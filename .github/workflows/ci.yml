name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The portability claim is the point of this project, so it is tested rather
  # than asserted. The vault opens the same way on every OS, and so does the
  # broker: a Unix socket where there is one, a named pipe on Windows. Those
  # tests used to skip themselves there, which is how a release shipped in
  # which `passbook signin` could not run on Windows at all.
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip pytest cryptography
      - name: Test
        run: python -m pytest tests -q -rs

  # The Rust side handles values in two places a URL and a webview could leak
  # them — the link parser, and the veil that rasterises a revealed credential
  # so no JavaScript string and no accessibility-tree text ever holds it. Both
  # are load-bearing, so the whole crate's tests run rather than one module's.
  #
  # This ran `cargo test ask::` for a long time, which was right when the
  # parser was the only such place. It stopped being right when the veil
  # landed: ten tests covering the one component whose entire job is keeping a
  # credential out of reach, and CI ran none of them.
  parser:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies for the webview crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: The staged CLI the app carries
        run: python3 scripts/stage-runtime.py
      - name: Test the crate
        working-directory: app/src-tauri
        run: cargo test --quiet

  # A machine with no OS keystore is the normal case on a headless server, and
  # the vault has to work there on a password alone. This pins that.
  no-keystore:
    name: no OS keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest cryptography
      - name: Test with every keystore disabled
        env:
          PASSBOOK_KEYSTORE: none
        run: python -m pytest tests -q -rs

  package:
    name: package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel and check every module shipped
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib
          # The module list in pyproject went stale once and shipped a tool with
          # no vault. This fails the build rather than the user's machine.
          for name in ("passbook", "passbook_access", "passbook_broker", "passbook_catalog",
                       "passbook_cli", "passbook_keystore", "passbook_link", "passbook_mcp",
                       "passbook_oauth", "passbook_peer", "passbook_seal", "passbook_stamp",
                       "passbook_vault"):
              importlib.import_module(name)
          print("all modules import from the installed wheel")
          PY
          passbook --help > /dev/null
          passbook-unseal --help > /dev/null
          echo "console scripts dispatch"
