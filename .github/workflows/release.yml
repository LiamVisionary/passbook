name: Release

# Tag a version and this builds the app for every platform and publishes it.
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# One runner per operating system, because a webview app cannot be cross
# compiled between them: Windows is built on Windows and Linux on Linux.
#
# The two Mac architectures are the exception and both are built on Apple
# Silicon. Same OS, same SDK, so an x86_64 target is an ordinary build rather
# than a cross compile, and it is how a universal binary is made. The Intel
# runner label was tried first and sat queued for an hour while the other three
# platforms finished, which is not a thing to depend on for a release.
#
# The release is drafted once, up front, and the build jobs only ever upload to
# it. Letting each job decide whether to create it meant two of the four could
# not see what the others had made: the Mac jobs created a draft and put both
# dmgs in it, the Windows job then created a second draft, and the release that
# survived had no Mac builds in it at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write

# Signing the Mac builds needs these in the repository's secrets. Without them
# everything still builds and only the macOS artifacts are unsigned.
#
#     APPLE_CERTIFICATE            base64 of a Developer ID .p12
#     APPLE_CERTIFICATE_PASSWORD   its password
#     APPLE_SIGNING_IDENTITY       Developer ID Application: NAME (TEAMID)
#     APPLE_ID                     the Apple account, for notarisation
#     APPLE_PASSWORD               an app-specific password for it
#     APPLE_TEAM_ID                the team

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The tests already run per push, but a release is the one build nobody gets
  # to re-run later, so it does not start until they pass on this exact commit.
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest cryptography
      - run: python -m pytest tests -q

  draft:
    name: draft the release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft it once, so nothing has to decide later
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "already drafted"
            exit 0
          fi
          gh release create "$TAG" --draft --title "PassBook $TAG" --notes '
          One credential store per machine, shared by every app that opts in.

          **macOS** takes the `.dmg` for your chip. Apple Silicon is `aarch64`,
          Intel is `x64`.
          **Windows** takes the `.exe`.
          **Linux** takes the `.AppImage` or the `.deb`.

          The command line installs separately, and the app needs it. The name
          `passbook` on PyPI belongs to an unrelated project, so install from
          here:

          ```bash
          uv tool install git+https://github.com/LiamVisionary/passbook
          ```

          See the [README](https://github.com/LiamVisionary/passbook#readme).'

  app:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    env:
      # Hoisted so a step can branch on it. A secret that was never set still
      # arrives as an empty string, so "is there one" has to be asked here.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS · Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS · Intel
            os: macos-14
            target: x86_64-apple-darwin
          - name: Windows · x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux · x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # webkit2gtk is the webview, and the rest are what it links against. A
      # Linux runner has none of them.
      #
      # Only the ayatana indicator, never both. They are two implementations of
      # the same thing and the packages declare a conflict, so asking for the
      # pair fails the whole install with "held broken packages".
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      # The window's ACL is generated from the command list. If the two have
      # drifted, the app builds and then refuses every command at runtime, which
      # is not something to find out from a release.
      - name: The window may call every command it has
        shell: bash
        run: python3 scripts/sync-permissions.py --check

      # There is no npm project here and there is not going to be one. The
      # window is a single HTML file, so the frontend has no build step and
      # nothing to install. tauri-action shells out to `npm run tauri` unless
      # told otherwise, which fails with `Missing script: "tauri"` on a repo
      # that has no package.json at all.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The certificate is imported here rather than handed to the action,
      # because an unset secret is not absent. It is an empty string, and
      # Tauri's bundler checks whether APPLE_CERTIFICATE is *set* rather than
      # whether it holds anything. With the variable present and empty it ran
      # `security import` on nothing and the build died with "SecKeychainItem
      # Import: One or more parameters passed to a function were not valid",
      # which reads like a broken certificate rather than a missing one.
      #
      # Setting them through GITHUB_ENV means they are genuinely absent when
      # there is nothing to sign with, and the build is unsigned rather than
      # failed.
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          unlock="$(uuidgen)"
          security create-keychain -p "$unlock" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$unlock" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$unlock" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          {
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # Build only. With no tagName the action never touches the release, so it
      # cannot decide to create a second one.
      - uses: tauri-apps/tauri-action@v0
        id: build
        with:
          projectPath: app
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}

      # Tauri notarises and staples the .app, then builds the dmg around it and
      # signs that. The dmg itself never goes to Apple, so `spctl` rejects it
      # with "source=Unnotarized Developer ID" and the person who downloaded it
      # is questioned about the disk image before they ever reach the app.
      #
      # Notarise the container too, staple the ticket into it so it verifies
      # without a network round trip, and refuse to ship one that does not then
      # pass Gatekeeper. Checking is the point: a release that is signed but
      # rejected looks exactly like one that is fine, right up until somebody
      # downloads it.
      - name: Notarise and staple the disk image
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        shell: bash
        env:
          BUILT: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r line; do
            dmg="${line%$'\r'}"
            case "$dmg" in *.dmg) ;; *) continue ;; esac
            found=$((found + 1))
            echo "notarising ${dmg##*/}"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
            echo "  stapled, and Gatekeeper accepts it"
          done < <(printf '%s' "$BUILT" | jq -r '.[]')
          [ "$found" -gt 0 ] || { echo "no disk image was built to notarise" >&2; exit 1; }

      # Named formats rather than everything the bundler produced, so an
      # updater tarball for an app with no updater cannot slip into a release
      # again. `artifactPaths` is a JSON array of absolute paths.
      - name: Attach the installers
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          sent=0
          while IFS= read -r line; do
            # A Windows runner hands these back with a trailing carriage return
            # and backslash separators. `*.exe` does not match `....exe\r`, so
            # the one installer Windows built was skipped and the job shipped
            # nothing. Match on the file name, not the whole path.
            path="${line%$'\r'}"
            name="${path##*[/\\]}"
            case "$name" in
              *.dmg|*.exe|*.msi|*.deb|*.AppImage|*.rpm)
                echo "attaching $name"
                gh release upload "$TAG" "$path" --clobber
                sent=$((sent + 1)) ;;
              *) echo "skipping   $name" ;;
            esac
          done < <(printf '%s' "$BUILT" | jq -r '.[]')
          # A platform that quietly ships nothing is the failure this whole job
          # exists to avoid.
          [ "$sent" -gt 0 ] || { echo "nothing was attached" >&2; exit 1; }

  # The app shells out to the CLI for everything, so the CLI is half the
  # release. Attached to the same tag rather than left to PyPI alone, which
  # matters here because the name `passbook` on PyPI is somebody else's.
  cli:
    name: command line
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Attach the wheel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.whl --clobber
