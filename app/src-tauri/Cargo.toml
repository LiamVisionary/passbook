[package]
name = "passbook-app"
version = "1.3.0"
description = "PassBook — the credentials this machine shares, and who may use them"
authors = ["Rizzma Inc."]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
passbook-biometric = { path = "biometric" }
tauri = { version = "2", features = ["macos-private-api"] }
# So an approval request arrives as a PassBook notification rather than an
# AppleScript one. `osascript -e 'display notification'` posts under Script
# Editor's identity — its icon, and its window when you click the banner.
tauri-plugin-notification = "2"
# The "Add to PassBook" button on a docs page opens `passbook://add?key=...`.
# Names only; see src/ask.rs for why a value never travels in a URL.
tauri-plugin-deep-link = "2"
# "Choose a different file" in the import sheet. Drag and drop needs no
# plugin, but a picker does, and both hand over a path rather than contents.
tauri-plugin-dialog = "2"
# The veil: a revealed credential is drawn here and the window is given
# pixels, because a JS string cannot be erased and webview text is published to
# the platform accessibility tree. See src/veil.rs for the whole argument.
# `fontdue` rasterises; the face itself is the system's, read by path, so there
# is no font file to ship, sign or carry a licence for.
fontdue = "0.9"
png = "0.18"
# The one crate here that exists to overwrite memory rather than to use it.
zeroize = { version = "1", features = ["alloc"] }
# Copy happens on this side now. `navigator.clipboard.writeText` takes a string,
# so leaving it in the window would re-materialise exactly what the veil avoids.
tauri-plugin-clipboard-manager = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
