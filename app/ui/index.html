<!doctype html>
<meta charset="utf-8" />
<title>PassBook</title>
<style>
  /* macOS Settings is the reference, not a web dashboard: a source list on the
     left, grouped inset rows on the right, one accent colour, and no border
     that the platform would not draw itself. */
  :root {
    color-scheme: light dark;
    --bg: #eceef2;
    --bg2: #f5f6f9;
    --sidebar: rgba(244,245,248,0.72);
    --card: #ffffff;
    --line: rgba(0,0,0,0.075);
    --line2: rgba(0,0,0,0.13);
    --ink1: #16171a;
    --ink2: #54565c;
    --ink3: #8a8c94;
    --chip: rgba(0,0,0,0.045);
    --chip2: rgba(0,0,0,0.072);
    /* PassBook blue. The logo's own blue is #0068FC, which lands at 4.06:1
       on this background — under AA for the small accent text this app uses
       for "2 restricted" and "readable by only …". One shade down clears
       4.5:1 both as text on the background and as white on the button, and
       is indistinguishable from the logo at a glance. */
    --accent: #0060ee;
    --accent-ink: #ffffff;
    --accent-soft: rgba(0,96,238,0.10);
    --brand: #0068fc;
    --brand-deep: #011d3d;
    --sel: rgba(0,0,0,0.06);
    --good: #157033;
    --good-soft: rgba(21,112,51,0.12);
    --warn: #b3261e;
    --warn-soft: rgba(179,38,30,0.10);
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 16px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b;
      --bg2: #1e1f23;
      --sidebar: rgba(32,33,38,0.7);
      --card: #232429;
      --line: rgba(255,255,255,0.075);
      --line2: rgba(255,255,255,0.14);
      --ink1: #f2f3f5;
      --ink2: #b1b3bb;
      --ink3: #7b7d87;
      --chip: rgba(255,255,255,0.06);
      --chip2: rgba(255,255,255,0.1);
      /* Lifted for a dark field; its ink is the logo's own navy. */
      --accent: #4d9bff;
      --accent-ink: #05203f;
      --accent-soft: rgba(77,155,255,0.16);
      --brand: #4d9bff;
      --brand-deep: #011d3d;
      --sel: rgba(255,255,255,0.075);
      --good: #5fd07d;
      --good-soft: rgba(95,208,125,0.15);
      --warn: #ff7b70;
      --warn-soft: rgba(255,123,112,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.26);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; background: var(--bg); color: var(--ink1);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── icons ───────────────────────────────────────────────────────────── */
  /* One stroke weight, one grid, currentColor throughout, so an icon takes the
     colour of whatever it sits in and never needs a second file. */
  svg.ic {
    width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  svg.navicon { width: 17px; height: 17px; flex-basis: 17px; }
  svg.pageicon { width: 20px; height: 20px; flex-basis: 20px; stroke-width: 1.6; }
  svg.emptyicon { width: 26px; height: 26px; flex-basis: 26px; stroke-width: 1.35; opacity: .5; }
  svg.tinyicon { width: 13px; height: 13px; flex-basis: 13px; }

  /* ── source list ─────────────────────────────────────────────────────── */
  nav {
    width: 216px; flex: 0 0 216px; background: var(--sidebar);
    backdrop-filter: saturate(180%) blur(20px);
    border-right: 1px solid var(--line);
    padding: 30px 10px 10px; -webkit-app-region: drag;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 14px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { font-size: 13.5px; font-weight: 700; letter-spacing: -0.012em; }
  .navlist { display: flex; flex-direction: column; gap: 1px; }
  .navlist button {
    -webkit-app-region: no-drag; display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left; padding: 6px 9px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink1); font: inherit; cursor: default;
  }
  .navlist button svg { color: var(--ink3); }
  .navlist button:hover { background: var(--sel); }
  .navlist button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .navlist button[aria-current="true"] svg { color: var(--accent-ink); }
  .navlist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .navlabel { flex: 1; min-width: 0; }
  .navcount { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .navlist button[aria-current="true"] .navcount { color: var(--accent-ink); opacity: .75; }
  nav .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex: 0 0 7px;
  }
  .navlist button[aria-current="true"] .dot { background: var(--accent-ink); }

  /* Whether anything can read a credential right now is the one fact worth
     seeing from every page, so it sits at the foot of the source list. */
  /* Settings and the vault footer travel together at the bottom of the list,
     so one `margin-top: auto` does for both. */
  .navbottom { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .navfoot {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; gap: 4px; width: 100%;
    padding: 5px 6px 5px 9px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--ink1);
  }
  .navfoot:hover { border-color: var(--line2); }
  .navfoot-main {
    display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0;
    text-align: left; border: 0; background: transparent; color: inherit;
    font: inherit; cursor: default; padding: 3px 0;
  }
  .navfoot-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
  .navlock { width: 26px; height: 26px; flex-basis: 26px; }
  .navfoot .col { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .navfoot-t { font-size: 12px; font-weight: 600; }
  .navfoot-s { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .navfoot.open .navfoot-main svg { color: var(--good); }
  /* Locked AND encrypted is the good state; it should not wear the warning
     colour that a store sitting in the clear needs. */
  .navfoot.shut .navfoot-main svg { color: var(--good); }
  .navfoot.exposed { border-color: var(--warn); background: var(--warn-soft); }
  .navfoot.exposed .navfoot-main svg { color: var(--warn); }
  .navfoot.exposed .navfoot-t { color: var(--warn); }

  /* ── content ─────────────────────────────────────────────────────────── */
  main { flex: 1; overflow-y: auto; padding: 30px 28px 32px; -webkit-app-region: drag; }
  main > * { -webkit-app-region: no-drag; }
  h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.022em; }
  .lede { color: var(--ink2); margin: 3px 0 0; max-width: 62ch; }
  .pagehead { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .pagetile {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .pagetext { min-width: 0; }
  .statustile {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .statustile.good { background: var(--good-soft); color: var(--good); }
  .statustile.warn { background: var(--warn-soft); color: var(--warn); }
  .statustile.plain { background: var(--chip2); color: var(--ink2); }
  .statustile.sm { width: 26px; height: 26px; flex-basis: 26px; border-radius: 7px; }
  .statustile.sm svg { width: 14px; height: 14px; }
  .chips.inline { padding: 5px 0 0; }

  .group {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .group h3 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink3); padding: 12px 14px 6px; background: transparent;
  }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sub { color: var(--ink3); font-size: 11.5px; margin-top: 1px; }
  .note { color: var(--ink3); font-size: 11.5px; line-height: 1.5; padding: 10px 14px 13px; }
  .note code, .lede code {
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--chip2); border-radius: 4px; padding: 1px 5px;
  }

  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--ink2); font: inherit; font-size: 12px;
    padding: 3px 10px; border-radius: 6px; cursor: default; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink1); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  button.act {
    border: 1px solid var(--line2); background: var(--card); color: var(--ink1);
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 7px; cursor: default;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  button.act:hover { background: var(--sel); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.act.primary:hover { filter: brightness(1.07); }
  button.act.danger { color: var(--warn); }
  button.act.danger:hover { background: var(--warn-soft); }
  /* The button that removes a credential was styled `primary` — the same blue
     as Add and Save, which is how an app says "this is the one you want". A
     destructive confirmation should never wear the recommended colour. */
  button.act.destructive {
    background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 600;
  }
  button.act.destructive:hover { background: var(--warn); filter: brightness(1.08); }
  .confirming { background: var(--warn-soft); border-radius: 8px; padding: 6px 8px; margin: -2px 0; }
  .confirming .sub { color: var(--warn); margin: 0; }
  button.act:disabled { opacity: .45; }
  button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* A word plus a coloured dot, so state reads without reading. */
  .tag { font-size: 11px; color: var(--ink3); white-space: nowrap;
         display: inline-flex; align-items: center; gap: 5px; }
  .tag.on, .tag.off, .tag.info { font-weight: 600; border-radius: 99px; padding: 2px 9px; }
  .tag.info { color: var(--accent); background: var(--accent-soft); }
  .tag.on { color: var(--good); background: var(--good-soft); }
  .tag.off { color: var(--warn); background: var(--warn-soft); }
  .tag.on::before, .tag.off::before, .tag.info::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  input { font: inherit; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line2);
          background: var(--bg2); color: var(--ink1); min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line2);
           background: var(--card); color: var(--ink1); }
  .add { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .add input:first-of-type { width: 190px; }
  .add input:last-of-type { flex: 1; }

  .banner { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius);
            padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 10px;
            align-items: flex-start; box-shadow: var(--shadow); }
  .banner > svg { margin-top: 1px; flex: 0 0 16px; }
  .banner .body { flex: 1; min-width: 0; }
  .banner b { font-weight: 700; }
  .banner .acts { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .banner button {
    border: 1px solid rgba(0,0,0,.2); background: rgba(255,255,255,.92); color: #16171a;
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 7px; cursor: default;
  }
  .banner button:hover { background: #fff; }
  .empty {
    color: var(--ink3); padding: 26px 14px; font-size: 12.5px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  }

  /* Add sits at the TOP of the list: on a store with hundreds of keys, an add
     row at the bottom is a scroll away and may as well not exist. */
  .addrow { display: grid; grid-template-columns: minmax(0,0.8fr) minmax(0,1fr) auto;
            gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  /* One field and a button: the three-column grid stretched the button over
     half the window, which read as a second text field. */
  .addrow.two { grid-template-columns: minmax(0,1fr) auto; }
  .addrow.one { grid-template-columns: minmax(0,1fr); }
  .addrow.three { grid-template-columns: minmax(0,1fr) auto auto; }
  /* Consecutive rows of one form are one form, not a stack of cards. */
  .addrow + .addrow { border-top: 0; padding-top: 0; }
  .keyrow { padding: 7px 14px; }
  .keyrow.open { background: var(--bg2); padding-bottom: 12px; }
  /* The chevron turns down when the row is open — the only thing on the row
     that says which of a few hundred is the one you opened. */
  .disclose svg { transition: transform .18s cubic-bezier(.2,.8,.3,1); }
  .keyrow.open .disclose svg { transform: rotate(90deg); }
  /* Two columns: the labels, then a column exactly as wide as the widest
     control in it. Laying these out as flex rows with the control pushed right
     put a hand's width of nothing between a label and the thing it labels, and
     made it worse on a wider window. `display: contents` on the row lets both
     of its children join the grid, so every control starts at the same x. */
  .keydetail {
    margin: 9px 0 0; padding: 6px 0 0;
    display: grid; grid-template-columns: 150px minmax(0, max-content);
    gap: 5px 14px; align-items: center; justify-content: start; justify-items: start;
    border-top: 1px solid var(--line);
  }
  .drow { display: contents; }
  .dfull { grid-column: 1 / -1; }
  .usedline { margin: 2px 0 6px; font-size: 12px; color: var(--ink3); }
  .dlabel { font-size: 12.5px; color: var(--ink2); min-height: 28px; display: flex;
            align-items: center; }
  /* Names to choose from, as things you press rather than a column of
     checkboxes — the same shape as the switch above them. */
  .pickrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 0 6px; }
  .pickchip {
    border: 1px solid var(--line2); border-radius: 999px; padding: 3px 11px;
    background: var(--card); color: var(--ink2); cursor: default;
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .pickchip:hover { border-color: var(--ink3); color: var(--ink1); }
  .pickchip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .keydetail .addrow { margin: 0 0 6px; }
  .confirmstrip {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    padding: 8px 10px; border-radius: 8px; background: var(--warn-soft);
    font-size: 12px; color: var(--ink1);
  }
  .confirmstrip .grow { flex: 1; }
  /* Search on the left, the two things you do occasionally on the right. */
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar .grow { flex: 1; }
  .countnote { text-align: center; margin-top: 12px; }
  .keyrow + .keyrow { border-top: 1px solid var(--line); }
  .keyrow:hover { background: var(--bg2); }
  .keyrow .head { display: flex; align-items: center; gap: 8px; }
  .keyrow .named {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
    align-self: stretch; cursor: default;
  }
  .keyrow .head .mono { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; font-size: 12.5px; }
  .keyrow .val {
    width: 100%; margin-top: 7px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 5px 9px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--card); color: var(--ink1);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  /* A revealed value is a picture, and the box around it is the old field's box
     so the row does not jump when one appears. The image is drawn at `12 * dpr`
     so it is crisp on a Retina panel and then displayed at a width of
     `naturalWidth / dpr`, which is set on load rather than in CSS: only the
     image knows how tall the font made it, and guessing here would scale the
     glyphs by whatever the guess was wrong by. The height below is what it
     occupies until that lands, so the row does not jump either. */
  .keyrow .val.picture {
    display: flex; align-items: center; min-height: 26px; overflow-x: auto;
    cursor: text;
  }
  .keyrow .val.picture img { display: block; height: 16px; width: auto; max-width: none; }
  .keyrow .val.picture img.measured { height: auto; }
  .keyrow .val.empty { color: var(--ink3); font-style: italic; }
  /* Shown from the moment the eye is pressed until the picture is on screen.
     Same box as the value it is standing in for, so the row does not move when
     one becomes the other. */
  .keyrow .val.loading { display: flex; align-items: center; gap: 8px; color: var(--ink3); }
  .spinner {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    border: 2px solid var(--line2); border-top-color: var(--ink3);
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* A person who has asked not to see motion gets a pulse instead of a spin,
     and still gets told something is happening. */
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }
  /* A hidden value is a chip beside its name, not a field of its own: a row of
     empty grey per key is most of what you see on a store of any size. */
  /* Not decoration: this is the one place a person looking at a key can learn
     that the lock in the sidebar does not cover it. */
  .bare {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    color: var(--warn); background: var(--warn-soft);
    border-radius: 5px; padding: 2px 7px;
  }
  /* Guarded is the good state and must not wear the warning colour `bare`
     uses — they sit on the same row, and amber beside amber would read as two
     problems rather than one problem and one protection. */
  .bare.guarded { color: var(--ink2); background: var(--chip); }
  .masked {
    font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em;
    color: var(--ink3); background: var(--chip); border-radius: 5px;
    padding: 2px 8px; white-space: nowrap;
  }
  .aud .used { color: var(--ink3); }

  /* Row actions are icons: four words on every row of a few hundred is more
     text than the key names they sit beside. */
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex: 0 0 28px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink3); cursor: default;
  }
  .iconbtn:hover { background: var(--sel); color: var(--ink1); }
  .iconbtn.on { background: var(--accent-soft); color: var(--accent); }
  /* A notice at the far end of the page is not feedback for a button press —
     the eye is on the button. It turns into a tick where it stands. */
  .iconbtn.done { background: var(--good-soft); color: var(--good); }
  .iconbtn.done svg { animation: pop .22s ease-out; }
  .iconbtn:active { transform: scale(0.92); }
  @keyframes pop {
    0%   { transform: scale(.55); opacity: 0; }
    60%  { transform: scale(1.14); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .iconbtn.done svg { animation: none; }
    .iconbtn:active { transform: none; }
  }
  .iconbtn.danger:hover { background: var(--warn-soft); color: var(--warn); }
  .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Kept for the few text buttons that still read better as words. */
  .icon {
    border: 1px solid transparent; background: transparent; color: var(--ink3);
    font: inherit; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; cursor: default;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .icon:hover { background: var(--sel); color: var(--ink1); }
  .icon.on { color: var(--accent); font-weight: 600; }
  .icon.danger:hover { color: var(--warn); }

  .hist { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 8px; }
  .hist .ev { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  .hist .ev .when { color: var(--ink3); font-size: 11px; white-space: nowrap; width: 118px; flex: 0 0 118px; }
  .hist .ev .who { flex: 1; min-width: 0; font-size: 11.5px; overflow-wrap: anywhere; }
  .hist .ev .op { color: var(--ink3); font-size: 11px; }
  .hist .proof {
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink3); overflow-wrap: anywhere; padding: 0 0 4px 128px;
  }
  .hist .foot { color: var(--ink3); font-size: 11px; padding-top: 6px; }

  /* A store can hold hundreds of keys, so find-as-you-type is the primary way
     in, not a convenience bolted to the side. */
  .grouphead { display: flex; align-items: center; gap: 10px; padding: 11px 14px 9px; }
  .grouphead h3 { padding: 0; flex: 1; }
  .searchwrap { position: relative; display: inline-flex; align-items: center; }
  .searchwrap > svg { position: absolute; left: 9px; color: var(--ink3); pointer-events: none; }
  .search {
    font: inherit; font-size: 12px; width: 210px; padding: 5px 9px 5px 29px;
    border-radius: 7px; border: 1px solid var(--line2);
    background: var(--bg2); color: var(--ink1);
  }
  .err { color: var(--warn); }
  /* Pinned to the bottom of the scroll, not appended to the end of it.
     It used to be the last child of a page that can be several screens long,
     so a refused sign-in put its reason somewhere nobody was looking and the
     button read as dead. An error you have to scroll to find is an error you
     did not report. */
  .noticebar {
    position: sticky; bottom: 0; z-index: 5;
    display: flex; gap: 8px; align-items: flex-start; margin-top: 14px;
    padding: 10px 12px; border-radius: 10px; font-size: 12.5px;
    background: var(--warn-soft); color: var(--warn);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .18);
    border: 1px solid currentColor;
  }
  .noticebar .grow { flex: 1; }
  .noticebar button {
    all: unset; cursor: pointer; opacity: .65; display: flex; padding: 0 2px;
  }
  .noticebar button:hover { opacity: 1; }
  .noticebar.good { background: var(--good-soft); color: var(--good); }
  .noticebar svg { margin-top: 1px; }

  /* Groups on the Keys page. A monogram carries a colour the eye can aim at,
     which a row of identical grey headings does not. */
  .grouprow {
    display: flex; align-items: center; gap: 9px; padding: 9px 14px;
    cursor: default; user-select: none; background: var(--bg2);
    border-top: 1px solid var(--line);
  }
  .grouprow:hover { background: var(--chip); }
  .grouprow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .grouprow .caret { color: var(--ink3); display: flex; transition: transform .13s ease; }
  .grouprow[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .morerow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 11px 14px; font: inherit; font-size: 12px;
    color: var(--ink3); background: var(--bg2); border: 0;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  .morerow:hover { background: var(--chip); color: var(--ink); }
  .morerow .caret, .morerow svg { transform: rotate(90deg); }
  .avatar {
    width: 24px; height: 24px; flex: 0 0 24px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: hsl(var(--h) 68% 92%); color: hsl(var(--h) 50% 34%);
  }
  @media (prefers-color-scheme: dark) {
    .avatar { background: hsl(var(--h) 38% 24%); color: hsl(var(--h) 68% 76%); }
  }
  .gname { font-weight: 600; font-size: 12.5px; color: var(--ink1); }
  .gcount { font-size: 11px; color: var(--ink3); background: var(--chip2);
    border-radius: 99px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .grestricted { font-size: 11px; color: var(--accent); margin-left: auto;
    display: inline-flex; align-items: center; gap: 4px; }

  /* Audience */
  .aud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .aud .restricted { color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
  .audedit { border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px;
    margin-top: 8px; background: var(--bg2); }
  .audmodes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .audlist { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .audlist label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .audedit .note { padding: 4px 0 0; }

  /* The matrix */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 14px 12px; }
  .asks { color: var(--ink3); font-weight: 600; font-size: 10px;
    font-variant-numeric: tabular-nums; }
  .chip { font-size: 11.5px; background: var(--chip2); border-radius: 99px;
    padding: 3px 10px; color: var(--ink2);
    display: inline-flex; align-items: center; gap: 5px; }
  .factors { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .matrixwrap { overflow-x: auto; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.matrix th, table.matrix td { text-align: left; padding: 7px 12px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.matrix thead th { color: var(--ink3); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; background: var(--bg2); }
  table.matrix tbody tr:hover { background: var(--bg2); }
  .kname { max-width: 22rem; overflow: hidden; text-overflow: ellipsis; }
  .gtag { font-size: 10.5px; color: var(--ink3); margin-left: 6px; }
  td.cell { text-align: center; }
  td.cell svg { width: 15px; height: 15px; }
  td.cell.yes { color: var(--good); }
  td.cell.no { color: var(--warn); }
  td.cell.ask { color: var(--accent); }
  .snippet { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; overflow-x: auto; margin: 4px 14px 10px; color: var(--ink1); }

  select.scope { font: inherit; font-size: 11.5px; padding: 2px 6px; border-radius: 6px;
    border: 1px solid var(--line2); background: var(--card); color: var(--ink2); max-width: 15rem; }
  select.scope:hover { color: var(--ink1); }
  .recovery {
    font-size: 15px; letter-spacing: .06em; margin-top: 5px;
    background: var(--chip2); border-radius: 7px; padding: 7px 10px;
    display: inline-block; user-select: all;
  }
  .viatag {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
    font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 6px;
    color: var(--ink3); background: var(--chip2);
  }
  .viatag.grant { color: var(--good); background: var(--good-soft); }
  .scope.locked { font-size: 11.5px; color: var(--ink3); background: var(--chip);
    border-radius: 6px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; }

  input.pick { margin: 0 .1rem 0 0; accent-color: var(--accent); cursor: pointer;
    width: 14px; height: 14px; flex: 0 0 14px; }
  .bulkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 9px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--accent-soft); position: sticky; top: 0; z-index: 2; }
  .bulkbar .grow { flex: 1; min-width: 0; }
  .bulkbar .warn { color: var(--warn); font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px; }
  .bulkbar.confirm { background: var(--warn-soft); }
  .bulkbar .note { flex-basis: 100%; margin: 0; padding: 4px 0 0; }

  /* A panel that is present without asking to be looked at. */
  .group.quiet { background: transparent; border-style: dashed; box-shadow: none; }
  .group.quiet .row { color: var(--ink3); }
  .pathval { font-size: 11.5px; color: var(--ink3); margin-left: auto;
             overflow-wrap: anywhere; text-align: right; }

  /* ── folded-away explanation ─────────────────────────────── */
  .aside { margin: 8px 12px 10px; }
  .aside > summary {
    list-style: none; cursor: default; display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--ink3); padding: 2px 0;
  }
  .aside > summary::-webkit-details-marker { display: none; }
  .aside > summary::before {
    content: ""; width: 5px; height: 5px; border-right: 1.4px solid currentColor;
    border-bottom: 1.4px solid currentColor; transform: rotate(-45deg); margin-right: 2px;
    transition: transform .16s ease;
  }
  .aside[open] > summary::before { transform: rotate(45deg); }
  .aside > summary:hover { color: var(--ink2); }
  .asidebody { font-size: 12px; line-height: 1.55; color: var(--ink3); padding: 4px 0 2px; }
  .asidebody p { margin: 0 0 7px; }
  .asidebody p:last-child { margin-bottom: 0; }

  /* ── settings shelf ──────────────────────────────────────── */
  /* One row per pane, the shape macOS uses for the same job: an icon, a name,
     a line saying what is inside, and a chevron. Nothing on this page does
     anything by itself — it only takes you somewhere. */
  .group.tight { padding: 6px; }
  .settingrow {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 10px 10px; border: 0; border-radius: 10px; background: transparent;
    color: var(--ink1); font: inherit; cursor: default;
  }
  .settingrow + .settingrow { box-shadow: 0 -1px 0 var(--line); }
  .settingrow:hover { background: var(--sel); box-shadow: none; }
  .settingrow:hover + .settingrow { box-shadow: none; }
  .settingrow .grow { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .settingname { font-weight: 550; font-size: 13.5px; }
  .settingrow > svg:last-child { color: var(--ink3); flex: 0 0 13px; }
  .backlink {
    display: inline-flex; align-items: center; gap: 3px; margin: 0 0 2px -6px;
    padding: 3px 8px 3px 6px; border: 0; border-radius: 7px; background: transparent;
    color: var(--accent); font: inherit; font-size: 12.5px; cursor: default;
  }
  .backlink:hover { background: var(--sel); }
  .backlink svg { transform: rotate(180deg); }

  /* ── the gate ─────────────────────────────────────────────────────────── */
  /* Who's working? — the same screen Hivemind Content Studio opens with, so
     the two apps ask the same question the same way. A workspace is a store
     and, now, a key: picking one is picking both. */
  #gate {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    padding: 24px; background: var(--bg); overflow-y: auto;
    -webkit-app-region: drag;
  }
  /* An id beats [hidden] on specificity, so `display: grid` above would keep
     this on screen after gate.hidden = true — an empty, opaque, full-window
     sheet over the store, which is what a signed-in window would show. The
     attribute has to be given a rule of its own to mean anything here. */
  #gate[hidden] { display: none; }
  #gate > * { -webkit-app-region: no-drag; }
  .gwrap { width: min(860px, 100%); display: grid; gap: 28px; justify-items: center; }
  .ghead { display: grid; justify-items: center; gap: 6px; margin-bottom: 4px; }
  .gmark {
    width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
  }
  .geyebrow {
    margin: 0; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--accent); text-align: center;
  }
  #gate h1 { margin: 6px 0 0; font-size: 28px; font-weight: 650; letter-spacing: -.02em; text-align: center; }
  .glede { margin: 8px 0 0; color: var(--ink3); font-size: 13px; line-height: 1.55; text-align: center; max-width: 44ch; }
  .gtiles { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; padding: 0; margin: 0; list-style: none; }
  .gtile { display: grid; gap: 10px; justify-items: center; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  /* The tile as an object rather than a swatch.
   *
   *  The first version was the studio's rule copied onto a different page: a
   *  short two-stop gradient with the near-black page colour as its letter.
   *  That works on #0c0c0e, where a saturated square is the only lit thing on
   *  screen. On a light background the same square has nothing to separate it
   *  from the page, and black-on-mid-purple is a letter stamped on top instead
   *  of a letter belonging to it.
   *
   *  So: a wider ramp with a hue turn across it, a light source (the inset
   *  highlight along the top edge, a shadow beneath), a rim that keeps its
   *  edge on a pale page, and a letter in the tile's own light rather than in
   *  the page's ink. */
  .gav {
    position: relative; width: 118px; height: 118px; border-radius: 26px;
    display: grid; place-items: center; isolation: isolate;
    font-size: 46px; font-weight: 700; letter-spacing: -.02em;
    color: rgba(255, 255, 255, .95);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .22);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, .45),
      inset 0 0 0 1px rgba(255, 255, 255, .16),
      0 10px 20px -8px var(--gav-cast, rgba(0, 0, 0, .38)),
      0 2px 6px -2px rgba(0, 0, 0, .18);
    transition: transform .18s cubic-bezier(.2, .8, .3, 1), box-shadow .18s ease;
  }
  /* The sheen. A single soft highlight off the top-left, which is what makes a
     flat gradient read as a surface with a light on it. */
  .gav::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: radial-gradient(120% 88% at 22% 4%, rgba(255, 255, 255, .34), transparent 62%);
  }
  .gtile:hover .gav, .gtile:focus-visible .gav {
    transform: translateY(-3px) scale(1.035);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, .5),
      inset 0 0 0 1px rgba(255, 255, 255, .2),
      0 18px 30px -10px var(--gav-cast, rgba(0, 0, 0, .45)),
      0 3px 8px -2px rgba(0, 0, 0, .2);
  }
  /* Dashed, and drawn as a real border rather than an inset shadow — a shadow
     cannot be dashed, and the dashes are what say "this one is not a workspace
     yet, it is the way to make one". */
  .gav.add {
    background: none; color: var(--ink3); font-size: 34px; font-weight: 300;
    text-shadow: none; box-shadow: none;
    border: 2px dashed var(--line2);
  }
  .gav.add::after { background: none; }
  .gtile:hover .gav.add, .gtile:focus-visible .gav.add {
    color: var(--ink1); border-color: var(--ink3); box-shadow: none;
  }
  .gtile:focus-visible { outline: none; }
  .gname { font-size: 14px; color: var(--ink3); transition: color .16s; }
  .gtile:hover .gname, .gtile:focus-visible .gname { color: var(--ink1); }
  .gbadge { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink3); }
  .gbadge.on { color: var(--ok); }
  /* Three stops with a hue turn, so the ramp has somewhere to go across 118px
     — two stops of one hue is the thing that reads as a placeholder swatch.
     `--gav-cast` tints the shadow with the tile's own colour, which is what
     stops six squares looking like six stickers on the same grey page. */
  .c-amber  { background: linear-gradient(145deg, #ffcc4d, #f2a413 52%, #dc7d05);
              --gav-cast: rgba(217, 138, 8, .45); }
  .c-violet { background: linear-gradient(145deg, #b79dff, #8b6cf3 52%, #6741e0);
              --gav-cast: rgba(103, 65, 224, .45); }
  /* Started a stop lighter and the white letter sat on top of it rather than
     in it. Every ramp here has to keep enough weight under the monogram. */
  .c-teal   { background: linear-gradient(145deg, #4fdcc4, #1cbda8 52%, #0a8a80);
              --gav-cast: rgba(10, 138, 128, .45); }
  .c-rose   { background: linear-gradient(145deg, #ffb3bd, #fb6f86 52%, #e8365a);
              --gav-cast: rgba(232, 54, 90, .45); }
  .c-sky    { background: linear-gradient(145deg, #93dcfd, #38b3f0 52%, #0b82d4);
              --gav-cast: rgba(11, 130, 212, .45); }
  .c-lime   { background: linear-gradient(145deg, #cdf58a, #97d63f 52%, #629f16);
              --gav-cast: rgba(98, 159, 22, .45); }
  .gcard {
    width: min(400px, 100%); display: grid; gap: 14px; padding: 30px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--bg2);
    box-shadow: 0 24px 64px -24px rgba(0, 0, 0, .55);
  }
  .gcard h2 { margin: 0; font-size: 19px; font-weight: 640; letter-spacing: -.01em; }
  .gwho { display: flex; align-items: center; gap: 12px; }
  .gwho .gav { width: 46px; height: 46px; border-radius: 13px; font-size: 20px;
               box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4),
                           inset 0 0 0 1px rgba(255, 255, 255, .14),
                           0 4px 10px -4px var(--gav-cast, rgba(0, 0, 0, .35)); }
  .gwho .gav.add { font-size: 22px; box-shadow: inset 0 0 0 2px var(--line2); }
  .gcard button { min-height: 46px; border: 0; border-radius: 10px; font: 600 14px inherit; cursor: pointer; }
  /* The one colour in this file that was written down instead of named. It was
     a near-black brown, chosen when the accent was amber, and it stayed put
     when the accent went blue — black text on a blue button. `--accent-ink` is
     the token that already means "legible on the accent", in both themes. */
  .gprimary {
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .gprimary:disabled { opacity: .55; cursor: default; }
  .gsecondary { background: var(--chip); color: var(--ink1); border: 1px solid var(--line2) !important; }
  .gdiv { display: flex; align-items: center; gap: 12px; color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
  .gdiv::before, .gdiv::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .gcard form { display: grid; gap: 10px; }
  .gcard label { display: grid; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink3); }
  .gcard input[type="password"], .gcard input[type="text"] {
    width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--chip); color: var(--ink1); font: inherit; font-size: 14px; outline: 0;
  }
  .gcard input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* One line, a switch on the right — the shape every settings row in this app
     already has. It was a bare `input type=checkbox` inside a label that is
     `display: grid`, so it stacked above its own words at whatever size the
     platform draws an unstyled box. Nothing else in PassBook uses a checkbox. */
  .gopt {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--chip);
  }
  .gopt-text { flex: 1; font-size: 13px; color: var(--ink1); white-space: nowrap; }
  .gswitch {
    flex: 0 0 40px; width: 40px; height: 23px; min-height: 0 !important; padding: 0;
    border-radius: 999px !important; background: var(--line2); border: 0; cursor: pointer;
    position: relative; transition: background .18s ease;
  }
  .gswitch::after {
    content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    transition: transform .18s cubic-bezier(.2, .8, .3, 1);
  }
  .gswitch[aria-checked="true"] { background: var(--accent); }
  .gswitch[aria-checked="true"]::after { transform: translateX(17px); }
  .gswitch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .gerror { margin: 0; color: var(--danger); font-size: 12px; line-height: 1.5; }
  .gerror:empty { display: none; }
  .gback { background: none !important; border: 0 !important; color: var(--ink3); font: inherit; font-size: 12px; cursor: pointer; padding: 4px; min-height: 0 !important; }
  .gback:hover { color: var(--ink2); }
  /* Agent access, on the lock screen, because that is where somebody is
     already thinking about what stays open while they are away. */
  .gagents {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg2);
    width: min(400px, 100%); font-size: 12px; color: var(--ink2);
  }
  .gagents .grow { flex: 1; }
  .gagents button { min-height: 0; padding: 6px 11px; border-radius: 8px;
    background: var(--chip); color: var(--ink1); border: 1px solid var(--line2);
    font: 600 12px inherit; cursor: pointer; }
  /* ── Add to PassBook ──────────────────────────────────────────────────────
     A page asked for keys. This sits above the sign-in sheet on purpose: the
     request is what the person came here to answer, and making them sign in
     first would mean approving something they had not read yet. */
  #ask {
    position: fixed; inset: 0; z-index: 120; display: grid; place-items: center;
    padding: 24px; background: var(--bg); overflow-y: auto;
    -webkit-app-region: drag;
  }
  #ask[hidden] { display: none; }
  #ask > * { -webkit-app-region: no-drag; }
  .awrap { width: min(520px, 100%); display: grid; gap: 18px; }
  .acard {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px; display: grid; gap: 18px; box-shadow: 0 18px 46px rgba(0,0,0,.10);
  }
  .ahead { display: grid; justify-items: center; gap: 10px; text-align: center; }
  .amark {
    width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px;
    background: var(--accent-soft); color: var(--accent);
  }
  .ahead h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
  .aorigin {
    margin: 0; font-size: 12.5px; color: var(--ink3); line-height: 1.5;
    word-break: break-word;
  }
  .aorigin b { color: var(--ink); font-weight: 600; }
  .anote {
    margin: 0; font-size: 12.5px; color: var(--ink3); line-height: 1.5;
    background: var(--soft); border-radius: 9px; padding: 9px 11px;
  }
  .akeys { display: grid; gap: 12px; }
  .akey { display: grid; gap: 5px; }
  .akey label { font: 600 11.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink2); letter-spacing: .01em; }
  /* Longhand, because `font: ... inherit` is not a valid shorthand -- the
     family slot needs a real family, so the whole declaration was dropped and
     the password label kept the monospace meant for key names. */
  .akey label.aplain {
    font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1;
    color: var(--ink3); letter-spacing: 0;
  }
  .akey input {
    width: 100%; box-sizing: border-box; min-height: 40px; padding: 0 11px;
    border: 1px solid var(--line2); border-radius: 9px; background: var(--paper);
    color: var(--ink); font: 400 13px inherit;
  }
  .akey input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .akey .ahint { font-size: 11px; color: var(--ink3); }
  .asent {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;

   *  expired first would leave a broken image under a row still claiming to

   *  `prefers-color-scheme` picked.

Use the copy button to put it on the clipboard."

    try { const next = await invoke(name, args); notice = ""; state = next; }
    catch (e) { notice = String(e); }
    finally { busy = false; paint(); }
  }

  async function callVault(name, args = {}) {
    busy = true; paint();
    try { vault = await invoke(name, args); notice = ""; }
    catch (e) { notice = String(e); }
    finally { busy = false; paint(); }

   *  brought up Script Editor's open-a-file panel. A notification about your
