            : `anything running as you can ask for a value and receive it.`}
          ${guarded.length
            ? `<div class="sub">${guarded.length} key${guarded.length === 1 ? " is" : "s are"}
               guarded and never printed whatever this is set to:
               ${guarded.map(esc).join(", ")}.</div>`
            : `<div class="sub">No keys are individually guarded.
               <code>passbook guard NAME --to host</code> binds one.</div>`}
          ${pinnedLine()}
        </div>
        <button class="act" data-reads="${sealed ? "open" : "sealed"}"
          ${busy || asking?.id === "reads-open" ? "disabled" : ""}>${sealed ? "Allow reads" : "Seal reads"}</button></div>
        ${confirmStrip("reads-open", `Allow any program running as you to read credential values again?
          Every agent on this machine could then read them, not just use them.`, "Allow reads")}
        ${aside(`<p>Sealing refuses a value to any caller PassBook did not start. Apps that
          read directly keep working while they are on the approved list \u2014 see
          <code>passbook approved</code> \u2014 and the list is meant to shrink as each one
          moves to <code>passbook run</code>.</p><p>From a terminal:
          <code>passbook policy --reads sealed</code>.</p>`, "What sealing changes")}
      </div>`;
  }

  /** The question a press asks before it acts, shown in place under the button that asked it. */
  function confirmStrip(id, sentence, yes) {
    if (asking?.id !== id) return "";
    return `<div class="confirmstrip" role="group" aria-label="${esc(yes)}?">
      <span class="grow">${sentence}</span>
      <button class="act" data-askno="1">Cancel</button>
      <button class="act destructive" data-askyes="${esc(id)}" ${busy ? "disabled" : ""}>${esc(yes)}</button>
    </div>`;
  }

  async function setReads(mode) {
    busy = true; paint();
    try { state = await invoke("set_reads", { mode }) || state; notice = ""; }
    catch (e) { notice = said(e); }
    finally { busy = false; paint(); }
  }

  async function setStayOpen(on) {
    const password = on ? document.getElementById("so-pw")?.value || "" : "";
    const typed = typedNow();
    let refused = false;
    busy = true; paint();
    try {
      vault = await invoke("set_stay_open", { on, password }) || vault;
      const field = document.getElementById("so-pw");
      if (field) field.value = "";
      notice = "";
    } catch (e) { notice = said(e); refused = true; }
    finally { busy = false; paint(); if (refused) giveBack(typed); }
  }

  async function disconnectGithub() {
    busy = true; paint();
    try { ghStatus = await invoke("github_disconnect"); notice = ""; }
    catch (e) { notice = said(e); }
    finally { busy = false; paint(); }
  }

  /** Open the question `id` asks, with Cancel focused: Enter on an open question is never the yes. */
  function askFirst(id) {
    asking = { id, page };
    paint();
    main.querySelector("[data-askno]")?.focus({ preventScroll: true });
  }

  function vaultPage() {
    const v = vault;
    if (!v) return settingsBack("Security") + `<p class="lede">Reading…</p>`;
    if (!v.supported) {
      return settingsBack("Security") + `
        <p class="lede">This device cannot encrypt keys yet.</p>
        <div class="group"><p class="note">Run <code>passbook install</code> to add it,
        then reopen this window.</p></div>`;
    }

    // A held key is not the same claim as a readable store. Each profile has
    // its own key and the profile is bound into every value, so signing in to
    // the wrong one holds a perfectly good key that opens nothing.
    const sealedCount = (v.sealed || []).length;
    const opens = v.opens ?? sealedCount;
    const wrongProfile = v.unlocked && sealedCount > 0 && opens === 0;
    const partial = v.unlocked && opens > 0 && opens < sealedCount;

    const openState = v.unlocked
      ? `<div class="row"><span class="statustile ${wrongProfile ? "warn" : "good"}">${
           icon(wrongProfile ? "alert" : "unlock")}</span>
         <div class="grow"><strong>${wrongProfile ? "Open, and reading nothing" : "Open"}</strong> —
           signed in as ${esc(profileLabel(v.signed_in_profile))} by ${esc(v.factor || "password")}${
             v.expires_in ? `, ${humanTime(v.expires_in)} left`
                          : ", and it stays open until you lock it"}.
           ${wrongProfile ? `<div class="sub">None of the ${sealedCount} encrypted values open with
             this profile — they were sealed by another one. Sign out and sign in to the profile
             that holds them.</div>`
             : partial ? `<div class="sub">${opens} of ${sealedCount} encrypted values open with
               this profile; the rest were sealed by another one.</div>` : ""}</div>
         <button class="act" data-signout ${busy ? "disabled" : ""}>${icon("lock")} Lock</button></div>`
      : `<div class="row"><span class="statustile warn">${icon("lock")}</span>
         <div class="grow"><strong>Locked</strong> —
           ${v.fully_sealed
             ? "apps on this device have no credentials right now."
             : "though the store is not sealed, so values are readable anyway."}</div>
         <span class="tag off">Locked</span></div>`;

    const signIn = v.unlocked || !v.profiles.length ? "" : `
      <div class="group">
        <h3>Sign in</h3>
        ${v.profiles.length > 1 ? `
          <select id="si-profile">
            ${v.profiles.map((p) => `<option value="${esc(p.id)}"${
              p.id === (vaultForm.profile || v.active) ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
          </select>` : ""}
        <div class="addrow three">
          <input id="si-pw" type="password" placeholder="Vault password" aria-label="Vault password" />
          <select id="si-for" title="How long to stay open" aria-label="How long to stay open">
            ${SESSION_LENGTHS.map(([value, label]) => `<option value="${value}"${
              value === vaultForm.duration ? " selected" : ""}>${label}</option>`).join("")}
          </select>
          <button class="act primary" id="si-go" ${busy ? "disabled" : ""}>Sign in</button>
        </div>
        ${aside(`<p>Staying open is the default. Nothing locks itself — a vault that
          shut at four in the morning would stop the work it exists to allow. Lock it
          whenever you want to.</p>`, "About staying signed in")}
        ${!v.running ? `<p class="note">The broker is not running; signing in starts it.</p>` : ""}
      </div>`;

    // Adding a profile is a once-a-year act, and its form was permanently open
    // under the list — a third "Vault password" box on a screen that already
    // had two, asking for a new one rather than the one you have.
    const profiles = `
      <div class="group">
        <div class="grouphead">
          <h3>Profiles</h3>
          <button class="act ${addingProfile ? "primary" : ""}" data-addprofile="1">
            ${addingProfile ? "Cancel" : "Add profile"}</button>
        </div>
        ${v.profiles.length ? v.profiles.map((p) => `
          <div class="row">
            <div class="grow">
              <strong>${esc(p.label)}</strong>${p.active ? " · active" : ""}
              <div class="factors">${p.factors.length
                ? p.factors.map((f) => `<span class="chip">${icon(
                    { password: "key", passkey: "person", device: "monitor" }[f.kind] || "shield",
                    "tinyicon")} ${esc(f.kind)}</span>`).join("")
                : `<span class="chip">no factors</span>`}</div>
            </div>
            ${p.active ? "" : `<button class="act" data-use="${esc(p.label)}">Use</button>`}
          </div>`).join("")
          : `<div class="empty">No profiles yet.</div>`}
        ${addingProfile ? `<div class="addrow">
          <input id="np-label" placeholder="Name for the new profile" spellcheck="false" />
          <input id="np-pw" type="password" placeholder="A password for it" />
          <button class="act primary" id="np-create" ${busy ? "disabled" : ""}>Create</button>
        </div>` : ""}
        ${aside(`<p>A profile is a sign-in and the key it holds, not a separate store.
          Every profile lists the same keys; what changes is whose key opens them.</p>
          <p>Adding one does not switch to it — press <strong>Use</strong> when you mean
          to, then sign in again.</p>`, "What a profile is")}
      </div>`;

    // One encryption panel, not two. This page and the Keys page each carried
    // their own; they disagreed about first run, because only one of them knew
    // how to make a profile and seal in a single step.
    const encryption = encryptionPanel(state.sealing || {});

    // What needs doing first, then what can be changed, then what is only being reported. With no
    // vault yet there is nothing to sign in to, open at restart, recover or add a profile to, and
    // those panels each asked for a "vault password" that did not exist: three password boxes on
    // a first-run screen whose one real action was further down.
    const noVault = !v.profiles.length;
    return settingsBack("Security") + `
      ${noVault ? "" : `<div class="group">${openState}</div>`}
      ${signIn}${encryption}
      ${readsBlock()}
      ${noVault ? `<p class="note">Opening at restart, a recovery code and profiles come once this
        device is secured.</p>` : `${stayOpenBlock()}${recoveryPanel()}${profiles}`}
      ${backupPanel()}
      ${veilGroup()}`;
  }

  function lockBanner() {
    if (!vault?.supported || vault.unlocked || !vault.fully_sealed) return "";
    // On Security the sign-in form is the first thing on the page; a banner over it offering to go
    // there said the same thing twice.
    if (page === "vault") return "";
    return `<div class="banner">
      ${icon("lock")}
      <div class="body"><strong>The vault is locked.</strong>
      Every value is encrypted, so apps on this device have no credentials until you sign in.
      <div class="acts"><button data-goto="vault">Sign in</button></div></div>
    </div>`;
  }

  /** The grid: every key against every app that has actually asked.
   *
   *  The apps listed are read out of the access ledger, not just the ones
   *  somebody remembered to configure — those are usually the interesting ones.
   */
  const STATE_TAG = {
    connected:    ["on",  "Live"],
    expiring:     ["on",  "Renewing"],
    expired:      ["off", "Expired"],
    "no-refresh": ["off", "No refresh"],
    disconnected: ["off", "Signed out"],
  };

  async function refreshSignins() {
    try { signins = await invoke("oauth_state"); }
    catch { signins = null; }
    try { ghStatus = await invoke("github_state"); }
    catch { ghStatus = null; }
  }

  /** GitHub is a connection, not a renewable sign-in: it is where keys go. */
  function githubGroup() {
    const s = ghStatus;
    const how = { device: "Signed in on github.com", gh: "Using your GitHub CLI login",
                  token: "Using a token you pasted" }[s?.method] || "Connected";
    return `<div class="group">
      <h3>GitHub</h3>
      <div class="row">
        ${avatar("github")}
        <div class="grow">
          <strong>${s?.connected ? `Connected as ${esc(s.account || "?")}` : "Not connected"}</strong>
          <div class="note">${s?.connected
            ? `${esc(how)}. Select keys, then Send to GitHub, to set them as Actions secrets.`
            : "Connect to send keys to your repositories as Actions secrets."}</div>
        </div>
        ${s?.connected
          ? `<button class="act danger" data-ghdisconnect ${busy || asking?.id === "ghdisconnect" ? "disabled" : ""}>Disconnect</button>`
          : `<button class="act" data-ghconnect ${busy ? "disabled" : ""}>Connect</button>`}
      </div>
      ${confirmStrip("ghdisconnect", `Disconnect GitHub? Its token is deleted from PassBook. Secrets
        already sent to GitHub stay there.`, "Disconnect")}
    </div>`;
  }

  async function callSignin(name, args = {}) {
    const typed = typedNow();
    let refused = false;
    busy = true; paint();
    try { signins = await invoke(name, args); notice = ""; }
    catch (e) { notice = said(e); refused = true; }
    finally { busy = false; paint(); if (refused) giveBack(typed); }
  }

  // Adding a sign-in was two terminal commands printed on this page, with "<your client id>" to fill
  // in by hand. It is a form now: the provider, the client ID and secret from registering with it, and
  // one press that describes it and opens the sign-in.
  const SIGNIN_PROVIDERS = [
    ["google", "Google", "an OAuth client ID of type \u201cDesktop app\u201d in Google Cloud \u2192 APIs & Services \u2192 Credentials. Google gives desktop clients a secret too; paste it."],
    ["microsoft", "Microsoft", "an app registration in Microsoft Entra, with a \u201cMobile and desktop\u201d redirect."],
    ["github", "GitHub", "an OAuth App under GitHub \u2192 Settings \u2192 Developer settings. Paste its client secret too."],
    ["custom", "Another provider", "a client with the provider, then give its sign-in and token addresses below."],
  ];
  let signinForm = { open: false, provider: "google", busy: false, error: "" };

  function signinFormPanel() {
    const f = signinForm;
    if (!f.open) {
      return `<div class="group">
        <div class="grouphead"><h3>Add a sign-in</h3>
          <button class="act" data-signinadd="1">${icon("plus")} Add a sign-in</button></div>
        <p class="note">Sign in to an account with a client you registered with the provider. PassBook
          keeps the tokens and renews them.</p>
        ${aside(`<p>No vendor's own client id ships with PassBook. Some tools sign in
          with a client they registered for themselves, and borrowing one is between
          you and that vendor's terms \u2014 not something this app should decide for
          you.</p>`, "Why you need your own client id")}
      </div>`;
    }
    const which = SIGNIN_PROVIDERS.find(([id]) => id === f.provider) || SIGNIN_PROVIDERS[0];
    const custom = f.provider === "custom";
    const off = f.busy ? "disabled" : "";
    return `<div class="group signinform">
      <h3>Add a sign-in</h3>
      <div class="formgrid">
        <label for="sf-provider">Provider</label>
        <select id="sf-provider" ${off}>${SIGNIN_PROVIDERS.map(([id, name]) =>
          `<option value="${id}"${id === f.provider ? " selected" : ""}>${esc(name)}</option>`).join("")}</select>
        <label for="sf-label">Name <span class="sub">optional</span></label>
        <input id="sf-label" data-keep ${off} spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="${custom ? "e.g. acme" : "e.g. work \u2014 to hold more than one"}" />
        <label for="sf-client">Client ID</label>
        <input id="sf-client" data-keep ${off} spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="From registering with ${esc(which[1] === "Another provider" ? "the provider" : which[1])}" />
        <label for="sf-secret">Client secret <span class="sub">if it has one</span></label>
        <input id="sf-secret" type="password" data-keep ${off} autocomplete="off"
          placeholder="Kept in this store, encrypted like any key" />
        ${custom ? `<label for="sf-auth">Sign-in address</label>
        <input id="sf-auth" data-keep ${off} spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="https://provider.example/oauth/authorize" />
        <label for="sf-token">Token address</label>
        <input id="sf-token" data-keep ${off} spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="https://provider.example/oauth/token" />` : ""}
        <label for="sf-scope">Scope <span class="sub">optional</span></label>
        <input id="sf-scope" data-keep ${off} spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="${custom ? "What to ask the provider for" : "The usual sign-in scope"}" />
      </div>
      <p class="note">Register ${which[2]} PassBook signs in through
        <code>http://localhost</code> on a free port, at <code>/auth/callback</code>.</p>
      ${f.error ? `<div class="note err" role="alert">${esc(f.error)}</div>` : ""}
      <div class="formacts">
        <button class="act" data-signincancel="1" ${off}>Cancel</button>
        <button class="act primary" data-signingo="1" ${off}>${f.busy
          ? `<span class="spinner"></span> Adding\u2026` : "Add and sign in"}</button>
      </div>
    </div>`;
  }

  function closeSigninForm() {
    signinForm = { open: false, provider: signinForm.provider, busy: false, error: "" };
    for (const id of ["sf-label", "sf-client", "sf-secret", "sf-auth", "sf-token", "sf-scope"]) {
      const el = document.getElementById(id);
      if (el) el.value = "";
    }
    paint();
  }

  /** Describe the sign-in, then open it in the browser. The fields stay as typed until the CLI has it. */
  async function submitSigninForm() {
    if (signinForm.busy) return;
    const field = (id) => String(document.getElementById(id)?.value || "").trim();
    const form = { provider: signinForm.provider, label: field("sf-label"), clientId: field("sf-client"),
                   clientSecret: field("sf-secret"), authorizeUrl: field("sf-auth"), tokenUrl: field("sf-token"),
                   scope: field("sf-scope") };
    if (!form.clientId) {
      signinForm.error = "Paste the client ID you registered with the provider.";
      paint(); document.getElementById("sf-client")?.focus(); return;
    }
    if (form.provider === "custom" && (!form.authorizeUrl || !form.tokenUrl)) {
      signinForm.error = "A custom provider needs its sign-in address and its token address.";
      paint(); document.getElementById(form.authorizeUrl ? "sf-token" : "sf-auth")?.focus(); return;
    }
    const before = new Set((signins || []).map((s) => s.id));
    const typed = typedNow();
    signinForm.busy = true; signinForm.error = ""; paint();
    try {
      signins = await invoke("oauth_add", form);
    } catch (e) {
      signinForm.busy = false; signinForm.error = said(e); paint(); giveBack(typed);
      return;
    }
    const made = (signins || []).find((s) => !before.has(s.id));
    closeSigninForm();
    if (made) connectSignin(made.id);
  }

  /** Start a browser sign-in and watch for it to finish. */
  async function connectSignin(id) {
    connecting[id] = true; paint();
    try { await invoke("oauth_connect", { id }); notice = ""; }
    catch (e) { notice = said(e); delete connecting[id]; paint(); return; }
    // The browser half happens outside this window, so poll rather than wait.
    const until = Date.now() + 185000;
    const tick = async () => {
      if (!connecting[id]) return;   // stopped waiting
      await refreshSignins();
      const done = (signins || []).find((s) => s.id === id);
      if (done?.state === "connected" || Date.now() > until) {
        delete connecting[id]; paint(); return;
      }
      setTimeout(tick, 2000);
    };
    setTimeout(tick, 2000);
  }

  /** Accounts this machine is signed in to, and whether they still work.
   *
   *  An OAuth grant is a credential with a clock on it. The broker renews one
   *  when something reads it, so "expired" here is a statement about right now
   *  rather than a problem — what actually needs a person is a grant with no
   *  refresh token, or one the provider has revoked.
   */
  function signinsPage() {
    const list = signins;
    if (list === null) {
      return `<h2>Sign-ins</h2><p class="lede">Reading…</p>`;
    }

    const rows = list.length ? list.map((s) => {
      const [tone, label] = STATE_TAG[s.state] || ["off", s.state];
      const waiting = connecting[s.id];
      return `<div class="row">
        ${avatar(String(s.id).split(":")[0])}
        <div class="grow">
          <strong class="mono">${esc(s.id)}</strong>
          <div class="note">${esc(s.detail)}</div>
        </div>
        <span class="tag ${tone}">${esc(label)}</span>
        ${waiting
          ? `<span class="note flat"><span class="spinner"></span> Waiting for the browser\u2026</span>
             <button class="act" data-oastop="${esc(s.id)}">Stop waiting</button>`
          : `${s.has_refresh ? `<button class="act" data-oarefresh="${esc(s.id)}"
                ${busy ? "disabled" : ""}>Renew</button>` : ""}
             <button class="act" data-oaconnect="${esc(s.id)}" ${busy ? "disabled" : ""}>
               ${s.state === "disconnected" ? "Sign in" : "Sign in again"}</button>
             <button class="act danger" data-oaforget="${esc(s.id)}" ${busy || asking?.id === "oaforget:" + s.id ? "disabled" : ""}>Forget</button>`}
      </div>
      ${confirmStrip("oaforget:" + s.id, `Forget ${esc(s.id)}? Its tokens are deleted from this store, and
        anything that uses them is signed out until you sign in again.`, "Forget")}`;
    }).join("") : `<div class="empty">No sign-ins yet.${signinForm.open ? "" : ` <button class="linkbtn" data-signinadd="1">Add one</button>`}</div>`;

    return `<h2>Sign-ins</h2>
      <p class="lede">Accounts this device holds, kept signed in so agents never
      meet a dead one.</p>
      <div class="group">
        ${rows}
        ${aside(`<p>A sign-in is stored like any other credential \u2014 encrypted with
          them, held to the same rules, in the same record. What is different is the
          clock: it is renewed on the way past when something reads it, so nothing has
          to handle that itself.</p>`, "How these stay alive")}
      </div>
      ${signinFormPanel()}
      ${githubGroup()}`;
  }

  /** A rejected invoke as a sentence: without the "Error:" in front of one that already is. */
  const balanceError = (error) => String(error?.message ?? error ?? "").replace(/^Error:\s*/, "");

  /** Read the balances. `quiet` is the reading taken at launch and each hour while the app is open, so
   *  the history has points on days nobody opened this page: it repaints only if the page is showing. */
  // One read at a time, and a read asked for while one runs waits for it and then runs: it used to be dropped,
  // so a key saved during the hourly read never showed (1.10.17).
  let balanceRead = null;
  async function loadBalances(fresh = false, quiet = false) {
    while (balanceRead) await balanceRead.catch(() => {});
    balanceRead = (async () => {
      balancesView.busy = true;
      if (!quiet) { balancesView.error = ""; paint(); }
      try { balancesView.data = await invoke("balances_state", { fresh }); balancesView.readAt = Date.now(); }
      catch (e) { if (!quiet) balancesView.error = balanceError(e); }
      finally { balancesView.busy = false; if (!quiet || page === "balances") paint(); }
      loadBalanceIcons();
    })();
    try { await balanceRead; } finally { balanceRead = null; }
  }

  /** Each provider's logo, once per launch. Slow the first time (it visits each site), so never awaited. */
  async function loadBalanceIcons() {
    if (balancesView.iconsAsked || !balancesView.data?.enabled) return;
    balancesView.iconsAsked = true;
    try {
      balancesView.icons = (await invoke("balances_icons"))?.icons || {};
      if (page === "balances") paint();
    } catch { balancesView.iconsAsked = false; }
  }

  /** Ask what is installed and what is newest. `quiet` is the check at launch and twice a day: it only
   *  repaints the sidebar's dot, never the page somebody may be typing on. */
  async function loadUpdates(quiet = false) {
    if (updatesView.busy || updatesView.working) return;
    updatesView.busy = true;
    if (!quiet) { updatesView.error = ""; paint(); }
    try { updatesView.data = await invoke("update_state"); updatesView.checked = Date.now(); }
    catch (e) { if (!quiet) updatesView.error = balanceError(e); }
    finally {
      updatesView.busy = false;
      if (!quiet || page === "updates" || page === "settings") paint(); else paintNav();
    }
  }

  async function installUpdate(appOnly) {
    updatesView.working = "install"; updatesView.error = ""; paint();
    try {
      const next = await invoke("update_install", { appOnly });
      if (next?.restarting) { updatesView.working = "restarting"; updatesView.restartingTo = next.version; paint(); return; }
      updatesView.data = next; updatesView.checked = Date.now();
    }
    catch (e) { updatesView.error = balanceError(e); }
    updatesView.working = ""; paint();
  }

  /** Settings → Updates: the app, the command line and the background service, each with the version
   *  it is on, and one button that brings the first two to the newest release. */
  function updatesPage() {
    const v = updatesView, d = v.data;
    if (!d) return `${settingsBack("Updates")}<p class="lede">${v.error ? esc(v.error) : "Checking…"}</p>`;
    const a = d.app || {}, c = d.cli || {};
    const needApp = !!(a.available && a.can_install), needCli = !!(c.behind && c.can_update);
    const working = v.working;
    const row = (glyph, tone, name, version, note, tag, extra = "") => `<div class="row">
      <span class="statustile ${tone}">${icon(glyph)}</span>
      <div class="grow"><strong>${esc(name)}</strong>${version ? ` <span class="figure">${esc(version)}</span>` : ""}
        <div class="note">${note}</div></div>
      ${tag ? `<span class="tag ${tag[0]}">${esc(tag[1])}</span>` : ""}${extra}</div>`;
    const appNote = a.available
      ? `Version ${esc(a.latest)} is out.${a.can_install ? "" : ` This copy was installed as a package, so it cannot replace itself: get the new package from <span class="mono">${esc((d.releases || "").replace("https://", ""))}</span>.`}`
      : a.error ? "Could not ask for the newest version. Check the connection and try again."
      : "This is the newest release.";
    const cliNote = c.error ? "The command line here is too old to say its version. Run <span class=\"mono\">passbook update</span> in a terminal."
      : c.behind ? `Version ${esc(c.latest)} is out.${c.can_update ? "" : ` This copy is ${esc(c.method || "not installed by PassBook")}, so it is updated there.`}`
      : !c.latest ? "Could not ask for the newest version."
      : `The newest release, installed by ${esc(c.method || "this computer")}.`;
    const tagFor = (behind, unknown) => behind ? ["off", "Update"] : unknown ? ["", "Unknown"] : ["on", "Current"];
    const stuckCli = v.error && v.error.startsWith("The command line could not be updated") && needApp;
    return `${settingsBack("Updates")}
      <div class="group">
        ${row("monitor", a.available ? "warn" : "good", "PassBook app", a.current || "", appNote, tagFor(a.available, !!a.error))}
        ${row("doc", c.behind ? "warn" : "good", "Command line", c.installed || "", cliNote, tagFor(c.behind, !!c.error || !c.latest))}
        ${c.service ? row("hub", c.service_behind ? "warn" : "good", "Background service", c.service,
            c.service_behind ? "Still running the version it was started from. Restarting it closes the vault: sign in again afterwards."
                             : "Running the installed version.",
            tagFor(c.service_behind, false),
            c.service_behind ? `<button class="act" data-service-restart="1" ${working ? "disabled" : ""}>
              ${working === "service" ? "Restarting…" : "Restart"}</button>` : "") : ""}
        <div class="row">
          <div class="grow note">${working === "restarting" ? `Installed ${esc(v.restartingTo || "")}. Restarting PassBook…`
            : working === "install" ? "Downloading and checking the release…"
            : v.busy ? "Checking…" : "Checked just now. PassBook also checks when it opens."}</div>
          <button class="act" data-update-check="1" ${v.busy || working ? "disabled" : ""}>Check again</button>
          ${needApp || needCli ? `<button class="act primary" data-update-install="all" ${v.busy || working ? "disabled" : ""}>
            ${working === "install" ? "Updating…" : needApp ? `Update to ${esc(a.latest)} and restart` : "Update the command line"}</button>` : ""}
        </div>
      </div>
      ${v.error ? `<p class="note">${esc(v.error)}</p>` : ""}
      ${stuckCli ? `<div class="group quiet"><div class="row"><div class="grow note">Update only the app for now. Pages
        that need the newer command line will say so until it is updated.</div>
        <button class="act" data-update-install="app" ${working ? "disabled" : ""}>Update the app only</button></div></div>` : ""}
      ${a.available && a.notes ? `<div class="group"><h3>In ${esc(a.latest)}</h3>
        <div class="row"><div class="grow note prewrap">${esc(a.notes)}</div></div></div>` : ""}
      ${aside(`<p>An update is downloaded from PassBook's releases on GitHub and installed only if its signature
        matches the key built into this app. Nothing is installed until you press the button.</p>
        <p>To check, PassBook asks GitHub for the newest version when it opens and twice a day while open.
        Nothing about you, this computer or your keys is sent.</p>`, "How updates work")}`;
  }

  // ── where keys are, between devices ────────────────────────────────────
  //
  // Asked for after a day spent finding out why two paired Macs each lacked the other's key (2026-10-13):
  // the window had no way to show that one device could not answer and the other was holding keys back.
  // `sync_status` is names and counts from each device's own account of itself; nothing is opened.
  let syncView = { data: null, busy: false, working: "", error: "", said: "", open: "" };
  const deviceName = (host) => String(host || "").replace(/^hivemindos-/, "");

  async function loadSync(quiet = false) {
    if (syncView.busy || syncView.working) return;
    syncView.busy = true;
    watchSync();
    if (!quiet) { syncView.error = ""; paint(); }
    try { syncView.data = await invoke("sync_status"); }
    catch (e) { if (!quiet) syncView.error = balanceError(e); }
    finally {
      syncView.busy = false; unwatchSync();
      if (!quiet || ["machines", "attention", "keys"].includes(page)) paint(); else paintNav();
    }
  }

  // The check asks every other device and can take most of a minute. The page said only "Checking the
  // other devices…" for all of it, so it could not be told from a hang. `passbook://sync-progress` says
  // which devices are being asked and when each answers; the page shows that, and how long the ones
  // still out have been waited on.
  let syncTicker = null;
  function watchSync() {
    syncView.progress = { stage: "finding", hosts: [], answered: {}, started: Date.now() };
    clearInterval(syncTicker);
    // Only the seconds change, so a tick rewrites that one line: a whole repaint each second restarted
    // every spinner on the page and would drop a selection.
    syncTicker = setInterval(() => {
      const line = page === "machines" && syncView.progress && main.querySelector("[data-syncnote]");
      if (line) line.textContent = line.dataset.syncnote + syncProgressNote();
    }, 1000);
  }
  function unwatchSync() { syncView.progress = null; clearInterval(syncTicker); syncTicker = null; }
  function syncStep(step) {
    if (!step) return;
    // Sync now exchanges keys first and checks after; its progress starts with the check.
    if (!syncView.progress && step.stage === "finding" && syncView.working) watchSync();
    const p = syncView.progress;
    if (!p) return;
    if (step.stage === "asking") { p.stage = "asking"; p.hosts = step.hosts || []; p.askedAt = Date.now(); }
    else if (step.stage === "answered" && step.host) p.answered[step.host] = { ok: !!step.ok, seconds: step.seconds };
    if (page === "machines") paint();
  }

  /** Where a running check has got to, as one line. */
  function syncProgressNote() {
    const p = syncView.progress;
    if (!p) return "";
    if (p.stage !== "asking") return "Finding your other devices on the network\u2026";
    if (!p.hosts.length) return "No other device answered on the network.";
    const out = p.hosts.filter((h) => !p.answered[h]);
    const waited = Math.round((Date.now() - (p.askedAt || p.started)) / 1000);
    if (!out.length) return "Every device answered. Comparing keys\u2026";
    return `${p.hosts.length - out.length} of ${p.hosts.length} device${p.hosts.length === 1 ? "" : "s"} answered`
      + ` \u00b7 waiting on ${out.map(deviceName).join(", ")}${waited >= 3 ? ` (${waited} s)` : ""}\u2026`;
  }

  /** The devices being asked on a first check, each with whether it has answered yet. */
  function syncProgressRows() {
    const p = syncView.progress;
    if (!p || p.stage !== "asking") return "";
    return p.hosts.map((h) => {
      const got = p.answered[h];
      return `<div class="row">
        <span class="statustile ${got ? (got.ok ? "good" : "warn") : "plain"} sm">${icon("monitor")}</span>
        <div class="grow"><strong>${esc(deviceName(h))}</strong></div>
        ${got ? `<span class="tag ${got.ok ? "on" : "off"}">${got.ok ? "Answered" : "Not answering"}</span>`
              : `<span class="note flat"><span class="spinner"></span> Asking\u2026</span>`}
      </div>`;
    }).join("");
  }

  async function syncNow() {
    syncView.working = "sync"; syncView.error = ""; syncView.said = ""; paint();
    try {
      const d = await invoke("sync_now");
      syncView.data = d;
      const pulled = (d.ran?.pulled || []).length, sent = Object.values(d.ran?.sent || {}).reduce((a, b) => a + b, 0);
      syncView.said = pulled || sent ? `Received ${pulled} key${pulled === 1 ? "" : "s"}, sent ${sent}.`
        : (d.devices || []).length ? "Nothing needed to move." : "There is no other device to exchange keys with.";
      state = await invoke("state");
    } catch (e) { syncView.error = balanceError(e); }
    finally { syncView.working = ""; unwatchSync(); paint(); }
  }

  /** Seconds since the epoch as "5m ago", or what to say when it never happened. */
  const sinceEpoch = (when, never) => (when ? ago(new Date(when * 1000).toISOString()) : never);

  /** The Devices page's first panel: is every key everywhere, and if not, where is it stuck. */
  function syncPanel() {
    const v = syncView, d = v.data;
    if (!d) return `<div class="group"><h3>Sync</h3><div class="row"><div class="grow note flat" role="status" aria-live="polite">${v.error ? esc(v.error)
      : v.progress ? `<span class="spinner"></span> <span data-syncnote="">${esc(syncProgressNote())}</span>` : "Checking the other devices\u2026"}</div></div>${v.error ? "" : syncProgressRows()}</div>`;
    const devices = d.devices || [];
    if (!devices.length) return `<div class="group"><h3>Sync</h3><div class="row"><div class="grow note flat">No other device on your network is exchanging keys with this one.</div></div></div>`;
    const apart = Object.keys(d.notEverywhere || {}).length;
    const down = devices.filter((r) => !r.reachable).length;
    const stuck = devices.reduce((n, r) => n + r.heldBack.length, 0);
    const fine = !apart && !down && !stuck && !devices.some((r) => r.missingHere.length);
    const names = (list) => list.slice(0, 14).map((k) => `<span class="chip mono">${esc(k)}</span>`).join("")
      + (list.length > 14 ? `<span class="sub">and ${list.length - 14} more</span>` : "");
    const row = (r) => {
      const open = v.open === r.host;
      const facts = !r.reachable ? ["Not answering. Keys cannot move to or from it until it does."] : [
        `${r.serves} keys`,
        ...(r.missingThere.length ? [`lacks ${r.missingThere.length} of this device's`] : []),
        ...(r.missingHere.length ? [`has ${r.missingHere.length} this device lacks`] : []),
        ...(r.heldBack.length ? [`holds ${r.heldBack.length} it cannot hand over yet`] : []),
      ];
      const tag = !r.reachable ? ["off", "Not answering"] : r.missingThere.length || r.missingHere.length || r.heldBack.length ? ["", "Catching up"] : ["on", "In step"];
      const detail = r.missingThere.length || r.missingHere.length || r.heldBack.length;
      return `<div class="row top">
        <span class="statustile ${!r.reachable ? "warn" : detail ? "plain" : "good"} sm">${icon("monitor")}</span>
        <div class="grow"><strong>${esc(deviceName(r.host))}</strong>
          <div class="note flat">${esc(facts.join(" \u00b7 "))}</div>
          ${r.pulledAt || r.sentAt ? `<div class="note flat">${esc([r.pulledAt ? `Last received from it ${sinceEpoch(r.pulledAt)}` : "", r.sentAt ? `last sent to it ${sinceEpoch(r.sentAt)}` : ""].filter(Boolean).join(" \u00b7 ").replace(/^l/, "L"))}</div>` : ""}
          ${open ? `${r.missingThere.length ? `<div class="synclist"><span class="dlabel">Not on it yet</span><div class="chips inline">${names(r.missingThere)}</div></div>` : ""}
            ${r.missingHere.length ? `<div class="synclist"><span class="dlabel">Not on this device yet</span><div class="chips inline">${names(r.missingHere)}</div></div>` : ""}
            ${r.heldBack.length ? `<div class="synclist"><span class="dlabel">Held there, not handed over</span><div class="chips inline">${names(r.heldBack)}</div>
              <div class="note flat">${r.restartWouldServe.length ? "It will hand these over once its background collector restarts, which it now does by itself." : "That device keeps these to itself, or cannot open them until someone signs in there."}</div></div>` : ""}` : ""}
        </div>
        <span class="tag ${tag[0]}">${tag[1]}</span>
        ${detail ? `<button class="act" data-sync-open="${esc(r.host)}">${open ? "Hide" : "Which keys"}</button>` : ""}
      </div>`;
    };
    return `<div class="group"><h3>Sync</h3>
      <div class="row">
        <span class="statustile ${fine ? "good" : "plain"}">${icon(fine ? "check" : "history")}</span>
        <div class="grow"><strong>${fine ? "Every key is on every device" : apart ? `${apart} key${apart === 1 ? " is" : "s are"} not on every device` : down ? `${down} device${down === 1 ? " is" : "s are"} not answering` : "Some keys are still on their way"}</strong>
          <div class="note flat" role="status" aria-live="polite">${v.working && v.progress
            ? `<span data-syncnote="Keys exchanged. ">Keys exchanged. ${esc(syncProgressNote())}</span>`
            : v.busy && v.progress ? `<span data-syncnote="Checking again: ">Checking again: ${esc(syncProgressNote())}</span>`
            : esc(v.working ? "Exchanging keys with the other devices\u2026"
              : v.said || `Checked ${sinceEpoch(d.checkedAt, "just now")}. Devices exchange keys by themselves every ten minutes.`)}</div></div>
        <button class="act" data-sync-check="1" ${v.busy || v.working ? "disabled" : ""}>${v.busy ? "Checking…" : "Check again"}</button>
        <button class="act primary" data-sync-now="1" ${v.busy || v.working ? "disabled" : ""}>${v.working ? "Syncing…" : "Sync now"}</button>
      </div>
      ${devices.map(row).join("")}
      ${v.error ? `<div class="row"><div class="grow note flat">${esc(v.error)}</div></div>` : ""}
    </div>`;
  }

  /** What a key's own service said when it refused it, or "" when it has not. */
  const refusedWhy = (k) => { const hit = rejectedKeys().find((r) => r.key === k); return hit ? `${hit.provider}: ${hit.why}` : ""; };

  /** Which devices a key is missing from, for its detail and for the "not on every device" filter. */
  const lackingDevices = (k) => (syncView.data?.notEverywhere || {})[k] || [];

  // ── attention ──────────────────────────────────────────────────────────
  //
  // Everything that wants a decision, in one list, each with the one thing to press. Until this page
  // the same facts were spread over six places or said nowhere: four keys their services had refused,
  // a background service three versions old, values lying unencrypted, a device that could not sync.
  // It only collects what the other pages already know; nothing is asked of anything to build it.

  /** Keys whose own service refused them, from the balance readings: [{key, provider, why}]. */
  function rejectedKeys() {
    return (balancesView.data?.providers || []).filter((r) => r.status === "error" && r.providerError && r.keyName)
      .map((r) => ({ key: r.keyName, provider: r.name, why: r.message }));
  }

  function attentionItems() {
    if (!state) return [];
    const items = [];
    const pending = (state.broker?.pending || []).length;
    if (pending) items.push({ tone: "warn", glyph: "inbox", title: `${pending} request${pending === 1 ? " is" : "s are"} waiting for your answer`,
      detail: "Something asked for a key and is waiting on you.", go: ["access", "Review"] });
    for (const r of state.rotations || []) items.push({ tone: "warn", glyph: "history", title: `${r.key} is half rotated`,
      detail: r.restored ? "The previous value was put back; the services that got the new one still need it." : "The new value is in place and the previous one is still being kept until you say it works.",
      rotate: r.key, label: "Finish" });
    for (const r of rejectedKeys()) items.push({ tone: "warn", glyph: "alert", title: `${r.provider} refused ${r.key}`,
      detail: r.why, rotate: r.key, label: "Replace it" });
    for (const low of balancesView.data?.summary?.low || []) items.push({ tone: "warn", glyph: "coins", title: `${low.name} is running low`,
      detail: low.why, topup: low.id, label: "Top up" });
    const u = updatesView.data;
    if (u?.app?.available) items.push({ tone: "plain", glyph: "download", title: `PassBook ${u.app.latest} is out`, detail: `This is ${u.app.current}.`, go: ["updates", "Update"] });
    else if (u?.cli?.behind) items.push({ tone: "plain", glyph: "download", title: "The command line is behind the app", detail: `It is ${u.cli.installed}; ${u.cli.latest} is out.`, go: ["updates", "Update"] });
    if (u?.cli?.service_behind) items.push({ tone: "plain", glyph: "hub", title: "The background service is running an old version",
      detail: `It is still ${u.cli.service}. Restarting it closes the vault until you sign in again.`, go: ["updates", "Review"] });
    const bare = (vault?.plaintext?.length ?? 0) + (vault?.legacy_v1?.length ?? 0);
    if (vault?.supported && bare) items.push({ tone: "plain", glyph: "unlock", title: `${bare} value${bare === 1 ? " is" : "s are"} not encrypted`,
      detail: "Anything running as you can read them, signed in or not.", go: ["vault", "Encrypt"] });
    const d = syncView.data;
    if (d) {
      const down = (d.devices || []).filter((r) => !r.reachable);
      if (down.length) items.push({ tone: "plain", glyph: "monitor", title: `${down.map((r) => deviceName(r.host)).join(", ")} ${down.length === 1 ? "is" : "are"} not answering`,
        detail: "Keys cannot move to or from it until it does.", go: ["machines", "See devices"] });
      const apart = Object.keys(d.notEverywhere || {}).length;
      if (apart) items.push({ tone: "plain", glyph: "monitor", title: `${apart} key${apart === 1 ? " is" : "s are"} not on every device`,
        detail: "Devices exchange keys by themselves every ten minutes; this is what has not arrived.", go: ["machines", "See devices"] });
    }
    return items;
  }

  /** Attention's place in the sidebar. It is not one of the permanent pages: the list stays as short as
   *  it was, and this row appears above it only while something wants a decision (or while you are on
   *  the page, so it does not vanish from under you as the last item clears). */
  function attentionEntry(count) {
    if (!count && page !== "attention") return "";
    return `<div class="navlist attn"><button data-page="attention" aria-current="${page === "attention"}">
      ${icon("bell", "navicon")}<span class="navlabel">Attention</span>
      ${count ? `<span class="navcount hot">${count}</span>` : ""}</button></div>`;
  }

  function attentionPage() {
    const items = attentionItems();
    return `<h2>Attention</h2>
      <p class="lede">${items.length ? "What wants a decision from you, each with the one thing to press." : "Nothing needs you right now."}</p>
      ${items.length ? `<div class="group">${items.map((item) => `<div class="row">
          <span class="statustile ${item.tone}">${icon(item.glyph)}</span>
          <div class="grow"><strong>${esc(item.title)}</strong><div class="note flat">${esc(item.detail || "")}</div></div>
          ${item.go ? `<button class="act" data-goto="${item.go[0]}">${esc(item.go[1])}</button>` : ""}
          ${item.rotate ? `<button class="act" data-rotate-go="${esc(item.rotate)}">${esc(item.label)}</button>` : ""}
          ${item.topup ? `<button class="act" data-topup="${esc(item.topup)}">${esc(item.label)}</button>` : ""}
        </div>`).join("")}</div>`
      : `<div class="group"><div class="row"><span class="statustile good">${icon("check")}</span>
          <div class="grow note flat">No requests waiting, nothing refused, nothing low, every key where it should be, and this is the newest release.</div></div></div>`}
      ${aside(`<p>This page collects what the others already know: requests on Permissions, refused keys and low
        balances from Balances (when it is on), versions from Updates, unencrypted values from Security, and
        where keys are from Devices. Turning Balances on is what lets it tell you a service has refused a key.</p>`, "Where this comes from")}`;
  }

  // ── balances: what the page says ───────────────────────────────────────
  //
  // Rebuilt for 1.10.7 (Liam, 2026-10-13: "at a glance visibility so users can see immediately what's
  // low"). The first page was a list of numbers, and a number alone does not say whether it is a lot.
  // Each live service now reads left to right as: whose it is (its own logo), how full (a meter against
  // the plan's quota, or the balance after the last top-up), what is left, what it is costing over the
  // chosen span and whether that is rising, and one button to top up. Everything it shows is worked out
  // by the command line (passbook_insights.py), so the terminal and HivemindOS can say the same.

  const BALANCE_TAG = { ready: ["on", "Live"], error: ["off", "Needs a look"], locked: ["", "Locked"],
                        missing: ["", "Needs a stronger key"], manual: ["", "On their site"] };
  // What each kind of problem is called, worst first (passbook_balances.issue_for says what and why).
  const ISSUE_TAG = { "key-rejected": ["off", "Key rejected"], "wrong-account": ["off", "Wrong account"], "needs-balance-key": ["mid", "Needs a stronger key"],
                      "missing-key": ["mid", "Missing a key"], locked: ["", "Locked"], unreachable: ["", "Didn't answer"],
                      "not-offered": ["", "Not offered"], "enter-balance": ["info", "Credits not reported"],
                      "entered-stale": ["mid", "Enter credits again"], "console-signin": ["info", "Credits in the Console"],
                      "console-expired": ["mid", "Sign in again"], "console-blocked": ["off", "Console refused"] };
  const BALANCE_SPANS = [["today", "Today"], ["week", "7 days"], ["month", "30 days"]];
  const SPAN_WORDS = { today: "today", week: "last 7 days", month: "last 30 days" };

  /** An amount in its unit: dollars as money, anything else as a count with its name. */
  function amount(n, unit) {
    const v = Number(n);
    if (unit === "USD") return `$${v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    return `${v.toLocaleString(undefined, { maximumFractionDigits: Math.abs(v) < 100 ? 2 : 0 })}${unit ? ` ${unit}` : ""}`;
  }
  const shortDay = (iso) => new Date(`${iso}T00:00:00Z`).toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });

  /** How long what is left will last, in words a person would say. */
  function runwayWords(days) {
    if (days === null || days === undefined) return "";
    if (days < 1) return "under a day left";
    if (days >= 365) return "over a year left";
    if (days >= 60) return `about ${Math.round(days / 30)} months left`;
    return `about ${Math.round(days)} day${Math.round(days) === 1 ? "" : "s"} left`;
  }

  /** Up or down against the span before, or nothing when there is no fair span to compare with. */
  function trend(change) {
    if (change === null || change === undefined) return "";
    if (Math.abs(change) < 0.5) return "";  // the same as before is not news
    const up = change > 0;
    return `<span class="trend ${up ? "up" : "down"}" title="${up ? "More" : "Less"} than the span before">${up ? "▲" : "▼"} ${Math.abs(Math.round(change))}%</span>`;
  }

  /** What a service spent over the chosen span: {text, change, sub} or null when nothing is known. */
  function spanSpend(spend, span) {
    if (!spend) return null;
    if (span === "today") {
      return { value: spend.today, sub: spend.yesterday === null || spend.yesterday === undefined ? "so far today" : `${amount(spend.yesterday, spend.unit)} yesterday`, change: null };
    }
    const watched = span === "week" ? spend.weekWatched : spend.monthWatched;
    const value = span === "week" ? spend.week : spend.month;
    return { value, change: span === "week" ? spend.weekChange : spend.monthChange, sub: watched ? SPAN_WORDS[span] : "since tracking began" };
  }

  /** A provider's own logo when its site gave one, else the letter this app has always drawn. */
  function logo(r) {
    const src = balancesView.icons[r.provider || r.providerId];
    return src ? `<img class="logo" src="${esc(src)}" alt="" />` : `<span class="logo letter">${avatar(r.name)}</span>`;
  }

  /** The meter: what is left against what full is. Green over half, amber to a fifth, red under. */
  function meterBar(m) {
    if (!m) return `<div class="bmeter none"></div>`;
    if (m.empty) return `<div class="bmeter"><div class="meter"><span style="width:0"></span></div><div class="metercap">Nothing in this account</div></div>`;
    // Nothing to measure against yet: the most this account has held is what it holds now. A full green
    // bar would be a claim, so the track is left bare until a top-up is seen or a full mark is set.
    if (m.kind === "balance" && m.basis === "highest" && m.fraction >= 0.999) {
      return `<div class="bmeter"><div class="meter unknown"></div>
        <div class="metercap">No top-up seen yet \u00b7 open to set what full is</div></div>`;
    }
    const pct = Math.max(0, Math.min(100, Math.round(m.fraction * 100)));
    const tone = m.fraction < 0.2 ? "low" : m.fraction < 0.5 ? "mid" : "ok";
    const against = m.kind === "quota"
      ? `${m.unit === "USD" ? `${esc(amount(m.used, "USD"))} of ${esc(amount(m.full, "USD"))}` : `${Number(m.used).toLocaleString()} of ${Number(m.full).toLocaleString()} ${esc(m.unit || "")}`} used${m.resetsAt ? ` · resets ${esc(shortDay(m.resetsAt.slice(0, 10)))}` : ""}`
      : m.basis === "highest" && m.fraction >= 0.999 ? "no top-up seen yet"
      : `of ${esc(amount(m.full, m.unit))}${m.basis === "top-up" ? " at last top-up" : m.basis === "set" ? " when full" : " at its highest"}`;
    return `<div class="bmeter"><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
      <span class="${tone}" style="width:${Math.max(pct, 2)}%"></span></div>
      <div class="metercap"><b>${pct}% left</b> · ${against}</div></div>`;
  }

  /** Spend per day as bars. The chosen span is drawn in the accent; a day nobody watched has no bar. */
  function dayBars(days, unit, span, tall = 64) {
    if (!days?.length) return "";
    const top = Math.max(...days.map((p) => p.v), 0.0001);
    const lit = span === "today" ? 1 : span === "week" ? 8 : days.length;
    const w = 100 / days.length;
    const bars = days.map((p, i) => {
      const h = Math.max(p.v / top * (tall - 6), p.v > 0 ? 2 : 0);
      const on = i >= days.length - lit;
      return `<rect x="${(i * w + w * 0.14).toFixed(2)}%" y="${(tall - h).toFixed(1)}" width="${(w * 0.72).toFixed(2)}%" height="${h.toFixed(1)}" rx="1.5"
        class="${on ? "on" : ""}${i === days.length - 1 ? " now" : ""}" data-tip="${esc(shortDay(p.d))} · ${esc(amount(p.v, unit))}"></rect>`;
    }).join("");
    return `<div class="daybars"><svg class="bars" width="100%" height="${tall}" role="img" aria-label="Spend per day">
      <line x1="0" x2="100%" y1="${tall - 0.5}" y2="${tall - 0.5}" class="base"/>${bars}</svg>
      <div class="dayaxis"><span>${esc(shortDay(days[0].d))}</span><span>peak ${esc(amount(top, unit))} a day</span><span>today</span></div></div>`;
  }

  /** The four things to know before reading a single row. */
  function balanceStats(d, span) {
    const u = d.summary?.usd || {}, low = d.summary?.low || [], out = d.summary?.nextOut;
    const spent = span === "today" ? u.today : span === "week" ? u.week : u.month;
    const change = span === "week" ? u.weekChange : span === "month" ? u.monthChange : null;
    const spentSub = !u.tracked ? "no dollar spend to track yet"
      : span === "today" ? `${amount(u.yesterday || 0, "USD")} yesterday`
      : change === null || change === undefined ? `${amount(u.perDay || 0, "USD")} a day lately`
      : `${trend(change)} against the ${span === "week" ? "7" : "30"} days before`;
    const card = (label, value, sub, tone = "") => `<div class="stat ${tone}"><span class="statk">${label}</span>
      <span class="statv">${value}</span><span class="stats">${sub}</span></div>`;
    return `<div class="stats4">
      ${card("On hand", u.accounts ? esc(amount(u.balance, "USD")) : "—", u.accounts ? `in ${u.accounts} dollar account${u.accounts === 1 ? "" : "s"}` : "no dollar balance reported")}
      ${card(`Spent · ${SPAN_WORDS[span]}`, u.tracked ? esc(amount(spent || 0, "USD")) : "—", spentSub)}
      ${card("Running low", low.length ? String(low.length) : "None", low.length ? esc(low.slice(0, 2).map((x) => x.name).join(", ") + (low.length > 2 ? ` +${low.length - 2}` : "")) : "nothing under a fifth or a week", low.length ? "warn" : "good")}
      ${card("Runs out first", out ? esc(out.name) : "—", out ? esc(runwayWords(out.days)) + " at this rate" : "not enough history to say")}
    </div>`;
  }

  /** The live list's column names, sticky at the top while it scrolls; the same grid as a row, so they line up. */
  function balanceHeader(span) {
    return `<div class="brow bhead" role="row"><div class="bmain">
        <span></span><span>Service</span><span>How full</span><span class="bfig">Left</span>
        <span class="bfig spend">${span === "today" ? "Spent today" : `Spent · ${span === "week" ? "7" : "30"} days`}</span></div>
      <span class="act bph" aria-hidden="true">Top up</span></div>`;
  }

  /** One live service: logo, name, meter, what is left, what it costs, top up. Opens for the detail. */
  function balanceRow(r, span) {
    const i = r.insights || {}, m = i.meter, open = balancesView.open === r.providerId;
    const spend = spanSpend(i.spend, span);
    // Figures shown only as reported (Stripe, a brokerage, Vultr): the first one, named, and the next beside it.
    const figure = (text) => { const n = /^(-?[\d.]+) USD$/.exec(text || ""); return n ? amount(Number(n[1]), "USD") : text; };
    const [d0, d1] = r.details || [];
    const asReported = (r.balance === null || r.balance === undefined) && !m && (r.usageUsd === null || r.usageUsd === undefined) && d0;
    const left = r.balance !== null && r.balance !== undefined ? amount(r.balance, r.unit)
      : m?.kind === "quota" ? (m.unit === "USD" ? amount(m.left, "USD") : `${Number(m.left).toLocaleString()} ${m.unit || ""}`.trim())
      : r.usageUsd !== null && r.usageUsd !== undefined ? `${amount(r.usageUsd, "USD")} used` : d0 ? figure(d0.value) : "—";
    // A quota that refills before it would run out is not counting down to anything.
    const refills = m?.kind === "quota" && m.resetsAt ? (Date.parse(m.resetsAt) - Date.now()) / 86400000 : null;
    const hasRunway = i.runwayDays !== null && i.runwayDays !== undefined;
    const estimate = r.balanceKind === "entered" ? "estimate" : r.balanceKind === "console" ? "from the Console"
      : r.balanceKind === "monthly" ? "monthly credits" : "";
    const leftRest = (hasRunway && refills !== null && i.runwayDays >= refills ? "enough until it resets"
      : hasRunway ? runwayWords(i.runwayDays)
      : m?.kind === "quota" ? "left on the plan" : r.usagePeriod ? r.usagePeriod.toLowerCase()
      : asReported ? `${d0.label.toLowerCase()}${d1 ? ` · ${d1.label.toLowerCase()} ${figure(d1.value)}` : ""}`
      : "");
    const leftSub = [estimate, leftRest].filter(Boolean).join(" · ");
    // Whether there is anything here whose movement could be spend at all.
    const trackable = m || (r.usageUsd !== null && r.usageUsd !== undefined);
    return `<div class="brow${i.low ? " low" : ""}${open ? " open" : ""}">
      <button class="bmain" data-bal-open="${esc(r.providerId)}" aria-expanded="${open}">
        ${logo(r)}
        <span class="bname"><strong>${esc(r.name)}</strong>${i.low ? ` <span class="tag off">Low</span>` : ""}
          <span class="sub">${esc(i.low ? i.lowWhy : r.category)}</span></span>
        ${meterBar(m)}
        <span class="bfig"><strong>${esc(left)}</strong><span class="sub">${esc(leftSub)}</span></span>
        <span class="bfig spend">${spend ? `<strong>${esc(amount(spend.value, i.spend.unit))}</strong> ${trend(spend.change)}<span class="sub">${esc(spend.sub)}</span>`
          : `${trackable ? `<strong class="dim">—</strong><span class="sub">${m?.kind === "quota" ? "no use seen yet" : "no spend seen yet"}</span>` : ""}`}</span>
      </button>
      ${r.topUpUrl ? `<button class="act" data-topup="${esc(r.provider || r.providerId)}" title="Open ${esc(r.name)}'s billing page">${r.category === "Money" ? "Open" : "Top up"}</button>` : ""}
      ${open ? balanceDetail(r) : ""}
    </div>`;
  }

  /** Under an opened row: its own spend per day, every figure the provider reported, and what full is. */
  function balanceDetail(r) {
    const i = r.insights || {}, m = i.meter, s = i.spend;
    const facts = [
      ...(s ? [["Today", amount(s.today, s.unit)], ["Last 7 days", amount(s.week, s.unit) + (s.weekWatched ? "" : " so far")],
               ["Last 30 days", amount(s.month, s.unit) + (s.monthWatched ? "" : " so far")],
               ...(s.perDay !== null && s.perDay !== undefined ? [["A day, lately", amount(s.perDay, s.unit)]] : [])] : []),
      ...(i.lastTopUp ? [["Last top-up", `${amount(i.lastTopUp.amount, r.unit)} on ${shortDay(i.lastTopUp.at)}`]] : []),
      ...(r.accountLabel ? [["Account", r.accountLabel]] : []),
      ["Paid as", r.billing],
      ...(r.details || []).map((x) => [x.label, x.value]),
      ...(i.since ? [["Tracked since", shortDay(i.since)]] : []),
      ...(r.keyName ? [["Read with", r.keyName + (r.balanceKey && r.keyName === r.balanceKey.key ? " (balance only)" : "")]] : []),
      ...(r.accountKeys?.length > 1 || (r.accountKeys?.length && r.accountKeys[0] !== r.keyName) ? [["Keys in this account", r.accountKeys.join(", ")]] : []),
    ];
    const marking = balancesView.marking === r.providerId;
    return `<div class="bdetail">
      ${s && i.days?.length ? dayBars(i.days, s.unit, balancesView.span, 48) : ""}
      <div class="bfacts">${facts.map(([k, v]) => `<div><span class="dlabel">${esc(k)}</span><span>${esc(v)}</span></div>`).join("")}</div>
      <div class="note">${esc(r.message)}</div>
      ${m?.kind === "balance" ? `<div class="bmark">${marking
        ? `<label>Full is <input id="balmark" inputmode="decimal" size="8" value="${m.basis === "set" ? esc(String(m.full)) : ""}" placeholder="${esc(String(Math.round(m.full)))}" /> ${esc(r.unit || "")}</label>
           <button class="act primary" data-bal-mark-save="${esc(r.providerId)}">Save</button>
           ${m.basis === "set" ? `<button class="act" data-bal-mark-clear="${esc(r.providerId)}">Use the last top-up</button>` : ""}
           <button class="act" data-bal-mark="">Cancel</button>`
        : `<span class="note flat">The meter measures against ${m.basis === "set" ? "the amount you set" : m.basis === "top-up" ? "the balance after your last top-up" : "the most this account has held while PassBook watched"}.</span>
           <button class="act" data-bal-mark="${esc(r.providerId)}">Set what full is</button>`}</div>` : ""}
      ${r.consoleSignIn ? `<div class="bmark"><span class="note flat">${r.balanceKind === "console"
          ? `Credits read from the ${esc(r.consoleSignIn.name)} with ${esc(r.consoleKey || "your sign-in")}, through Anthropic's undocumented web API.`
          : `Credits can be read from the ${esc(r.consoleSignIn.name)} with a sign-in PassBook keeps on this Mac, through Anthropic's undocumented web API.`}</span>
          <button class="act${r.balanceKind === "console" ? "" : " primary"}" data-cs-open="${esc(r.consoleSignIn.provider)}" ${balancesView.signingIn ? "disabled" : ""}>${r.balanceKind === "console" ? "Sign in again" : `Sign in to the ${esc(r.consoleSignIn.name)}`}</button></div>` : ""}
      ${r.canEnterBalance && r.balanceKind !== "console" ? (balancesView.entering === r.providerId ? balanceEnteredForm(r)
        : `<div class="bmark"><span class="note flat">${r.monthly
            ? `${esc(amount(r.monthly.amount, "USD"))} of credits a month, refilled on day ${esc(String(r.monthly.resetDay))}. Next refill ${esc(shortDay(String(r.monthly.resetsAt).slice(0, 10)))}.`
            : r.entered
            ? `Credits entered by you on ${esc(shortDay(String(r.entered.at).slice(0, 10)))}.`
            : `${esc(r.name.split(" · ")[0])} reports what is spent, not the credit left. Enter your plan's monthly credits, or the balance its console shows, to see what is left.`}</span>
           <button class="act${r.entered || r.monthly ? "" : " primary"}" data-eb-open="${esc(r.providerId)}">${r.entered || r.monthly ? "Change" : "Enter credits"}</button>
           ${r.entered || r.monthly ? `<button class="act" data-eb-clear="${esc(r.providerId)}">Clear</button>` : ""}</div>`) : ""}
      ${r.balanceKey && balancesView.adding === r.providerId ? balanceKeyForm(r)
        : r.balanceKey && r.keyName !== r.balanceKey.key ? `<div class="bmark"><span class="note flat">Read with ${esc(r.keyName)}, a key other apps use too.
             You can give Balances a key of its own instead.</span><button class="act" data-bk-open="${esc(r.providerId)}">Use a balance-only key</button></div>` : ""}
    </div>`;
  }

  /** Paste a key that only the balance reader may use. It is stored under its own name, so the key other apps
   *  run with keeps exactly the permissions it has; PassBook limits the new one to the balance readers. */
  function balanceKeyForm(r) {
    const k = r.balanceKey, v = balancesView, busy = v.keyBusy === r.providerId, checking = busy && v.keyStage === "checking";
    const detail = r.issue?.detail || `What to make: ${k.permission}`;
    return `<div class="bkform">
      <div class="note flat">${esc(detail)}</div>
      <div class="alform">
        <input id="bkvalue" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the ${esc(k.label)}" ${busy ? "disabled" : ""} />
        <button class="act primary" data-bk-save="${esc(r.providerId)}" ${busy ? "disabled" : ""}>${checking ? "Checking…" : busy ? "Saving…" : "Save and read"}</button>
        ${k.createUrl ? `<button class="act" data-bk-make="${esc(r.provider || r.providerId)}" title="Open ${esc(r.name)}'s page for making keys">Make one ${icon("chevron", "tinyicon")}</button>` : ""}
        <button class="act" data-bk-cancel="1" ${busy ? "disabled" : ""}>Cancel</button>
      </div>
      <div class="note flat">Saved as <code>${esc(k.key)}</code> for ${esc(r.accountLabel || r.name)} and limited to Balances: other apps
        and agents are refused it, and your other keys keep their permissions. PassBook never pays with it.</div>
      ${checking ? `<div class="note flat"><b>Saved.</b> Asking ${esc(r.name.split(" · ")[0])} for ${esc(r.accountLabel || r.name)}'s figures with it…</div>` : ""}
      ${v.keyNote && v.keyNoteFor === r.providerId ? `<div class="note flat warntext">${esc(v.keyNote)}</div>` : ""}
    </div>`;
  }

  /** The credits a provider that reports only spend will not tell: either what a plan adds each month (Claude
   *  plans with API credits), counted down from each refill, or the balance its console shows right now. */
  // What each Claude plan adds a month, from Anthropic's help center (read 2026-11-26); the same figures as
  // PLAN_CREDITS in passbook_balances.py. Team credits are pooled per seat, so a Team org's amount is typed.
  const CLAUDE_PLANS = [["Max", 100], ["Ultra", 200]];
  function balanceEnteredForm(r) {
    const v = balancesView, busy = v.ebBusy === r.providerId, who = r.name.split(" · ")[0];
    const mode = v.ebMode || (r.entered ? "once" : "monthly"), monthly = mode === "monthly";
    const shown = monthly ? (r.monthly ? String(r.monthly.amount) : "") : (r.entered ? String(r.entered.amount) : "");
    return `<div class="bkform">
      <div class="seg" role="group" aria-label="What kind of credits">
        <button data-eb-mode="monthly" aria-pressed="${monthly}" ${busy ? "disabled" : ""}>Monthly credits from a plan</button>
        <button data-eb-mode="once" aria-pressed="${!monthly}" ${busy ? "disabled" : ""}>Credits left right now</button></div>
      ${monthly && (r.provider || r.providerId).startsWith("anthropic") ? `<div class="seg" role="group" aria-label="Claude plan">
        ${CLAUDE_PLANS.map(([label, dollars]) => `<button data-eb-plan="${dollars}" aria-pressed="${shown === String(dollars)}" ${busy ? "disabled" : ""}>${label} · ${amount(dollars, "USD")}</button>`).join("")}
        <button data-eb-plan="" aria-pressed="${!!shown && !CLAUDE_PLANS.some(([, d]) => shown === String(d))}" ${busy ? "disabled" : ""}>Team or other</button></div>` : ""}
      <div class="note flat">${monthly
        ? `The Claude plan this organization's API credits come from. They expire at the end of each billing cycle, so they refill on
           the plan's billing day. The bar counts what ${esc(who)} reports spent since each refill against them.`
        : `The credit balance ${esc(who)}'s console shows for ${esc(r.accountLabel || r.name)} right now. PassBook takes off what
           ${esc(who)} reports spent after this, so it stays close until the next top-up.`}</div>
      <div class="alform">
        <label class="ebamount">$ <input id="ebvalue" inputmode="decimal" autocomplete="off" placeholder="${monthly ? "amount" : "247.57"}" value="${esc(shown)}" ${busy ? "disabled" : ""} /></label>
        ${monthly ? `<label class="ebamount">a month, billing day <input id="ebday" class="ebday" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="1" value="${esc(String(r.monthly?.resetDay || 1))}" ${busy ? "disabled" : ""} /></label>` : ""}
        <button class="act primary" data-eb-save="${esc(r.providerId)}" ${busy ? "disabled" : ""}>${busy ? "Saving…" : "Save"}</button>
        ${r.topUpUrl ? `<button class="act" data-topup="${esc(r.provider || r.providerId)}">Open ${esc(who)}'s billing ${icon("chevron", "tinyicon")}</button>` : ""}
        <button class="act" data-eb-cancel="1" ${busy ? "disabled" : ""}>Cancel</button>
      </div>
      ${v.ebNote && v.ebNoteFor === r.providerId ? `<div class="note flat warntext">${esc(v.ebNote)}</div>` : ""}
    </div>`;
  }

  /** A provider's name without the account after it or a trailing "API": "Anthropic", not "Anthropic API · NewVisionary". */
  const shortName = (r) => String(r.name || "").split(" · ")[0].replace(/ API$/, "");

  /** Everything that keeps a balance from showing, worst first, each with its fix and the button that does it. */
  function balanceFixes(d) {
    const v = balancesView, rows = d.providers || [];
    const list = (d.issues || []).filter((x) => x.kind !== "no-api" && (!v.category || x.category === v.category));
    if (!list.length) return "";
    const byId = Object.fromEntries(rows.map((r) => [r.providerId, r]));
    const shown = v.allFixes ? list : list.slice(0, 5);
    const item = (x) => {
      const r = byId[x.providerId] || { name: x.name, providerId: x.providerId, provider: x.provider };
      const [tone, label] = ISSUE_TAG[x.kind] || ["", x.title];
      const open = v.adding === x.providerId && r.balanceKey;
      const acts = x.action === "add-key" && r.balanceKey
          ? (open ? "" : `<button class="act primary" data-bk-open="${esc(x.providerId)}">${x.kind === "key-rejected" ? "Paste a new key" : "Add the key"}</button>`)
        : x.action === "enter-balance" ? (v.entering === x.providerId ? "" : `<button class="act primary" data-eb-open="${esc(x.providerId)}">Enter credits</button>`)
        : x.action === "console-signin" ? `<button class="act primary" data-cs-open="${esc(r.consoleSignIn?.provider || r.provider)}" ${v.signingIn ? "disabled" : ""}>${v.signingIn ? "Signing in…" : `Sign in to ${esc(r.consoleSignIn?.name || "the Console")}`}</button>
            ${r.canEnterBalance && v.entering !== x.providerId ? `<button class="act" data-eb-open="${esc(x.providerId)}">Type it instead</button>` : ""}`
        : x.action === "unlock" ? `<button class="act primary" data-goto="vault">Unlock</button>`
        : x.action === "retry" ? `<button class="act" data-balances-refresh="1" ${v.busy ? "disabled" : ""}>Try again</button>`
        // Not offered today can change on the provider's side (Anthropic: Convert to team), so it can be asked
        // again at once, and a key can still be added for it.
        : x.kind === "not-offered" ? `<button class="act primary" data-balances-refresh="1" ${v.busy ? "disabled" : ""}>${v.busy ? "Checking…" : "Check again"}</button>
            ${r.balanceKey && !open ? `<button class="act" data-bk-open="${esc(x.providerId)}">Add the key</button>` : ""}
            ${r.consoleSignIn ? `<button class="act" data-cs-open="${esc(r.consoleSignIn.provider)}" ${v.signingIn ? "disabled" : ""}>Credits from the Console</button>` : ""}
            ${r.topUpUrl ? `<button class="act" data-topup="${esc(r.provider || r.providerId)}">Open ${esc(shortName(r))}</button>` : ""}`
        : r.topUpUrl ? `<button class="act" data-topup="${esc(r.provider || r.providerId)}">Open ${esc(shortName(r))}</button>` : "";
      return `<div class="fixrow">
        ${logo(r)}
        <div class="fixtext"><span class="fixtitle"><strong>${esc(x.name)}</strong><span class="tag ${tone}">${esc(label)}</span></span>
          <span class="fixwhy"><b>${esc(x.title)}.</b> ${esc(x.fix)}</span>
          ${x.keys?.length ? `<span class="fixkeys">${x.keys.length === 1 ? "Key" : "Keys"} in this account: ${x.keys.map((k) => `<code>${esc(k)}</code>`).join(" ")}</span>` : ""}</div>
        <div class="fixacts">${acts}</div>
        ${open ? balanceKeyForm(r) : v.entering === x.providerId && r.canEnterBalance ? balanceEnteredForm(r) : ""}
      </div>`;
    };
    const fixable = list.filter((x) => x.kind !== "not-offered").length, notOffered = list.length - fixable;
    return `<div class="group balfix"><h3>${fixable ? `${fixable} thing${fixable === 1 ? "" : "s"} to fix to see every balance` : "Nothing to fix"}${notOffered
        ? ` · ${notOffered} not offered by the provider` : ""}</h3>
      ${shown.map(item).join("")}
      ${list.length > shown.length ? `<button class="morelink" data-bal-fixes="1">${list.length - shown.length} more ${icon("chevron", "tinyicon")}</button>` : ""}
    </div>`;
  }

  /** A service with no live figure: what it needs, in one line. */
  function balanceQuietRow(r) {
    const [tone, label] = BALANCE_TAG[r.status] || ["", r.status];
    return `<div class="brow quiet"><div class="bmain still">
        ${logo(r)}
        <span class="bname wide"><strong>${esc(r.name)}</strong><span class="sub">${esc(r.message)}</span></span>
        <span class="tag ${tone}">${esc(label)}</span></div>
      ${r.topUpUrl ? `<button class="act" data-topup="${esc(r.provider || r.providerId)}" title="Open ${esc(r.name)}'s billing page">${r.status === "manual" ? "Open" : "Billing"}</button>` : ""}
    </div>`;
  }

  /** Telegram alerts: a message through the owner's own bot when something runs low, cannot be read, or
   *  recovers. Three steps the first time (the bot, the chat, on), one row after that. */
  function balanceAlerts(d) {
    const v = balancesView, cfg = v.alertCfg || d.alerts || {};
    const names = (state?.store?.keys || []).map((k) => (typeof k === "string" ? k : k.name)).filter(Boolean);
    const held = names.includes(cfg.key);
    const candidates = [...new Set([...(held ? [cfg.key] : []), ...names.filter((n) => /BOT_TOKEN$/i.test(n))])];
    const busy = !!v.alertBusy;
    const note = v.alertNote ? `<div class="row"><div class="grow note">${esc(v.alertNote)}</div></div>` : "";
    if (cfg.on && !v.alerting) {
      return `<div class="group"><h3>Alerts</h3>
        <div class="row"><span class="statustile good">${icon("bell")}</span>
          <div class="grow"><strong>Telegram alerts are on</strong>
            <div class="note flat">A message to chat ${esc(cfg.chat)} when a service runs low, when a balance cannot be read,
            and when either recovers. Checked every hour, with this window closed too.</div></div>
          <button class="act" data-al-test="1" ${busy ? "disabled" : ""}>${v.alertBusy === "test" ? "Sending…" : "Send a test"}</button>
          <button class="act" data-al-open="1" ${busy ? "disabled" : ""}>Change</button>
          <button class="act danger" data-al-off="1" ${busy ? "disabled" : ""}>Turn off</button></div>
        ${d.alerts?.error ? `<div class="row"><div class="grow note">${esc(d.alerts.error)}</div></div>` : ""}${note}</div>`;
    }
    if (!v.alerting) {
      return `<div class="group"><h3>Alerts</h3>
        <div class="row"><span class="statustile plain">${icon("bell")}</span>
          <div class="grow"><strong>Get a Telegram message when something runs low</strong>
            <div class="note flat">Through your own bot: when a service runs low, when a balance cannot be read, and when
            either recovers.</div></div>
          <button class="act" data-al-open="1">Set up</button></div>${note}</div>`;
    }
    const pasting = v.pasting || !candidates.length;
    return `<div class="group"><h3>Alerts</h3>
      <div class="row top"><span class="stepno">1</span>
        <div class="grow"><strong>Your bot</strong>
          <div class="note flat">In Telegram, message <span class="mono">@BotFather</span>, send <span class="mono">/newbot</span>, and copy the token it gives you.
          PassBook keeps it as a key and sends it nowhere but Telegram.</div>
          <div class="alform">${pasting
            ? `<input id="albot" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the bot token" size="34" />
               <button class="act primary" data-al-token="1" ${busy ? "disabled" : ""}>${v.alertBusy === "token" ? "Saving…" : "Save token"}</button>
               ${candidates.length ? `<button class="act" data-al-paste="">Use a saved key</button>` : ""}`
            : `<select data-al-key aria-label="The key that holds the bot token">${held ? "" : `<option value="">Choose a saved key\u2026</option>`}${candidates.map((n) =>
                 `<option value="${esc(n)}" ${n === cfg.key ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
               ${held ? `<span class="tag on">Saved</span>` : ""}
               <button class="act" data-al-paste="1">Paste a new token</button>`}</div></div></div>
      <div class="row top"><span class="stepno">2</span>
        <div class="grow"><strong>Your chat</strong>
          <div class="note flat">Send your bot any message in Telegram (or add it to a group and say something), then find it here.</div>
          <div class="alform">
            <button class="act" data-al-find="1" ${busy || !held ? "disabled" : ""}>${v.alertBusy === "find" ? "Looking…" : "Find my chat"}</button>
            ${(v.alertChats || []).map((c) => `<button class="fchip" data-al-chat="${esc(c.id)}" aria-pressed="${cfg.chat === c.id}">${esc(c.name)}<span>${esc(c.kind || "chat")}</span></button>`).join("")}
            ${v.alertChats && !v.alertChats.length ? `<span class="note flat">No chat has written to the bot lately.</span>` : ""}
            <input id="alchat" inputmode="numeric" size="16" placeholder="or a chat id" value="${esc(cfg.chat || "")}" />
            <button class="act" data-al-chatsave="1" ${busy ? "disabled" : ""}>Use</button>
          </div></div></div>
      <div class="row"><span class="stepno">3</span>
        <div class="grow note flat">Turning on sends a test message first, so you know it arrives.</div>
        <button class="act" data-al-close="1">${cfg.on ? "Done" : "Cancel"}</button>
        ${cfg.on ? "" : `<button class="act primary" data-al-on="1" ${busy || !held || !cfg.chat ? "disabled" : ""}>
          ${v.alertBusy === "on" ? "Sending a test…" : "Turn on alerts"}</button>`}</div>
      ${note}</div>`;
  }

  /** What each service account has left (passbook_balances.py). Off until turned on: it calls each
   *  provider you hold a key for, so a person says yes to that first. */
  function balancesPage() {
    const v = balancesView, d = v.data;
    if (!d) return `<h2>Balances</h2><p class="lede">${v.error ? esc(v.error) : "Reading…"}</p>`;
    if (!d.enabled) {
      return `<h2>Balances</h2>
        <p class="lede">See at a glance what is left on the services your keys pay for, what they are
        costing you, and what is about to run out.</p>
        <div class="group">
          <div class="row">
            <span class="statustile plain">${icon("coins")}</span>
            <div class="grow">
              <strong>Read balances with the keys already here</strong>
              <div class="note">PassBook asks each provider you hold a key for, straight from this
              computer: OpenRouter, fal, RunPod, Stripe and twenty more report a balance; the rest get a link to
              their billing page. Nothing goes anywhere else.</div>
            </div>
          </div>
          <div class="row"><div class="grow note">Only numbers are kept: each reading goes into a history on
            this computer, which is what spend per day, trends and “days left” are worked out from. Every
            read shows in Activity as “read service balances”. Logos come from each provider's own site.
            Top up opens the provider's own billing page: PassBook never handles a payment.</div></div>
          <div class="row"><div class="grow"></div>
            <button class="act primary" data-balances-on="1" ${v.busy ? "disabled" : ""}>
              ${v.busy ? "Turning on…" : "Turn on Balances"}</button></div>
        </div>
        ${v.error ? `<p class="note">${esc(v.error)}</p>` : ""}`;
    }
    const rows = d.providers || [], span = v.span;
    const live = rows.filter((r) => r.status === "ready");
    const fixes = (d.issues || []).filter((x) => x.kind !== "no-api");
    // What cannot be fixed from here (no API reports it): a quiet list at the bottom.
    const rest = rows.filter((r) => r.status === "manual" || (r.status === "missing" && r.issue?.kind === "missing-key" && !r.needsKey));
    const low = live.filter((r) => r.insights?.low);
    const categories = [...new Set(rows.map((r) => r.category))].sort();
    const inCategory = (r) => !v.category || r.category === v.category;
    // Lowest first: what needs attention is at the top without anyone sorting for it.
    const fullness = (r) => r.insights?.meter && !r.insights.meter.empty ? r.insights.meter.fraction : 2;
    const spentOf = (r) => spanSpend(r.insights?.spend, span)?.value || 0;
    const order = { low: (a, b) => (b.insights?.low ? 1 : 0) - (a.insights?.low ? 1 : 0) || fullness(a) - fullness(b) || a.name.localeCompare(b.name),
