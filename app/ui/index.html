      if (!password) { notice = "The vault password is needed to mint a recovery code."; paint(); return; }
      busy = true; paint();
      try { recoveryCode = (await invoke("make_recovery_code", { password })).code; notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; await refreshVault(); paint(); }
    });
    wire("si-go", () => signIn("si-pw", "si-profile"));
    wire("sw-go", () => signIn("sw-pw", "sw-profile"));
    wire("seal-go", () => callVault("vault_seal", { password: pwd("seal-pw") }));
    wire("unseal-go", async () => { await callVault("vault_unseal", { password: pwd("sl-pw") }); if (!vault?.fully_sealed) unsealing = false; paint(); });
    main.querySelectorAll("[data-unsealopen]").forEach((b) => b.onclick = () => {
      unsealing = true; paint(); document.getElementById("sl-pw")?.focus();
    });
    main.querySelectorAll("[data-unsealclose]").forEach((b) => b.onclick = () => { unsealing = false; paint(); });
    wire("sec-go", () => callVault("vault_secure",
      { label: document.getElementById("sec-label")?.value ?? "", password: pwd("sec-pw") }));
    wire("np-create", () => callVault("vault_create_profile",
      { label: document.getElementById("np-label")?.value ?? "", password: pwd("np-pw") }));

    // Enter submits the password field it is in, because a password field that
    // needs a mouse to submit is one people retype.
    [["si-pw", "si-go"], ["sl-pw", "unseal-go"], ["rc-pw", "rc-go"], ["seal-pw", "seal-go"],
     ["sec-pw", "sec-go"], ["np-pw", "np-create"], ["sw-pw", "sw-go"]].forEach(([field, button]) => {
      const input = document.getElementById(field);
      if (input) input.onkeydown = (e) => { if (e.key === "Enter") document.getElementById(button)?.click(); };
    });

    main.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () =>
      call("set_mode", { app: APP, key: b.dataset.key, mode: b.dataset.mode }));
    main.querySelectorAll("[data-unlock]").forEach((b) => b.onclick = () =>
      call("unlock", { duration: b.dataset.unlock, reason: "from PassBook" }));
    main.querySelectorAll("[data-lock]").forEach((b) => b.onclick = () => call("lock"));
    main.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () =>
      call("resolve", { id: b.dataset.ok, approve: true, remember: b.dataset.for }));
    main.querySelectorAll("[data-no]").forEach((b) => b.onclick = () =>
      call("resolve", { id: b.dataset.no, approve: false, remember: "" }));
    main.querySelectorAll("[data-broker]").forEach((b) => b.onclick = () =>
      call("broker", { action: b.dataset.broker }));
    main.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
      // One computer fewer is one more the plan has room for.
      if (await call("revoke", { did: b.dataset.revoke })) void plan.load();
    });
    main.querySelectorAll("[data-add-device]").forEach((b) => b.onclick = () => { void addDevice.start(); });
    main.querySelectorAll("[data-resume-device]").forEach((b) => b.onclick = () => addDevice.resume());
    main.querySelectorAll("[data-add-person]").forEach((b) => b.onclick = () => { void addPerson.start(); });
    main.querySelectorAll("[data-resume-person]").forEach((b) => b.onclick = () => addPerson.resume());
    main.querySelectorAll("[data-member-remove]").forEach((b) => b.onclick = () =>
      plan.open("people", { remove: b.dataset.memberRemove }));
    // The plan, the backup and the phone are sheets; "teams" is the plan sheet opened at Teams.
    main.querySelectorAll("[data-plan-open]").forEach((b) => b.onclick = () => {
      if (b.dataset.planOpen === "teams") plan.open("plan", { want: "teams" }); else plan.open(b.dataset.planOpen);
    });
    main.querySelectorAll("[data-plan-retry]").forEach((b) => b.onclick = () => { void plan.load(); });
    main.querySelectorAll("[data-forget]").forEach((b) => b.onclick = () =>
      call("forget_machine", { host: b.dataset.forget }));
    main.querySelectorAll("[data-reveal]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.reveal;
      // A press while one is already in flight is the press that caused this:
      // it used to start a second reveal rather than being ignored.
      if (revealing[k]) return;
      if (revealed[k]) { hideValue(k); paint(); return; }
      // Painted before the await, so the press is acknowledged in this frame
      // instead of whenever the store answers.
      revealing[k] = true; notice = ""; paint();
      // The drawing happens on the other side, at the moment the plaintext
      // exists, so the size and colour have to travel with the request rather
      // than with the fetch. What comes back is a token and a length, never the
      // value; the picture is fetched by the <img> the next paint puts on the
      // row. A theme change while a value is showing therefore leaves the old
      // ink on it until it hides, which is a fair price for the plaintext
      // living for microseconds instead of half a minute.
      const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);
      try {
        revealed[k] = { dpr, ...await invoke("reveal_key",
          { name: k, px: 12, scale: dpr, ink: inkHex() }) };
        notice = ""; holdFor(k);
      } catch (e) { notice = String(e); }
      finally { delete revealing[k]; }
      paint();
    });
    main.querySelectorAll("[data-hist]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.hist;
      if (history[k]) { delete history[k]; paint(); return; }
      history[k] = "loading"; paint();
      try { history[k] = await invoke("key_history", { name: k }); }
      catch (e) { history[k] = []; notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-copytext]").forEach((b) => b.onclick = async (event) => {
      // Some of these sit inside a row that opens on a click (the copy beside a key's name).
      event.stopPropagation();
      try { await navigator.clipboard.writeText(b.dataset.copytext); markCopied(b.dataset.copymark); }
      catch (e) { notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => copyValue(b.dataset.copy));
    main.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => {
      confirming = b.dataset.remove; paint();
    });
    main.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => {
      confirming = null; notice = ""; paint();
    });
    main.querySelectorAll("[data-rmgo]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.rmgo;
      confirming = null; hideValue(k); delete replacing[k];
      if (keyCursor === k) keyCursor = "";
      await call("remove_key", { name: k });
    });
    // Clicking the picture asks to replace the value.
    //
    // Replace rather than edit, and the box opens empty rather than filled in.
    // Editing in place would have meant putting the old value back into an
    // input — the exact string in the exact element this whole change exists to
    // avoid — and it was never much of an edit anyway: nobody amends the
    // fourteenth character of an API key, they paste a new one.
    main.querySelectorAll("[data-picture]").forEach((el) => el.onclick = () => {
      if (!replacing[el.dataset.picture]) editValue(el.dataset.picture);
    });
    // A picture drawn at `12 * dpr` belongs on screen at a dpr-th of its own
    // size. Done from the loaded image rather than in CSS because the height a
    // font gives a line is not something this side can know, and a guess would
    // scale every glyph by however wrong it was.
    main.querySelectorAll("[data-picture] img").forEach((img) => {
      const fit = () => {
        const dpr = Number(img.dataset.dpr) || 1;
        if (!img.naturalWidth) return;
        img.style.width = `${img.naturalWidth / dpr}px`;
        img.classList.add("measured");
      };
      if (img.complete) fit(); else img.onload = fit;
    });
    // Enter saves and Escape abandons. Losing focus does neither: see `editValue`.
    main.querySelectorAll("[data-replace]").forEach((input) => {
      const k = input.dataset.replace;
      input.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); saveValue(k); }
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelEdit(k); }
      };
    });
    // innerHTML is replaced on every paint, so typing would lose focus after
    // each keystroke without restoring it here.
    const projBox = document.getElementById("proj-new");
    if (projBox) {
      projBox.oninput = () => { projectTyped = projBox.value; };
      projBox.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.querySelector("[data-projadd]")?.click(); }
      };
    }
    // Grow the list when its tail is scrolled to. The observer is rebuilt each
    // paint because the node it watched was replaced by the paint that made it.
    rowGrower?.disconnect();
    rowGrower = null;
    const more = main.querySelector("[data-more]");
    if (more) {
      const grow = () => { rowLimit += ROW_PAGE; paint(); };
      more.onclick = grow;
      if (window.IntersectionObserver) {
        // A margin, so the rows are built before the tail is reached rather
        // than after. It stops on its own: a full list has no tail to watch.
        rowGrower = new IntersectionObserver(
          (seen) => { if (seen.some((e) => e.isIntersecting)) grow(); },
          { rootMargin: "600px" });
        rowGrower.observe(more);
      }
    }

    ["q-keys", "q-access"].forEach((id) => {
      const box = document.getElementById(id);
      if (!box) return;
      box.oninput = () => {
        query = box.value;
        resetRows();
        // The best match is the one the keyboard is on, so Enter (or the right arrow) opens it without
        // a trip to the pointer. No search, no row picked out.
        if (id === "q-keys") { keyCursor = query.trim() ? (shownKeys()[0] || "") : ""; byKeyboard = !!keyCursor; }
        const at = box.selectionStart;
        paint();
        const again = document.getElementById(id);
        if (again) { again.focus(); again.setSelectionRange(at, at); }
      };
      // On Keys, Escape and the arrows are the list's: see `keysKey`.
      if (id !== "q-keys") box.onkeydown = (e) => {
        if (e.key === "Escape" && query) {
          query = ""; resetRows(); paint(); document.getElementById(id)?.focus();
        }
      };
    });
    // A paste of NAME=value lines into either field is an offer to add them all.
    for (const id of ["k", "v"]) {
      const field = document.getElementById(id);
      if (!field) continue;
      field.addEventListener("paste", (event) => {
        const text = event.clipboardData?.getData("text") || "";
        if (!/[\r\n]/.test(text.trim()) && !KEY_LINE.test(text)) return;
        const found = readPasted(text);
        if (!found) return;
        // One line pasted into the name field is just a name and a value: fill the two fields.
        if (found.names.length === 1) {
          event.preventDefault();
          document.getElementById("k").value = found.names[0];
          document.getElementById("v").value = found.text.slice(found.names[0].length + 1);
          addForm.error = ""; addHint();
          document.getElementById("addgo")?.focus();
          return;
        }
        event.preventDefault();
        pasted = found; paint();
      });
    }
    // Enter adds. From the name it goes on to the value first, when there is none yet. Escape empties
    // the field it is in, and puts the form away once both are empty.
    const valueField = document.getElementById("v"), nameField = document.getElementById("k");
    if (valueField && nameField) {
      for (const field of [nameField, valueField]) {
        field.oninput = () => { addForm.error = ""; addHint(); };
        field.onkeydown = (e) => {
          if (e.key === "Enter") {
            e.preventDefault(); e.stopPropagation();
            if (field === nameField && !valueField.value) valueField.focus(); else submitAdd();
          } else if (e.key === "Escape") {
            e.preventDefault(); e.stopPropagation();
            if (field.value) { field.value = ""; addForm.error = ""; addHint(); }
            else if (!nameField.value && !valueField.value) closeAdd();
          }
        };
      }
      addHint();
    }
    main.querySelectorAll("[data-pasted-cancel]").forEach((b) => b.onclick = () => { pasted = null; paint(); });
    main.querySelectorAll("[data-pasted-add]").forEach((b) => b.onclick = async () => {
      const replace = b.dataset.pastedAdd === "replace";
      const keep = replace ? null : new Set(pasted.names.filter((n) => !pasted.existing.includes(n)));
      const text = keep ? pasted.text.split("\n").filter((line) => keep.has(line.slice(0, line.indexOf("=")))).join("\n") : pasted.text;
      const names = keep ? [...keep] : pasted.names;
      if (!await call("add_pasted", { text, replace })) { pasted = { ...pasted, problem: notice }; notice = ""; paint(); return; }
      pasted = null; keyFilter = "all"; keySort = "new"; query = ""; resetRows();
      sayWell(`Added ${names.length} key${names.length === 1 ? "" : "s"}. Newest are first.`);
      paint(); loadSync(true);
    });
    const go = document.getElementById("addgo");
    if (go) go.onclick = () => submitAdd();
  }

  const authorization = window.createPassbookAuthorization({ invoke, container: ask, esc, repaint: paint });
  const webLink = window.createPassbookWebLink({ invoke, container: ask, esc, repaint: paint });
  /** Text that is already on screen (a backup's code, the link a phone opens), put on the clipboard.
   *  Never a key's value: that is `copy_key`, which keeps the value out of this page. */
  const copyShown = (copytext) => navigator.clipboard.writeText(copytext);
  const plan = window.createPassbookPlan({ invoke, container: ask, esc, repaint: paint, copy: copyShown,
                                           onStoreChanged: () => { void call("state"); },
                                           invitePerson: () => { void addPerson.start(); } });
  // A computer or a person that joined is one more the plan counts, so the plan is asked again.
  const joined = () => { void call("state"); void plan.load(); };
  const addDevice = window.createPassbookAddDevice({ invoke, container: ask, esc, repaint: paint, onJoined: joined,
    plans: { refused: plan.refused, offer: () => plan.offer("machine_limit"), open: () => plan.open("plan") } });
  const addPerson = window.createPassbookAddDevice({ invoke, container: ask, esc, repaint: paint, onJoined: joined, mode: "person",
    plans: { refused: plan.refused, offer: () => plan.offer("seat_limit"), open: () => plan.open("plan", { want: "teams" }) } });

  async function boot() {
    if (!invoke) {
      main.innerHTML = `<h2>PassBook</h2><p class="lede err">This window could not reach
        the app backend. That is a build problem, not a credential problem —
        <code>withGlobalTauri</code> must be enabled in tauri.conf.json.</p>`;
      return;
    }
    // The appearance the app has on record (the hint above is only what this window last saw).
    try { applyAppearance(await invoke("appearance")); } catch { /* an older app: follow the system */ }
    try {
      state = await invoke("state");
      await refreshVault();
      await refreshSignins();
      // A remembered lock is only honoured if the factor that would lift it is
      // still there. A workspace that lost its key between sessions would
      // otherwise come back to a screen nothing can answer.
      if (appLocked && !canProveIdentity(activeRow())) unlockWindow();
      paint();
      paintGate();
      // The plan comes from the relay, so it is asked for after the page is up and never waited on.
      // A relay that does not answer leaves one quiet line on Devices, not a banner.
      void plan.load();
      await readyNotifications();
      try { biometry = await invoke("biometric_status") || biometry; } catch { /* older build */ }
      // Two of the three protections are conditional, so the window asks rather
      // than claiming them. See `capture_protection` in main.rs.
      try { guards = await invoke("capture_protection") || guards; } catch { /* older build */ }
      if (biometry.available) { paintGate(); paint(); }
      announce(state?.broker?.pending);
      // A link that launched this window fired its event before there was a
      // window to hear it, so the first question is always "is one waiting?".
      await loadAsk();
      await authorization.load();
      await webLink.load();
      await loadAgentAsk();
      wireDrop();
      // Where every key is, for Devices, Attention and the key rows: asked now and every ten minutes,
      // which is how often the devices exchange keys by themselves.
      loadSync(true);
      setInterval(() => loadSync(true), 10 * 60 * 1000);
      // Machines added with `passbook join` get their keys again if they changed here, and their
      // grants renewed; quietly, and never by opening the vault (a shut one is skipped).
      const refreshJoined = () => invoke("link_refresh").catch(() => {});
      refreshJoined();
      setInterval(refreshJoined, 10 * 60 * 1000);
      // Balances keeps a history, so a reading is taken now and each hour while the app is open (when
      // the page is on; off, this asks nothing of anyone).
      loadBalances(false, true);
      setInterval(() => { if (balancesView.data?.enabled) loadBalances(false, true); }, 60 * 60 * 1000);
      // Is there a newer release? Asked once now and twice a day, quietly: it only lights a dot.
      loadUpdates(true);
      setInterval(() => loadUpdates(true), 12 * 60 * 60 * 1000);
      const events = window.__TAURI__?.event;
      if (events?.listen) {
        events.listen("passbook://ask", () => loadAsk());
        events.listen("passbook://authorize", () => authorization.load());
        events.listen("passbook://weblink", () => webLink.load());
        events.listen("passbook://signin", () => loadAgentAsk());
        events.listen("passbook://sent", (e) => sendingDone(e?.payload));
        events.listen("passbook://sync-progress", (e) => syncStep(e?.payload));
        events.listen("passbook://ask-refused", (e) => {
          notice = String(e?.payload || "That link could not be read.");
          paint();
        });
      }
    }
    catch (e) { main.innerHTML = `<h2>PassBook</h2><p class="lede err">${esc(String(e))}</p>`; }
  }
  // ── the palette, and the keyboard ──────────────────────────────────────
  //
  // Nothing in this window answered a key press until now: every key, page and action was a pointer
  // away. Cmd+K (Ctrl+K elsewhere) opens one box that finds any of them by a few letters. Enter does the
  // obvious thing; on a key, Cmd+Enter copies its name instead of opening it. Besides that: "/" puts the
  // cursor in the search box, and Cmd+N opens Add key.
  const palette = document.createElement("div");
  palette.id = "palette";
  palette.hidden = true;
  palette.innerHTML = `<div class="palbox" role="dialog" aria-label="Find anything">
    <input id="palq" type="text" placeholder="Find a key, a page or something to do" spellcheck="false" autocomplete="off" autocapitalize="off" />
    <div id="pallist" role="listbox"></div>
    <div class="palfoot"><span><b>\u2191\u2193</b> move</span><span><b>\u21b5</b> or <b>\u2192</b> open</span><span><b>${MOD_KEY}\u21b5</b> copy a key's name</span><span><b>esc</b> close</span></div></div>`;
  document.body.appendChild(palette);
  let palRows = [], palAt = 0;

  /** How well `text` answers `typed`: 0 for not at all; starting with it beats containing it beats its letters in order. */
  function palScore(text, typed) {
    const hay = text.toLowerCase(), q = typed.toLowerCase().replace(/\s+/g, "_");
    if (!q) return 1;
    if (hay.startsWith(q)) return 100 - Math.min(hay.length, 60) / 10;
    const at = hay.indexOf(q);
    if (at >= 0) return 70 - at / 10;
    const plain = typed.toLowerCase().replace(/[\s_]+/g, "");
    let i = 0;
    for (const ch of hay) if (ch === plain[i]) i++;
    return plain && i === plain.length ? 30 - hay.length / 20 : 0;
  }

  function palActions() {
    const go = (id, label, glyph) => ({ kind: "Go to", label, glyph, run: () => { page = id; notice = ""; resetRows(); paint(); if (id === "balances") loadBalances(); if (id === "machines") loadSync(); if (id === "updates") loadUpdates(); } });
    return [
      go("attention", "Attention", "bell"), ...PAGES.map(([id, label, glyph]) => go(id, label, glyph)),
      go("settings", "Settings", "sliders"), ...SETTINGS.map(([id, label, glyph]) => go(id, label, glyph)),
      ...SHEETS.map(([id, label, glyph]) => ({ kind: "Open", label, glyph, run: () => plan.open(id) })),
      { kind: "Do", label: "Add a key", glyph: "plus", run: () => openAdd() },
      { kind: "Do", label: "Sync with my other devices now", glyph: "monitor", run: () => { page = "machines"; paint(); syncNow(); } },
      { kind: "Do", label: "Check for updates", glyph: "download", run: () => { page = "updates"; paint(); loadUpdates(); } },
      { kind: "Do", label: "Lock this window", glyph: "lock", run: () => lockWindow() },
      ...APPEARANCES.map(([id, label]) => ({ kind: "Appearance", label, glyph: "moon", run: async () => { applyAppearance(id); paint(); try { await invoke("set_appearance", { choice: id }); } catch { /* the page changed; the app will follow next time */ } } })),
    ];
  }

  function palSearch(typed) {
    const actions = palActions().map((row) => ({ ...row, score: palScore(row.label, typed) * (typed ? 1 : 1) })).filter((row) => row.score > 0);
    const keys = typed.trim() ? (state?.store?.keys || []).map((k) => ({ kind: "Key", label: k, glyph: "key", key: k, score: palScore(k, typed) }))
      .filter((row) => row.score > 0).sort((a, b) => b.score - a.score).slice(0, 9) : [];
    const ranked = typed.trim() ? [...keys, ...actions].sort((a, b) => b.score - a.score || (a.kind === "Key" ? -1 : 1)) : actions;
    // Looked for a key that is not here: the next thing is to add it, with the name already typed.
    const name = tidyName(typed);
    const offer = name && !storedName(name) && /[A-Za-z]/.test(name)
      ? [{ kind: "Do", label: `Add a key named ${name}`, glyph: "plus", run: () => openAdd(name) }] : [];
    return [...ranked.slice(0, 12 - offer.length), ...offer];
  }

  function palPaint() {
    const list = document.getElementById("pallist");
    list.innerHTML = palRows.length ? palRows.map((row, i) => `<button class="palrow" role="option" data-pal="${i}" aria-selected="${i === palAt}">
      ${icon(row.glyph || "chevron", "navicon")}<span class="${row.kind === "Key" ? "mono" : ""}">${esc(row.label)}</span><span class="palkind">${esc(row.kind)}</span></button>`).join("")
      : `<div class="palnone">Nothing here goes by that.</div>`;
    list.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
    list.querySelectorAll("[data-pal]").forEach((b) => { b.onclick = () => palRun(Number(b.dataset.pal), false); b.onmousemove = () => { if (palAt !== Number(b.dataset.pal)) { palAt = Number(b.dataset.pal); palPaint(); } }; });
  }

  function palOpen() {
    if (!state || appLocked || !palette.hidden) return;
    hideTip();
    palette.hidden = false;
    const box = document.getElementById("palq");
    box.value = ""; palRows = palSearch(""); palAt = 0; palPaint(); box.focus();
  }
  function palClose() { palette.hidden = true; }

  async function palRun(index, copyName) {
    const row = palRows[index];
    if (!row) return;
    palClose();
    if (row.kind !== "Key") { row.run(); return; }
    if (copyName) {
      // `copytext`: a key's name, the one thing this window may put on the clipboard itself.
      const copytext = row.key;
      try { await navigator.clipboard.writeText(copytext); sayWell(`Copied the name ${copytext}.`); }
      catch (e) { notice = String(e); }
      paint(); return;
    }
    showKeyRow(row.key);
  }

  document.getElementById("palq").addEventListener("input", (event) => { palRows = palSearch(event.target.value); palAt = 0; palPaint(); });
  palette.addEventListener("mousedown", (event) => { if (event.target === palette) palClose(); });
  document.addEventListener("keydown", (event) => {
    const mod = event.metaKey || event.ctrlKey;
    if (mod && !event.altKey && event.key.toLowerCase() === "k") { event.preventDefault(); if (palette.hidden) palOpen(); else palClose(); return; }
    if (!palette.hidden) {
      if (event.key === "Escape") { event.preventDefault(); palClose(); }
      else if (event.key === "ArrowDown") { event.preventDefault(); palAt = Math.min(palAt + 1, palRows.length - 1); palPaint(); }
      else if (event.key === "ArrowUp") { event.preventDefault(); palAt = Math.max(palAt - 1, 0); palPaint(); }
      else if (event.key === "Enter") { event.preventDefault(); palRun(palAt, mod); }
      else if (event.key === "ArrowRight" && !mod && !event.shiftKey && !event.altKey) {
        // The right arrow opens a key, as it does on the list. Only from the end of what was typed:
        // anywhere else it is still how the caret moves.
        const box = document.getElementById("palq");
        if (palRows[palAt]?.kind === "Key" && box.selectionStart === box.value.length && box.selectionEnd === box.value.length) {
          event.preventDefault(); palRun(palAt, false);
        }
      }
      return;
    }
    // A press something on the page has already answered is not answered again here.
    if (!state || appLocked || !gate.hidden || !ask.hidden || event.defaultPrevented) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") || document.activeElement?.isContentEditable;
    if (event.key === "Escape" && asking) {
      event.preventDefault(); asking = null; paint();
    } else if (mod && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "n") {
      event.preventDefault(); openAdd();
    } else if (event.key === "/" && !mod && !typing) {
      const box = document.querySelector("main input.search");
      if (!box) { page = "keys"; paint(); }
      event.preventDefault(); document.querySelector("main input.search")?.focus();
    } else if (page === "keys") keysKey(event, mod);
  });

  // ── the keyboard, on the list of keys ──────────────────────────────────
  //
  // The list answered no key at all: with a search typed and its one result on screen, the arrows and
  // Enter did nothing, and the only way to a key was the pointer ("i even press the right arrow on it
  // and it does nothing when in search", Liam 2026-11-24). Now the arrows move a cursor down the rows
  // and Enter or the right arrow opens the one it is on, the left arrow or Escape closes it, and typing
  // anywhere on the page goes to the search box. The caret can stay in the search box throughout, so
  // narrowing the list and walking it are one motion.
  const rowNames = () => [...main.querySelectorAll("[data-keyrow]")].map((el) => el.dataset.keyrow);

  /** Put the cursor on a row. Done to the two rows concerned rather than by repainting: the arrow keys
   *  repeat, and a repaint of a long list on every repeat is the lag this page already had once. */
  function setKeyCursor(k, scroll = true) {
    if (keyCursor && keyCursor !== k) keyRowEl(keyCursor)?.classList.remove("cursor");
    keyCursor = k;
    const row = k ? keyRowEl(k) : null;
    row?.classList.add("cursor");
    if (row && scroll) row.scrollIntoView({ block: "nearest" });
    showListHint();
  }

  function showListHint() {
    const hint = document.getElementById("listhint");
    if (hint) hint.hidden = !(keyCursor && byKeyboard && !notice);
  }

  function moveKeyCursor(step) {
    let rows = rowNames();
    if (!rows.length) return;
    let at = rows.indexOf(keyCursor);
    at = at < 0 ? (step > 0 ? 0 : rows.length - 1) : at + step;
    // Past the last row that has been built: build the next page of them.
    if (at >= rows.length && main.querySelector("[data-more]")) { rowLimit += ROW_PAGE; paint(); rows = rowNames(); }
    setKeyCursor(rows[Math.max(0, Math.min(rows.length - 1, at))]);
  }

  function keysKey(event, mod) {
    const el = document.activeElement;
    const inSearch = el?.id === "q-keys";
    // Any other field being typed into, and a dropdown, keep their keys.
    if (!inSearch && (typing(el) || el?.tagName === "SELECT")) return;
    const key = event.key, plain = !mod && !event.altKey && !event.shiftKey;
    const row = keyCursor && keyRowEl(keyCursor) ? keyCursor : "";
    const atEnd = inSearch && el.selectionStart === el.value.length && el.selectionEnd === el.value.length;

    if ((key === "ArrowDown" || key === "ArrowUp") && plain) {
      event.preventDefault();
      byKeyboard = true;
      moveKeyCursor(key === "ArrowDown" ? 1 : -1);
    } else if (key === "Enter" && plain) {
      // On a button, Enter is that button's.
      if (!inSearch && el && el !== document.body && el.matches?.("button, a, summary, [role=button], input")) return;
      const target = row || (inSearch ? rowNames()[0] : "");
      if (!target) return;
      event.preventDefault();
      byKeyboard = true;
      setKeyCursor(target);
      toggleKeyRow(target);
    } else if (key === "ArrowRight" && plain && row && !expanded[row]) {
      // In the search box the arrows still move the caret through what was typed. At the end of it
      // there is nowhere further right to go, so the press is the row's.
      if (inSearch && !atEnd) return;
      event.preventDefault();
      byKeyboard = true;
      toggleKeyRow(row);
    } else if (key === "ArrowLeft" && plain && row && expanded[row]) {
      if (inSearch && !atEnd) return;
      event.preventDefault();
      byKeyboard = true;
      toggleKeyRow(row);
    } else if (key === "Escape") {
      // One step back at a time: the open row, then the search, then the cursor.
      if (row && expanded[row]) { event.preventDefault(); toggleKeyRow(row); }
      else if (query) {
        event.preventDefault();
        query = ""; keyCursor = ""; resetRows(); paint();
        if (inSearch) document.getElementById("q-keys")?.focus();
      } else if (keyCursor) { event.preventDefault(); setKeyCursor(""); }
      else if (inSearch) el.blur();
    } else if (mod && !event.altKey && !event.shiftKey && row && byKeyboard && key.toLowerCase() === "c") {
      // Only for a cursor the keyboard put there, with the strip that says so on screen: a value does
      // not go to the clipboard for a row somebody merely clicked on.
      // Copy means the selection first: a name being copied, or text in the search box.
      if (selectionIn(document.body) || (inSearch && el.selectionStart !== el.selectionEnd)) return;
      event.preventDefault();
      copyValue(row);
    } else if (mod && !event.altKey && !event.shiftKey && row && byKeyboard && key.toLowerCase() === "e") {
      event.preventDefault();
      editValue(row);
    } else if (!inSearch && plain && key.length === 1 && /\S/.test(key)) {
      // Typing anywhere on the page is a search. The box takes the focus now and the letter with it.
      if (el && el !== document.body && !el.matches?.("button, [role=button]")) return;
      document.getElementById("q-keys")?.focus();
    }
  }

  // ── tooltips ───────────────────────────────────────────────────────────
  // One tooltip for the whole window. Markup keeps saying `title="…"`, which is where a description of
  // a control belongs and what a screen reader already reads; the moment such an element appears its
  // title is taken over (`data-tip`), so the system's tooltip never has anything to show. An icon-only
  // control with no other name keeps the words as its `aria-label`.
  const tip = document.createElement("div");
  tip.id = "tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  let tipFor = null, tipTimer = 0, tipWatch = 0, tipHidAt = 0;
  const TIP_DELAY = 380;

  function adoptTitles(root) {
    const found = root.matches?.("[title]") ? [root] : [];
    for (const el of [...found, ...(root.querySelectorAll?.("[title]") || [])]) {
      const words = el.getAttribute("title");
      el.removeAttribute("title");
      if (!words) continue;
      el.dataset.tip = words;
      if (!el.getAttribute("aria-label") && !el.textContent.trim()) el.setAttribute("aria-label", words);
    }
  }
  adoptTitles(document.body);
  new MutationObserver((changes) => {
    for (const change of changes) {
      if (change.type === "attributes") adoptTitles(change.target);
      else change.addedNodes.forEach((node) => { if (node.nodeType === 1) adoptTitles(node); });
    }
  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["title"] });

  function hideTip() {
    clearTimeout(tipTimer); clearInterval(tipWatch);
    if (tip.classList.contains("show")) tipHidAt = Date.now();
    tip.classList.remove("show");
    tipFor = null;
  }

  function showTip(el) {
    const words = el.dataset.tip;
    if (!words || !el.isConnected) return;
    tip.textContent = words;
    // Above the thing it describes, centred on it; below when there is no room above; never off an edge.
    const at = el.getBoundingClientRect(), box = tip.getBoundingClientRect(), gap = 7, edge = 8;
    const above = at.top - box.height - gap;
    const top = above >= edge ? above : Math.min(at.bottom + gap, window.innerHeight - box.height - edge);
    const left = Math.max(edge, Math.min(at.left + at.width / 2 - box.width / 2, window.innerWidth - box.width - edge));
    tip.style.transform = "";
    tip.style.left = `${Math.round(left)}px`;
    tip.style.top = `${Math.round(top)}px`;
    tip.classList.add("show");
    // A repaint can take the element away from under a pointer that never moved.
    clearInterval(tipWatch);
    tipWatch = setInterval(() => { if (!tipFor || !tipFor.isConnected) hideTip(); }, 200);
  }

  function wantTip(el) {
    if (el === tipFor) return;
    hideTip();
    if (!el) return;
    tipFor = el;
    // Moving along a row of buttons, the next one answers at once: the wait is for arriving, not for reading.
    const wait = Date.now() - tipHidAt < 400 ? 60 : TIP_DELAY;
    tipTimer = setTimeout(() => { if (tipFor === el) showTip(el); }, wait);
  }

  const tipTarget = (node) => node?.closest?.("[data-tip], [title]") || null;
  document.addEventListener("mouseover", (event) => {
    const el = tipTarget(event.target);
    if (el) adoptTitles(el);
    wantTip(el && el.dataset.tip ? el : null);
  });
  document.addEventListener("mouseout", (event) => {
    if (tipFor && !tipFor.contains(event.relatedTarget)) hideTip();
  });
  // By keyboard too, but not for a click that happens to focus something.
  document.addEventListener("focusin", (event) => {
    const el = tipTarget(event.target);
    if (el && el.dataset.tip && event.target.matches?.(":focus-visible")) wantTip(el);
  });
  document.addEventListener("focusout", hideTip);
  for (const gone of ["mousedown", "keydown", "wheel"]) document.addEventListener(gone, hideTip, { passive: true });
  document.addEventListener("scroll", hideTip, { capture: true, passive: true });
  document.addEventListener("mousedown", () => { if (byKeyboard) { byKeyboard = false; showListHint(); } }, { passive: true });
  window.addEventListener("blur", hideTip);
  // Back from a provider's console (a key made, an organization converted): Balances reads again by itself.
  window.addEventListener("focus", () => {
    if (page === "balances" && balancesView.data?.enabled && Date.now() - (balancesView.readAt || 0) > 60 * 1000) loadBalances(false, true);
  });

  boot();
  // A poll that repaints unconditionally repaints for nothing nearly every
  // time. Most five-second windows change nothing at all, and a repaint of a
  // store this size is the most expensive thing the window does — so compare
  // first, and only rebuild when the answer is actually different.
  let lastSeen = "";
  let quietPolls = 0;
  // One poll at a time. Each tick starts a `passbook state` process, and when
  // one took longer than five seconds the next tick started another beside
  // it: a slow ledger read became a dozen concurrent processes, each slowing
  // the others down.
  let polling = false;
  setInterval(async () => {
    if (polling) return;
    // A background refresh must not wipe a value someone is mid-edit on.
    const focused = document.activeElement;
    if (busy || confirming || audienceFor || bulkConfirm
        || Object.keys(picked).length || Object.keys(connecting).length
        || Object.keys(revealing).length) return;
    // Nor text somebody is in the middle of selecting to copy: a repaint drops the selection.
    if (selectionIn(main)) return;
    // Anything half-typed must survive the refresh — a key's name as much as
    // its value. Naming the few fields worth protecting was the earlier
    // approach, and it missed every field nobody thought to name: the repaint
    // rebuilds `main` wholesale, so the text went with it mid-word. A field
    // being typed into is the one thing on screen this window did not put
    // there, so it waits for the caret to leave rather than listing fields.
    // The search box is typed into too, but it only narrows the list: the list
    // itself must keep coming in, or a key added while the caret sits in the box
    // is searched for against a list from before it existed ("no results").
    // Any other field keeps its text: the data still refreshes, the repaint waits.
    const searching = Boolean(focused?.classList?.contains("search"));
    const editing = typing(focused) && !searching;
    polling = true;
    try {
      const next = await invoke("state");
      if (editing) { state = next; lastSeen = ""; return; }
      await refreshVault();
      await refreshSignins();
      // Before the unchanged-state shortcut below: a request that arrived and
      // was answered between two polls still deserves to have been announced.
      announce(next?.broker?.pending);
      // A chain checked ten rows ago has not been checked. The label goes back
      // to "Not checked" rather than keeping a tick that is no longer about
      // the record on screen.
      const tail = (rows) => (rows || []).slice(-1)[0]?.proofHash || "";
      if (chain.answer && tail(next.record?.rows) !== tail(state?.record?.rows)) {
        chain.answer = null;
      }
      const now = JSON.stringify([next, vault, signins]);
      // Relative times ("4m ago") go stale while nothing changes, so a quiet
      // window still gets one repaint a minute to move them along.
      if (now === lastSeen && ++quietPolls < 12) { state = next; return; }
      lastSeen = now; quietPolls = 0;
      state = next;
      if (searching) paintKeepingSearch(focused); else paint();
    } catch {}
    finally { polling = false; }
  }, 5000);
})();
</script>
