                    spend: (a, b) => spentOf(b) - spentOf(a) || a.name.localeCompare(b.name),
                    name: (a, b) => a.name.localeCompare(b.name) }[v.sort];
    const shownLive = (v.filter === "low" ? low : live).filter(inCategory).sort(order);
    const showLive = v.filter === "all" || v.filter === "low" || v.filter === "live";
    const showLook = v.filter === "all" || v.filter === "look";
    const isLook = v.filter === "look";
    const showRest = v.filter === "rest" || (v.filter === "all" && v.rest);
    const chip = (id, label, n) => `<button class="fchip" data-bal-filter="${id}" aria-pressed="${v.filter === id}">${label}<span>${n}</span></button>`;
    const usdDays = d.summary?.usd?.days || [];
    return `<div class="balhead">
        <div><h2>Balances</h2>
          <p class="lede">What is left, what it is costing, and what runs out next.</p></div>
        <div class="balctl">
          <div class="seg" role="group" aria-label="Span">${BALANCE_SPANS.map(([id, label]) =>
            `<button data-bal-span="${id}" aria-pressed="${span === id}">${label}</button>`).join("")}</div>
          <button class="act bellbtn" data-al-toggle="1" aria-expanded="${v.alertsShown}"
            title="Telegram alerts when something runs low">${icon("bell", "tinyicon")} Alerts${(v.alertCfg || d.alerts || {}).on ? ` <span class="tag on">On</span>` : ""}</button>
          <button class="act" data-balances-refresh="1" ${v.busy ? "disabled" : ""}
            title="${d.cached ? "Read in the last two minutes" : "Just read"}">${v.busy ? "Reading…" : "Refresh"}</button>
        </div>
      </div>
      ${v.alertsShown ? balanceAlerts(d) : ""}
      ${v.keyDone ? `<p class="note baldone">${esc(v.keyDone)}</p>` : ""}
      ${v.signingIn ? `<div class="group"><div class="row"><span class="statustile plain">${icon("person")}</span><div class="grow">
        <strong>Sign in to the Anthropic Console in the window that opened</strong>
        <div class="note">PassBook keeps that sign-in on this Mac only, for Balances only, and reads each organization's credits
        through Anthropic's undocumented web API, which can change without notice. The sign-in can do anything the Console can.
        The window closes by itself once you are in. If Google sign-in does not finish, use Continue with email there.</div></div></div></div>` : ""}
      ${showLook ? balanceFixes(d) : ""}
      ${isLook ? "" : balanceStats(d, span)}
      ${!isLook && usdDays.some((p) => p.v > 0) ? `<div class="group chart"><h3>Dollars spent per day</h3>${dayBars(usdDays, "USD", span)}</div>` : ""}
      <div class="balfilters">
        <div class="fchips">${chip("all", "All", rows.length)}${chip("low", "Low", low.length)}${chip("live", "Live", live.length)}${chip("look", "To fix", fixes.length)}${chip("rest", "No live figure", rest.length)}</div>
        <div class="fsel">
          ${categories.length > 1 ? `<select data-bal-category aria-label="Kind of service"><option value="">Every kind</option>${categories.map((c) =>
            `<option value="${esc(c)}" ${v.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>` : ""}
          <select data-bal-sort aria-label="Order"><option value="low" ${v.sort === "low" ? "selected" : ""}>Lowest first</option>
            <option value="spend" ${v.sort === "spend" ? "selected" : ""}>Biggest spend</option>
            <option value="name" ${v.sort === "name" ? "selected" : ""}>By name</option></select>
        </div>
      </div>
      ${isLook && !fixes.length ? `<div class="group"><div class="empty">Nothing to fix: every balance that can be read is showing.</div></div>` : ""}
      ${showLive ? `<div class="group ballist">${shownLive.length ? balanceHeader(span) + shownLive.map((r) => balanceRow(r, span)).join("")
        : `<div class="empty">${v.filter === "low" ? "Nothing is running low." : "No service here is reporting a live figure."}</div>`}</div>` : ""}
      ${showRest && rest.filter(inCategory).length ? `<div class="group ballist"><h3>No live figure</h3>${rest.filter(inCategory).map(balanceQuietRow).join("")}</div>` : ""}
      ${v.filter === "all" && !v.rest && rest.filter(inCategory).length ? `<button class="morelink" data-bal-rest="1">${rest.filter(inCategory).length} more service${rest.filter(inCategory).length === 1 ? "" : "s"} without a live figure ${icon("chevron", "tinyicon")}</button>` : ""}
      ${v.error ? `<p class="note">${esc(v.error)}</p>` : ""}
      ${aside(`<p><b>The meter</b> is what is left against what full is: a plan's quota, or for bought credits the balance
        just after the last top-up this computer saw. Until it has seen one, open a row and set what full is.</p>
        <p><b>Spend</b> is worked out from how the readings move, per day, so it starts the day Balances was turned on;
        OpenRouter also reports its own daily figures. A change is only shown against a span that was fully watched.
        Only dollars are added together: credits, characters and emails stay on their own rows.</p>
        <p><b>Low</b> means under a fifth left, or under a week at the recent rate.</p>`, "How to read this")}
      <div class="group quiet"><div class="row"><div class="grow note">Stop reading balances and forget the readings,
        their history and the logos.</div><button class="act danger" data-balances-off="1" ${v.busy ? "disabled" : ""}>Turn off</button></div></div>`;
  }

  function appsPage() {
    const cat = state.catalog;
    if (!cat?.available) {
      return settingsBack("Apps") + `
        <div class="group"><p class="note">Run <code>passbook install</code>, then reopen.</p></div>`;
    }
    const known = cat.agents || [];
    const restricted = Object.keys(cat.audiences || {});

    const summary = `
      <div class="group">
        <div class="row">
          <div class="grow"><strong>${known.length}</strong> app${known.length === 1 ? "" : "s"}
            have asked this device for a credential.</div>
          <span class="tag ${restricted.length ? "info" : ""}">${restricted.length
            ? `${restricted.length} restricted` : "nothing restricted"}</span>
        </div>
        ${known.length ? `<div class="chips">${[...known].sort((a, b) =>
            ((cat.agent_activity || {})[b] || 0) - ((cat.agent_activity || {})[a] || 0)
          ).map((a) => {
            const asks = (cat.agent_activity || {})[a] || 0;
            // A name alone cannot be judged: a daemon asking every minute and a
            // one-off from a test read identically without this.
            return `<span class="chip mono" title="${asks} recorded read${asks === 1 ? "" : "s"}">${esc(a)}
              <span class="asks">${asks}</span></span>`;
          }).join("")}</div>`
          : `<p class="note">None yet. An app appears here the first time it asks —
             including ones you never configured, which is the point.</p>`}
        ${aside(`<p>These are the names things give when they ask. A name is a claim,
          not a proof: it chooses the policy and fills the record, but it is not a
          password. The number beside each is how many reads it has on record \u2014 a
          name with one is usually a test that ran once.</p>
          <p>PassBook's own commands are not listed; restricting them would be
          restricting yourself. They are all in Activity.</p>`, "About these names")}
      </div>`;

    const mcp = `
      <div class="group">
        <h3>Give an agent access</h3>
        <p class="note">So an agent can ask for one credential at a time instead of you
        pasting keys into a chat.</p>
        <pre class="snippet">claude mcp add passbook -- passbook mcp</pre>
        ${aside(`<p>For anything else, point it at <code>passbook mcp</code> over
          stdio.</p>`, "Other agents")}
      </div>`;

    if (!grid) {
      return settingsBack("Apps") + `
        ${summary}
        <div class="group">
          <div class="row"><div class="grow">See every key against every app.</div>
            <button class="act" data-grid="1" ${busy ? "disabled" : ""}>Show the grid</button></div>
        </div>
        ${mcp}`;
    }

    const rows = grid.rows.filter((r) =>
      !gridOnlyRestricted || r.audience.mode !== "all"
      || Object.values(r.agents).some((c) => c.outcome !== "grant"));

    return settingsBack("Apps") + `
      ${summary}
      <div class="group">
        <div class="row">
          <div class="grow">${rows.length} key${rows.length === 1 ? "" : "s"} ×
            ${grid.agents.length} app${grid.agents.length === 1 ? "" : "s"}</div>
          <button class="act ${gridOnlyRestricted ? "primary" : ""}" data-gridfilter="1">
            ${gridOnlyRestricted ? "Showing restricted" : "Show all"}</button>
          <button class="act" data-grid="1">Refresh</button>
        </div>
        <div class="matrixwrap">
          <table class="matrix">
            <thead><tr><th>Key</th>${grid.agents.map((a) =>
              `<th class="mono">${esc(a)}</th>`).join("")}</tr></thead>
            <tbody>
              ${rows.map((r) => `<tr>
                <td class="mono kname">${esc(r.key)}
                  <span class="gtag">${esc(r.group)}</span></td>
                ${grid.agents.map((a) => {
                  const cell = r.agents[a];
                  const cls = { grant: "yes", refuse: "no", ask: "ask" }[cell.outcome];
                  const glyph = { grant: "check", refuse: "cross", ask: "question" }[cell.outcome];
                  const word = { grant: "yes", refuse: "no", ask: "asks" }[cell.outcome];
                  return `<td class="cell ${cls}" title="${esc(cell.why)}"
                    aria-label="${word}">${icon(glyph)}</td>`;
                }).join("")}
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        ${rows.length ? "" : `<div class="empty">Nothing is restricted — every app
          can read every key.</div>`}
      </div>
      ${mcp}`;
  }

  /** Which workspace this machine acts for, and the way back in.
   *
   *  Locking and choosing a workspace belong on one screen because they are one
   *  moment: you step away from a client's credentials, or you step into them.
   *  Splitting them puts the sign-in on a page you reach by remembering it.
   */
  function switchPage() {
    const cat = state.catalog || {};
    const rows = cat.workspace_rows || [];
    const here = cat.workspace || state.store?.workspace || "";
    const pinned = cat.workspace_pinned;
    const v = vault;

    const list = rows.length ? rows.map((row) => `
      <div class="row">
        ${avatar(row.label || row.id)}
        <div class="grow">
          <div><strong>${esc(row.label || row.id)}</strong>${row.active ? " \u00b7 active" : ""}</div>
          <div class="sub mono">${esc(row.id)}${row.inherits ? ""
            : " \u00b7 does not inherit the shared store"}</div>
        </div>
        ${row.active
          ? `<span class="tag on">Here</span>`
          : `<button class="act" data-workspace="${esc(row.id)}" ${busy || pinned ? "disabled" : ""}>
               Switch</button>`}
      </div>`).join("")
      : `<div class="empty">This device has no workspaces \u2014 everything lives in the
         shared store.</div>`;

    const signIn = !v?.supported ? "" : v.unlocked ? `
      <div class="group">
        <div class="row">
          <span class="statustile good">${icon("unlock")}</span>
          <div class="grow"><strong>Signed in</strong> as
            ${esc(profileLabel(v.signed_in_profile))}${v.expires_in
              ? `, ${humanTime(v.expires_in)} left` : ""}.</div>
          <button class="act" data-signout ${busy ? "disabled" : ""}>${icon("lock")} Lock</button>
        </div>
        <p class="note">Locking closes the vault for everything on this device, not just
        this window. Anything mid-request gets refused rather than served stale.</p>
      </div>`
      : `
      <div class="group">
        <h3>Sign in</h3>
        ${(v.profiles || []).length > 1 ? `
          <div class="addrow two">
            <select id="sw-profile">
              ${v.profiles.map((p) => `<option value="${esc(p.id)}"${
                p.id === (vaultForm.profile || v.active) ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
            </select>
          </div>` : ""}
        <div class="addrow two">
          <input id="sw-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="sw-go" ${busy ? "disabled" : ""}>${icon("unlock")} Sign in</button>
        </div>
        ${(v.profiles || []).length ? "" : `<p class="note">No profile on this device yet.
          Set one up on the Vault page.</p>`}
      </div>`;

    return `
      <h2>Workspace</h2>
      <p class="lede">Which set of credentials this device is working with, and
      whether anything can read them.</p>
      ${signIn}
      <div class="group">
        <h3>Workspaces</h3>
        ${list}
        ${pinned ? `<p class="note">HIVE_WORKSPACE is set in this app's environment, so it is
          pinned to <span class="mono">${esc(here)}</span> and switching is turned off here.
          A pinned process is pinned deliberately \u2014 usually an agent working for one
          client \u2014 and a switch made in this window should not quietly re-point it.</p>`
          : `<p class="note">Switching writes HivemindOS's own workspace manifest, so both
          apps agree on which one is active. Keys stay where they are; what changes is which
          store this device reads first and where a new key is written.</p>`}
      </div>`;
  }

  const CONFIRM_WORDS = {
    add: ["Adding a key", "A credential this store did not have before."],
    modify: ["Replacing a value", "An existing key being overwritten \u2014 the change that quietly breaks things."],
    delete: ["Removing a key", "Gone from this store; the value is not recoverable from here."],
  };

  /** What happens when something asks — the rules that are not about one key.
   *
   *  Two thirds of this page used to be a list of all 281 keys with a
   *  three-way switch on each: 843 buttons, kept up to date with the identical
   *  list on the Keys page, so that changing one key meant finding it twice.
   *  That switch now lives on the key, where it is a property of the key. What
   *  is left here is the part that is genuinely global.
   */
  function accessPage() {
    const a = state.access || {};
    const cat = state.catalog || {};
    const pending = state.broker?.pending || [];
    const open = a.sessions || [];
    return `
      ${settingsBack("Permissions")}
      ${pending.map((p) => `
        <div class="banner">
          ${icon("alert")}
          <div class="body">
            <b>${esc(p.app)}</b> ${esc({ add: "wants to add", modify: "wants to change",
              delete: "wants to remove" }[p.kind] || "wants")} ${esc((p.keys || []).join(", "))}
            ${p.reason ? `<div style="opacity:.85;margin-top:2px">${esc(p.reason)}</div>` : ""}
            <div class="acts">
              <button data-ok="${esc(p.id)}" data-for="">Just once</button>
              <button data-ok="${esc(p.id)}" data-for="1h">For 1 hour</button>
              <button data-no="${esc(p.id)}">Decline</button>
            </div>
          </div>
        </div>`).join("")}
      <div class="group">
        <h3>Ask before changing a key</h3>
        ${(cat.confirm_ops || ["add", "modify", "delete"]).map((op) => {
          const on = !!(cat.confirm || {})[op];
          const [label, blurb] = CONFIRM_WORDS[op];
          return `<div class="row">
            <div class="grow"><div><strong>${label}</strong></div>
              <div class="sub">${blurb}</div></div>
            <div class="seg">
              <button data-confirm="${op}" data-on="0" aria-pressed="${!on}">Straight away</button>
              <button data-confirm="${op}" data-on="1" aria-pressed="${on}">Ask me</button>
            </div>
          </div>`;
        }).join("")}
      </div>
      <div class="group">
        <h3>Stop being asked</h3>
        ${open.length ? open.map((u) => `
          <div class="row"><div class="grow">${(u.keys || []).length
              ? `<span class="mono">${esc(u.keys.join(", "))}</span>` : "Every key"}</div>
            <span class="tag on">${Math.round(u.remaining_seconds / 60)}m left</span>
            <button class="act" data-lock="1" ${busy ? "disabled" : ""}>Close now</button></div>`).join("")
          : `<div class="row"><div class="grow">Answer everything without asking, for a while.
             It closes on its own.</div>
             <div class="seg">${(a.presets || ["15m","1h","4h"]).map((p) =>
               `<button data-unlock="${p}">${p}</button>`).join("")}</div></div>`}
      </div>
      <p class="note">Each key also has its own answer — open a key on the Keys page to
      set it.</p>`;
  }

  function machinesPage() {
    const l = state.links || {};
    // Tailnet machines sit in the same list as grants, badged with how trust
    // was established. They belong here — they hold the store — but a grant
    // had a fingerprint compared on two screens and an adoption did not, and
    // one badge is the difference between saying so and implying otherwise.
    // A grant to another person is not one of your computers: it is listed under People, below,
    // with their name and what they may do, and not a second time here as a machine.
    const rows = [
      ...(l.lent || []).filter((r) => r.kind !== "member").map((r) => ({ ...r, lent: true })),
      ...(l.tailnet || []).map((r) => ({ ...r, lent: true })),
      ...(l.borrowed || []),
    ];
    return `
      <div class="devhead"><h2>Devices</h2>
        ${addDevice.waiting()
          ? `<button class="act" data-resume-device>Invite waiting\u2026</button>`
          : `<button class="act primary" data-add-device ${busy ? "disabled" : ""}>Add a device</button>`}</div>
      <p class="lede">Every device that holds this store \u2014 the ones you paired with,
      and the ones that have it because they are on your network.</p>
      ${planLine()}
      ${syncPanel()}
      <div class="group">
        <h3>This device</h3>
        <div class="row">
          <span class="statustile plain">${icon("monitor")}</span>
          <div class="grow"><div class="mono">${esc(l.fingerprint || "—")}</div>
            <div class="sub">Pairing code \u2014 both ends read this aloud before a key moves.</div></div>
          ${l.fingerprint ? `<button class="iconbtn ${copied.__fingerprint ? "done" : ""}"
            data-copytext="${esc(l.fingerprint)}" data-copymark="__fingerprint"
            title="${copied.__fingerprint ? "Copied" : "Copy pairing code"}"
            aria-label="Copy pairing code">${icon(copied.__fingerprint ? "check" : "copy")}</button>` : ""}
        </div>
      </div>
      <div class="group">
        <h3>Paired devices</h3>
        ${rows.map((r) => `
          <div class="row">
            <span class="statustile plain sm">${icon(r.lent ? "out" : "into")}</span>
            <div class="grow">
              <div>${r.lent ? "Lent to" : "Borrowed from"}
                ${r.label ? `<b>${esc(r.label)}</b>` : `<span class="mono">${esc(r.host || r.fingerprint || r.did)}</span>`}
                ${r.via === "tailnet"
                  ? `<span class="viatag" title="Trusted because it is on your network. No pairing code was compared.">${icon("globe", "tinyicon")} network</span>`
                  : `<span class="viatag grant" title="Both ends compared a pairing code.">${icon("shield", "tinyicon")} paired</span>`}</div>
              ${(r.keys || []).length > 8
                ? `<div class="sub">${(r.keys || []).length} keys \u2014 everything whose reach allows it</div>`
                : `<div class="chips inline">${(r.keys || []).map((k) =>
                    `<span class="chip mono">${esc(k)}</span>`).join("") || `<span class="sub">no keys</span>`}</div>`}
              ${r.relay && r.active ? `<div class="sub">${r.live === false ? "these keys as they were" : "kept up to date"}${
                r.sentAt ? ` \u00b7 last sent ${esc(String(r.sentAt).slice(0, 16).replace("T", " "))}` : ""}${
                r.pulledAt ? ` \u00b7 last checked ${esc(String(r.pulledAt).slice(0, 16).replace("T", " "))}` : ""}${
                r.expires ? ` \u00b7 until ${esc(String(r.expires).slice(0, 10))}` : ""}</div>` : ""}</div>
            ${r.lent && r.active
              ? (r.via === "tailnet"
                  ? `<button class="act" data-forget="${esc(r.host)}" ${busy ? "disabled" : ""}>Forget</button>`
                  : `<button class="act" data-revoke="${esc(r.did)}" ${busy ? "disabled" : ""}>${r.relay ? "Unlink" : "Revoke"}</button>`)
              : `<span class="tag ${r.active ? "on" : "off"}">${r.revoked ? "Revoked" : r.active ? "Active" : "Expired"}</span>`}
          </div>`).join("") || `<div class="empty">No other devices.</div>`}
        ${aside(`<p>A pairing names which keys may move, and it can be undone from
          here. It is not the only way a device ends up holding this store \u2014 see
          below.</p>`)}
      </div>
      ${peoplePanel()}
      ${fleetPanel()}`;
  }

  /** The plan, in one line at the top of Devices: its name, how many computers it has room for, and
   *  the one button. Asked of the relay after the page is up, so it can also be "still asking" or
   *  "could not ask", and neither of those is an error worth a banner. */
  function planLine() {
    const line = plan.line();
    if (line.state !== "ok") {
      return `<div class="group quiet"><div class="row">
        <span class="statustile plain sm">${icon("card")}</span>
        <div class="grow" role="status">${line.state === "failed" ? "Plan: could not check" : "Checking your plan\u2026"}</div>
        ${line.state === "failed" ? `<button class="act" data-plan-retry="1">Retry</button>` : ""}
      </div></div>`;
    }
    return `<div class="group"><div class="row">
      <span class="statustile plain sm">${icon("card")}</span>
      <div class="grow"><strong>${esc(line.name)}</strong> <span class="sub">\u00b7 ${esc(line.usage)}</span></div>
      <button class="act" data-plan-open="plan">${esc(line.action)}</button>
    </div></div>`;
  }
  const planBlurb = (fallback) => { const line = plan.line(); return line.state === "ok" ? `${line.name} \u00b7 ${line.usage}` : fallback; };

  /** The people keys are shared with. Under the computers, because a person is another computer
   *  that holds some of these keys; it just is not yours. */
  function peoplePanel() {
    const people = plan.people();
    if (!people) return "";
    const rows = people.members.map((m) => `
      <div class="row">
        <span class="statustile plain sm">${icon("person")}</span>
        <div class="grow">
          <div><b>${esc(m.name || "Someone")}</b>
            <span class="viatag" title="${m.role === "read" ? "They can use these keys and see them." : "Their apps can use these keys. PassBook never shows the keys to them."}">${m.role === "read" ? "can use and see" : "can use"}</span></div>
          ${(m.keys || []).length > 8
            ? `<div class="sub">${(m.keys || []).length} keys</div>`
            : `<div class="chips inline">${(m.keys || []).map((k) =>
                `<span class="chip mono">${esc(k)}</span>`).join("") || `<span class="sub">no keys</span>`}</div>`}
          ${m.sentAt || m.expires ? `<div class="sub">${[m.sentAt ? `last sent ${esc(String(m.sentAt).slice(0, 16).replace("T", " "))}` : "",
            m.expires ? `until ${esc(String(m.expires).slice(0, 10))}` : ""].filter(Boolean).join(" \u00b7 ")}</div>` : ""}</div>
        <button class="act" data-member-remove="${esc(m.did)}" ${busy ? "disabled" : ""}>Remove</button>
      </div>`).join("");
    const share = addPerson.waiting()
      ? `<button class="act" data-resume-person="1">Invite waiting\u2026</button>`
      : people.can ? `<button class="act" data-add-person="1" ${busy ? "disabled" : ""}>Share with a person</button>`
      : people.offer ? `<button class="act" data-plan-open="teams">${esc(people.offer)}</button>` : "";
    return `<div class="group">
        <h3>People${people.total ? ` \u00b7 ${people.taken} of ${people.total}` : ""}</h3>
        ${rows}
        <div class="row">
          <div class="grow ${rows ? "sub" : ""}">${people.can
            ? (rows ? "Each person gets only the keys you choose, on their own computer." : "Share some of your keys with someone else, on their own computer.")
            : esc(people.why)}</div>
          ${share}
        </div>
      </div>`;
  }

  /** Machines that hold this store without a PassBook grant.
   *
   *  Kept apart from linked machines rather than merged with them. A linked
   *  machine is trusted because both ends compared a fingerprint; a tailnet
   *  peer is trusted because it is on the tailnet. One list would be the more
   *  comfortable lie, and this page already told someone "no linked machines"
   *  while six machines held their credentials.
   */
  function fleetPanel() {
    const f = state.fleet;
    if (!f) return "";
    if (!f.available) {
      return `<div class="group">
        <h3>Your network</h3>
        <p class="note">${esc(f.detail || "This device cannot see your network.")}</p>
      </div>`;
    }
    // Machines already recorded above are not repeated here. What is left is
    // the rest of the tailnet: on it, but not receiving the store.
    const known = new Set(((state.links || {}).tailnet || []).map((r) => r.host));
    const rows = (f.peers || []).filter((p) => !known.has(p.host));
    const replicating = rows.filter((p) => p.replicates);
    if (!rows.length) {
      return `<div class="group">
        <h3>Rest of your network</h3>
        <p class="note">Every device that receives the store is listed above.</p>
      </div>`;
    }
    return `
      <div class="group">
        <div class="row">
          <span class="statustile ${replicating.length ? "warn" : "plain"}">${icon("globe")}</span>
          <div class="grow">${replicating.length
            ? `<strong>${replicating.length}</strong> more device${replicating.length === 1 ? "" : "s"}
               receive${replicating.length === 1 ? "s" : ""} this store but ${replicating.length === 1 ? "is" : "are"}
               not recorded above. Run <code>passbook sync</code> to record ${replicating.length === 1 ? "it" : "them"}.`
            : `The rest of your network. ${rows.length} device${rows.length === 1 ? "" : "s"}
               ${rows.length === 1 ? "is" : "are"} reachable but ${rows.length === 1 ? "does" : "do"} not
               receive the store.`}</div>
          <span class="tag ${replicating.length ? "info" : ""}">${rows.length} other${rows.length === 1 ? "" : "s"}</span>
        </div>
        ${rows.map((p) => `
          <div class="row">
            <span class="statustile plain sm">${icon(p.replicates ? "globe" : "monitor")}</span>
            <div class="grow">
              <div class="mono">${esc(p.host)}</div>
              <div class="sub">${esc(p.os || "unknown")}${p.replicates
                ? " \u00b7 set up" : " \u00b7 not set up \u2014 does not receive the store"}</div>
            </div>
            ${p.replicates
              ? `<span class="tag off">Has the store</span>`
              : `<span class="tag">Not shared</span>`}
          </div>`).join("") || `<div class="empty">No other devices on your network.</div>`}
        ${aside(`<p>A device stays here until <code>passbook sync</code> has seen it,
          after which it joins the list above.</p>`)}
      </div>`;
  }

  /** The drawer everything technical was moved into.
   *
   *  The background service had a page in the source list, level with Keys.
   *  Nobody opens an app to look at a daemon — but the day it is not running
   *  is the day you need to find it, so it is one press inside Settings
   *  rather than gone. The store's path on disk joins it here; it was in grey
   *  under 281 keys, where it was decoration for everyone who did not need it
   *  and unfindable for the one person who did.
   */
  function brokerPage() {
    const b = state.broker || {};
    const st = state.store || {};
    return `
      ${settingsBack("Advanced")}
      <div class="group">
        <h3>Background access</h3>
        <div class="row">
          <span class="statustile ${b.running ? "good" : "warn"}">${icon("hub")}</span>
          <div class="grow">${b.running
            ? "Running. Every read goes through one door and is recorded."
            : "Not running — each app records its own reads, so Activity has gaps."}</div>
          <span class="tag ${b.running ? "on" : "off"}">${b.running ? "On" : "Off"}</span>
          <button class="act ${b.running ? "" : "primary"}" data-broker="${b.running ? "stop" : "start"}"
            ${busy ? "disabled" : ""}>${icon("power")} ${b.running ? "Turn off" : "Turn on"}</button></div>
        ${b.limits ? aside(`<p>${esc(b.limits)}</p>`, "What this does not stop") : ""}
      </div>
      <div class="group">
        <h3>On this device</h3>
        <div class="row"><span class="dlabel">Store</span>
          <span class="mono pathval">${esc(st.path || "—")}</span></div>
        ${st.writes_to && st.writes_to !== st.path ? `
          <div class="row"><span class="dlabel">New keys go to</span>
            <span class="mono pathval">${esc(st.writes_to)}</span></div>` : ""}
        <div class="row"><span class="dlabel">Workspace</span>
          <span class="mono pathval">${esc(st.workspace || "main")}</span></div>
      </div>`;
  }

  /** What each kind of entry did, in words — one entry per ledger operation.
   *
   *  Both halves matter. `did` is what happened; `didnt` is what the same row
   *  means when `granted` is false, and it is not one sentence for all of them:
   *  a refused sign-in was refused, but a read that comes back false only means
   *  some of the names asked for were not in the store. This app said "was
   *  refused" for both, which turned 438 ordinary rows into security events and
   *  buried the one row on this machine that really was a refusal.
   *
   *  `bare` marks the operations that are about the store rather than about
   *  particular keys, so they do not get "1 key" glued to the end of them.
   *
   *  Keep this in step with OPERATIONS in passbook_stamp.py — a missing entry
   *  prints the raw op verbatim, which is how "hivemindos reveal 1 keys" got on
   *  screen. There is a test that fails if the two drift apart.
   */
  const OP_WORD = {
    read:      { did: "read", didnt: "read", partial: "some were not there" },
    reveal:    { did: "revealed", didnt: "could not reveal" },
    // "used", never "read": the whole point of a grant is that the caller
    // caused the key to work without ever holding it, and a row saying "read"
    // would claim the one thing that did not happen.
    use:       { did: "used", didnt: "could not use" },
    write:     { did: "changed", didnt: "could not change" },
    // "deleted", not "changed": a key that is gone is a different event from a
    // key with a new value, and the window has to be able to show which.
    remove:    { did: "deleted", didnt: "could not delete" },
    denied:    { did: "was refused", didnt: "was refused" },
    ask:       { did: "asked to use", didnt: "asked to use" },
    approve:   { did: "was allowed", didnt: "was allowed" },
    unlock:    { did: "opened access to", didnt: "could not open access to" },
    lock:      { did: "closed access to", didnt: "closed access to" },
    refresh:   { did: "renewed", didnt: "could not renew" },
    export:    { did: "exported", didnt: "could not export" },
    import:    { did: "imported", didnt: "could not import" },
    link:      { did: "was given", didnt: "could not be given" },
    unlink:    { did: "no longer has", didnt: "no longer has" },
    provision: { did: "set up", didnt: "could not set up" },
    signin:    { did: "signed in", didnt: "was refused a sign-in", bare: true },
    signout:   { did: "locked the vault", didnt: "locked the vault", bare: true },
    seal:      { did: "encrypted the store", didnt: "could not encrypt the store", bare: true },
    unseal:    { did: "decrypted the store", didnt: "could not decrypt the store", bare: true },
    recovery:  { did: "made a recovery code", didnt: "could not make one", bare: true },
    // Standing access — an app using a key with the vault locked, and being
    // given or losing that. Worded for the app, since that is whose row it is.
    standing:  { did: "used, while locked,", didnt: "could not use, while locked," },
    keep:      { did: "may use while locked", didnt: "could not be given" },
    release:   { did: "no longer uses while locked", didnt: "no longer uses while locked" },
  };

  /** What each kind of entry did, as a glyph. Same vocabulary, same test. */
  const OP_ICON = {
    read: "eye", reveal: "eye", write: "pencil", denied: "cross", ask: "alert",
    approve: "check", unlock: "unlock", lock: "lock", refresh: "history",
    export: "out", import: "into", link: "link", unlink: "cross",
    provision: "plus", signin: "unlock", signout: "lock", seal: "lock",
    use: "unlock", remove: "trash",
    unseal: "unlock", recovery: "shield",
    standing: "unlock", keep: "shield", release: "cross",
  };

  /** The same thing, over and over, as one row that says how many times.
   *
   *  675 of the 2,208 rows on this machine share a timestamp to the second
   *  with another row: one caller read a single key 29 times inside one
   *  second. Printing 29 identical lines is accurate and useless — it fills
   *  the page with one event and pushes everything else off it. Folded up,
   *  with the count kept, nothing is hidden and the rest is visible.
   */
  function foldRuns(rows) {
    const out = [];
    for (const row of rows) {
      const run = out[out.length - 1];
      const same = run && run.row.app === row.app && run.row.op === row.op
        && run.row.granted === row.granted
        && (run.row.keyCount || 0) === (row.keyCount || 0)
        && (run.row.keys || []).join() === (row.keys || []).join();
      // Rows arrive newest first, so the head of a run keeps the time shown
      // and the tail is remembered for the tooltip. Folding must never lose
      // when something happened — only how many lines it takes to say so.
      if (same) { run.times += 1; run.oldest = row.at; }
      else out.push({ row, times: 1, oldest: row.at });
    }
    return out;
  }

  /** Re-hash the whole chain and say whether it holds.
   *
   *  Not part of the five-second refresh: it walks every row of a ledger that
   *  is megabytes long, and it was costing that on every poll to answer a
   *  question only this page asks. Asked once when the page opens, and again
   *  whenever somebody presses the button.
   */
  async function checkChain() {
    if (chain.busy) return;
    chain.busy = true; paint();
    try { chain.answer = await invoke("verify_record"); }
    catch (e) { chain.answer = { intact: null, detail: said(e) }; }
    finally { chain.busy = false; paint(); }
  }

  function recordPage() {
    const r = state.record || {};
    const rows = (r.rows || []).slice(-40).reverse();
    // `state` no longer verifies, so `intact` arrives as null and only this
    // page's own check fills it in. Null is not "fine" — a chain nobody has
    // checked must not be labelled Intact, which is the whole point of it.
    const checked = chain.answer || (r.intact === null ? null : r);
    const intact = checked ? checked.intact : null;
    const broken = intact === false;
    const tone = broken ? "warn" : intact ? "good" : "plain";
    const word = chain.busy ? "Checking…" : broken ? "Tampered" : intact ? "Verified" : "Not checked";
    // A check that could not be run is not a record that has not been checked: pressing Verify and being
    // told "not verified yet" again read as a button that did nothing.
    const failed = !chain.busy && checked && intact === null && checked.detail;
    const detail = chain.busy ? "Checking every entry."
      : broken ? (checked.detail || "This record has been altered.")
      : intact ? "Nothing in this record has been altered."
      : failed ? `The check could not be run: ${checked.detail}`
      : "This record has not been verified yet.";
    // Tamper-evidence belongs at the top only when it has something to say.
    // A green "Intact" badge above every visit is a badge nobody reads; the
    // one time this matters it should be the first thing on the page.
    const check = `<div class="group${broken ? "" : " quiet"}">
        <div class="row">
          <span class="statustile ${tone} sm">${icon(broken ? "alert" : "shield")}</span>
          <div class="grow">${broken ? `<strong>${esc(detail)}</strong>` : esc(detail)}</div>
          <span class="tag ${broken ? "off" : intact ? "on" : ""}">${word}</span>
          <button class="act" data-verify="1" ${chain.busy ? "disabled" : ""}>
            ${intact === null ? "Verify" : "Verify again"}</button>
        </div>
      </div>`;
    return `
      <h2>Activity</h2>
      <p class="lede">What has been read on this device, and by what. Names and times \u2014
      never a value.</p>
      ${broken ? check : ""}
      <div class="group">
        ${foldRuns(rows).map(({ row, times, oldest }) => {
          const names = row.keys || [];
          const total = row.keyCount || names.length;
          const ok = row.granted !== false;
          const said = OP_WORD[row.op];
          // The actor and the verb read first. This used to lead with twelve
          // monospace key names wrapped over three lines, under which the app
          // that did it — the one thing you scan this page for — was the
          // smallest grey text on the row.
          const verb = said ? (ok ? said.did : said.didnt) : (row.op || "used");
          // A row is only alarming when the operation itself is. A read that
          // comes back false is a name the store did not have, not a refusal.
          const wrong = !ok && !said?.partial;
          const what = said?.bare ? ""
            : total === 1 && names.length ? `<span class="mono">${esc(names[0])}</span>`
            : total === 1 ? "1 key"
            : total ? `${total} keys` : "";
          const aside = !ok && said?.partial ? said.partial : "";
          return `
          <div class="row">
            <span class="statustile ${wrong ? "warn" : "plain"} sm"
              title="${esc(row.op || "")}">${icon(OP_ICON[row.op] || "doc")}</span>
            <div class="grow">
              <div><strong>${esc(row.app || "unknown")}</strong> ${esc(verb)} ${what}${
                times > 1 ? ` <span class="sub">\u00d7${times}</span>` : ""}</div>
              ${aside ? `<div class="sub">${esc(aside)}</div>`
                : total > 1 && total <= 4 ? `<div class="sub mono">${esc(names.join(", "))}</div>` : ""}
            </div>
            <span class="tag"${times > 1 ? ` title="${times} times, ${
              esc(ago(oldest))} to ${esc(ago(row.at))}"` : ""
              }>${esc(ago(row.at) || "")}</span>
          </div>`; }).join("") || `<div class="empty">Nothing recorded yet.</div>`}
      </div>
      ${teamActivity()}
      ${broken ? "" : check}`;
  }

  /** What the people keys are shared with did with them, on their computers. Only when there are
   *  people: an empty heading about nobody is not something to scroll past. */
  function teamActivity() {
    if (!plan.people()?.members.length) return "";
    const rows = [...plan.events()].sort((a, b) => (Date.parse(b.at) || 0) - (Date.parse(a.at) || 0)).slice(0, 40);
    return `<div class="group">
        <h3>From people you share with</h3>
        ${rows.map((row) => {
          const names = row.keys || [];
          const ok = row.granted !== false;
          const said = OP_WORD[row.op];
          const verb = said ? (ok ? said.did : said.didnt) : (row.op || "used");
          const wrong = !ok && !said?.partial;
          const what = said?.bare ? ""
            : names.length === 1 ? `<span class="mono">${esc(names[0])}</span>`
            : names.length ? `${names.length} keys` : "";
          const more = [row.app ? `with ${row.app}` : "", !ok && said?.partial ? said.partial : "", row.reason || "",
                        names.length > 1 && names.length <= 4 ? names.join(", ") : ""].filter(Boolean).join(" \u00b7 ");
          return `
          <div class="row">
            <span class="statustile ${wrong ? "warn" : "plain"} sm">${icon(OP_ICON[row.op] || "person")}</span>
            <div class="grow">
              <div><strong>${esc(row.member || "Someone")}</strong> ${esc(verb)} ${what}</div>
              ${more ? `<div class="sub">${esc(more)}</div>` : ""}
            </div>
            <span class="tag">${esc(ago(row.at) || "")}</span>
          </div>`; }).join("") || `<div class="empty">Nothing from them yet.</div>`}
      </div>`;
  }

  /** The last thing that happened, said once, in the colour it deserves. */
  /** Say that something went well: the same bar, in its good colour, gone by itself in a few seconds.
   *  `notice` alone is how this window reports a failure, and it stays until dismissed. */
  let saidWell = "";
  function sayWell(words) {
    saidWell = words; notice = words;
    setTimeout(() => { if (notice === words) { notice = ""; paintKeepingCaret(); } }, 4500);
  }

  function noticeBar() {
    if (!notice) return "";
    const good = notice === saidWell || /\bcopied\.$/.test(notice);
    return `<div class="noticebar ${good ? "good" : ""}">${icon(good ? "check" : "alert")}
      <span class="grow">${esc(notice)}</span>
      <button data-noticeclear="1" title="Dismiss" aria-label="Dismiss">${icon("cross", "tinyicon")}</button>
      </div>`;
  }

  const PAGE_ICON = Object.fromEntries([...PAGES, ...SETTINGS]
    .map(([id, , glyph]) => [id, glyph]));
  PAGE_ICON.settings = "sliders";
  PAGE_ICON.attention = "bell";
  // Reached from the source list's foot rather than from the list itself: it is
  // where you go to leave or to come back, not a section you browse.
  PAGE_ICON.switch = "building";

  /** Give the page its heading tile and every empty state a glyph.
   *
   *  Done to the rendered DOM rather than in each page function: there are
   *  fourteen headings across eight pages once the loading and not-installed
   *  variants are counted, and a rule applied in one place cannot be the one
   *  somebody forgets.
   */
  function dressPage() {
    const h2 = main.querySelector("h2");
    if (h2 && !h2.closest(".pagehead")) {
      const lede = h2.nextElementSibling?.classList.contains("lede") ? h2.nextElementSibling : null;
      const wrap = document.createElement("div");
      wrap.className = "pagehead";
      const tile = document.createElement("span");
      tile.className = "pagetile";
      tile.innerHTML = icon(PAGE_ICON[page] || "key", "pageicon");
      const text = document.createElement("div");
      text.className = "pagetext";
      h2.parentNode.insertBefore(wrap, h2);
      wrap.append(tile, text);
      text.append(h2);
      if (lede) text.append(lede);
    }
    main.querySelectorAll(".empty").forEach((box) => {
      if (box.querySelector("svg")) return;
      box.insertAdjacentHTML("afterbegin", icon("inbox", "emptyicon"));
    });
  }


  /** Who's working? — the gate.
   *
   *  Locking used to mean one thing, and it meant the wrong one: pressing Lock
   *  signed the broker out, so putting the app away at the end of the day also
   *  stopped every agent reading credentials overnight. What people do about
   *  that is stop locking anything, which is worse than the risk it was
   *  guarding against.
   *
   *  So there are two decisions and two controls. Locking is about who is at
   *  the keyboard: it closes this window and nothing else. Agent access is
   *  about what runs while nobody is, and it lives on this screen — the moment
   *  somebody is already thinking about what they leave open.
   */
  const GATE_COLOURS = ["amber", "violet", "teal", "rose", "sky", "lime"];

  /** Whether the window is locked, and why that has to outlive the window.
   *
   *  Lock deliberately does not sign the broker out — agents read credentials
   *  at four in the morning and a window closing must not stop them. The cost
   *  of that is that "is the vault open" can no longer answer "may this person
   *  see it", so the window has to remember being locked on its own. Held only
   *  in a variable, it forgot the moment you quit: press Lock, quit, reopen,
   *  and the vault was still open so the gate never appeared.
   *
   *  This stops a person at the keyboard, which is what Lock is for. It does
   *  not stop code running as you, and nothing here could — that code can read
   *  the store directly. Do not let the padlock imply otherwise.
   */
  const LOCK_KEY = "passbook.window-locked";
  // Storage is scoped to the origin, and the origin carries the port. The app
  // asks for a fixed one so this survives a restart; if every candidate was
  // taken it says so here rather than losing the lock without a word.
  const lockIsRemembered = new URLSearchParams(location.search).get("steady") !== "0";
  const lockedOnDisk = () => {
    try { return localStorage.getItem(LOCK_KEY) === "1"; } catch { return false; }
  };
  const rememberLock = (on) => {
    try { if (on) localStorage.setItem(LOCK_KEY, "1"); else localStorage.removeItem(LOCK_KEY); }
    catch { /* a window with no storage still locks for as long as it lives */ }
  };
  let appLocked = lockedOnDisk();
  // What this device can verify, and what to call it. Asked once, before
  // anything is drawn, so no control is offered that cannot work.
  let biometry = { available: false, kind: "", label: "" };

  /** The active workspace, and whether anything could prove you are you. */
  const activeRow = () => (state?.catalog?.workspace_rows || []).find((row) => row.active);
  const canProveIdentity = (row) => Boolean(row && (row.has_password || row.has_passkey));

  function lockWindow() {
    // A workspace with no password and no passkey has nothing to check on the
    // way back in, so locking it would put up a screen with no way past it.
    if (!canProveIdentity(activeRow())) {
      notice = "This workspace has no password yet, so the window cannot be locked. "
             + "Give it one in Settings › Security.";
      paint();
      return;
    }
    appLocked = true;
    rememberLock(true);
    if (!lockIsRemembered) {
      notice = "Locked. This window could not claim its usual port, so quitting the app "
             + "will clear the lock until it can.";
    }
    // Every revealed value goes, and the app is told to overwrite each one
    // rather than waiting out its hold. A lock that leaves a readable value
    // behind it is a mistake this window has already made once, in the other
    // direction: the sidebar said "Vault locked" while the eye beside every key
    // still worked.
    Object.keys(revealed).forEach(hideValue);
    revealed = {}; history = {}; picked = {}; expanded = {}; replacing = {};
    for (const box of main.querySelectorAll("input[data-keep]")) box.value = "";
    adding = false; pasted = null; keyCursor = ""; addForm.error = ""; addForm.sent = null;
    gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
    paintGate();
  }

  /** Only ever called where a factor has just been checked. */
  function unlockWindow() {
    appLocked = false;
    rememberLock(false);
  }
  let gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };

  // ── An agent asks to open the vault ───────────────────────────────────────
  //
  //  `passbook signin --ask WHY` (or the MCP server's request_signin) opens
  //  passbook://signin naming who asks and why (signin.rs). The agent must never
  //  be handed the password, so the person approves here, on the same sign-in
  //  card as always, and the agent sees only that the vault opened. Who is
  //  asking is the request's own word; the card says so, and Not now is the guard.
  let agentAsk = null;

  const agentAskRow = () => {
    const rows = workspaceRows();
    return rows.find((row) => row.id === agentAsk?.workspace) || (!agentAsk?.workspace && rows.find((row) => row.active)) || null;
  };
  const agentAskOpen = () => Boolean(agentAsk) && (vault?.unlocked_workspaces || []).includes(agentAskRow()?.id ?? agentAsk.workspace);
  const agentAskWaiting = () => Boolean(agentAsk) && Boolean(agentAskRow()) && !agentAskOpen();

  async function loadAgentAsk() {
    if (!invoke) return;
    let next = null;
    try { next = await invoke("pending_signin_ask"); } catch { return; /* an older build */ }
    if (!next) return;
    agentAsk = next;
    // Whether it is already open is the broker's answer now, not this window's last reading.
    try { await refreshVault(); } catch { /* judged on what the window has */ }
    if (agentAsk?.id !== next.id) return;  // settled, or replaced, while it was reading
    if (!agentAskRow()) {
      notice = `${next.by} asked to open a workspace this window does not have: ${next.workspace}.`;
      settleAgentAsk(true);
      paint();
      return;
    }
    if (agentAskOpen()) { settleAgentAsk(true); return; }
    gateView = { mode: "signin", chosen: agentAskRow(), error: "", busy: false, hint: "" };
    paintGate();
    document.getElementById("g-pw")?.focus();
  }

  /** Clears the request once its workspace is open, or when `force`d (Not now). */
  function settleAgentAsk(force = false) {
    if (!agentAsk || (!force && !agentAskOpen())) return;
    const id = agentAsk.id;
    agentAsk = null;
    invoke?.("dismiss_signin_ask", { id }).catch(() => undefined);
  }

  function agentAskCard(row) {
    if (!agentAsk || agentAskRow()?.id !== row.id) return "";
    return `
      <p class="glede" style="text-align:left;margin:0"><strong>${esc(agentAsk.by)}</strong> asks you to
        open this workspace${agentAsk.reason ? `: “${esc(agentAsk.reason)}”` : "."}</p>
      <p class="glede" style="text-align:left;margin:0;font-size:12px">That is what the request says
        about itself; any program on this computer can ask. Approve only if you expect it. Agents and
        scripts can then use this workspace's credentials until you lock it. Your password stays here.</p>`;
  }

  /** A colour per workspace: stable for a given name, distinct within a screen.
   *
   *  A plain hash gave two of three workspaces the same violet, which does not
   *  read as coincidence — it reads as a colour that was never assigned. So the
   *  hash picks where to start and the first free colour from there is taken,
   *  which keeps a workspace's colour steady as others come and go while no two
   *  on screen collide until there are more workspaces than colours.
   */
  function gateColours(names) {
    const taken = new Set();
    const out = {};
    for (const name of names) {
      let sum = 0;
      for (const character of String(name || "")) sum = (sum * 31 + character.charCodeAt(0)) >>> 0;
      const start = sum % GATE_COLOURS.length;
      let chosen = GATE_COLOURS[start];
      for (let step = 0; step < GATE_COLOURS.length; step++) {
        const candidate = GATE_COLOURS[(start + step) % GATE_COLOURS.length];
        if (!taken.has(candidate)) { chosen = candidate; break; }
      }
      taken.add(chosen);
      out[name] = chosen;
    }
    return out;
  }
  const gateInitial = (name) => (String(name || "?").trim()[0] || "?").toUpperCase();

  function workspaceRows() {
    const rows = state?.catalog?.workspace_rows || [];
    const palette = gateColours(rows.map((row) => row.id));
    return rows.map((row) => ({
      ...row, colour: palette[row.id],
      open: (vault?.unlocked_workspaces || []).includes(row.id),
    }));
  }

  /** Whether the window should be showing the gate rather than the store.
   *
   *  Two ways in: somebody pressed Lock, or the active workspace has a key and
   *  nothing has opened it. A workspace with no key of its own has nothing to
   *  ask for, so asking would be theatre.
   */
  function gateShouldShow() {
    // A request on screen carries its own unlock step, and the sign-in
    // sheet underneath it would mean approving something unread.
    if (webLink.active() || authorization.active() || askShouldShow() || impShouldShow() || impView.done || ghShouldShow()) return false;
    if (agentAskWaiting()) return true;
    // The passkey offer comes AFTER a successful sign-in, which is the one
    // moment it can succeed — and the same moment the gate would otherwise
    // decide it is no longer needed and take the offer down with it.
    if (gateView.mode === "enrol") return true;
    if (appLocked) return true;
    const here = (state?.catalog?.workspace_rows || []).find((row) => row.active);
    return Boolean(here?.has_vault) && !vault?.unlocked;
  }

  function gateTiles() {
    const rows = workspaceRows();
    return `
      <div class="ghead">
        <div class="gmark">${icon("key")}</div>
        <p class="geyebrow">PassBook</p>
        <h1>Who's working?</h1>
        <p class="glede">${rows.length
          ? "Each workspace is its own set of credentials, with its own key."
          : "No workspaces on this device yet."}</p>
      </div>
      <ul class="gtiles">
        ${rows.map((row) => `
          <li><button class="gtile" data-gpick="${esc(row.id)}" aria-label="Open ${esc(row.label)}" title="${esc(row.label)}">
            <span class="gav c-${row.colour}">${esc(gateInitial(row.label))}</span>
            <span class="gname">${esc(row.label)}</span>
            ${row.open ? `<span class="gbadge on">Open</span>`
              : row.has_passkey ? `<span class="gbadge">Passkey</span>`
              : row.has_vault ? "" : `<span class="gbadge">No key yet</span>`}
          </button></li>`).join("")}
        <li><button class="gtile" data-gnew="1" aria-label="Create a new workspace">
          <span class="gav add">+</span>
          <span class="gname">New workspace</span>
        </button></li>
      </ul>
      ${gateAgentPanel()}`;
  }

  /** The other lock. Deliberately on this screen and nowhere else. */
  function gateAgentPanel() {
    const open = (vault?.unlocked_workspaces || []).length;
    return `
      <div class="gagents">
        ${icon(open ? "unlock" : "lock")}
        <span class="grow">${open
          ? `Agents and scripts can read credentials in <strong>${open}</strong>
             workspace${open === 1 ? "" : "s"}. Locking this window does not stop them.`
          : "Agents and scripts have no credentials right now."}</span>
        ${open ? `<button data-gagents="off" ${gateView.busy ? "disabled" : ""}>Close it</button>` : ""}
      </div>`;
  }

  function gateSignIn() {
    const row = gateView.chosen;
    if (!row) return gateTiles();
    return `
      <section class="gcard">
        <div class="gwho">
          <span class="gav c-${row.colour}">${esc(gateInitial(row.label))}</span>
          <div>
            <h2>Sign in</h2>
            <p class="glede" style="text-align:left;margin:2px 0 0">${esc(row.label)}</p>
          </div>
        </div>
        ${gateView.hint ? `<p class="glede" style="text-align:left;margin:0">${esc(gateView.hint)}</p>` : ""}
        ${agentAskCard(row)}
        ${row.has_device && biometry.available ? `
          <button class="gprimary" data-gdevice="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} Unlock with ${esc(biometry.label)}</button>
          ${row.has_password ? `<div class="gdiv"><span>or</span></div>` : ""}` : ""}
        ${row.has_passkey && passkeysPossible() ? `
          <button class="gprimary" data-gpasskey="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} Unlock with passkey</button>
          ${row.has_password ? `<div class="gdiv"><span>or</span></div>` : ""}` : ""}
        ${row.has_passkey && !row.has_password && !passkeysPossible()
          ? `<p class="gerror">${esc(PASSKEY_ELSEWHERE)}</p>` : ""}
        ${row.has_password ? `
          <form data-gform="password">
            <label>Password
              <input id="g-pw" type="password" autocomplete="current-password" required />
            </label>
            ${(!row.has_device && biometry.available) || (!row.has_passkey && passkeysPossible()) ? `
              <div class="gopt">
                <span class="gopt-text">${biometry.available && !row.has_device
                  ? `Enable ${esc(biometry.label)}` : "Enable passkey"}</span>
                <button type="button" class="gswitch" data-gwant="1"
                  role="switch" aria-checked="${gateView.wantPasskey ? "true" : "false"}"
                  aria-label="Enable passkey"></button>
              </div>` : ""}
            <button class="gsecondary" type="submit" ${gateView.busy ? "disabled" : ""}>
              ${gateView.busy ? "Unlocking…" : "Unlock with password"}</button>
          </form>` : `
          <p class="glede" style="text-align:left;margin:0">This workspace has no key of its
          own yet, so there is nothing to unlock. Give it one from the Vault page.</p>`}
        <p class="gerror">${esc(gateView.error)}</p>
        <div style="display:grid;justify-items:center">
          ${agentAskCard(row)
            ? `<button class="gback" data-gnotnow="1" ${gateView.busy ? "disabled" : ""}>Not now</button>`
            : `<button class="gback" data-gback="1">Choose a different workspace</button>`}
        </div>
      </section>
      ${gateAgentPanel()}`;
  }

  /** Whether a passkey ceremony can even run here.
   *
   *  It needs an authenticator and an origin WebAuthn will accept. A window
   *  served from a custom scheme has neither, and a button that could only
   *  ever fail is worse than no button — so this decides whether the offer is
   *  made at all, and the enrol card says why when the answer is no.
   */
  /** Whether a passkey ceremony can happen here at all.
   *
   *  Not in this window, and not because of anything this code does. Measured
   *  from inside it: `isUserVerifyingPlatformAuthenticatorAvailable()` — the
   *  one question WebAuthn answers honestly, with no prompt and no ceremony —
   *  returns false. It stays false with the window served over
   *  `http://localhost`, and it stays false with the bundle signed by a
   *  Developer ID with a real team identifier. A WKWebView is not a browser
   *  and does not get a platform authenticator.
   *
   *  HivemindOS's desktop app reaches the same conclusion in the same place:
   *  it checks for the native runtime first and returns before it would ever
   *  call WebAuthn, using a Rust command against LocalAuthentication instead.
   *  Its button says "passkey"; what runs is Touch ID.
   *
   *  So the offer is not made here, and the browser is where it is made. That
   *  is a statement about this window, not about the vault: a passkey enrolled
   *  in a browser opens this vault perfectly well.
   */
  function passkeysPossible(where = location) {
    if (typeof window.PublicKeyCredential !== "function") return false;
    if (!navigator.credentials?.create) return false;
    // The desktop shell. Same test HivemindOS uses for the same decision.
    if (window.__TAURI_INTERNALS__ || window.__TAURI__) return false;
    if (where.protocol !== "https:" && where.protocol !== "http:") return false;
    const host = where.hostname || "";
    const isAddress = /^\[?(?:\d{1,3}(?:\.\d{1,3}){3}|[0-9A-Fa-f:]*:[0-9A-Fa-f:]*)\]?$/;
    return Boolean(host) && !isAddress.test(host);
  }

  /** Said only where it changes what somebody can do: a workspace whose only
   *  way in is a passkey, opened from a window that cannot run one. */
  const PASSKEY_ELSEWHERE = "Passkeys are set up and used in a browser — this desktop "
    + "window cannot run the ceremony. A passkey made in HivemindOS or Hivemind Content "
    + "Studio opens this vault too.";

  /** The offer made once a password has just been proved.
   *
   *  Touch ID where the device can do it, a passkey where a browser can. The
   *  passkey branch is unreachable in the desktop window on purpose — see
   *  `passkeysPossible` — so in practice this screen is Touch ID.
   */
  function gateEnrol() {
    const row = gateView.chosen;
    const device = biometry.available && !row?.has_device;
    return `
      <section class="gcard">
        <div class="gwho">
          <span class="gav c-${row?.colour || "amber"}">${esc(gateInitial(row?.label))}</span>
          <div>
            <h2>${device ? `Use ${esc(biometry.label)}` : "Add a passkey"}</h2>
            <p class="glede" style="text-align:left;margin:2px 0 0">${esc(row?.label || "")}</p>
          </div>
        </div>
        ${device ? `
          <p class="glede" style="text-align:left;margin:0">Signed in. Let this device open
          the vault, so next time it is ${esc(biometry.label)} instead of a password. Your
          password still works and is still the thing that can be moved to another
          machine.</p>
          <button class="gprimary" data-gtrust="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} ${gateView.busy ? "Waiting for you…" : `Use ${esc(biometry.label)}`}</button>
          ${aside(`<p>This is a lock on the window, not on the key. Anything already running
            as you can open the vault without being asked \u2014 it stops somebody at your
            keyboard, which is what it is for.</p>`, "What this protects")}
          <button class="gsecondary" data-gskip="1">Not now</button>`
        : passkeysPossible() ? `
          <p class="glede" style="text-align:left;margin:0">Signed in. Add a passkey so next
          time this workspace opens with your fingerprint instead of a password.</p>
          <button class="gprimary" data-genrol="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} ${gateView.busy ? "Waiting for the authenticator…" : "Add a passkey"}</button>
          <button class="gsecondary" data-gskip="1">Not now</button>`
        : `<p class="glede" style="text-align:left;margin:0">${esc(PASSKEY_ELSEWHERE)}</p>
           <button class="gsecondary" data-gskip="1">Continue</button>`}
        <p class="gerror">${esc(gateView.error)}</p>
      </section>`;
  }

  function gateCreate() {
    return `
      <section class="gcard">
        <div class="gwho">
          <span class="gav add">+</span>
          <div>
            <h2>New workspace</h2>
            <p class="glede" style="text-align:left;margin:2px 0 0">Its own library, its own key.</p>
          </div>
        </div>
        <form data-gform="create">
          <label>Workspace name
            <input id="g-name" type="text" autocomplete="off" maxlength="40" required />
          </label>
          <label>Its password
            <input id="g-newpw" type="password" autocomplete="new-password" required />
          </label>
          <button class="gprimary" type="submit" ${gateView.busy ? "disabled" : ""}>
            ${gateView.busy ? "Creating…" : "Create workspace"}</button>
        </form>
        <p class="gerror">${esc(gateView.error)}</p>
        <div style="display:grid;justify-items:center">
          <button class="gback" data-gback="1">Choose a different workspace</button>
        </div>
      </section>`;
  }



  /** One passkey, registered against this workspace, read once for its PRF.
   *
   *  There is no server here to issue a challenge or check an assertion, and
   *  none is needed: what the vault wants is the PRF output, which the same
   *  credential and salt reproduce on every device the passkey syncs to. The
   *  signature proves nothing to a local vault — the secret is the point.
   */
  const PRF_LABEL = "passbook/v2/vault-prf/v1";
  const b64url = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  async function prfSalt(workspace) {
    const material = new TextEncoder().encode(`${PRF_LABEL}:${workspace}`);
    return new Uint8Array(await crypto.subtle.digest("SHA-256", material));
  }

  async function enrolPasskey(workspace, label, password) {
    const salt = await prfSalt(workspace);
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const created = await navigator.credentials.create({
      publicKey: {
        challenge,
        // The relying party has to be named explicitly. Left out, it is
        // inferred from the origin, and a webview does not infer it the way a
        // browser does — the request is rejected before the authenticator is
        // ever asked. `platform` for the same reason: without it the request
        // may be answered by a security key this window has no way to talk to.
        rp: { name: "PassBook", id: location.hostname },
        user: {
          id: new TextEncoder().encode(workspace),
          name: `${workspace} · PassBook`,
          displayName: label || workspace,
        },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          residentKey: "preferred",
          userVerification: "required",
        },
        timeout: 60000,
        attestation: "none",
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    if (!created) throw new Error("No passkey was created.");
    const made = created.getClientExtensionResults?.() || {};
    if (!(made.prf && (made.prf.enabled || made.prf.results))) {
      throw new Error("This authenticator has no PRF support, so it cannot hold a vault key.");
    }
    // One assertion, purely to read the secret out: registration reports only
    // that PRF is available, not what it evaluates to.
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        allowCredentials: [{ type: "public-key", id: created.rawId }],
        userVerification: "required",
        timeout: 60000,
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    const secret = assertion?.getClientExtensionResults?.()?.prf?.results?.first;
    if (!secret) throw new Error("That passkey would not return a secret to wrap the key with.");
    return invoke("vault_add_passkey", {
      workspace, credentialId: created.id, prfSecret: b64url(secret),
      label: label || "This device", rpId: location.hostname || "", password,
    });
  }

  /** Open the vault with a passkey already enrolled for this workspace.
   *
   *  The mirror of `enrolPasskey`: same salt, same PRF, but no registration —
   *  the credential exists, and all this does is make it evaluate the secret
   *  the vault key was wrapped under.
   */
  async function unlockWithPasskey(workspace) {
    const salt = await prfSalt(workspace);
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        userVerification: "required",
        timeout: 60000,
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    if (!assertion) throw new Error("No passkey was offered.");
    const secret = assertion.getClientExtensionResults?.()?.prf?.results?.first;
    if (!secret) throw new Error("That passkey would not return the secret this vault is wrapped under.");
    return invoke("vault_signin_passkey", {
      workspace, credentialId: assertion.id, prfSecret: b64url(secret), duration: "always",
    });
  }

  /** What a failed passkey ceremony actually means.
   *
   *  WebAuthn reports almost every failure as `NotAllowedError`, on purpose:
   *  a page must not be able to tell a cancelled prompt from a refused origin
   *  from a missing credential, or it could probe for them. This window read
   *  that one error as "cancelled", which is the reading that blames the
   *  person for something the platform did without asking them.
   *
   *  The one signal the spec does not hide is the clock. A prompt a human saw
   *  and dismissed takes a second at least. A rejection that arrives in a few
   *  hundred milliseconds never reached anybody.
   */
  const HUMAN_MS = 700;
  function passkeyReason(error, startedAt, doing) {
    const name = error?.name || "";
    const why = String(error?.message ?? error ?? "");
    const elapsed = Date.now() - startedAt;
    if (/invalid domain|relying party|rp id/i.test(why) || name === "SecurityError") {
      return `This window's address has no domain for a passkey to belong to. ${PASSKEY_ELSEWHERE}`;
    }
    if (name === "InvalidStateError") {
      return "There is already a passkey for this workspace on this device.";
    }
    if (name === "NotAllowedError" || name === "AbortError") {
      // Nothing a person did takes a millisecond. A rejection that fast was
      // the platform refusing without ever putting a prompt on screen, and
      // calling that "cancelled" blames somebody for something they never saw.
      return elapsed < HUMAN_MS
        ? `${doing} was refused before anything appeared on screen, so there was `
          + `nothing to cancel. This window is not allowed to run the ceremony. `
          + PASSKEY_ELSEWHERE
        : `${doing} was cancelled.`;
    }
    return why || String(error);
  }

  function wireGate() {
    const fail = (error) => { gateView.error = said(error); gateView.busy = false; paintGate(); };

    gate.querySelectorAll("[data-gpick]").forEach((b) => b.onclick = () => {
      const row = workspaceRows().find((w) => w.id === b.dataset.gpick);
      // Picking a workspace asks for a factor. It used to skip straight past
      // this screen when the workspace was already open, on the reasoning that
      // the vault was unlocked anyway — which made Lock a screen you dismissed
      // by clicking your own name. The vault being open is what lets agents
      // read; it is not evidence about who is at the keyboard, and that is the
      // only thing this screen is asking about.
      gateView = { mode: "signin", chosen: row, error: "", busy: false,
                   hint: row?.open && !row.active
                     ? "Already open for agents. Signing in switches this window to it." : "" };
      paintGate();
      document.getElementById("g-pw")?.focus();
    });

    gate.querySelectorAll("[data-gtrust]").forEach((b) => b.onclick = async () => {
      gateView.busy = true; gateView.error = ""; paintGate();
      try {
        vault = await invoke("vault_trust_device", { password: gateView.password || "" });
        state = await invoke("state");
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) { fail(e); }
    });

    gate.querySelectorAll("[data-gdevice]").forEach((b) => b.onclick = async () => {
      const row = gateView.chosen;
      gateView.busy = true; gateView.error = ""; paintGate();
      try {
        vault = await invoke("vault_signin_device", { workspace: row?.id ?? "" });
        state = row && !row.active
          ? await invoke("set_workspace", { name: row.id })
          : await invoke("state");
        unlockWindow();
        resetRows();
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) { fail(e); }
    });

    gate.querySelectorAll("[data-gpasskey]").forEach((b) => b.onclick = async () => {
      const row = gateView.chosen;
      gateView.busy = true; gateView.error = ""; paintGate();
      const started = Date.now();
      try {
        vault = await unlockWithPasskey(row?.id ?? "");
        state = row && !row.active
          ? await invoke("set_workspace", { name: row.id })
          : await invoke("state");
        unlockWindow();
        resetRows();
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) {
        fail(passkeyReason(e, started, "Unlocking with a passkey"));
      }
    });

    gate.querySelectorAll("[data-gnew]").forEach((b) => b.onclick = () => {
      gateView = { mode: "create", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
      document.getElementById("g-name")?.focus();
    });

    gate.querySelectorAll("[data-gback]").forEach((b) => b.onclick = () => {
      gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
    });

    // The asking agent is not told no; it waits out its own time and says so.
    gate.querySelectorAll("[data-gnotnow]").forEach((b) => b.onclick = () => {
      settleAgentAsk(true);
      gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
      paint();
    });

    gate.querySelectorAll("[data-gagents]").forEach((b) => b.onclick = async () => {
      gateView.busy = true; paintGate();
      try { vault = await invoke("vault_signout", { workspace: "", everything: true }); }
      catch (e) { gateView.error = said(e); }
      finally { gateView.busy = false; paintGate(); }
    });

    gate.querySelectorAll("[data-gskip]").forEach((b) => b.onclick = () => {
      gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
    });
    gate.querySelectorAll("[data-genrol]").forEach((b) => b.onclick = async () => {
      const row = gateView.chosen;
      const password = gateView.password || "";
      gateView.busy = true; gateView.error = ""; paintGate();
      const started = Date.now();
      try {
        vault = await invoke("vault_state");
        await enrolPasskey(row?.id ?? "", "This device", password);
        state = await invoke("state");
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) {
        fail(passkeyReason(e, started, "Adding a passkey"));
      }
    });

    const form = gate.querySelector("[data-gform]");
    if (!form) return;
    form.onsubmit = async (event) => {
      event.preventDefault();
      if (gateView.busy) return;
      // Read the fields BEFORE anything repaints. Setting busy rebuilds this
      // form, which replaces the input with an empty one — so reading after it
      // sent a blank password and the vault refused a password nobody mistyped.
      const typed = {
        password: document.getElementById("g-pw")?.value ?? "",
        name: document.getElementById("g-name")?.value?.trim() ?? "",
        fresh: document.getElementById("g-newpw")?.value ?? "",
      };
      const wanted = gateView.wantPasskey === true;
      gateView.busy = true; gateView.error = ""; paintGate();
      try {
        if (form.dataset.gform === "create") {
          const { name, fresh: password } = typed;
          vault = await invoke("vault_create_workspace", { name, password });
          state = await invoke("state");
          gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        } else {
          const password = typed.password;
          vault = await invoke("vault_signin", {
            profile: "", password, duration: "always",
            workspace: gateView.chosen?.id ?? "",
          });
          if (gateView.chosen && !gateView.chosen.active) {
            state = await invoke("set_workspace", { name: gateView.chosen.id });
          } else {
            state = await invoke("state");
          }
          unlockWindow();
          resetRows();
          // The one moment enrolment can succeed: a proven password, in hand,
          // for a vault that is open. Offering it earlier could only refuse.
          if (wanted && (passkeysPossible() || biometry.available)) {
            gateView = { mode: "enrol", chosen: gateView.chosen, error: "",
                         busy: false, hint: "", password: typed.password };
          } else {
            gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
          }
        }
        paintGate();
        paint();
      } catch (e) {
        fail(e);
      }
    };
    // A form that reappears on every keystroke-free repaint has to be refocused.
    // The switch flips in place. Repainting the card here would take the
    // password field down with it, and a control that clears what you typed is
    // a control nobody touches twice.
    gate.querySelectorAll("[data-gwant]").forEach((b) => b.onclick = () => {
      gateView.wantPasskey = !gateView.wantPasskey;
      b.setAttribute("aria-checked", gateView.wantPasskey ? "true" : "false");
    });
    const field = document.getElementById("g-pw") || document.getElementById("g-name");
    if (field && !gateView.busy) field.focus();
  }

  function paintGate() {
    // Every successful sign-in repaints the gate, so this is where a request
    // whose workspace has just opened is cleared.
    settleAgentAsk();
    const show = gateShouldShow();
    gate.hidden = !show;
    if (!show) return;
    const body = gateView.mode === "signin" ? gateSignIn()
      : gateView.mode === "create" ? gateCreate()
      : gateView.mode === "enrol" ? gateEnrol() : gateTiles();
    gate.innerHTML = `<div class="gwrap">${body}</div>`;
    wireGate();
  }


  // ── Add to PassBook ────────────────────────────────────────────────────────
  //
  //  A page says which keys its SDK reads and opens `passbook://add?key=...`.
  //  The link carries names and never values, so what happens here is: show
  //  who asked and what they asked for, take the values from the person, open
  //  the vault, store the set in one operation.
  //
  //  Nothing on this path can be skipped by the link. There is no parameter
  //  that pre-approves, pre-fills a value, or picks a workspace on the
  //  person's behalf, because a credential prompt that can be steered from
  //  outside is a phishing form with a native title bar.

  let askReq = null;
  let askView = { step: "review", values: {}, workspace: "", picking: false,
                  error: "", busy: false, added: 0, where: "" };

  const askShouldShow = () => Boolean(askReq);

  /** The workspace the keys would land in: whatever was chosen, else active. */
  function askTarget() {
    const rows = workspaceRows();
    const chosen = rows.find((row) => row.id === askView.workspace);
    return chosen || rows.find((row) => row.active) || null;
  }

  function askReview() {
    const target = askTarget();
    const count = askReq.keys.length;
    const sent = askReq.keys.filter((k) => k.has_value).length;
    const site = askReq.origin
      ? `<b>${esc(askReq.app)}</b> at <b>${esc(askReq.origin)}</b>`
      : `<b>${esc(askReq.app)}</b>`;
    // Where the values came from decides what this screen is. If the page sent
    // them, there is nothing to fill in and the only question is whether to
    // keep them. If it sent names only, the person supplies the values.
    const lede = sent === count
      ? `${site} wants to put ${count === 1 ? "this credential" : "these credentials"} in your vault.`
      : sent === 0
        ? `${site} is asking for ${count === 1 ? "this credential" : "these credentials"}. It sent the names only, so the ${count === 1 ? "value is" : "values are"} yours to fill in.`
        : `${site} sent ${sent} of ${count} values. Fill in the rest.`;
    return `
      <div class="acard">
        <div class="ahead">
          <div class="amark">${icon("key")}</div>
          <h1>Add ${count} key${count === 1 ? "" : "s"} to PassBook?</h1>
          <p class="aorigin">${lede}</p>
        </div>
