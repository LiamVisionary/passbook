        ${askReq.note ? `<p class="anote">${esc(askReq.note)}</p>` : ""}
        <div class="akeys">
          ${askReq.keys.map((k, i) => k.has_value ? `
            <div class="asent">
              <span class="aname">${esc(k.name)}</span>
              <span class="apreview" title="Only part of the value is shown">${esc(k.preview)}</span>
            </div>` : `
            <div class="akey">
              <label for="ak-${i}">${esc(k.name)}</label>
              <input id="ak-${i}" data-akey="${esc(k.name)}" type="password"
                     autocomplete="off" spellcheck="false" placeholder="Paste the value"
                     value="${esc(askView.values[k.name] || "")}">
            </div>`).join("")}
        </div>
        ${askReq.refused.length ? `<p class="arefused">${askReq.refused.length}
          ${askReq.refused.length === 1 ? "entry was" : "entries were"} left out:
          ${askReq.refused.map((r) => esc(r)).join(", ")}. A name has to be a plain
          environment variable, and a value has to fit on one line.</p>` : ""}
        <div class="aws">
          <span>Adding to <b>${esc(target?.label || "this device")}</b></span>
          <button class="alink" data-apick="1">${askView.picking ? "Keep this one" : "Use another workspace"}</button>
        </div>
        ${askView.picking ? `<ul class="apick">
          ${workspaceRows().map((row) => `
            <li><button data-aws="${esc(row.id)}"
                        aria-pressed="${row.id === target?.id ? "true" : "false"}">
              ${esc(row.label)}${row.active ? " · current" : ""}
            </button></li>`).join("")}
        </ul>` : ""}
        ${askView.error ? `<p class="aerr">${esc(askView.error)}</p>` : ""}
        <div class="arow">
          <button class="aghost" data-acancel="1">Not now</button>
          <button class="aprimary" data-aadd="1" ${askView.busy ? "disabled" : ""}>
            ${askView.busy ? "Adding…" : `Add ${count === 1 ? "key" : "keys"}`}</button>
        </div>
      </div>`;
  }

  function askUnlock() {
    const target = askTarget();
    return `
      <div class="acard">
        <div class="ahead">
          <div class="amark">${icon("lock")}</div>
          <h1>Open ${esc(target?.label || "the vault")}</h1>
          <p class="aorigin">The keys are ready. Signing in seals them with everything else.</p>
        </div>
        <form class="akeys" id="ak-form">
          <div class="akey">
            <label class="aplain" for="ak-pw">Vault password</label>
            <input id="ak-pw" type="password" autocomplete="current-password" placeholder="Password">
          </div>
        </form>
        ${biometry.available ? `<button class="alink" data-abio="1">Use ${esc(biometry.label || "this device")} instead</button>` : ""}
        ${askView.error ? `<p class="aerr">${esc(askView.error)}</p>` : ""}
        <div class="arow">
          <button class="aghost" data-acancel="1">Cancel</button>
          <button class="aprimary" data-aunlock="1" ${askView.busy ? "disabled" : ""}>
            ${askView.busy ? "Opening…" : "Unlock and add"}</button>
        </div>
      </div>`;
  }

  function askDone() {
    const n = askView.added;
    return `
      <div class="acard">
        <div class="adone">
          <svg class="atick" viewBox="0 0 68 68" aria-hidden="true">
            <circle cx="34" cy="34" r="28"/>
            <path d="M21 35.5 30 44 47 25"/>
          </svg>
          <h1>${n} key${n === 1 ? "" : "s"} added</h1>
          <p class="aorigin">Stored in <b>${esc(askView.where)}</b>. Any app that opts in can read
            ${n === 1 ? "it" : "them"} now, and every read is recorded.</p>
        </div>
        <div class="arow" style="grid-template-columns: 1fr;">
          <button class="aprimary" data-adone="1">Done</button>
        </div>
      </div>`;
  }

  /** The sheet has two tenants: a credential request and a .env import. Both
   *  used to set `ask.hidden` from their own idea of whether they were needed,
   *  so the five second repaint took the import sheet down mid-decision and
   *  dropped the sign-in gate on top of it. One function decides now. */
  function paintSheet() {
    if (webLink.paint()) return;
    if (authorization.paint()) return;
    if (addDevice.paint()) return;
    if (addPerson.paint()) return;
    if (plan.paint()) return;
    if (ghShouldShow()) { paintGithub(); return; }
    if (impShouldShow() || impView.done) { paintImport(); return; }
    paintAsk();
  }

  function paintAsk() {
    const show = askShouldShow();
    ask.hidden = !show;
    if (!show) return;
    const body = askView.step === "done" ? askDone()
      : askView.step === "unlock" ? askUnlock() : askReview();
    ask.innerHTML = `<div class="awrap">${body}</div>`;
    wireAsk();
  }

  /** Close the request without storing anything. */
  async function askClose() {
    askReq = null;
    askView = { step: "review", values: {}, workspace: "", picking: false,
                error: "", busy: false, added: 0, where: "" };
    try { await invoke("dismiss_ask"); } catch { /* nothing pending */ }
    paint();
  }

  /** Read the typed values off the form, so a repaint cannot lose them. */
  function askHarvest() {
    ask.querySelectorAll("[data-akey]").forEach((input) => {
      askView.values[input.dataset.akey] = input.value;
    });
    // "Paste the values first" outliving the paste is the kind of small lie
    // that makes people stop reading the messages.
    if (askView.error && askReq
        && askReq.keys.every((k) => k.has_value || (askView.values[k.name] || "").trim())) {
      askView.error = "";
    }
  }

  /** Store the set, once the vault is open. */
  async function askApply() {
    const target = askTarget();
    // Only what was typed. Anything the page supplied stayed in the app and is
    // read there, so a credential the window never held is not sent back to it.
    const typed = askReq.keys.filter((k) => !k.has_value)
      .map((k) => [k.name, (askView.values[k.name] || "").trim()]);
    askView.busy = true; askView.error = ""; paintAsk();
    try {
      // A different workspace is a real switch, not a hidden one: the window
      // stays where the keys went, so what you see afterwards is where they are.
      if (target && !target.active) {
        state = await invoke("set_workspace", { name: target.id });
      }
      const id = askReq.id;
      const count = askReq.keys.length;
      const where = target?.label || "this device";
      state = await invoke("apply_ask", { id, typed, replace: false });
      askReq = null;
      askView = { step: "done", values: {}, workspace: "", picking: false,
                  error: "", busy: false, added: count, where };
      // `askReq` is gone, so the overlay would vanish; the confirmation is the
      // point of the whole flow, so it is drawn from `askView` alone.
      ask.hidden = false;
      ask.innerHTML = `<div class="awrap">${askDone()}</div>`;
      wireAsk();
      resetRows();
      return;
    } catch (e) {
      askView.error = String(e);
    } finally {
      askView.busy = false;
    }
    paintAsk();
  }

  function wireAsk() {
    ask.querySelectorAll("[data-acancel]").forEach((b) => b.onclick = () => askClose());
    ask.querySelectorAll("[data-adone]").forEach((b) => b.onclick = () => {
      askView.step = "review"; askView.added = 0; ask.hidden = true; paint();
    });
    ask.querySelectorAll("[data-apick]").forEach((b) => b.onclick = () => {
      askHarvest(); askView.picking = !askView.picking; paintAsk();
    });
    ask.querySelectorAll("[data-aws]").forEach((b) => b.onclick = () => {
      askHarvest(); askView.workspace = b.dataset.aws; askView.picking = false; paintAsk();
    });
    ask.querySelectorAll("[data-aadd]").forEach((b) => b.onclick = async () => {
      askHarvest();
      const missing = askReq.keys.filter((k) => !k.has_value && !(askView.values[k.name] || "").trim());
      if (missing.length) {
        askView.error = missing.length === askReq.keys.length
          ? "Paste the values first."
          : `Still empty: ${missing.map((k) => k.name).join(", ")}.`;
        paintAsk();
        return;
      }
      askView.error = "";
      const target = askTarget();
      // Only ask for the password when there is a vault that is shut. A device
      // with nothing sealed yet has nothing to open.
      if (target?.has_vault && !(vault?.unlocked_workspaces || []).includes(target.id)) {
        askView.step = "unlock"; paintAsk();
        document.getElementById("ak-pw")?.focus();
        return;
      }
      await askApply();
    });
    ask.querySelectorAll("[data-aunlock]").forEach((b) => b.onclick = () => askUnlockNow());
    ask.querySelectorAll("[data-abio]").forEach((b) => b.onclick = async () => {
      askView.busy = true; askView.error = ""; paintAsk();
      try {
        vault = await invoke("vault_signin_device", { workspace: askTarget()?.id ?? "" });
        askView.busy = false;
        await askApply();
      } catch (e) {
        askView.error = String(e); askView.busy = false; paintAsk();
      }
    });
    const form = document.getElementById("ak-form");
    if (form) form.onsubmit = (e) => { e.preventDefault(); askUnlockNow(); };
    ask.querySelectorAll("input").forEach((input) => {
      input.oninput = () => {
        if (!askView.error) return;
        askHarvest();
        const stale = ask.querySelector(".aerr");
        if (stale && !askView.error) stale.remove();
      };
      input.onkeydown = (e) => {
        if (e.key === "Enter" && askView.step === "review") { e.preventDefault();
          ask.querySelector("[data-aadd]")?.click(); }
      };
    });
  }

  async function askUnlockNow() {
    const password = document.getElementById("ak-pw")?.value ?? "";
    if (!password) { askView.error = "Enter the vault password."; paintAsk(); return; }
    askView.busy = true; askView.error = ""; paintAsk();
    try {
      vault = await invoke("vault_signin", {
        profile: "", password, duration: "always", workspace: askTarget()?.id ?? "",
      });
      unlockWindow();
      askView.busy = false;
      await askApply();
    } catch (e) {
      askView.error = String(e); askView.busy = false; paintAsk();
      document.getElementById("ak-pw")?.focus();
    }
  }

  /** Ask the backend whether a link is waiting. Called at startup and on the
   *  event, because a link that arrives during a cold start would otherwise
   *  fire before this window existed to hear it. */
  async function loadAsk() {
    if (!invoke) return;
    try {
      const next = await invoke("pending_ask");
      if (!next) return;
      askReq = next;
      askView = { step: "review", values: {}, workspace: next.workspace || "",
                  picking: false, error: "", busy: false, added: 0, where: "" };
      paint();
      ask.querySelector("input")?.focus();
    } catch { /* an older build without the command */ }
  }


  // ── Importing a .env ───────────────────────────────────────────────────────
  //
  //  Drop a project's `.env` on the window and pick what goes in. The list is
  //  names: the file is full of credentials and this window is a thing people
  //  screen-share, so the values stay in the CLI, which reads the file again
  //  when the import actually happens.
  //
  //  A key already in the store is the interesting case. Replacing is the
  //  default because that is usually why somebody is importing a newer file,
  //  and keeping both is one dropdown away, under a name the CLI picks so the
  //  window and the terminal cannot disagree about what it should be.

  let imp = null;   // { file, name, rows: [{key, clashes, suggested}] }
  let impView = { picked: {}, mode: {}, busy: false, error: "", done: "" };

  const impShouldShow = () => Boolean(imp);
  const impChosen = () => (imp?.rows || []).filter((r) => impView.picked[r.key]);

  function impBody() {
    const rows = imp.rows;
    const chosen = impChosen();
    const clashing = chosen.filter((r) => r.clashes);
    return `
      <div class="acard">
        <div class="ahead">
          <div class="amark">${icon("into")}</div>
          <h1>Import ${rows.length} key${rows.length === 1 ? "" : "s"}?</h1>
        </div>
        <div class="ifile">
          <span>From <b>${esc(imp.name)}</b></span>
          <button class="alink" data-ipick="1">Choose a different file</button>
        </div>
        <div class="ibar">
          <button class="alink" data-iall="1">Select all</button>
          <button class="alink" data-inone="1">Deselect all</button>
          <span class="count">${chosen.length} of ${rows.length} selected</span>
        </div>
        <div class="ilist">
          ${rows.map((r, i) => {
            const on = Boolean(impView.picked[r.key]);
            const mode = impView.mode[r.key] || "replace";
            return `
            <div class="irow${on ? "" : " off"}">
              <input type="checkbox" id="i-${i}" data-ikey="${esc(r.key)}" ${on ? "checked" : ""}>
              <label for="i-${i}">${esc(r.key)}</label>
              ${r.clashes ? `
                <span class="iclash">
                  <span class="itag">in store</span>
                  <select data-imode="${esc(r.key)}" ${on ? "" : "disabled"}>
                    <option value="replace"${mode === "replace" ? " selected" : ""}>Replace</option>
                    <option value="new"${mode === "new" ? " selected" : ""}>Add as new</option>
                  </select>
                  ${mode === "new" && on ? `<span class="ias">${esc(r.suggested)}</span>` : ""}
                </span>` : ""}
            </div>`;
          }).join("")}
        </div>
        ${clashing.length ? `<p class="arefused">${clashing.length}
          selected key${clashing.length === 1 ? " is" : "s are"} already in this store.
          Replacing overwrites what is there. Adding as new keeps both.</p>` : ""}
        ${impView.error ? `<p class="aerr">${esc(impView.error)}</p>` : ""}
        <div class="arow">
          <button class="aghost" data-icancel="1">Cancel</button>
          <button class="aprimary" data-igo="1" ${impView.busy || !chosen.length ? "disabled" : ""}>
            ${impView.busy ? "Importing…"
              : !chosen.length ? "Nothing selected"
              : chosen.length === rows.length ? `Import all ${rows.length}`
              : `Import ${chosen.length} key${chosen.length === 1 ? "" : "s"}`}</button>
        </div>
      </div>`;
  }

  function impDone() {
    const n = impView.done;
    return `
      <div class="acard">
        <div class="adone">
          <svg class="atick" viewBox="0 0 68 68" aria-hidden="true">
            <circle cx="34" cy="34" r="28"/>
            <path d="M21 35.5 30 44 47 25"/>
          </svg>
          <h1>${n} key${n === 1 ? "" : "s"} imported</h1>
          <p class="aorigin">Delete the file when you are done with it. A copy in
            the store does not make the copy on your disk any safer.</p>
        </div>
        <div class="arow" style="grid-template-columns: 1fr;">
          <button class="aprimary" data-idone="1">Done</button>
        </div>
      </div>`;
  }

  function paintImport() {
    if (!impShouldShow() && !impView.done) { ask.hidden = true; return; }
    ask.hidden = false;
    ask.innerHTML = `<div class="awrap">${impView.done ? impDone() : impBody()}</div>`;
    wireImport();
  }

  function impClose() {
    imp = null;
    impView = { picked: {}, mode: {}, busy: false, error: "", done: "" };
    ask.hidden = true;
    paint();
  }

  /** Read a file the person chose, and show what is in it. */
  async function openEnv(path) {
    impView = { picked: {}, mode: {}, busy: false, error: "", done: "" };
    try {
      const found = await invoke("inspect_env", { path });
      const rows = found?.keys || [];
      if (!rows.length) {
        notice = `${found?.name || "That file"} has no keys in it.`;
        imp = null; paint(); return;
      }
      imp = { file: found.file, name: found.name, rows };
      // Everything on by default: the common case is wanting the lot, and
      // unticking three is less work than ticking twenty.
      rows.forEach((r) => { impView.picked[r.key] = true; impView.mode[r.key] = "replace"; });
      paintImport();
    } catch (e) {
      imp = null;
      notice = String(e);
      paint();
    }
  }

  async function impRun() {
    const chosen = impChosen();
    if (!chosen.length) return;
    impView.busy = true; impView.error = ""; paintImport();
    try {
      // Two lists, because they are two different questions: what to bring in,
      // and which of those to keep alongside what is already here.
      const only = chosen.map((r) => r.key);
      const renames = chosen
        .filter((r) => r.clashes && impView.mode[r.key] === "new")
        .map((r) => [r.key, r.suggested]);
      const answer = await invoke("import_env", {
        path: imp.file, only, renames,
        // Anything kept alongside is renamed, so it cannot collide. Overwrite
        // therefore only ever lands on a key somebody chose to replace.
        overwrite: chosen.some((r) => r.clashes && impView.mode[r.key] !== "new"),
      });
      if (answer?.state) state = answer.state;
      const count = only.length;
      imp = null;
      impView = { picked: {}, mode: {}, busy: false, error: "", done: count };
      resetRows();
      paintImport();
    } catch (e) {
      impView.error = String(e);
      impView.busy = false;
      paintImport();
    }
  }

  function wireImport() {
    ask.querySelectorAll("[data-ikey]").forEach((box) => box.onchange = () => {
      impView.picked[box.dataset.ikey] = box.checked;
      paintImport();
    });
    ask.querySelectorAll("[data-imode]").forEach((sel) => sel.onchange = () => {
      impView.mode[sel.dataset.imode] = sel.value;
      paintImport();
    });
    ask.querySelectorAll("[data-iall]").forEach((b) => b.onclick = () => {
      imp.rows.forEach((r) => impView.picked[r.key] = true); paintImport();
    });
    ask.querySelectorAll("[data-inone]").forEach((b) => b.onclick = () => {
      imp.rows.forEach((r) => impView.picked[r.key] = false); paintImport();
    });
    ask.querySelectorAll("[data-icancel]").forEach((b) => b.onclick = () => impClose());
    ask.querySelectorAll("[data-idone]").forEach((b) => b.onclick = () => impClose());
    ask.querySelectorAll("[data-igo]").forEach((b) => b.onclick = () => impRun());
    ask.querySelectorAll("[data-ipick]").forEach((b) => b.onclick = () => chooseEnv());
  }

  /** The file picker, for people who would rather not drag anything. */
  async function chooseEnv() {
    const dialog = window.__TAURI__?.dialog;
    if (!dialog?.open) {
      notice = "Drag a .env onto this window to import it.";
      paint();
      return;
    }
    const picked = await dialog.open({
      multiple: false, title: "Choose a .env to import",
      filters: [{ name: "Environment files", extensions: ["env", "txt", ""] }],
    });
    if (picked) await openEnv(typeof picked === "string" ? picked : picked.path);
  }

  // ── Sending keys to GitHub ─────────────────────────────────────────────────
  //
  //  Same sheet as a request or an import: a person is deciding where keys go.
  //  Every step shows names only. The values are read, sealed to GitHub's key
  //  and sent by the CLI (`passbook github push`), one key per process, and
  //  never come into this page. A pasted token goes straight to the CLI's stdin
  //  and the field is cleared.

  let gh = null;
  let ghStatus = null;

  const ghShouldShow = () => Boolean(gh);
  const ghTarget = () => gh.kind === "org"
    ? { org: gh.org, visibility: gh.visibility }
    : (gh.env ? { repo: gh.repo, env: gh.env } : { repo: gh.repo });
  const ghWhere = () => gh.kind === "org"
    ? `organisation <b>${esc(gh.org)}</b> (${gh.visibility === "all" ? "all repositories" : "private repositories"})`
    : `<b>${esc(gh.repo)}</b>${gh.env ? `, environment <b>${esc(gh.env)}</b>` : ""}`;

  /** GitHub's naming rules, the same ones the CLI enforces before sending. */
  function ghNameError(name) {
    const text = String(name || "").trim().toUpperCase();
    if (!text) return "Needs a name";
    if (!/^[A-Z0-9_]+$/.test(text)) return "Letters, digits and _ only";
    if (/^[0-9]/.test(text)) return "Cannot start with a digit";
    if (text.startsWith("GITHUB_")) return "Names starting GITHUB_ are GitHub's";
    return "";
  }
  const ghName = (key) => String(gh.names[key] ?? key).trim().toUpperCase();

  async function ghOpen(keys) {
    gh = { step: "loading", keys: [...keys], kind: "repo", repo: "", env: "", envs: null,
           org: "", visibility: "private", query: "", targets: null, names: {}, checks: {},
           overwrite: {}, busy: false, error: "", results: null, clientId: "", confirmGh: false };
    paintSheet();
    try { ghStatus = await invoke("github_state"); } catch (e) { ghStatus = null; gh.error = String(e); }
    if (ghStatus?.connected && gh.keys.length) { gh.step = "target"; ghLoadTargets(); }
    else if (ghStatus?.connected) { gh = null; paint(); return; }
    else gh.step = "connect";
    paintSheet();
  }

  function ghClose() { gh = null; ask.hidden = true; paint(); }

  async function ghLoadTargets() {
    gh.busy = true; paintSheet();
    try { gh.targets = await invoke("github_targets"); gh.error = ""; }
    catch (e) { gh.error = String(e); }
    finally { gh.busy = false; paintSheet(); }
  }

  async function ghPickRepo(repo) {
    gh.repo = repo; gh.env = ""; gh.envs = null; paintSheet();
    try { gh.envs = (await invoke("github_environments", { repo })).environments || []; }
    catch (e) { gh.envs = []; gh.error = String(e); }
    paintSheet();
  }

  async function ghCheck() {
    const names = gh.keys.map(ghName).filter((n) => !ghNameError(n));
    if (!names.length) return;
    const t = ghTarget();
    try {
      const answer = await invoke("github_check", { repo: t.repo || "", env: t.env || "",
        org: t.org || "", visibility: t.visibility || "", names });
      gh.checks = {};
      (answer.secrets || []).forEach((row) => { gh.checks[row.name] = row; });
      gh.error = "";
    } catch (e) { gh.error = String(e); }
    paintSheet();
  }

  function ghToReview() {
    const names = gh.keys.map(ghName);
    const bad = gh.keys.filter((k) => ghNameError(ghName(k)));
    if (bad.length) { gh.error = `Fix the name for ${bad.join(", ")} first.`; paintSheet(); return; }
    if (new Set(names).size !== names.length) {
      gh.error = "Two keys would land on the same secret name."; paintSheet(); return;
    }
    const unasked = names.filter((n) => gh.checks[n]?.exists && !gh.overwrite[n]);
    if (unasked.length) {
      gh.error = `${unasked.join(", ")} already ${unasked.length === 1 ? "exists" : "exist"} there. `
        + "Tick Replace, or choose another name.";
      paintSheet(); return;
    }
    gh.error = ""; gh.step = "review"; paintSheet();
  }

  async function ghSend() {
    gh.busy = true; gh.error = ""; paintSheet();
    const plan = {
      target: ghTarget(),
      items: gh.keys.map((key) => ({ key, name: ghName(key) })),
      overwrite: gh.keys.map(ghName).filter((n) => gh.overwrite[n]),
    };
    try { gh.results = (await invoke("github_push", { plan })).results || []; gh.step = "done"; }
    catch (e) { gh.error = String(e); }
    finally { gh.busy = false; paintSheet(); }
  }

  async function ghConnect(command, args = {}) {
    gh.busy = true; gh.error = ""; paintSheet();
    try {
      ghStatus = await invoke(command, args);
      const field = ask.querySelector("[data-ghtoken]");
      if (field) field.value = "";
      if (ghStatus?.connected) {
        if (gh.keys.length) { gh.step = "target"; ghLoadTargets(); }
        else { ghClose(); return; }
      }
    } catch (e) { gh.error = String(e); }
    finally { if (gh) { gh.busy = false; paintSheet(); } }
  }

  async function ghDevice() {
    gh.busy = true; gh.error = ""; paintSheet();
    try { await invoke("github_connect_device", { clientId: gh.clientId }); }
    catch (e) { gh.error = String(e); gh.busy = false; paintSheet(); return; }
    const until = Date.now() + 16 * 60 * 1000;
    const tick = async () => {
      if (!gh) return;
      try { ghStatus = await invoke("github_state"); } catch { /* keep waiting */ }
      if (ghStatus?.pending?.error) { gh.error = ghStatus.pending.error; gh.busy = false; paintSheet(); return; }
      if (ghStatus?.connected) { gh.busy = false; gh.keys.length ? (gh.step = "target", ghLoadTargets()) : ghClose(); return; }
      if (Date.now() < until) setTimeout(tick, 2000);
      paintSheet();
    };
    setTimeout(tick, 1500);
  }

  function ghHead(title, lede) {
    return `<div class="ahead"><div class="amark">${icon("out")}</div>
      <h1>${title}</h1>${lede ? `<p class="aorigin">${lede}</p>` : ""}</div>`;
  }

  function ghConnectBody() {
    const code = ghStatus?.pending?.userCode;
    return `<div class="acard">
      ${ghHead("Connect GitHub", "PassBook keeps the GitHub token like your other keys: encrypted, never shown, and only ever sent to GitHub.")}
      ${code ? `<div class="ghcode"><span>Enter this code at <b>${esc(ghStatus.pending.verificationUri || "github.com/login/device")}</b></span>
          <strong>${esc(code)}</strong><span class="aorigin">Waiting for you to approve it…</span></div>` : `
      <div class="ghways">
        <div class="ghway">
          <b>Use your GitHub CLI login</b>
          <span class="aorigin">Copies the token <code>gh</code> is signed in with into PassBook. Only if you say so here.</span>
          <button class="act" data-ghwithgh ${gh.busy ? "disabled" : ""}>Use my gh login</button>
        </div>
        <div class="ghway">
          <b>Paste a token</b>
          <span class="aorigin">A fine-grained token with <i>Secrets: read and write</i> on the repositories you want, or a classic one with <code>repo</code>.</span>
          <div class="akey"><input data-ghtoken type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_… or ghp_…"></div>
          <button class="act" data-ghpaste ${gh.busy ? "disabled" : ""}>Connect with this token</button>
        </div>
        <div class="ghway">
          <b>Sign in on github.com</b>
          <span class="aorigin">Needs your GitHub OAuth app's client id, with device flow on.</span>
          <div class="akey"><input data-ghclient autocomplete="off" spellcheck="false" placeholder="Client id" value="${esc(gh.clientId)}"></div>
          <button class="act" data-ghdevice ${gh.busy ? "disabled" : ""}>Show me a code</button>
        </div>
      </div>`}
      ${gh.error ? `<p class="aerr">${esc(gh.error)}</p>` : ""}
      <div class="arow" style="grid-template-columns: 1fr;"><button class="aghost" data-ghcancel>Cancel</button></div>
    </div>`;
  }

  function ghTargetBody() {
    const t = gh.targets;
    const repos = (t?.repos || []).filter((r) => !gh.query || r.repo.toLowerCase().includes(gh.query.toLowerCase()));
    const orgs = t?.orgs || [];
    const ready = gh.kind === "org" ? Boolean(gh.org) : Boolean(gh.repo);
    return `<div class="acard">
      ${ghHead(`Send ${gh.keys.length} key${gh.keys.length === 1 ? "" : "s"} to GitHub`,
        `Connected as <b>${esc(ghStatus?.account || "")}</b>. Choose where they go.`)}
      <div class="ghtabs">
        <button class="${gh.kind === "repo" ? "on" : ""}" data-ghkind="repo">Repository</button>
        <button class="${gh.kind === "org" ? "on" : ""}" data-ghkind="org" ${orgs.length ? "" : "disabled"}>Organisation</button>
      </div>
      ${!t ? `<p class="aorigin">Reading your repositories…</p>` : gh.kind === "repo" ? `
        <div class="akey"><input data-ghsearch placeholder="Search repositories" value="${esc(gh.query)}" spellcheck="false"></div>
        <ul class="apick ghlist">${repos.slice(0, 60).map((r) => `
          <li><button data-ghrepo="${esc(r.repo)}" aria-pressed="${r.repo === gh.repo}" ${r.admin ? "" : "disabled"}>
            ${esc(r.repo)}${r.private ? "" : " · public"}${r.admin ? "" : " · not admin"}</button></li>`).join("")
          || `<li class="aorigin">No repositories match.</li>`}</ul>
        ${gh.repo ? `<div class="akey"><label class="aplain">Environment</label>
          <select class="ghselect" data-ghenv ${gh.envs ? "" : "disabled"}>
            <option value="">Whole repository</option>
            ${(gh.envs || []).map((e) => `<option value="${esc(e)}"${e === gh.env ? " selected" : ""}>${esc(e)}</option>`).join("")}
          </select></div>` : ""}` : `
        <ul class="apick">${orgs.map((o) => `<li><button data-ghorg="${esc(o)}" aria-pressed="${o === gh.org}">${esc(o)}</button></li>`).join("")}</ul>
        <div class="akey"><label class="aplain">Which repositories may use it</label>
          <select class="ghselect" data-ghvis>
            <option value="private"${gh.visibility === "private" ? " selected" : ""}>Private repositories</option>
            <option value="all"${gh.visibility === "all" ? " selected" : ""}>All repositories</option>
          </select></div>`}
      ${gh.error ? `<p class="aerr">${esc(gh.error)}</p>` : ""}
      <div class="arow">
        <button class="aghost" data-ghcancel>Cancel</button>
        <button class="aprimary" data-ghnext ${ready ? "" : "disabled"}>Next</button>
      </div>
    </div>`;
  }

  function ghNamesBody() {
    return `<div class="acard">
      ${ghHead("Name the secrets", `Going to ${ghWhere()}. Each starts as the key's own name; change any of them.`)}
      <div class="ghrows">${gh.keys.map((key, i) => {
        const name = ghName(key);
        const problem = ghNameError(name);
        const found = gh.checks[name];
        return `<div class="ghrow">
          <span class="ghkey">${esc(key)}</span><span class="gharrow">→</span>
          <input id="gn-${i}" data-ghname="${esc(key)}" value="${esc(gh.names[key] ?? key)}" spellcheck="false" autocomplete="off">
          <span class="ghstate">${problem ? `<span class="ghbad">${esc(problem)}</span>`
            : found?.exists ? `<label class="ghover"><input type="checkbox" data-ghover="${esc(name)}" ${gh.overwrite[name] ? "checked" : ""}>
                Replace the one updated ${esc((found.updatedAt || "").slice(0, 10) || "before")}</label>`
            : found ? `<span class="ghnew">new</span>` : ""}</span>
        </div>`; }).join("")}</div>
      ${gh.error ? `<p class="aerr">${esc(gh.error)}</p>` : ""}
      <div class="arow">
        <button class="aghost" data-ghback="target">Back</button>
        <button class="aprimary" data-ghreview>Review</button>

    </div>`;
  }

  function ghReviewBody() {
    return `<div class="acard">
      ${ghHead(`Send ${gh.keys.length} secret${gh.keys.length === 1 ? "" : "s"}?`, `To ${ghWhere()}.`)}
      <div class="ghrows">${gh.keys.map((key) => {
        const name = ghName(key);

          <span class="ghkey">${esc(name)}</span>

      }).join("")}</div>
      <p class="arefused">Each value is encrypted on this device with ${gh.kind === "org" ? "the organisation's" : gh.env ? "the environment's" : "the repository's"} public key before it leaves.
        PassBook remembers where each one went, so <code>passbook rotate</code> sends the new value to the same secret.</p>
      ${gh.error ? `<p class="aerr">${esc(gh.error)}</p>` : ""}
      <div class="arow">

  /** Drag and drop, through Tauri rather than the DOM.
   *
   *  The DOM would hand the window a File and its contents. Tauri hands it a
   *  path, so the credentials in that file are read by the CLI and never enter
   *  the webview at all.
   */
  function wireDrop() {
    const events = window.__TAURI__?.event;
    if (!events?.listen) return;
    events.listen("tauri://drag-enter", () => { drop.hidden = false;
      drop.innerHTML = `<div class="dropcard">${icon("into", "big")}
        <b>Drop it to import</b><span>Nothing is stored until you choose what to keep.</span></div>`; });
    events.listen("tauri://drag-leave", () => { drop.hidden = true; });
    events.listen("tauri://drag-drop", async (e) => {
      drop.hidden = true;
      const paths = e?.payload?.paths || e?.payload || [];
      const first = Array.isArray(paths) ? paths[0] : null;
      if (first) await openEnv(first);
    });
  }

  /** Is the caret in something a repaint would erase?
   *
   *  Only text entry counts. A button, a tickbox and a dropdown all keep focus
   *  after they are clicked, and none of them hold anything that was typed —
   *  counting those would hold the window still for as long as it sat there.
   */
  const TYPED = new Set(["", "text", "password", "search", "email", "url",
                         "tel", "number"]);
  function typing(el) {
    if (!el || el === document.body) return false;
    if (el.isContentEditable) return true;
    if (el.tagName === "TEXTAREA") return true;
    return el.tagName === "INPUT"
      && TYPED.has((el.getAttribute("type") || "").toLowerCase());
  }

  /** Repaint without emptying the field someone is typing into.
   *
   *  A paint replaces every node, so a field being typed into comes back blank.
   *  That is right after a button was pressed — the add row is meant to clear —
   *  but wrong for the clocks that repaint on their own: a "Copied" tick
   *  reverting, a revealed value expiring, the "Added" button going back to
   *  "Add". Those used to wipe a name half-way through it. The typed text and
   *  the caret come across, and only into a field the repaint left empty, so a
   *  field the window fills in itself still wins.
   */
  function paintKeepingCaret() {
    const el = document.activeElement;
    if (!typing(el) || !el.id) { paint(); return; }
    const { id, value } = el;
    let at = value.length, to = value.length;
    try { at = el.selectionStart ?? at; to = el.selectionEnd ?? to; } catch { /* refused */ }
    paint();
    const again = document.getElementById(id);
    if (!again || again.value) return;
    again.value = value;
    again.focus();
    try { again.setSelectionRange(at, to); } catch { /* refused */ }
  }

  /** Repaint while someone is in a search box: same text, same caret, same focus.
   *  The box's text comes from `query`, so it survives the paint; the focus and the
   *  caret do not, and a box that loses focus mid-word is its own kind of broken. */
  function paintKeepingSearch(el) {
    const id = el.id;
    let at = el.value.length, to = el.value.length;
    try { at = el.selectionStart ?? at; to = el.selectionEnd ?? to; } catch { /* refused */ }
    paint();
    const again = id && document.getElementById(id);
    if (!again) return;
    again.focus();
    try { again.setSelectionRange(at, to); } catch { /* refused */ }
  }

  /** What is typed into the fields marked `data-keep`, and where the caret was, so a repaint can put it
   *  back.
   *
   *  A paint replaces every node. The callers that repaint on a clock learned to carry the focused
   *  field across (`paintKeepingCaret`), but any other repaint still emptied whatever was being typed:
   *  pressing Add repainted to gray the button, and the name and the value went with it. A field that
   *  asks to be kept is kept by every paint. `data-keep="focus"` keeps only the focus and the caret, for
   *  a field whose text the page already supplies (the search box). Whatever wants one of these fields
   *  empty empties it before it paints.
   */
  function heldTyping() {
    const kept = [];
    main.querySelectorAll("input[data-keep][id]").forEach((el) => {
      const focused = el === document.activeElement;
      if (!el.value && !focused) return;
      let at = null, to = null;
      try { at = el.selectionStart; to = el.selectionEnd; } catch { /* refused */ }
      kept.push({ id: el.id, value: el.value, focused, at, to });
    });
    return kept;
  }

  function restoreTyping(kept) {
    for (const was of kept) {
      const el = document.getElementById(was.id);
      if (!el || !el.matches("input[data-keep]")) continue;
      if (el.dataset.keep !== "focus" && !el.value && was.value) el.value = was.value;
      if (!was.focused || el.disabled) continue;
      el.focus({ preventScroll: true });
      try { el.setSelectionRange(was.at ?? el.value.length, was.to ?? el.value.length); } catch { /* refused */ }
    }
  }

  // ── a press that is in progress ────────────────────────────────────────
  //
  // A click is a mouse going down and coming up on the same element, and a paint replaces every
  // element. So a paint that lands between the two takes the button away from under the pointer, and
  // the click never happens: no error, nothing on screen, a press that did nothing. The page repaints
  // for its own reasons (the five-second refresh when anything has changed, a "Copied" tick reverting,
  // a status arriving); how often one lands inside a press was not measured. Reproduced in WebKit and
  // in Chrome: copy one
  // value, then press another row's chevron as the tick reverts, and the row stays shut.
  //
  // While a press is in progress a paint waits for it to end. Only a press on something there is to
  // press: the mouse going down on a scrollbar, or on the page itself to drag the window, is not always
  // followed by word of it coming back up, and a list being scrolled has to keep building its rows. A
  // dropdown is left out for the same reason: its menu belongs to the system.
  const PRESSABLE = "button, a, summary, label, [role=button], [role=option], [data-open], [data-picture], input[type=checkbox], input[type=radio]";
  let pressHeld = false, paintOwed = false, pressTimer = 0;
  function pressOver() {
    clearTimeout(pressTimer);
    if (!pressHeld) return;
    pressHeld = false;
    // After the click this release is part of, which usually paints anyway.
    setTimeout(() => { if (paintOwed) paint(); }, 0);
  }
  document.addEventListener("mousedown", (event) => {
    if (event.button !== 0 || event.target?.closest?.("select") || !event.target?.closest?.(PRESSABLE)) return;
    pressHeld = true;
    clearTimeout(pressTimer);
    // A mouse let go somewhere this window never hears about does not hold the page still for good.
    pressTimer = setTimeout(pressOver, 3000);
  }, true);
  for (const over of ["mouseup", "click", "change", "dragstart", "contextmenu", "keydown"]) document.addEventListener(over, pressOver, true);
  window.addEventListener("blur", pressOver);

  function paint() {
    if (!state) return;
    if (pressHeld) { paintOwed = true; return; }
    paintOwed = false;
    if (asking && asking.page !== page) asking = null;
    const typed = heldTyping();
    paintNav();
    const body = { keys: keysPage, vault: vaultPage, signins: signinsPage,
                   access: accessPage, apps: appsPage, settings: settingsPage,
                   machines: machinesPage, switch: switchPage,
                   broker: brokerPage, record: recordPage, balances: balancesPage,
                   updates: updatesPage, attention: attentionPage }[page]();
    main.innerHTML = lockBanner() + body + noticeBar();
    paintGate();
    paintSheet();
    dressPage();
    restoreTyping(typed);
    const pinned = main.querySelector(".keyshead");
    main.style.scrollPaddingTop = pinned ? `${pinned.offsetHeight + 8}px` : "";

    main.querySelectorAll("[data-goto]").forEach((b) => b.onclick = () => {
      page = b.dataset.goto; notice = ""; paint();
      if (page === "updates" && Date.now() - updatesView.checked > 60000) loadUpdates();
    });
    main.querySelectorAll("[data-key-filter]").forEach((b) => b.onclick = () => {
      keyFilter = b.dataset.keyFilter; resetRows();
      if (keyCursor && !shownKeys().includes(keyCursor)) keyCursor = query.trim() ? (shownKeys()[0] || "") : "";
      paint();
    });
    main.querySelectorAll("[data-key-sort]").forEach((b) => b.onchange = () => { keySort = b.value; resetRows(); paint(); });
    main.querySelectorAll("[data-sync-check]").forEach((b) => b.onclick = () => loadSync());
    main.querySelectorAll("[data-sync-now]").forEach((b) => b.onclick = () => syncNow());
    main.querySelectorAll("[data-sync-open]").forEach((b) => b.onclick = () => {
      syncView.open = syncView.open === b.dataset.syncOpen ? "" : b.dataset.syncOpen; paint();
    });
    main.querySelectorAll("[data-rotate-open]").forEach((b) => b.onclick = () => openRotate(b.dataset.rotateOpen));
    main.querySelectorAll("[data-account-edit]").forEach((b) => b.onclick = () => {
      const k = b.dataset.accountEdit, e = state.catalog?.accounts?.entries?.[k] || {};
      accountEdit = { key: k, busy: "", error: "", said: "",
        draft: { email: e.email || "", via: e.via || "", account: e.account || "", note: e.note || "" } };
      paint();
    });
    main.querySelectorAll("[data-account-field]").forEach((el) => el.oninput = el.onchange = () => {
      if (accountEdit.draft) accountEdit.draft[el.dataset.accountField] = el.value;
    });
    main.querySelectorAll("[data-account-cancel]").forEach((b) => b.onclick = () => {
      accountEdit = { key: "", draft: null, busy: "", error: "", said: "" }; paint();
    });
    main.querySelectorAll("[data-account-save]").forEach((b) => b.onclick = () => {
      const d = accountEdit.draft || {};
      accountStep(b.dataset.accountSave, "account_set", { key: b.dataset.accountSave, email: d.email || "",
        via: d.via || "", account: d.account || "", note: d.note || "" }, "save");
    });
    main.querySelectorAll("[data-account-lookup]").forEach((b) => b.onclick = () =>
      accountStep(b.dataset.accountLookup, "account_lookup", { key: b.dataset.accountLookup }, "lookup"));
    main.querySelectorAll("[data-rotate-go]").forEach((b) => b.onclick = () => openRotate(b.dataset.rotateGo, true));
    main.querySelectorAll("[data-rotate-start]").forEach((b) => b.onclick = () => {
      const value = String(document.getElementById("rotvalue")?.value || "").trim();
      if (!value) { rotateView.error = "Paste the new value first."; paint(); return; }
      rotateStep("start", "rotate_start", { key: b.dataset.rotateStart, value });
    });
    main.querySelectorAll("[data-rotate-verify]").forEach((b) => b.onclick = () => rotateStep("verify", "rotate_verify", { provider: b.dataset.rotateVerify }));
    main.querySelectorAll("[data-rotate-finish]").forEach((b) => b.onclick = async () => {
      await rotateStep(b.dataset.rotateFinish, "rotate_finish", { key: b.dataset.key, action: b.dataset.rotateFinish });
      if (!rotateView.error && !rotateView.data?.pending) { rotateView = { key: "", data: null, busy: "", error: "", check: null }; paint(); }
    });
    main.querySelectorAll("[data-appearance]").forEach((b) => b.onclick = async () => {
      applyAppearance(b.dataset.appearance); paint();
      try { await invoke("set_appearance", { choice: appearance }); }
      catch (e) { notice = String(e); paint(); }
    });
    main.querySelectorAll("[data-update-check]").forEach((b) => b.onclick = () => loadUpdates());
    main.querySelectorAll("[data-update-install]").forEach((b) => b.onclick = () =>
      installUpdate(b.dataset.updateInstall === "app"));
    main.querySelectorAll("[data-service-restart]").forEach((b) => b.onclick = async () => {
      updatesView.working = "service"; updatesView.error = ""; paint();
      try { state = await invoke("broker", { action: "restart" }); await refreshVault(); }
      catch (e) { updatesView.error = balanceError(e); }
      finally { updatesView.working = ""; await loadUpdates(); }
    });
    // Lock = put this window away. Agent access is a separate decision, made
    // on the screen this drops you on.
    main.querySelectorAll("[data-signout]").forEach((b) => b.onclick = () => lockWindow());
    main.querySelectorAll("[data-reads]").forEach((b) => b.onclick = async () => {
      // Sealing is reversible and changes nothing about what is stored, so it
      // does not ask twice. Un-sealing is the direction worth a beat: it hands
      // values back to every caller on the machine.
      const wanted = b.dataset.reads;
      if (wanted === "open") askFirst("reads-open"); else setReads(wanted);
    });
    main.querySelectorAll("[data-stayopen]").forEach((b) => b.onclick = async () => {
      const wanted = b.dataset.stayopen;
      // Off asks nothing: taking a capability away is never the dangerous
      // direction, and demanding a password to become SAFER is how a setting
      // ends up left on.
      //
      // On asks for the password AND confirms, because it is the last moment
      // anybody is asked: afterwards this machine opens the vault without one.
      let password = "";
      if (wanted === "on") {
        password = document.getElementById("so-pw")?.value || "";
        if (!password) {
          notice = "Type the vault password first. It is needed once, to wrap the key for the keystore.";
          paint();
          document.getElementById("so-pw")?.focus();
          return;
        }
        askFirst("stayopen-on");
        return;
      }
      setStayOpen(false);
    });
    main.querySelectorAll("[data-askno]").forEach((b) => b.onclick = () => { asking = null; paint(); });
    main.querySelectorAll("[data-askyes]").forEach((b) => b.onclick = () => {
      const id = b.dataset.askyes;
      asking = null;
      if (id === "reads-open") setReads("open");
      else if (id === "stayopen-on") setStayOpen(true);
      else if (id === "ghdisconnect") disconnectGithub();
      else if (id.startsWith("oaforget:")) callSignin("oauth_disconnect", { id: id.slice("oaforget:".length) });
    });
    main.querySelectorAll("[data-verify]").forEach((b) => b.onclick = () => checkChain());
    main.querySelectorAll("[data-balances-on]").forEach((b) => b.onclick = async () => {
      balancesView.busy = true; paint();
      try { balancesView.data = await invoke("balances_enable", { on: true }); balancesView.error = ""; }
      catch (e) { balancesView.error = balanceError(e); }
      finally { balancesView.busy = false; paint(); }
    });
    main.querySelectorAll("[data-balances-off]").forEach((b) => b.onclick = async () => {
      balancesView.busy = true; paint();
      try { balancesView.data = await invoke("balances_enable", { on: false }); balancesView.error = ""; }
      catch (e) { balancesView.error = balanceError(e); }
      finally { balancesView.busy = false; paint(); }
    });
    main.querySelectorAll("[data-balances-refresh]").forEach((b) => b.onclick = () => loadBalances(true));
    // Alerts. Every step answers with the settings as they now stand, so the panel shows what was kept.
    const alertStep = async (busyAs, action, args = {}, after = null) => {
      balancesView.alertBusy = busyAs; balancesView.alertNote = ""; paint();
      try {
        const answer = await invoke("balances_alerts", { action, ...args });
        if (after) after(answer); else balancesView.alertCfg = answer;
      } catch (e) { balancesView.alertNote = balanceError(e); }
      finally { balancesView.alertBusy = ""; paint(); }
    };
    main.querySelectorAll("[data-al-toggle]").forEach((b) => b.onclick = () => {
      balancesView.alertsShown = !balancesView.alertsShown; balancesView.alertNote = ""; paint();
    });
    main.querySelectorAll("[data-al-open]").forEach((b) => b.onclick = () => { balancesView.alerting = true; alertStep("open", "status"); });
    main.querySelectorAll("[data-al-close]").forEach((b) => b.onclick = () => { balancesView.alerting = false; balancesView.alertNote = ""; paint(); });
    main.querySelectorAll("[data-al-paste]").forEach((b) => b.onclick = () => { balancesView.pasting = !!b.dataset.alPaste; paint(); });
    main.querySelectorAll("[data-al-key]").forEach((b) => b.onchange = () => { if (b.value) alertStep("key", "set", { key: b.value }); });
    main.querySelectorAll("[data-al-token]").forEach((b) => b.onclick = async () => {
      const field = document.getElementById("albot"), value = String(field?.value || "").trim();
      if (!/^\d{5,}:[\w-]{20,}$/.test(value)) { balancesView.alertNote = "That does not look like a bot token. It is numbers, a colon, then letters, from @BotFather."; paint(); return; }
      balancesView.alertBusy = "token"; balancesView.alertNote = ""; paint();
      try {
        state = await invoke("add_key", { name: "PASSBOOK_TELEGRAM_BOT_TOKEN", value, replace: true });
        balancesView.alertCfg = await invoke("balances_alerts", { action: "set", key: "PASSBOOK_TELEGRAM_BOT_TOKEN" });
        balancesView.pasting = false;
      } catch (e) { balancesView.alertNote = balanceError(e); }
      finally { balancesView.alertBusy = ""; paint(); }
    });
    main.querySelectorAll("[data-al-find]").forEach((b) => b.onclick = () =>
      alertStep("find", "chats", {}, (answer) => { balancesView.alertChats = answer?.chats || []; }));
    main.querySelectorAll("[data-al-chat]").forEach((b) => b.onclick = () => alertStep("chat", "set", { chat: b.dataset.alChat }));
    main.querySelectorAll("[data-al-chatsave]").forEach((b) => b.onclick = () => {
      const typed = String(document.getElementById("alchat")?.value || "").trim();
      if (!/^(-?\d+|@\w{5,32})$/.test(typed)) { balancesView.alertNote = "A chat is a number, or a public channel's @name."; paint(); return; }
      alertStep("chat", "set", { chat: typed });
    });
    main.querySelectorAll("[data-al-on]").forEach((b) => b.onclick = () => alertStep("on", "on", {}, (answer) => {
      balancesView.alertCfg = answer; balancesView.alerting = false;
      balancesView.alertNote = "Alerts are on. The test message is in your chat.";
    }));
    main.querySelectorAll("[data-al-off]").forEach((b) => b.onclick = () => alertStep("off", "off"));
    main.querySelectorAll("[data-al-test]").forEach((b) => b.onclick = () => alertStep("test", "test", {}, () => {
      balancesView.alertNote = "Sent. Check your chat.";
    }));

    const saveAudience = async (key, mode, agents) => {

      const rule = state.catalog?.audiences?.[key];
      const held = audienceFor === key && audienceDraft
        ? audienceDraft.agents : [...(rule?.agents || [])];
      // Between `include` and `exclude` the same names mean opposite things —
      // the app that was the only one allowed becomes one of the blocked. So a
      // flip starts empty rather than carrying a selection across a change of
      // meaning that nobody asked for.
      const carried = (rule?.mode || "all") === next ? held : [];
      if (carried.length) { saveAudience(key, next, carried); return; }
      audienceFor = key; audienceDraft = { mode: next, agents: [] };
      projectsFor = null; projectsDraft = null;

      // An empty rule is not a rule, so it is never written. The choice stays
      // on screen unsaved rather than quietly becoming "every app".
      if (!agents.length) {
        audienceFor = key; audienceDraft = { mode: draft.mode, agents }; paint(); return;
