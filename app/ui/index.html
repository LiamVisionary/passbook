      : intact ? "Nothing in this record has been altered."
      : "This record has not been verified yet.";
    // Tamper-evidence belongs at the top only when it has something to say.
    // A green "Intact" badge above every visit is a badge nobody reads; the
    // one time this matters it should be the first thing on the page.
    const check = `<div class="group${broken ? "" : " quiet"}">
        <div class="row">
          <span class="statustile ${tone} sm">${icon(broken ? "alert" : "shield")}</span>
          <div class="grow">${broken ? `<strong>${esc(detail)}</strong>` : esc(detail)}</div>
          <span class="tag ${broken ? "off" : intact ? "on" : ""}">${word}</span>
          <button class="act" data-verify="1" ${chain.busy ? "disabled" : ""}>
            ${intact === null ? "Verify" : "Verify again"}</button>
        </div>
      </div>`;
    return `
      <h2>Activity</h2>
      <p class="lede">What has been read on this device, and by what. Names and times \u2014
      never a value.</p>
      ${broken ? check : ""}
      <div class="group">
        ${foldRuns(rows).map(({ row, times, oldest }) => {
          const names = row.keys || [];
          const total = row.keyCount || names.length;
          const ok = row.granted !== false;
          const said = OP_WORD[row.op];
          // The actor and the verb read first. This used to lead with twelve
          // monospace key names wrapped over three lines, under which the app
          // that did it — the one thing you scan this page for — was the
          // smallest grey text on the row.
          const verb = said ? (ok ? said.did : said.didnt) : (row.op || "used");
          // A row is only alarming when the operation itself is. A read that
          // comes back false is a name the store did not have, not a refusal.
          const wrong = !ok && !said?.partial;
          const what = said?.bare ? ""
            : total === 1 && names.length ? `<span class="mono">${esc(names[0])}</span>`
            : total === 1 ? "1 key"
            : total ? `${total} keys` : "";
          const aside = !ok && said?.partial ? said.partial : "";
          return `
          <div class="row">
            <span class="statustile ${wrong ? "warn" : "plain"} sm"
              title="${esc(row.op || "")}">${icon(OP_ICON[row.op] || "doc")}</span>
            <div class="grow">
              <div><strong>${esc(row.app || "unknown")}</strong> ${esc(verb)} ${what}${
                times > 1 ? ` <span class="sub">\u00d7${times}</span>` : ""}</div>
              ${aside ? `<div class="sub">${esc(aside)}</div>`
                : total > 1 && total <= 4 ? `<div class="sub mono">${esc(names.join(", "))}</div>` : ""}
            </div>
            <span class="tag"${times > 1 ? ` title="${times} times, ${
              esc(ago(oldest))} to ${esc(ago(row.at))}"` : ""
              }>${esc(ago(row.at) || "")}</span>
          </div>`; }).join("") || `<div class="empty">Nothing recorded yet.</div>`}
      </div>
      ${broken ? "" : check}`;
  }

  /** The last thing that happened, said once, in the colour it deserves. */
  function noticeBar() {
    if (!notice) return "";
    const good = /\bcopied\.$/.test(notice);
    return `<div class="noticebar ${good ? "good" : ""}">${icon(good ? "check" : "alert")}
      <span class="grow">${esc(notice)}</span>
      <button data-noticeclear="1" title="Dismiss" aria-label="Dismiss">${icon("cross", "tinyicon")}</button>
      </div>`;
  }

  const PAGE_ICON = Object.fromEntries([...PAGES, ...SETTINGS]
    .map(([id, , glyph]) => [id, glyph]));
  PAGE_ICON.settings = "sliders";
  // Reached from the source list's foot rather than from the list itself: it is
  // where you go to leave or to come back, not a section you browse.
  PAGE_ICON.switch = "building";

  /** Give the page its heading tile and every empty state a glyph.
   *
   *  Done to the rendered DOM rather than in each page function: there are
   *  fourteen headings across eight pages once the loading and not-installed
   *  variants are counted, and a rule applied in one place cannot be the one
   *  somebody forgets.
   */
  function dressPage() {
    const h2 = main.querySelector("h2");
    if (h2 && !h2.closest(".pagehead")) {
      const lede = h2.nextElementSibling?.classList.contains("lede") ? h2.nextElementSibling : null;
      const wrap = document.createElement("div");
      wrap.className = "pagehead";
      const tile = document.createElement("span");
      tile.className = "pagetile";
      tile.innerHTML = icon(PAGE_ICON[page] || "key", "pageicon");
      const text = document.createElement("div");
      text.className = "pagetext";
      h2.parentNode.insertBefore(wrap, h2);
      wrap.append(tile, text);
      text.append(h2);
      if (lede) text.append(lede);
    }
    main.querySelectorAll(".empty").forEach((box) => {
      if (box.querySelector("svg")) return;
      box.insertAdjacentHTML("afterbegin", icon("inbox", "emptyicon"));
    });
  }


  /** Who's working? — the gate.
   *
   *  Locking used to mean one thing, and it meant the wrong one: pressing Lock
   *  signed the broker out, so putting the app away at the end of the day also
   *  stopped every agent reading credentials overnight. What people do about
   *  that is stop locking anything, which is worse than the risk it was
   *  guarding against.
   *
   *  So there are two decisions and two controls. Locking is about who is at
   *  the keyboard: it closes this window and nothing else. Agent access is
   *  about what runs while nobody is, and it lives on this screen — the moment
   *  somebody is already thinking about what they leave open.
   */
  const GATE_COLOURS = ["amber", "violet", "teal", "rose", "sky", "lime"];

  /** Whether the window is locked, and why that has to outlive the window.
   *
   *  Lock deliberately does not sign the broker out — agents read credentials
   *  at four in the morning and a window closing must not stop them. The cost
   *  of that is that "is the vault open" can no longer answer "may this person
   *  see it", so the window has to remember being locked on its own. Held only
   *  in a variable, it forgot the moment you quit: press Lock, quit, reopen,
   *  and the vault was still open so the gate never appeared.
   *
   *  This stops a person at the keyboard, which is what Lock is for. It does
   *  not stop code running as you, and nothing here could — that code can read
   *  the store directly. Do not let the padlock imply otherwise.
   */
  const LOCK_KEY = "passbook.window-locked";
  // Storage is scoped to the origin, and the origin carries the port. The app
  // asks for a fixed one so this survives a restart; if every candidate was
  // taken it says so here rather than losing the lock without a word.
  const lockIsRemembered = new URLSearchParams(location.search).get("steady") !== "0";
  const lockedOnDisk = () => {
    try { return localStorage.getItem(LOCK_KEY) === "1"; } catch { return false; }
  };
  const rememberLock = (on) => {
    try { if (on) localStorage.setItem(LOCK_KEY, "1"); else localStorage.removeItem(LOCK_KEY); }
    catch { /* a window with no storage still locks for as long as it lives */ }
  };
  let appLocked = lockedOnDisk();
  // What this device can verify, and what to call it. Asked once, before
  // anything is drawn, so no control is offered that cannot work.
  let biometry = { available: false, kind: "", label: "" };

  /** The active workspace, and whether anything could prove you are you. */
  const activeRow = () => (state?.catalog?.workspace_rows || []).find((row) => row.active);
  const canProveIdentity = (row) => Boolean(row && (row.has_password || row.has_passkey));

  function lockWindow() {
    // A workspace with no password and no passkey has nothing to check on the
    // way back in, so locking it would put up a screen with no way past it.
    if (!canProveIdentity(activeRow())) {
      notice = "This workspace has no password yet, so the window cannot be locked. "
             + "Give it one in Settings › Security.";
      paint();
      return;
    }
    appLocked = true;
    rememberLock(true);
    if (!lockIsRemembered) {
      notice = "Locked. This window could not claim its usual port, so quitting the app "
             + "will clear the lock until it can.";
    }
    // Every revealed value goes, and the app is told to overwrite each one
    // rather than waiting out its hold. A lock that leaves a readable value
    // behind it is a mistake this window has already made once, in the other
    // direction: the sidebar said "Vault locked" while the eye beside every key
    // still worked.
    Object.keys(revealed).forEach(hideValue);
    revealed = {}; history = {}; picked = {}; expanded = {}; replacing = {};
    gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
    paintGate();
  }

  /** Only ever called where a factor has just been checked. */
  function unlockWindow() {
    appLocked = false;
    rememberLock(false);
  }
  let gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };

  /** A colour per workspace: stable for a given name, distinct within a screen.
   *
   *  A plain hash gave two of three workspaces the same violet, which does not
   *  read as coincidence — it reads as a colour that was never assigned. So the
   *  hash picks where to start and the first free colour from there is taken,
   *  which keeps a workspace's colour steady as others come and go while no two
   *  on screen collide until there are more workspaces than colours.
   */
  function gateColours(names) {
    const taken = new Set();
    const out = {};
    for (const name of names) {
      let sum = 0;
      for (const character of String(name || "")) sum = (sum * 31 + character.charCodeAt(0)) >>> 0;
      const start = sum % GATE_COLOURS.length;
      let chosen = GATE_COLOURS[start];
      for (let step = 0; step < GATE_COLOURS.length; step++) {
        const candidate = GATE_COLOURS[(start + step) % GATE_COLOURS.length];
        if (!taken.has(candidate)) { chosen = candidate; break; }
      }
      taken.add(chosen);
      out[name] = chosen;
    }
    return out;
  }
  const gateInitial = (name) => (String(name || "?").trim()[0] || "?").toUpperCase();

  function workspaceRows() {
    const rows = state?.catalog?.workspace_rows || [];
    const palette = gateColours(rows.map((row) => row.id));
    return rows.map((row) => ({
      ...row, colour: palette[row.id],
      open: (vault?.unlocked_workspaces || []).includes(row.id),
    }));
  }

  /** Whether the window should be showing the gate rather than the store.
   *
   *  Two ways in: somebody pressed Lock, or the active workspace has a key and
   *  nothing has opened it. A workspace with no key of its own has nothing to
   *  ask for, so asking would be theatre.
   */
  function gateShouldShow() {
    // A request on screen carries its own unlock step, and the sign-in
    // sheet underneath it would mean approving something unread.
    if (askShouldShow() || impShouldShow() || impView.done) return false;
    // The passkey offer comes AFTER a successful sign-in, which is the one
    // moment it can succeed — and the same moment the gate would otherwise
    // decide it is no longer needed and take the offer down with it.
    if (gateView.mode === "enrol") return true;
    if (appLocked) return true;
    const here = (state?.catalog?.workspace_rows || []).find((row) => row.active);
    return Boolean(here?.has_vault) && !vault?.unlocked;
  }

  function gateTiles() {
    const rows = workspaceRows();
    return `
      <div class="ghead">
        <div class="gmark">${icon("key")}</div>
        <p class="geyebrow">PassBook</p>
        <h1>Who's working?</h1>
        <p class="glede">${rows.length
          ? "Each workspace is its own set of credentials, with its own key."
          : "No workspaces on this device yet."}</p>
      </div>
      <ul class="gtiles">
        ${rows.map((row) => `
          <li><button class="gtile" data-gpick="${esc(row.id)}" aria-label="Open ${esc(row.label)}">
            <span class="gav c-${row.colour}">${esc(gateInitial(row.label))}</span>
            <span class="gname">${esc(row.label)}</span>
            ${row.open ? `<span class="gbadge on">Open</span>`
              : row.has_passkey ? `<span class="gbadge">Passkey</span>`
              : row.has_vault ? "" : `<span class="gbadge">No key yet</span>`}
          </button></li>`).join("")}
        <li><button class="gtile" data-gnew="1" aria-label="Create a new workspace">
          <span class="gav add">+</span>
          <span class="gname">New workspace</span>
        </button></li>
      </ul>
      ${gateAgentPanel()}`;
  }

  /** The other lock. Deliberately on this screen and nowhere else. */
  function gateAgentPanel() {
    const open = (vault?.unlocked_workspaces || []).length;
    return `
      <div class="gagents">
        ${icon(open ? "unlock" : "lock")}
        <span class="grow">${open
          ? `Agents and scripts can read credentials in <strong>${open}</strong>
             workspace${open === 1 ? "" : "s"}. Locking this window does not stop them.`
          : "Agents and scripts have no credentials right now."}</span>
        ${open ? `<button data-gagents="off" ${gateView.busy ? "disabled" : ""}>Close it</button>` : ""}
      </div>`;
  }

  function gateSignIn() {
    const row = gateView.chosen;
    if (!row) return gateTiles();
    return `
      <section class="gcard">
        <div class="gwho">
          <span class="gav c-${row.colour}">${esc(gateInitial(row.label))}</span>
          <div>
            <h2>Sign in</h2>
            <p class="glede" style="text-align:left;margin:2px 0 0">${esc(row.label)}</p>
          </div>
        </div>
        ${gateView.hint ? `<p class="glede" style="text-align:left;margin:0">${esc(gateView.hint)}</p>` : ""}
        ${row.has_device && biometry.available ? `
          <button class="gprimary" data-gdevice="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} Unlock with ${esc(biometry.label)}</button>
          ${row.has_password ? `<div class="gdiv"><span>or</span></div>` : ""}` : ""}
        ${row.has_passkey && passkeysPossible() ? `
          <button class="gprimary" data-gpasskey="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} Unlock with passkey</button>
          ${row.has_password ? `<div class="gdiv"><span>or</span></div>` : ""}` : ""}
        ${row.has_passkey && !row.has_password && !passkeysPossible()
          ? `<p class="gerror">${esc(PASSKEY_ELSEWHERE)}</p>` : ""}
        ${row.has_password ? `
          <form data-gform="password">
            <label>Password
              <input id="g-pw" type="password" autocomplete="current-password" required />
            </label>
            ${(!row.has_device && biometry.available) || (!row.has_passkey && passkeysPossible()) ? `
              <div class="gopt">
                <span class="gopt-text">${biometry.available && !row.has_device
                  ? `Enable ${esc(biometry.label)}` : "Enable passkey"}</span>
                <button type="button" class="gswitch" data-gwant="1"
                  role="switch" aria-checked="${gateView.wantPasskey ? "true" : "false"}"
                  aria-label="Enable passkey"></button>
              </div>` : ""}
            <button class="gsecondary" type="submit" ${gateView.busy ? "disabled" : ""}>
              ${gateView.busy ? "Unlocking…" : "Unlock with password"}</button>
          </form>` : `
          <p class="glede" style="text-align:left;margin:0">This workspace has no key of its
          own yet, so there is nothing to unlock. Give it one from the Vault page.</p>`}
        <p class="gerror">${esc(gateView.error)}</p>
        <div style="display:grid;justify-items:center">
          <button class="gback" data-gback="1">Choose a different workspace</button>
        </div>
      </section>
      ${gateAgentPanel()}`;
  }

  /** Whether a passkey ceremony can even run here.
   *
   *  It needs an authenticator and an origin WebAuthn will accept. A window
   *  served from a custom scheme has neither, and a button that could only
   *  ever fail is worse than no button — so this decides whether the offer is
   *  made at all, and the enrol card says why when the answer is no.
   */
  /** Whether a passkey ceremony can happen here at all.
   *
   *  Not in this window, and not because of anything this code does. Measured
   *  from inside it: `isUserVerifyingPlatformAuthenticatorAvailable()` — the
   *  one question WebAuthn answers honestly, with no prompt and no ceremony —
   *  returns false. It stays false with the window served over
   *  `http://localhost`, and it stays false with the bundle signed by a
   *  Developer ID with a real team identifier. A WKWebView is not a browser
   *  and does not get a platform authenticator.
   *
   *  HivemindOS's desktop app reaches the same conclusion in the same place:
   *  it checks for the native runtime first and returns before it would ever
   *  call WebAuthn, using a Rust command against LocalAuthentication instead.
   *  Its button says "passkey"; what runs is Touch ID.
   *
   *  So the offer is not made here, and the browser is where it is made. That
   *  is a statement about this window, not about the vault: a passkey enrolled
   *  in a browser opens this vault perfectly well.
   */
  function passkeysPossible(where = location) {
    if (typeof window.PublicKeyCredential !== "function") return false;
    if (!navigator.credentials?.create) return false;
    // The desktop shell. Same test HivemindOS uses for the same decision.
    if (window.__TAURI_INTERNALS__ || window.__TAURI__) return false;
    if (where.protocol !== "https:" && where.protocol !== "http:") return false;
    const host = where.hostname || "";
    const isAddress = /^\[?(?:\d{1,3}(?:\.\d{1,3}){3}|[0-9A-Fa-f:]*:[0-9A-Fa-f:]*)\]?$/;
    return Boolean(host) && !isAddress.test(host);
  }

  /** Said only where it changes what somebody can do: a workspace whose only
   *  way in is a passkey, opened from a window that cannot run one. */
  const PASSKEY_ELSEWHERE = "Passkeys are set up and used in a browser — this desktop "
    + "window cannot run the ceremony. A passkey made in HivemindOS or Hivemind Content "
    + "Studio opens this vault too.";

  /** The offer made once a password has just been proved.
   *
   *  Touch ID where the device can do it, a passkey where a browser can. The
   *  passkey branch is unreachable in the desktop window on purpose — see
   *  `passkeysPossible` — so in practice this screen is Touch ID.
   */
  function gateEnrol() {
    const row = gateView.chosen;
    const device = biometry.available && !row?.has_device;
    return `
      <section class="gcard">
        <div class="gwho">
          <span class="gav c-${row?.colour || "amber"}">${esc(gateInitial(row?.label))}</span>
          <div>
            <h2>${device ? `Use ${esc(biometry.label)}` : "Add a passkey"}</h2>
            <p class="glede" style="text-align:left;margin:2px 0 0">${esc(row?.label || "")}</p>
          </div>
        </div>
        ${device ? `
          <p class="glede" style="text-align:left;margin:0">Signed in. Let this device open
          the vault, so next time it is ${esc(biometry.label)} instead of a password. Your
          password still works and is still the thing that can be moved to another
          machine.</p>
          <button class="gprimary" data-gtrust="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} ${gateView.busy ? "Waiting for you…" : `Use ${esc(biometry.label)}`}</button>
          ${aside(`<p>This is a lock on the window, not on the key. Anything already running
            as you can open the vault without being asked \u2014 it stops somebody at your
            keyboard, which is what it is for.</p>`, "What this protects")}
          <button class="gsecondary" data-gskip="1">Not now</button>`
        : passkeysPossible() ? `
          <p class="glede" style="text-align:left;margin:0">Signed in. Add a passkey so next
          time this workspace opens with your fingerprint instead of a password.</p>
          <button class="gprimary" data-genrol="1" ${gateView.busy ? "disabled" : ""}>
            ${icon("person")} ${gateView.busy ? "Waiting for the authenticator…" : "Add a passkey"}</button>
          <button class="gsecondary" data-gskip="1">Not now</button>`
        : `<p class="glede" style="text-align:left;margin:0">${esc(PASSKEY_ELSEWHERE)}</p>
           <button class="gsecondary" data-gskip="1">Continue</button>`}
        <p class="gerror">${esc(gateView.error)}</p>
      </section>`;
  }

  function gateCreate() {
    return `
      <section class="gcard">
        <div class="gwho">
          <span class="gav add">+</span>
          <div>
            <h2>New workspace</h2>
            <p class="glede" style="text-align:left;margin:2px 0 0">Its own library, its own key.</p>
          </div>
        </div>
        <form data-gform="create">
          <label>Workspace name
            <input id="g-name" type="text" autocomplete="off" maxlength="40" required />
          </label>
          <label>Its password
            <input id="g-newpw" type="password" autocomplete="new-password" required />
          </label>
          <button class="gprimary" type="submit" ${gateView.busy ? "disabled" : ""}>
            ${gateView.busy ? "Creating…" : "Create workspace"}</button>
        </form>
        <p class="gerror">${esc(gateView.error)}</p>
        <div style="display:grid;justify-items:center">
          <button class="gback" data-gback="1">Choose a different workspace</button>
        </div>
      </section>`;
  }



  /** One passkey, registered against this workspace, read once for its PRF.
   *
   *  There is no server here to issue a challenge or check an assertion, and
   *  none is needed: what the vault wants is the PRF output, which the same
   *  credential and salt reproduce on every device the passkey syncs to. The
   *  signature proves nothing to a local vault — the secret is the point.
   */
  const PRF_LABEL = "passbook/v2/vault-prf/v1";
  const b64url = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  async function prfSalt(workspace) {
    const material = new TextEncoder().encode(`${PRF_LABEL}:${workspace}`);
    return new Uint8Array(await crypto.subtle.digest("SHA-256", material));
  }

  async function enrolPasskey(workspace, label, password) {
    const salt = await prfSalt(workspace);
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const created = await navigator.credentials.create({
      publicKey: {
        challenge,
        // The relying party has to be named explicitly. Left out, it is
        // inferred from the origin, and a webview does not infer it the way a
        // browser does — the request is rejected before the authenticator is
        // ever asked. `platform` for the same reason: without it the request
        // may be answered by a security key this window has no way to talk to.
        rp: { name: "PassBook", id: location.hostname },
        user: {
          id: new TextEncoder().encode(workspace),
          name: `${workspace} · PassBook`,
          displayName: label || workspace,
        },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          residentKey: "preferred",
          userVerification: "required",
        },
        timeout: 60000,
        attestation: "none",
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    if (!created) throw new Error("No passkey was created.");
    const made = created.getClientExtensionResults?.() || {};
    if (!(made.prf && (made.prf.enabled || made.prf.results))) {
      throw new Error("This authenticator has no PRF support, so it cannot hold a vault key.");
    }
    // One assertion, purely to read the secret out: registration reports only
    // that PRF is available, not what it evaluates to.
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        allowCredentials: [{ type: "public-key", id: created.rawId }],
        userVerification: "required",
        timeout: 60000,
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    const secret = assertion?.getClientExtensionResults?.()?.prf?.results?.first;
    if (!secret) throw new Error("That passkey would not return a secret to wrap the key with.");
    return invoke("vault_add_passkey", {
      workspace, credentialId: created.id, prfSecret: b64url(secret),
      label: label || "This device", rpId: location.hostname || "", password,
    });
  }

  /** Open the vault with a passkey already enrolled for this workspace.
   *
   *  The mirror of `enrolPasskey`: same salt, same PRF, but no registration —
   *  the credential exists, and all this does is make it evaluate the secret
   *  the vault key was wrapped under.
   */
  async function unlockWithPasskey(workspace) {
    const salt = await prfSalt(workspace);
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        userVerification: "required",
        timeout: 60000,
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    if (!assertion) throw new Error("No passkey was offered.");
    const secret = assertion.getClientExtensionResults?.()?.prf?.results?.first;
    if (!secret) throw new Error("That passkey would not return the secret this vault is wrapped under.");
    return invoke("vault_signin_passkey", {
      workspace, credentialId: assertion.id, prfSecret: b64url(secret), duration: "always",
    });
  }

  /** What a failed passkey ceremony actually means.
   *
   *  WebAuthn reports almost every failure as `NotAllowedError`, on purpose:
   *  a page must not be able to tell a cancelled prompt from a refused origin
   *  from a missing credential, or it could probe for them. This window read
   *  that one error as "cancelled", which is the reading that blames the
   *  person for something the platform did without asking them.
   *
   *  The one signal the spec does not hide is the clock. A prompt a human saw
   *  and dismissed takes a second at least. A rejection that arrives in a few
   *  hundred milliseconds never reached anybody.
   */
  const HUMAN_MS = 700;
  function passkeyReason(error, startedAt, doing) {
    const name = error?.name || "";
    const why = String(error?.message ?? error ?? "");
    const elapsed = Date.now() - startedAt;
    if (/invalid domain|relying party|rp id/i.test(why) || name === "SecurityError") {
      return `This window's address has no domain for a passkey to belong to. ${PASSKEY_ELSEWHERE}`;
    }
    if (name === "InvalidStateError") {
      return "There is already a passkey for this workspace on this device.";
    }
    if (name === "NotAllowedError" || name === "AbortError") {
      // Nothing a person did takes a millisecond. A rejection that fast was
      // the platform refusing without ever putting a prompt on screen, and
      // calling that "cancelled" blames somebody for something they never saw.
      return elapsed < HUMAN_MS
        ? `${doing} was refused before anything appeared on screen, so there was `
          + `nothing to cancel. This window is not allowed to run the ceremony. `
          + PASSKEY_ELSEWHERE
        : `${doing} was cancelled.`;
    }
    return why || String(error);
  }

  function wireGate() {
    // `String(error)` on a rejected invoke reads "Error: Wrong password." The
    // word "Error" in front of a sentence that is already an error is noise.
    const said = (error) => String(error?.message ?? error ?? "").replace(/^Error:\s*/, "");
    const fail = (error) => { gateView.error = said(error); gateView.busy = false; paintGate(); };

    gate.querySelectorAll("[data-gpick]").forEach((b) => b.onclick = () => {
      const row = workspaceRows().find((w) => w.id === b.dataset.gpick);
      // Picking a workspace asks for a factor. It used to skip straight past
      // this screen when the workspace was already open, on the reasoning that
      // the vault was unlocked anyway — which made Lock a screen you dismissed
      // by clicking your own name. The vault being open is what lets agents
      // read; it is not evidence about who is at the keyboard, and that is the
      // only thing this screen is asking about.
      gateView = { mode: "signin", chosen: row, error: "", busy: false,
                   hint: row?.open && !row.active
                     ? "Already open for agents. Signing in switches this window to it." : "" };
      paintGate();
      document.getElementById("g-pw")?.focus();
    });

    gate.querySelectorAll("[data-gtrust]").forEach((b) => b.onclick = async () => {
      gateView.busy = true; gateView.error = ""; paintGate();
      try {
        vault = await invoke("vault_trust_device", { password: gateView.password || "" });
        state = await invoke("state");
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) { fail(e); }
    });

    gate.querySelectorAll("[data-gdevice]").forEach((b) => b.onclick = async () => {
      const row = gateView.chosen;
      gateView.busy = true; gateView.error = ""; paintGate();
      try {
        vault = await invoke("vault_signin_device", { workspace: row?.id ?? "" });
        state = row && !row.active
          ? await invoke("set_workspace", { name: row.id })
          : await invoke("state");
        unlockWindow();
        resetRows();
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) { fail(e); }
    });

    gate.querySelectorAll("[data-gpasskey]").forEach((b) => b.onclick = async () => {
      const row = gateView.chosen;
      gateView.busy = true; gateView.error = ""; paintGate();
      const started = Date.now();
      try {
        vault = await unlockWithPasskey(row?.id ?? "");
        state = row && !row.active
          ? await invoke("set_workspace", { name: row.id })
          : await invoke("state");
        unlockWindow();
        resetRows();
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) {
        fail(passkeyReason(e, started, "Unlocking with a passkey"));
      }
    });

    gate.querySelectorAll("[data-gnew]").forEach((b) => b.onclick = () => {
      gateView = { mode: "create", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
      document.getElementById("g-name")?.focus();
    });

    gate.querySelectorAll("[data-gback]").forEach((b) => b.onclick = () => {
      gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
    });

    gate.querySelectorAll("[data-gagents]").forEach((b) => b.onclick = async () => {
      gateView.busy = true; paintGate();
      try { vault = await invoke("vault_signout", { workspace: "", everything: true }); }
      catch (e) { gateView.error = said(e); }
      finally { gateView.busy = false; paintGate(); }
    });

    gate.querySelectorAll("[data-gskip]").forEach((b) => b.onclick = () => {
      gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
      paintGate();
    });
    gate.querySelectorAll("[data-genrol]").forEach((b) => b.onclick = async () => {
      const row = gateView.chosen;
      const password = gateView.password || "";
      gateView.busy = true; gateView.error = ""; paintGate();
      const started = Date.now();
      try {
        vault = await invoke("vault_state");
        await enrolPasskey(row?.id ?? "", "This device", password);
        state = await invoke("state");
        gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        paintGate(); paint();
      } catch (e) {
        fail(passkeyReason(e, started, "Adding a passkey"));
      }
    });

    const form = gate.querySelector("[data-gform]");
    if (!form) return;
    form.onsubmit = async (event) => {
      event.preventDefault();
      if (gateView.busy) return;
      // Read the fields BEFORE anything repaints. Setting busy rebuilds this
      // form, which replaces the input with an empty one — so reading after it
      // sent a blank password and the vault refused a password nobody mistyped.
      const typed = {
        password: document.getElementById("g-pw")?.value ?? "",
        name: document.getElementById("g-name")?.value?.trim() ?? "",
        fresh: document.getElementById("g-newpw")?.value ?? "",
      };
      const wanted = gateView.wantPasskey === true;
      gateView.busy = true; gateView.error = ""; paintGate();
      try {
        if (form.dataset.gform === "create") {
          const { name, fresh: password } = typed;
          vault = await invoke("vault_create_workspace", { name, password });
          state = await invoke("state");
          gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
        } else {
          const password = typed.password;
          vault = await invoke("vault_signin", {
            profile: "", password, duration: "always",
            workspace: gateView.chosen?.id ?? "",
          });
          if (gateView.chosen && !gateView.chosen.active) {
            state = await invoke("set_workspace", { name: gateView.chosen.id });
          } else {
            state = await invoke("state");
          }
          unlockWindow();
          resetRows();
          // The one moment enrolment can succeed: a proven password, in hand,
          // for a vault that is open. Offering it earlier could only refuse.
          if (wanted && (passkeysPossible() || biometry.available)) {
            gateView = { mode: "enrol", chosen: gateView.chosen, error: "",
                         busy: false, hint: "", password: typed.password };
          } else {
            gateView = { mode: "pick", chosen: null, error: "", busy: false, hint: "" };
          }
        }
        paintGate();
        paint();
      } catch (e) {
        fail(e);
      }
    };
    // A form that reappears on every keystroke-free repaint has to be refocused.
    // The switch flips in place. Repainting the card here would take the
    // password field down with it, and a control that clears what you typed is
    // a control nobody touches twice.
    gate.querySelectorAll("[data-gwant]").forEach((b) => b.onclick = () => {
      gateView.wantPasskey = !gateView.wantPasskey;
      b.setAttribute("aria-checked", gateView.wantPasskey ? "true" : "false");
    });
    const field = document.getElementById("g-pw") || document.getElementById("g-name");
    if (field && !gateView.busy) field.focus();
  }

  function paintGate() {
    const show = gateShouldShow();
    gate.hidden = !show;
    if (!show) return;
    const body = gateView.mode === "signin" ? gateSignIn()
      : gateView.mode === "create" ? gateCreate()
      : gateView.mode === "enrol" ? gateEnrol() : gateTiles();
    gate.innerHTML = `<div class="gwrap">${body}</div>`;
    wireGate();
  }


  // ── Add to PassBook ────────────────────────────────────────────────────────
  //
  //  A page says which keys its SDK reads and opens `passbook://add?key=...`.
  //  The link carries names and never values, so what happens here is: show
  //  who asked and what they asked for, take the values from the person, open
  //  the vault, store the set in one operation.
  //
  //  Nothing on this path can be skipped by the link. There is no parameter
  //  that pre-approves, pre-fills a value, or picks a workspace on the
  //  person's behalf, because a credential prompt that can be steered from
  //  outside is a phishing form with a native title bar.

  let askReq = null;
  let askView = { step: "review", values: {}, workspace: "", picking: false,
                  error: "", busy: false, added: 0, where: "" };

  const askShouldShow = () => Boolean(askReq);

  /** The workspace the keys would land in: whatever was chosen, else active. */
  function askTarget() {
    const rows = workspaceRows();
    const chosen = rows.find((row) => row.id === askView.workspace);
    return chosen || rows.find((row) => row.active) || null;
  }

  function askReview() {
    const target = askTarget();
    const count = askReq.keys.length;
    const sent = askReq.keys.filter((k) => k.has_value).length;
    const site = askReq.origin
      ? `<b>${esc(askReq.app)}</b> at <b>${esc(askReq.origin)}</b>`
      : `<b>${esc(askReq.app)}</b>`;
    // Where the values came from decides what this screen is. If the page sent
    // them, there is nothing to fill in and the only question is whether to
    // keep them. If it sent names only, the person supplies the values.
    const lede = sent === count
      ? `${site} wants to put ${count === 1 ? "this credential" : "these credentials"} in your vault.`
      : sent === 0
        ? `${site} is asking for ${count === 1 ? "this credential" : "these credentials"}. It sent the names only, so the ${count === 1 ? "value is" : "values are"} yours to fill in.`
        : `${site} sent ${sent} of ${count} values. Fill in the rest.`;
    return `
      <div class="acard">
        <div class="ahead">
          <div class="amark">${icon("key")}</div>
          <h1>Add ${count} key${count === 1 ? "" : "s"} to PassBook?</h1>
          <p class="aorigin">${lede}</p>
        </div>
        ${askReq.note ? `<p class="anote">${esc(askReq.note)}</p>` : ""}
        <div class="akeys">
          ${askReq.keys.map((k, i) => k.has_value ? `
            <div class="asent">
              <span class="aname">${esc(k.name)}</span>
              <span class="apreview" title="Only part of the value is shown">${esc(k.preview)}</span>
            </div>` : `
            <div class="akey">
              <label for="ak-${i}">${esc(k.name)}</label>
              <input id="ak-${i}" data-akey="${esc(k.name)}" type="password"
                     autocomplete="off" spellcheck="false" placeholder="Paste the value"
                     value="${esc(askView.values[k.name] || "")}">
            </div>`).join("")}
        </div>
        ${askReq.refused.length ? `<p class="arefused">${askReq.refused.length}
          ${askReq.refused.length === 1 ? "entry was" : "entries were"} left out:
          ${askReq.refused.map((r) => esc(r)).join(", ")}. A name has to be a plain
          environment variable, and a value has to fit on one line.</p>` : ""}
        <div class="aws">
          <span>Adding to <b>${esc(target?.label || "this device")}</b></span>
          <button class="alink" data-apick="1">${askView.picking ? "Keep this one" : "Use another workspace"}</button>
        </div>
        ${askView.picking ? `<ul class="apick">
          ${workspaceRows().map((row) => `
            <li><button data-aws="${esc(row.id)}"
                        aria-pressed="${row.id === target?.id ? "true" : "false"}">
              ${esc(row.label)}${row.active ? " · current" : ""}
            </button></li>`).join("")}
        </ul>` : ""}
        ${askView.error ? `<p class="aerr">${esc(askView.error)}</p>` : ""}
        <div class="arow">
          <button class="aghost" data-acancel="1">Not now</button>
          <button class="aprimary" data-aadd="1" ${askView.busy ? "disabled" : ""}>
            ${askView.busy ? "Adding…" : `Add ${count === 1 ? "key" : "keys"}`}</button>
        </div>
      </div>`;
  }

  function askUnlock() {
    const target = askTarget();
    return `
      <div class="acard">
        <div class="ahead">
          <div class="amark">${icon("lock")}</div>
          <h1>Open ${esc(target?.label || "the vault")}</h1>
          <p class="aorigin">The keys are ready. Signing in seals them with everything else.</p>
        </div>
        <form class="akeys" id="ak-form">
          <div class="akey">
            <label class="aplain" for="ak-pw">Vault password</label>
            <input id="ak-pw" type="password" autocomplete="current-password" placeholder="Password">
          </div>
        </form>
        ${biometry.available ? `<button class="alink" data-abio="1">Use ${esc(biometry.label || "this device")} instead</button>` : ""}
        ${askView.error ? `<p class="aerr">${esc(askView.error)}</p>` : ""}
        <div class="arow">
          <button class="aghost" data-acancel="1">Cancel</button>
          <button class="aprimary" data-aunlock="1" ${askView.busy ? "disabled" : ""}>
            ${askView.busy ? "Opening…" : "Unlock and add"}</button>
        </div>
      </div>`;
  }

  function askDone() {
    const n = askView.added;
    return `
      <div class="acard">
        <div class="adone">
          <svg class="atick" viewBox="0 0 68 68" aria-hidden="true">
            <circle cx="34" cy="34" r="28"/>
            <path d="M21 35.5 30 44 47 25"/>
          </svg>
          <h1>${n} key${n === 1 ? "" : "s"} added</h1>
          <p class="aorigin">Stored in <b>${esc(askView.where)}</b>. Any app that opts in can read
            ${n === 1 ? "it" : "them"} now, and every read is recorded.</p>
        </div>
        <div class="arow" style="grid-template-columns: 1fr;">
          <button class="aprimary" data-adone="1">Done</button>
        </div>
      </div>`;
  }

  /** The sheet has two tenants: a credential request and a .env import. Both
   *  used to set `ask.hidden` from their own idea of whether they were needed,
   *  so the five second repaint took the import sheet down mid-decision and
   *  dropped the sign-in gate on top of it. One function decides now. */
  function paintSheet() {
    if (impShouldShow() || impView.done) { paintImport(); return; }
    paintAsk();
  }

  function paintAsk() {
    const show = askShouldShow();
    ask.hidden = !show;
    if (!show) return;
    const body = askView.step === "done" ? askDone()
      : askView.step === "unlock" ? askUnlock() : askReview();
    ask.innerHTML = `<div class="awrap">${body}</div>`;
    wireAsk();
  }

  /** Close the request without storing anything. */
  async function askClose() {
    askReq = null;
    askView = { step: "review", values: {}, workspace: "", picking: false,
                error: "", busy: false, added: 0, where: "" };
    try { await invoke("dismiss_ask"); } catch { /* nothing pending */ }
    paint();
  }

  /** Read the typed values off the form, so a repaint cannot lose them. */
  function askHarvest() {
    ask.querySelectorAll("[data-akey]").forEach((input) => {
      askView.values[input.dataset.akey] = input.value;
    });
    // "Paste the values first" outliving the paste is the kind of small lie
    // that makes people stop reading the messages.
    if (askView.error && askReq
        && askReq.keys.every((k) => k.has_value || (askView.values[k.name] || "").trim())) {
      askView.error = "";
    }
  }

  /** Store the set, once the vault is open. */
  async function askApply() {
    const target = askTarget();
    // Only what was typed. Anything the page supplied stayed in the app and is
    // read there, so a credential the window never held is not sent back to it.
    const typed = askReq.keys.filter((k) => !k.has_value)
      .map((k) => [k.name, (askView.values[k.name] || "").trim()]);
    askView.busy = true; askView.error = ""; paintAsk();
    try {
      // A different workspace is a real switch, not a hidden one: the window
      // stays where the keys went, so what you see afterwards is where they are.
      if (target && !target.active) {
        state = await invoke("set_workspace", { name: target.id });
      }
      const id = askReq.id;
      const count = askReq.keys.length;
      const where = target?.label || "this device";
      state = await invoke("apply_ask", { id, typed, replace: false });
      askReq = null;
      askView = { step: "done", values: {}, workspace: "", picking: false,
                  error: "", busy: false, added: count, where };
      // `askReq` is gone, so the overlay would vanish; the confirmation is the
      // point of the whole flow, so it is drawn from `askView` alone.
      ask.hidden = false;
      ask.innerHTML = `<div class="awrap">${askDone()}</div>`;
      wireAsk();
      resetRows();
      return;
    } catch (e) {
      askView.error = String(e);
    } finally {
      askView.busy = false;
    }
    paintAsk();
  }

  function wireAsk() {
    ask.querySelectorAll("[data-acancel]").forEach((b) => b.onclick = () => askClose());
    ask.querySelectorAll("[data-adone]").forEach((b) => b.onclick = () => {
      askView.step = "review"; askView.added = 0; ask.hidden = true; paint();
    });
    ask.querySelectorAll("[data-apick]").forEach((b) => b.onclick = () => {
      askHarvest(); askView.picking = !askView.picking; paintAsk();
    });
    ask.querySelectorAll("[data-aws]").forEach((b) => b.onclick = () => {
      askHarvest(); askView.workspace = b.dataset.aws; askView.picking = false; paintAsk();
    });
    ask.querySelectorAll("[data-aadd]").forEach((b) => b.onclick = async () => {
      askHarvest();
      const missing = askReq.keys.filter((k) => !k.has_value && !(askView.values[k.name] || "").trim());
      if (missing.length) {
        askView.error = missing.length === askReq.keys.length
          ? "Paste the values first."
          : `Still empty: ${missing.map((k) => k.name).join(", ")}.`;
        paintAsk();
        return;
      }
      askView.error = "";
      const target = askTarget();
      // Only ask for the password when there is a vault that is shut. A device
      // with nothing sealed yet has nothing to open.
      if (target?.has_vault && !(vault?.unlocked_workspaces || []).includes(target.id)) {
        askView.step = "unlock"; paintAsk();
        document.getElementById("ak-pw")?.focus();
        return;
      }
      await askApply();
    });
    ask.querySelectorAll("[data-aunlock]").forEach((b) => b.onclick = () => askUnlockNow());
    ask.querySelectorAll("[data-abio]").forEach((b) => b.onclick = async () => {
      askView.busy = true; askView.error = ""; paintAsk();
      try {
        vault = await invoke("vault_signin_device", { workspace: askTarget()?.id ?? "" });
        askView.busy = false;
        await askApply();
      } catch (e) {
        askView.error = String(e); askView.busy = false; paintAsk();
      }
    });
    const form = document.getElementById("ak-form");
    if (form) form.onsubmit = (e) => { e.preventDefault(); askUnlockNow(); };
    ask.querySelectorAll("input").forEach((input) => {
      input.oninput = () => {
        if (!askView.error) return;
        askHarvest();
        const stale = ask.querySelector(".aerr");
        if (stale && !askView.error) stale.remove();
      };
      input.onkeydown = (e) => {
        if (e.key === "Enter" && askView.step === "review") { e.preventDefault();
          ask.querySelector("[data-aadd]")?.click(); }
      };
    });
  }

  async function askUnlockNow() {
    const password = document.getElementById("ak-pw")?.value ?? "";
    if (!password) { askView.error = "Enter the vault password."; paintAsk(); return; }
    askView.busy = true; askView.error = ""; paintAsk();
    try {
      vault = await invoke("vault_signin", {
        profile: "", password, duration: "always", workspace: askTarget()?.id ?? "",
      });
      unlockWindow();
      askView.busy = false;
      await askApply();
    } catch (e) {
      askView.error = String(e); askView.busy = false; paintAsk();
      document.getElementById("ak-pw")?.focus();
    }
  }

  /** Ask the backend whether a link is waiting. Called at startup and on the
   *  event, because a link that arrives during a cold start would otherwise
   *  fire before this window existed to hear it. */
  async function loadAsk() {
    if (!invoke) return;
    try {
      const next = await invoke("pending_ask");
      if (!next) return;
      askReq = next;
      askView = { step: "review", values: {}, workspace: next.workspace || "",
                  picking: false, error: "", busy: false, added: 0, where: "" };
      paint();
      ask.querySelector("input")?.focus();
    } catch { /* an older build without the command */ }
  }


  // ── Importing a .env ───────────────────────────────────────────────────────
  //
  //  Drop a project's `.env` on the window and pick what goes in. The list is
  //  names: the file is full of credentials and this window is a thing people
  //  screen-share, so the values stay in the CLI, which reads the file again
  //  when the import actually happens.
  //
  //  A key already in the store is the interesting case. Replacing is the
  //  default because that is usually why somebody is importing a newer file,
  //  and keeping both is one dropdown away, under a name the CLI picks so the
  //  window and the terminal cannot disagree about what it should be.

  let imp = null;   // { file, name, rows: [{key, clashes, suggested}] }
  let impView = { picked: {}, mode: {}, busy: false, error: "", done: "" };

  const impShouldShow = () => Boolean(imp);
  const impChosen = () => (imp?.rows || []).filter((r) => impView.picked[r.key]);

  function impBody() {
    const rows = imp.rows;
    const chosen = impChosen();
    const clashing = chosen.filter((r) => r.clashes);
    return `
      <div class="acard">
        <div class="ahead">
          <div class="amark">${icon("into")}</div>
          <h1>Import ${rows.length} key${rows.length === 1 ? "" : "s"}?</h1>
        </div>
        <div class="ifile">
          <span>From <b>${esc(imp.name)}</b></span>
          <button class="alink" data-ipick="1">Choose a different file</button>
        </div>
        <div class="ibar">
          <button class="alink" data-iall="1">Select all</button>
          <button class="alink" data-inone="1">Deselect all</button>
          <span class="count">${chosen.length} of ${rows.length} selected</span>
        </div>
        <div class="ilist">
          ${rows.map((r, i) => {
            const on = Boolean(impView.picked[r.key]);
            const mode = impView.mode[r.key] || "replace";
            return `
            <div class="irow${on ? "" : " off"}">
              <input type="checkbox" id="i-${i}" data-ikey="${esc(r.key)}" ${on ? "checked" : ""}>
              <label for="i-${i}">${esc(r.key)}</label>
              ${r.clashes ? `
                <span class="iclash">
                  <span class="itag">in store</span>
                  <select data-imode="${esc(r.key)}" ${on ? "" : "disabled"}>
                    <option value="replace"${mode === "replace" ? " selected" : ""}>Replace</option>
                    <option value="new"${mode === "new" ? " selected" : ""}>Add as new</option>
                  </select>
                  ${mode === "new" && on ? `<span class="ias">${esc(r.suggested)}</span>` : ""}
                </span>` : ""}
            </div>`;
          }).join("")}
        </div>
        ${clashing.length ? `<p class="arefused">${clashing.length}
          selected key${clashing.length === 1 ? " is" : "s are"} already in this store.
          Replacing overwrites what is there. Adding as new keeps both.</p>` : ""}
        ${impView.error ? `<p class="aerr">${esc(impView.error)}</p>` : ""}
        <div class="arow">
          <button class="aghost" data-icancel="1">Cancel</button>
          <button class="aprimary" data-igo="1" ${impView.busy || !chosen.length ? "disabled" : ""}>
            ${impView.busy ? "Importing…"
              : !chosen.length ? "Nothing selected"
              : chosen.length === rows.length ? `Import all ${rows.length}`
              : `Import ${chosen.length} key${chosen.length === 1 ? "" : "s"}`}</button>
        </div>
      </div>`;
  }

  function impDone() {
    const n = impView.done;
    return `
      <div class="acard">
        <div class="adone">
          <svg class="atick" viewBox="0 0 68 68" aria-hidden="true">
            <circle cx="34" cy="34" r="28"/>
            <path d="M21 35.5 30 44 47 25"/>
          </svg>
          <h1>${n} key${n === 1 ? "" : "s"} imported</h1>
          <p class="aorigin">Delete the file when you are done with it. A copy in
            the store does not make the copy on your disk any safer.</p>
        </div>
        <div class="arow" style="grid-template-columns: 1fr;">
          <button class="aprimary" data-idone="1">Done</button>
        </div>
      </div>`;
  }

  function paintImport() {
    if (!impShouldShow() && !impView.done) { ask.hidden = true; return; }
    ask.hidden = false;
    ask.innerHTML = `<div class="awrap">${impView.done ? impDone() : impBody()}</div>`;
    wireImport();
  }

  function impClose() {
    imp = null;
    impView = { picked: {}, mode: {}, busy: false, error: "", done: "" };
    ask.hidden = true;
    paint();
  }

  /** Read a file the person chose, and show what is in it. */
  async function openEnv(path) {
    impView = { picked: {}, mode: {}, busy: false, error: "", done: "" };
    try {
      const found = await invoke("inspect_env", { path });
      const rows = found?.keys || [];
      if (!rows.length) {
        notice = `${found?.name || "That file"} has no keys in it.`;
        imp = null; paint(); return;
      }
      imp = { file: found.file, name: found.name, rows };
      // Everything on by default: the common case is wanting the lot, and
      // unticking three is less work than ticking twenty.
      rows.forEach((r) => { impView.picked[r.key] = true; impView.mode[r.key] = "replace"; });
      paintImport();
    } catch (e) {
      imp = null;
      notice = String(e);
      paint();
    }
  }

  async function impRun() {
    const chosen = impChosen();
    if (!chosen.length) return;
    impView.busy = true; impView.error = ""; paintImport();
    try {
      // Two lists, because they are two different questions: what to bring in,
      // and which of those to keep alongside what is already here.
      const only = chosen.map((r) => r.key);
      const renames = chosen
        .filter((r) => r.clashes && impView.mode[r.key] === "new")
        .map((r) => [r.key, r.suggested]);
      const answer = await invoke("import_env", {
        path: imp.file, only, renames,
        // Anything kept alongside is renamed, so it cannot collide. Overwrite
        // therefore only ever lands on a key somebody chose to replace.
        overwrite: chosen.some((r) => r.clashes && impView.mode[r.key] !== "new"),
      });
      if (answer?.state) state = answer.state;
      const count = only.length;
      imp = null;
      impView = { picked: {}, mode: {}, busy: false, error: "", done: count };
      resetRows();
      paintImport();
    } catch (e) {
      impView.error = String(e);
      impView.busy = false;
      paintImport();
    }
  }

  function wireImport() {
    ask.querySelectorAll("[data-ikey]").forEach((box) => box.onchange = () => {
      impView.picked[box.dataset.ikey] = box.checked;
      paintImport();
    });
    ask.querySelectorAll("[data-imode]").forEach((sel) => sel.onchange = () => {
      impView.mode[sel.dataset.imode] = sel.value;
      paintImport();
    });
    ask.querySelectorAll("[data-iall]").forEach((b) => b.onclick = () => {
      imp.rows.forEach((r) => impView.picked[r.key] = true); paintImport();
    });
    ask.querySelectorAll("[data-inone]").forEach((b) => b.onclick = () => {
      imp.rows.forEach((r) => impView.picked[r.key] = false); paintImport();
    });
    ask.querySelectorAll("[data-icancel]").forEach((b) => b.onclick = () => impClose());
    ask.querySelectorAll("[data-idone]").forEach((b) => b.onclick = () => impClose());
    ask.querySelectorAll("[data-igo]").forEach((b) => b.onclick = () => impRun());
    ask.querySelectorAll("[data-ipick]").forEach((b) => b.onclick = () => chooseEnv());
  }

  /** The file picker, for people who would rather not drag anything. */
  async function chooseEnv() {
    const dialog = window.__TAURI__?.dialog;
    if (!dialog?.open) {
      notice = "Drag a .env onto this window to import it.";
      paint();
      return;
    }
    const picked = await dialog.open({
      multiple: false, title: "Choose a .env to import",
      filters: [{ name: "Environment files", extensions: ["env", "txt", ""] }],
    });
    if (picked) await openEnv(typeof picked === "string" ? picked : picked.path);
  }

  /** Drag and drop, through Tauri rather than the DOM.
   *
   *  The DOM would hand the window a File and its contents. Tauri hands it a
   *  path, so the credentials in that file are read by the CLI and never enter
   *  the webview at all.
   */
  function wireDrop() {
    const events = window.__TAURI__?.event;
    if (!events?.listen) return;
    events.listen("tauri://drag-enter", () => { drop.hidden = false;
      drop.innerHTML = `<div class="dropcard">${icon("into", "big")}
        <b>Drop it to import</b><span>Nothing is stored until you choose what to keep.</span></div>`; });
    events.listen("tauri://drag-leave", () => { drop.hidden = true; });
    events.listen("tauri://drag-drop", async (e) => {
      drop.hidden = true;
      const paths = e?.payload?.paths || e?.payload || [];
      const first = Array.isArray(paths) ? paths[0] : null;
      if (first) await openEnv(first);
    });
  }

  function paint() {
    if (!state) return;
    paintNav();
    const body = { keys: keysPage, vault: vaultPage, signins: signinsPage,
                   access: accessPage, apps: appsPage, settings: settingsPage,
                   machines: machinesPage, switch: switchPage,
                   broker: brokerPage, record: recordPage }[page]();
    main.innerHTML = lockBanner() + body + noticeBar();
    paintGate();
    paintSheet();
    dressPage();

    main.querySelectorAll("[data-goto]").forEach((b) => b.onclick = () => {
      page = b.dataset.goto; notice = ""; paint();
    });
    // Lock = put this window away. Agent access is a separate decision, made
    // on the screen this drops you on.
    main.querySelectorAll("[data-signout]").forEach((b) => b.onclick = () => lockWindow());
    main.querySelectorAll("[data-verify]").forEach((b) => b.onclick = () => checkChain());
    main.querySelectorAll("[data-noticeclear]").forEach((b) => b.onclick = () => {
      notice = ""; paint();
    });
    main.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
      busy = true; paint();
      try { state = await invoke("set_confirmation", {
              op: b.dataset.confirm, required: b.dataset.on === "1" });
            notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-btab]").forEach((b) => b.onclick = () => {
      backup.tab = b.dataset.btab; backup.said = ""; paint();
    });
    main.querySelectorAll("[data-addprofile]").forEach((b) => b.onclick = () => {
      addingProfile = !addingProfile; paint();
      if (addingProfile) document.getElementById("np-label")?.focus();
    });
    main.querySelectorAll("[data-bshape]").forEach((b) => b.onclick = () => {
      backup.shape = b.dataset.bshape;
      // The default path carries the shape's extension, so a shape change moves
      // it — unless the person has typed their own.
      const typed = document.getElementById("bk-path")?.value ?? "";
      if (!typed || typed === backup.path || typed.startsWith(`${state?.home || "~"}/Desktop/passbook-`)) {
        backup.path = "";
      } else {
        backup.path = typed;
      }
      backup.said = "";
      paint();
    });
    main.querySelectorAll("[data-recoverydone]").forEach((b) => b.onclick = () => {
      recoveryCode = ""; paint();
    });
    main.querySelectorAll("[data-workspace]").forEach((b) => b.onclick = async () => {
      busy = true; paint();
      try { state = await invoke("set_workspace", { name: b.dataset.workspace });
            notice = ""; grid = null; picked = {}; revealed = {}; values = {}; resetRows(); }
      catch (e) { notice = String(e); }
      finally { busy = false; await refreshVault(); paint(); }
    });

    main.querySelectorAll("[data-oarefresh]").forEach((b) => b.onclick = () =>
      callSignin("oauth_refresh", { id: b.dataset.oarefresh }));
    main.querySelectorAll("[data-oaforget]").forEach((b) => b.onclick = () =>
      callSignin("oauth_disconnect", { id: b.dataset.oaforget }));
    main.querySelectorAll("[data-oaconnect]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.oaconnect;
      connecting[id] = true; paint();
      try { await invoke("oauth_connect", { id }); notice = ""; }
      catch (e) { notice = String(e); connecting[id] = false; paint(); return; }
      // The browser half happens outside this window, so poll rather than wait.
      const until = Date.now() + 185000;
      const tick = async () => {
        await refreshSignins();
        const done = (signins || []).find((s) => s.id === id);
        if (done?.state === "connected" || Date.now() > until) {
          delete connecting[id]; paint(); return;
        }
        setTimeout(tick, 2000);
      };
      setTimeout(tick, 2000);
    });

    main.querySelectorAll("[data-group]").forEach((b) => {
      const toggle = () => {
        const name = b.dataset.group;
        collapsed[name] = !collapsed[name];
        paint();
      };
      b.onclick = toggle;
      b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    });

    // Opening a key's settings repaints only to add the block — the search box
    // and any typed-in value are rebuilt from state, so nothing is lost.
    main.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => {
      const k = b.dataset.open;
      if (expanded[k]) delete expanded[k]; else expanded[k] = true;
      // Leaving a row closes whatever editor it had open, so reopening it
      // starts from the summary rather than half-way through a change.
      if (!expanded[k]) {
        if (audienceFor === k) { audienceFor = null; audienceDraft = null; }
        if (projectsFor === k) { projectsFor = null; projectsDraft = null; }
      }
      paint();
    });
    main.querySelectorAll("[data-selectmode]").forEach((b) => b.onclick = () => {
      selectMode = !selectMode;
      if (!selectMode) { picked = {}; bulkConfirm = false; }
      paint();
    });
    main.querySelectorAll("[data-addopen]").forEach((b) => b.onclick = () => {
      adding = !adding; paint();
      if (adding) document.getElementById("k")?.focus();
    });

    main.querySelectorAll("[data-pick]").forEach((b) => b.onchange = () => {
      const k = b.dataset.pick;
      if (b.checked) picked[k] = true; else delete picked[k];
      bulkConfirm = false;
      paint();
    });
    main.querySelectorAll("[data-bulkclear]").forEach((b) => b.onclick = () => {
      picked = {}; bulkConfirm = false; paint();
    });
    main.querySelectorAll("[data-bulkremove]").forEach((b) => b.onclick = () => {
      bulkConfirm = true; paint();
    });
    main.querySelectorAll("[data-bulkcancel]").forEach((b) => b.onclick = () => {
      bulkConfirm = false; paint();
    });
    main.querySelectorAll("[data-bulkgo]").forEach((b) => b.onclick = async () => {
      const names = chosen();
      busy = true; paint();
      try { state = await invoke("remove_keys", { names });
            notice = ""; picked = {}; bulkConfirm = false; grid = null; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-bulkscope]").forEach((s) => s.onchange = async () => {
      const scope = s.value;
      if (!scope) return;
      const names = chosen();
      busy = true; paint();
      try {
        const answer = await invoke("set_keys_scope", { names, scope });
        // A partial refusal comes back with the new state and the reason; the
        // keys that did change have changed, so show both.
        if (answer && answer.partial) { state = answer.state; notice = answer.partial; }
        else { state = answer; notice = ""; }
        grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });

    main.querySelectorAll("[data-scope]").forEach((s) => s.onchange = async () => {
      busy = true; paint();
      try { state = await invoke("set_key_scope", { name: s.dataset.scope, scope: s.value });
            notice = ""; grid = null; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });

    /** Apps and Projects: chosen in place, applied on the press.
     *
     *  Both used to be a button that swapped the panel for an editor with its
     *  own Save and Cancel — four interactions and a change of scene to set a
     *  value that the two rows above it set with one click. The only reason a
     *  draft still exists at all is the moment between picking "Only chosen"
     *  and naming the first app, when there is no rule that could be written.
     */
    const saveAudience = async (key, mode, agents) => {
      busy = true; paint();
      try {
        state = await invoke("set_key_audience", { name: key, mode,
          agents: mode === "all" ? [] : agents });
        notice = ""; audienceFor = null; audienceDraft = null; grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    };
    const saveProjects = async (key, mode, projects) => {
      busy = true; paint();
      try {
        state = await invoke("set_key_projects", { name: key, mode,
          projects: mode === "all" ? [] : projects });
        notice = ""; projectsFor = null; projectsDraft = null; projectTyped = ""; grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    };

    main.querySelectorAll("[data-audmode]").forEach((b) => b.onclick = () => {
      const key = b.dataset.key;
      const next = b.dataset.audmode;
      if (next === "all") { saveAudience(key, "all", []); return; }
      const rule = state.catalog?.audiences?.[key];
      const held = audienceFor === key && audienceDraft
        ? audienceDraft.agents : [...(rule?.agents || [])];
      // Between `include` and `exclude` the same names mean opposite things —
      // the app that was the only one allowed becomes one of the blocked. So a
      // flip starts empty rather than carrying a selection across a change of
      // meaning that nobody asked for.
      const carried = (rule?.mode || "all") === next ? held : [];
      if (carried.length) { saveAudience(key, next, carried); return; }
      audienceFor = key; audienceDraft = { mode: next, agents: [] };
      projectsFor = null; projectsDraft = null;
      paint();
    });
    main.querySelectorAll("[data-audagent]").forEach((b) => b.onclick = () => {
      const key = b.dataset.key;
      const who = b.dataset.audagent;
      const rule = state.catalog?.audiences?.[key];
      const draft = (audienceFor === key && audienceDraft)
        || { mode: rule?.mode || "include", agents: [...(rule?.agents || [])] };
      const agents = draft.agents.includes(who)
        ? draft.agents.filter((a) => a !== who)
        : [...draft.agents, who];
      // An empty rule is not a rule, so it is never written. The choice stays
      // on screen unsaved rather than quietly becoming "every app".
      if (!agents.length) {
        audienceFor = key; audienceDraft = { mode: draft.mode, agents }; paint(); return;
      }
      saveAudience(key, draft.mode, agents);
    });

    main.querySelectorAll("[data-projmode]").forEach((b) => b.onclick = () => {
      const key = b.dataset.key;
      const next = b.dataset.projmode;
      if (next === "all") { saveProjects(key, "all", []); return; }
      const rule = state.catalog?.projects?.[key];
      const held = projectsFor === key && projectsDraft
        ? projectsDraft.projects : [...(rule?.projects || [])];
      const carried = (rule?.mode || "all") === next ? held : [];
      if (carried.length) { saveProjects(key, next, carried); return; }
      projectsFor = key; projectsDraft = { mode: next, projects: [] }; projectTyped = "";
      audienceFor = null; audienceDraft = null;
      paint();
    });
    main.querySelectorAll("[data-projname]").forEach((b) => b.onclick = () => {
      const key = b.dataset.key;
      const name = b.dataset.projname;
      const rule = state.catalog?.projects?.[key];
      const draft = (projectsFor === key && projectsDraft)
        || { mode: rule?.mode || "include", projects: [...(rule?.projects || [])] };
      const projects = draft.projects.includes(name)
        ? draft.projects.filter((p) => p !== name)
        : [...draft.projects, name];
      if (!projects.length) {
        projectsFor = key; projectsDraft = { mode: draft.mode, projects }; paint(); return;
      }
      saveProjects(key, draft.mode, projects);
    });
    main.querySelectorAll("[data-projadd]").forEach((b) => b.onclick = () => {
      const key = b.dataset.key;
      const name = (document.getElementById("proj-new")?.value ?? "").trim();
      if (!name) return;
      const rule = state.catalog?.projects?.[key];
      const draft = (projectsFor === key && projectsDraft)
        || { mode: rule?.mode || "include", projects: [...(rule?.projects || [])] };
      projectTyped = "";
      saveProjects(key, draft.mode === "all" ? "include" : draft.mode,
                   [...new Set([...draft.projects, name])]);
    });

    main.querySelectorAll("[data-grid]").forEach((b) => b.onclick = async () => {
      busy = true; paint();
      try { grid = await invoke("access_matrix", { agents: [] }); notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-gridfilter]").forEach((b) => b.onclick = () => {
      gridOnlyRestricted = !gridOnlyRestricted; paint();
    });
    main.querySelectorAll("[data-use]").forEach((b) => b.onclick = () =>
      callVault("vault_use_profile", { label: b.dataset.use }));

    const signIn = (field, select) => {
      const profile = select ? (document.getElementById(select)?.value ?? "") : "";
      const duration = document.getElementById("si-for")?.value ?? "";
      if (duration) vaultForm.duration = duration;
      callVault("vault_signin", { profile, password: pwd(field), duration });
    };
    const wire = (id, run) => {
      const button = document.getElementById(id);
      if (button) button.onclick = run;
    };
    wire("bk-export", async () => {
      const path = document.getElementById("bk-path")?.value?.trim() ?? "";
      const passphrase = document.getElementById("bk-pass")?.value ?? "";
      if (!path) { notice = "Where should it go?"; paint(); return; }
      backup.path = path;
      busy = true; backup.said = ""; paint();
      try {
        const answer = await invoke("export_store", {
          path, shape: backup.shape, passphrase, note: backup.note || "" });
        backup.said = `Wrote ${answer.path}`;
        notice = "";
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    wire("bk-inspect", async () => {
      const path = document.getElementById("bk-in")?.value?.trim() ?? "";
      const passphrase = document.getElementById("bk-inpass")?.value ?? "";
      if (!path) { notice = "Which file?"; paint(); return; }
      busy = true; paint();
      try { backup.said = await invoke("inspect_export", { path, passphrase }).then((a) => a.detail);
            notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    wire("bk-import", async () => {
      const path = document.getElementById("bk-in")?.value?.trim() ?? "";
      const passphrase = document.getElementById("bk-inpass")?.value ?? "";
      if (!path) { notice = "Which file?"; paint(); return; }
      busy = true; paint();
      try {
        const answer = await invoke("import_store", { path, passphrase, overwrite: false });
        backup.said = answer.detail;
        state = answer.state; notice = ""; grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    wire("rc-go", async () => {
      const password = pwd("rc-pw");
      if (!password) { notice = "The vault password is needed to mint a recovery code."; paint(); return; }
      busy = true; paint();
      try { recoveryCode = (await invoke("make_recovery_code", { password })).code; notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; await refreshVault(); paint(); }
    });
    wire("si-go", () => signIn("si-pw", "si-profile"));
    wire("sw-go", () => signIn("sw-pw", "sw-profile"));
    wire("si-go2", () => signIn("si-pw2", null));
    wire("seal-go", () => callVault("vault_seal", { password: pwd("seal-pw") }));
    wire("unseal-go", () => callVault("vault_unseal", { password: pwd("sl-pw") }));
    wire("sec-go", () => callVault("vault_secure",
      { label: document.getElementById("sec-label")?.value ?? "", password: pwd("sec-pw") }));
    wire("np-create", () => callVault("vault_create_profile",
      { label: document.getElementById("np-label")?.value ?? "", password: pwd("np-pw") }));

    // Enter submits the password field it is in, because a password field that
    // needs a mouse to submit is one people retype.
    [["si-pw", "si-go"], ["si-pw2", "si-go2"], ["seal-pw", "seal-go"],
     ["sec-pw", "sec-go"], ["np-pw", "np-create"], ["sw-pw", "sw-go"]].forEach(([field, button]) => {
      const input = document.getElementById(field);
      if (input) input.onkeydown = (e) => { if (e.key === "Enter") document.getElementById(button)?.click(); };
    });

    main.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () =>
      call("set_mode", { app: APP, key: b.dataset.key, mode: b.dataset.mode }));
    main.querySelectorAll("[data-unlock]").forEach((b) => b.onclick = () =>
      call("unlock", { duration: b.dataset.unlock, reason: "from PassBook" }));
    main.querySelectorAll("[data-lock]").forEach((b) => b.onclick = () => call("lock"));
    main.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () =>
      call("resolve", { id: b.dataset.ok, approve: true, remember: b.dataset.for }));
    main.querySelectorAll("[data-no]").forEach((b) => b.onclick = () =>
      call("resolve", { id: b.dataset.no, approve: false, remember: "" }));
    main.querySelectorAll("[data-broker]").forEach((b) => b.onclick = () =>
      call("broker", { action: b.dataset.broker }));
    main.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = () =>
      call("revoke", { did: b.dataset.revoke }));
    main.querySelectorAll("[data-forget]").forEach((b) => b.onclick = () =>
      call("forget_machine", { host: b.dataset.forget }));
    main.querySelectorAll("[data-reveal]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.reveal;
      // A press while one is already in flight is the press that caused this:
      // it used to start a second reveal rather than being ignored.
      if (revealing[k]) return;
      if (revealed[k]) { hideValue(k); paint(); return; }
      // Painted before the await, so the press is acknowledged in this frame
      // instead of whenever the store answers.
      revealing[k] = true; notice = ""; paint();
      // The drawing happens on the other side, at the moment the plaintext
      // exists, so the size and colour have to travel with the request rather
      // than with the fetch. What comes back is a token and a length, never the
      // value; the picture is fetched by the <img> the next paint puts on the
      // row. A theme change while a value is showing therefore leaves the old
      // ink on it until it hides, which is a fair price for the plaintext
      // living for microseconds instead of half a minute.
      const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);
      try {
        revealed[k] = { dpr, ...await invoke("reveal_key",
          { name: k, px: 12, scale: dpr, ink: inkHex() }) };
        notice = ""; holdFor(k);
      } catch (e) { notice = String(e); }
      finally { delete revealing[k]; }
      paint();
    });
    main.querySelectorAll("[data-hist]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.hist;
      if (history[k]) { delete history[k]; paint(); return; }
      history[k] = "loading"; paint();
      try { history[k] = await invoke("key_history", { name: k }); }
      catch (e) { history[k] = []; notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-copytext]").forEach((b) => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copytext); markCopied(b.dataset.copymark); }
      catch (e) { notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.copy;
      // `navigator.clipboard.writeText` takes a string, which is why this no
      // longer happens here: it was the one path that put the value back in
      // this heap, on the row's most-used button. On a machine that seals reads
      // it is refused outright, and the refusal says so.
      try {
        await invoke("copy_key", { name: k });
        markCopied(k);
        notice = "";
      } catch (e) { notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => {
      confirming = b.dataset.remove; paint();
    });
    main.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => {
      confirming = null; notice = ""; paint();
    });
    main.querySelectorAll("[data-rmgo]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.rmgo;
      confirming = null; hideValue(k);
      await call("remove_key", { name: k });
    });
    // Clicking the picture asks to replace the value.
    //
    // Replace rather than edit, and the box opens empty rather than filled in.
    // Editing in place would have meant putting the old value back into an
    // input — the exact string in the exact element this whole change exists to
    // avoid — and it was never much of an edit anyway: nobody amends the
    // fourteenth character of an API key, they paste a new one.
    main.querySelectorAll("[data-picture]").forEach((el) => el.onclick = () => {
      replacing[el.dataset.picture] = true;
      paint();
    });
    // A picture drawn at `12 * dpr` belongs on screen at a dpr-th of its own
    // size. Done from the loaded image rather than in CSS because the height a
    // font gives a line is not something this side can know, and a guess would
    // scale every glyph by however wrong it was.
    main.querySelectorAll("[data-picture] img").forEach((img) => {
      const fit = () => {
        const dpr = Number(img.dataset.dpr) || 1;
        if (!img.naturalWidth) return;
        img.style.width = `${img.naturalWidth / dpr}px`;
        img.classList.add("measured");
      };
      if (img.complete) fit(); else img.onload = fit;
    });
    // Saving on blur is how the HivemindOS card behaves; Escape abandons it.
    main.querySelectorAll("[data-replace]").forEach((input) => {
      const k = input.dataset.replace;
      input.onkeydown = (e) => {
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { input.value = ""; input.blur(); }
      };
      input.onblur = async () => {
