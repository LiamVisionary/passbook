    return `<span class="searchwrap">${icon("search", "tinyicon")}
      <input class="search" id="${id}" data-keep="focus" type="search" placeholder="Search keys"
        value="${esc(query)}" spellcheck="false" autocapitalize="off" autocomplete="off" /></span>`;
  }

  /** How many keys the search and the filter leave, beside the box that is doing the narrowing. */
  function searchCount(shown, all) {
    if (!query.trim() && keyFilter === "all") return "";
    return `<span class="searchcount" role="status">${shown} of ${all}</span>`;
  }

  // ── names ──────────────────────────────────────────────────────────────
  /** What a key can be called: what the store itself accepts (`_KEY` in passbook.py). */
  const KEY_NAME = /^[A-Za-z_][A-Za-z0-9_]*$/;

  /** The key already stored under this name, however it was capitalized when typed. */
  function storedName(name) {
    const wanted = String(name).trim().toLowerCase();
    return (state?.store?.keys || []).find((k) => k.toLowerCase() === wanted) || "";
  }

  /** What was typed, as a name the store will take: "my stripe-key" becomes MY_STRIPE_KEY. */
  function tidyName(text) {
    let name = String(text).trim().replace(/[^A-Za-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
    if (!name) return "";
    if (/^[0-9]/.test(name)) name = "_" + name;
    return name.toUpperCase().slice(0, 128);
  }

  /** What the list says when it has nothing to show, and the way out of it.
   *
   *  "Nothing matches" used to be the whole of it. A search that finds nothing is usually one of three
   *  things: a filter still on from earlier, a typo, or a key that is not here yet, and each of those
   *  has one obvious thing to press next.
   */
  function nothingShown(all) {
    const q = query.trim();
    const filter = KEY_FILTERS.find(([id]) => id === keyFilter);
    if (!all) {
      return `<div class="empty">No keys yet.
        <div class="emptyacts"><button class="act primary" data-addnamed="">${icon("plus")} Add your first key</button></div></div>`;
    }
    if (!q) {
      return `<div class="empty">No key is ${esc((filter?.[1] || "like that").toLowerCase())}.
        <div class="emptyacts"><button class="act" data-key-filter="all">Show all keys</button></div></div>`;
    }
    let elsewhere = 0;
    if (filter) { const was = keyFilter; keyFilter = "all"; elsewhere = shownKeys().length; keyFilter = was; }
    const name = tidyName(q);
    return `<div class="empty">Nothing matches “${esc(q)}”${filter ? ` in ${esc(filter[1])}` : ""}.
      <div class="emptyacts">
        ${elsewhere ? `<button class="act primary" data-key-filter="all">Search all keys · ${elsewhere}</button>` : ""}
        <button class="act" data-searchclear="1">Clear search</button>
        ${name && !storedName(name) && !elsewhere ? `<button class="act primary" data-addnamed="${esc(name)}">${icon("plus")} Add ${esc(name)}</button>` : ""}
      </div></div>`;
  }

  /** What the keyboard does on the list, said while the keyboard is being used on it. */
  const MOD_KEY = /Mac|iPhone|iPad/.test(navigator.platform || "") ? "\u2318" : "Ctrl+";
  function listHint() {
    return `<div class="listhint" id="listhint" ${keyCursor && byKeyboard && !notice ? "" : "hidden"}>
      <span><kbd>\u2191</kbd><kbd>\u2193</kbd> move</span><span><kbd>\u21b5</kbd> open</span>
      <span><kbd>${MOD_KEY}C</kbd> copy value</span><span><kbd>${MOD_KEY}E</kbd> change value</span>
      <span><kbd>esc</kbd> done</span></div>`;
  }

  function ago(iso) {
    const then = Date.parse(iso);
    if (!Number.isFinite(then)) return "";
    const s = Math.max(0, Math.round((Date.now() - then) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return `${Math.round(s / 86400)}d ago`;
  }

  function usedLine(k) {
    const u = (state.usage || {})[k];
    // No entry means never read — say that, rather than printing a zero that
    // looks like measured data.
    if (!u || !u.last) return "Never used.";
    const times = u.count === 1 ? "once" : `${u.count} times`;
    return `Last used ${ago(u.last)} by ${esc(u.last_app || "something")} · ${times}`;
  }

  function historyBlock(k) {
    const rows = history[k];
    if (rows === "loading") return `<div class="hist"><div class="foot">Reading the record…</div></div>`;
    if (!rows.length) return `<div class="hist"><div class="foot">Nothing recorded for this key yet.</div></div>`;
    return `<div class="hist">
      ${rows.slice().reverse().map((r) => `
        <div class="ev">
          <span class="when">${esc(ago(r.at))}</span>
          <span class="who">${esc(r.app || "unknown")}${r.reason ? ` — ${esc(r.reason)}` : ""}</span>
          <span class="op">${esc(r.op)}${r.granted === false ? " · denied" : ""}</span>
        </div>
        <div class="proof">${esc(r.proof || "")}</div>`).join("")}
      <div class="foot">Each line is hash-chained to the one before it. A row that
      was edited, removed or reordered breaks every proof after it.</div>
    </div>`;
  }

  function countLabel(shown, all) {
    return query.trim() && shown !== all ? `${shown} of ${all}` : `${all} stored`;
  }
  const modeOf = (key) => {
    const a = (state?.access?.apps || {})[APP] || {};
    return ((a.keys || {})[key] || {}).mode || (a.default || {}).mode || state?.access?.default_mode || "always";
  };

  /** How many of a thing each page is about, so the list carries the shape of
   *  the store rather than eight identical words. */
  /** Whether the page on screen lives on the Settings shelf. The sidebar entry
   *  stays lit while you are inside one, so you always know where you are. */
  const inSettings = () => page === "settings"
    || SETTINGS.some(([id]) => id === page);

  /** The way back out of a settings pane. */
  function settingsBack(title) {
    return `<button class="backlink" data-goto="settings">
      ${icon("chevron", "tinyicon")} Settings</button>
      <h2>${esc(title)}</h2>`;
  }

  function settingsPage() {
    const pending = (state?.broker?.pending || []).length;
    return `
      <h2>Settings</h2>
      <div class="group tight">
        ${SETTINGS.map(([id, label, glyph, blurb]) => `
          <button class="settingrow" data-goto="${id}">
            <span class="statustile plain sm">${icon(glyph)}</span>
            <span class="grow"><span class="settingname">${esc(label)}</span>
              <span class="sub">${esc(blurb)}</span></span>
            ${(id === "access" && pending) || (id === "updates" && updatesWaiting()) ? '<span class="dot"></span>' : ""}
            ${icon("chevron", "tinyicon")}
          </button>`).join("")}
      </div>
      <div class="group tight">
        ${SHEETS.map(([id, label, glyph, blurb]) => `
          <button class="settingrow" data-plan-open="${id}">
            <span class="statustile plain sm">${icon(glyph)}</span>
            <span class="grow"><span class="settingname">${esc(label)}</span>
              <span class="sub">${esc(id === "plan" ? planBlurb(blurb) : blurb)}</span></span>
            ${icon("chevron", "tinyicon")}
          </button>`).join("")}
      </div>
      <div class="group">
        <div class="row">
          <span class="statustile plain sm">${icon("moon")}</span>
          <div class="grow"><span class="settingname">Appearance</span>
            <span class="sub">${appearance === "system" ? "Follows this computer's light or dark setting" : `Always ${appearance}`}</span></div>
          <div class="seg" role="group" aria-label="Appearance">${APPEARANCES.map(([id, label]) =>
            `<button data-appearance="${id}" aria-pressed="${appearance === id}">${label}</button>`).join("")}</div>
        </div>
      </div>`;
  }

  /** An explanation that is true, worth having, and not worth reading twice.
   *
   *  This app explained itself in paragraphs: why a profile is not a store,
   *  what a project name is worth as a claim, why an export is in the ledger.
   *  All of it correct, all of it permanently on screen, and the effect of
   *  putting it everywhere was a window that looked like documentation with
   *  controls embedded in it. Folded away it costs one line until asked for.
   */
  function aside(html, label = "Why") {
    return `<details class="aside"><summary>${esc(label)}</summary>
      <div class="asidebody">${html}</div></details>`;
  }

  function navCounts() {
    const links = state?.links || {};
    return {
      attention: attentionItems().length,
      keys: (state?.store?.keys || []).length,
      signins: (signins || []).length,
      // What the page lists, so the badge and the list cannot disagree.
      machines: (links.lent || []).length + (links.tailnet || []).length
              + (links.borrowed || []).length,
    };
  }

  /** Whether anything can read a credential right now, pinned to the foot of
   *  the source list. It is the one fact that changes what every other page
   *  means, and hunting for it on the Vault page is how people miss it. */
  function navFoot() {
    const v = vault;
    if (!v?.supported) return "";
    const open = !!v.unlocked;
    const bare = (v.plaintext?.length ?? 0) + (v.legacy_v1?.length ?? 0);
    const where = state?.catalog?.workspace || state?.store?.workspace || "";

    // Three states, not two, because "locked" and "protected" are not the same
    // thing and this footer used to say the first while meaning neither.
    //
    // A locked vault over a store that is mostly plaintext is the worst of
    // them: it reads as safety, and the reassurance is the danger. It gets the
    // count in the headline, where "Vault locked" used to sit, because a person
    // who has just pressed Lock is looking at exactly this corner and deserves
    // to be told that pressing it did not do what the word says.
    const exposed = bare > 0;
    const tone = open ? "open" : exposed ? "exposed" : "shut";
    const headline = exposed
      ? `${bare} readable`
      : (open ? "Vault open" : "Vault locked");
    const detail = exposed
      ? "not encrypted on disk"
      : open
        ? profileLabel(v.signed_in_profile) + (v.expires_in ? ` \u00b7 ${humanTime(v.expires_in)} left` : "")
        : "nothing can read it";
    const glyph = exposed ? "alert" : open ? "unlock" : "lock";

    return `<div class="navfoot ${tone}" data-tauri-drag-region="false">
      <button class="navfoot-main" data-page="vault"
        title="${exposed ? `${bare} value(s) are in the clear on disk` : "Workspace and sign-in"}">
        ${icon(glyph, "navicon")}
        <span class="col">
          <span class="navfoot-t">${esc(headline)}</span>
          <span class="navfoot-s">${esc(exposed || !where ? detail : `${where} \u00b7 ${detail}`)}</span>
        </span>
      </button>
      <button class="iconbtn navlock" data-locknow title="Lock this window"
        aria-label="Lock this window">${icon("lock")}</button>
    </div>`;
  }

  function paintNav() {
    const pending = (state?.broker?.pending || []).length;
    const counts = navCounts();
    nav.innerHTML = `
      <div class="brand"><img src="mark.png" alt="" /><span>PassBook</span></div>
      ${attentionEntry(counts.attention)}
      <div class="navlist">${PAGES.map(([id, label, glyph]) => `
        <button data-page="${id}" aria-current="${page === id}">
          ${icon(glyph, "navicon")}<span class="navlabel">${label}</span>
          ${counts[id] ? `<span class="navcount">${counts[id]}</span>` : ""}
        </button>`).join("")}</div>
      <div class="navbottom">
        <button class="palhint" data-palette="1" title="Find a key, a page or something to do">${icon("search", "tinyicon")}<span>Find anything</span><kbd>\u2318K</kbd></button>
        <div class="navlist">
          <button data-page="settings" aria-current="${inSettings()}">
            ${icon("sliders", "navicon")}<span class="navlabel">Settings</span>
            ${pending || updatesWaiting() ? '<span class="dot"></span>' : ""}
          </button>
        </div>
        ${navFoot()}
      </div>`;
    nav.querySelectorAll("[data-palette]").forEach((b) => b.onclick = () => palOpen());
    nav.querySelectorAll("[data-page]").forEach((b) =>
      b.onclick = () => {
        page = b.dataset.page; resetRows(); paint();
        // Opening the Record is the moment somebody wants to know, so ask then
        // — rather than on every poll, whatever page they were on.
        if (page === "record" && !chain.answer && !chain.busy) checkChain();
        if (page === "balances") loadBalances();
        if (page === "machines") loadSync(true);
      });
    // Lock puts the WINDOW away — nothing else. It used to sign the broker out,
    // which meant closing the app at the end of the day also stopped every
    // agent reading credentials overnight; what agent access does is decided on
    // the lock screen this drops you on, by somebody already thinking about it.
    nav.querySelectorAll("[data-locknow]").forEach((b) => b.onclick = () => lockWindow());
  }

  // Mirrors the HivemindOS agent-env card: name and actions on one line, the
  // value on its own line underneath — masked until revealed, editable in
  // place, saved on blur.
  /** Is this key one the machine never prints?
   *
   *  A guarded key has no eye icon, and the missing icon has to explain itself
   *  — an affordance that silently disappears reads as a bug, and somebody
   *  chasing a bug goes looking for the store file, which is the one outcome
   *  this whole feature exists to prevent.
   */
  function isGuarded(k) {
    return !!(state?.access?.guarded && state.access.guarded[k]);
  }

  function guardedWhy(k) {
    const rule = state?.access?.guarded?.[k];
    if (!rule) return "";
    const into = (rule.commands || []).join(", ");
    const to = (rule.destinations || []).join(", ");
    return "Guarded: used, never shown."
      + (into ? ` May be injected into: ${into}.` : "")
      + (to ? ` May be sent to: ${to}.` : "")
      + " Run what needs it with passbook run.";
  }

  /** Keys sitting in the clear, as a set the rows can ask cheaply.
   *
   *  Read from the vault where it answers, else the state's own sealing block.
   *  Both now come from the v2 vault, so they cannot disagree.
   */
  function readableSet() {
    const source = vault?.supported ? vault : state?.sealing;
    const listed = source?.plaintext;
    return new Set(Array.isArray(listed) ? listed : []);
  }

  /** One key, one line.
   *
   *  What was here before put every policy a key has on the row itself: a
   *  reach dropdown, an audience sentence with its own Change button, a
   *  project button, and the last-used line — three lines and five controls,
   *  multiplied by a few hundred. On a store this size the page rendered 363
   *  buttons and 60 dropdowns before you had done anything, and the key names
   *  were the smallest thing on it.
   *
   *  A row is now a name, whether it is hidden, and the two things people
   *  actually do (look, copy). Everything else is a key's *settings*, and it
   *  opens when you ask for it — the same trade every list on this platform
   *  makes, and the reason those lists stay readable at any length.
   */
  function keyRow(k, readable) {
    const shown = revealed[k];
    const open = expanded[k];
    const pending = confirming === k;
    // A key nobody encrypted is not protected by the vault, whatever the vault
    // says about itself. Saying so on the row is the whole point: this app told
    // someone "Vault locked" in the sidebar while the eye icon beside every key
    // still worked, and the sentence that explained why was below 279 rows.
    const bare = readable ? readable.has(k) : false;
    const edit = replacing[k];
    const saved = copied["edit:" + k];
    return `<div class="keyrow${open ? " open" : ""}${k === justAdded ? " justadded" : ""}${k === keyCursor ? " cursor" : ""}"
      data-keyrow="${esc(k)}">
      <div class="head">
        ${selectMode ? `<input type="checkbox" class="pick" data-pick="${esc(k)}"
          ${picked[k] ? "checked" : ""} aria-label="Select ${esc(k)}" />` : ""}
        <span class="named" data-open="${esc(k)}"><span class="mono keyname">${esc(k)}</span>
          <button class="iconbtn namecopy ${copied["name:" + k] ? "done" : ""}" data-copytext="${esc(k)}" data-copymark="name:${esc(k)}"
            title="${copied["name:" + k] ? "Copied" : "Copy key name"}"
            aria-label="Copy the name ${esc(k)}">${icon(copied["name:" + k] ? "check" : "copy")}</button>
          ${shown ? "" : `<span class="masked" title="Hidden">••••••••••</span>`}
          ${bare ? `<span class="bare" title="This value is not encrypted. Anything running as you can read it, signed in or not.">${icon("unlock", "tinyicon")} readable</span>` : ""}
          ${isGuarded(k) ? `<span class="bare guarded" title="${esc(guardedWhy(k))}">${icon("lock", "tinyicon")} guarded</span>` : ""}
          ${refusedWhy(k) ? `<span class="bare refused" title="${esc(refusedWhy(k))}">${icon("alert", "tinyicon")} refused</span>` : ""}</span>
        ${isGuarded(k)
          ? `<button class="iconbtn" disabled title="${esc(guardedWhy(k))}"
               aria-label="Guarded: never shown">${icon("lock")}</button>`
          : revealing[k]
          ? `<button class="iconbtn working" disabled aria-busy="true"
               title="Reading ${esc(k)}…" aria-label="Reading ${esc(k)}">
               <span class="spinner"></span></button>`
          : `<button class="iconbtn ${shown ? "on" : ""}" data-reveal="${esc(k)}"
          title="${shown ? "Hide value" : "Reveal value"}"
          aria-label="${shown ? "Hide value" : "Reveal value"}">${icon(shown ? "eyeOff" : "eye")}</button>`}
        <button class="iconbtn ${copied[k] ? "done" : ""}" data-copy="${esc(k)}"
          title="${copied[k] ? "Copied" : "Copy value"}"
          aria-label="${copied[k] ? "Copied" : "Copy value"}">${icon(copied[k] ? "check" : "copy")}</button>
        <button class="iconbtn ${saved ? "done" : edit ? "on" : ""}" data-edit="${esc(k)}"
          title="${saved ? "Saved" : edit ? "Keep the current value" : "Change value"}"
          aria-label="${saved ? "Saved" : edit ? `Keep the current value of ${esc(k)}` : `Change the value of ${esc(k)}`}"
          >${icon(saved ? "check" : "pencil")}</button>
        <button class="iconbtn danger" data-remove="${esc(k)}" title="Remove"
          aria-label="Remove ${esc(k)}">${icon("trash")}</button>
        <button class="iconbtn disclose" data-open="${esc(k)}"
          title="${open ? "Hide settings" : "Settings for this key"}"
          aria-expanded="${open}"
          aria-label="Settings for ${esc(k)}">${icon("chevron")}</button>
      </div>
      ${edit ? `<div class="valedit">
          <input class="val" id="edit-${esc(k)}" data-keep data-replace="${esc(k)}" value=""
            spellcheck="false" autocapitalize="off" autocomplete="off" ${edit.saving ? "disabled" : ""}
            aria-label="New value for ${esc(k)}" placeholder="Paste or type the new value for ${esc(k)}" />
          <button class="act" data-editcancel="${esc(k)}" ${edit.saving ? "disabled" : ""}>Cancel</button>
          <button class="act primary" data-editsave="${esc(k)}" ${edit.saving ? "disabled" : ""}>${edit.saving
            ? `<span class="spinner"></span> Saving…` : "Save"}</button>
        </div>
        ${edit.error ? `<div class="note flat err valnote" role="alert">${esc(edit.error)}</div>`
          : `<div class="note flat valnote">The new value replaces the old one for everything that uses this key.
              <span class="keyhints"><kbd>↵</kbd> save <kbd>esc</kbd> cancel</span></div>`}`
       : revealing[k] ? `<div class="val loading" role="status" aria-live="polite">
           <span class="spinner"></span>Reading ${esc(k)}…</div>`
       : shown ? valuePicture(k) : ""}
      ${pending ? `<div class="confirmstrip">
        <span class="grow">Remove it? Another app may be using it, and the value is
          not recoverable from here.</span>
        <button class="act" data-cancel="1">Cancel</button>
        <button class="act destructive" data-rmgo="${esc(k)}" ${busy ? "disabled" : ""}>
          ${icon("trash")} Remove</button>
      </div>` : ""}
      ${open ? keyDetail(k) : ""}
    </div>`;
  }

  /** A key's settings, shown only while its row is open.
   *
   *  Every control that used to sit on the row lives here, plus the one that
   *  used to have a page of its own: whether a read is answered, asked about
   *  or refused. That was a list of all 281 keys with a three-way switch on
   *  each — 854 buttons to change one of them, on a page whose other half was
   *  about something else entirely.
   *
   *  Two columns, and the second one is only as wide as the widest control in
   *  it. The first version pushed each control to the right edge of the panel
   *  with `margin-left: auto`, which on a full-width window left a hand's
   *  width of nothing between a label and the thing it labels — the eye has to
   *  travel it on every row, and on a wide screen it gets worse, not better.
   *
   *  Nothing here opens a different view. Apps and Projects each used to be a
   *  button that replaced the whole panel with an editor, three clicks and a
   *  Save to change what is now one click on a switch that was already on
   *  screen. They are the same three-way choice as the row above them, so they
   *  are drawn the same way and applied the same way: immediately.
   */
  function keyDetail(k) {
    const cat = state.catalog || {};
    const aud = cat.audiences?.[k];
    const proj = cat.projects?.[k];
    const used = usedLine(k);
    const mode = modeOf(k);

    // A draft exists only between choosing "Only chosen" and picking the first
    // name, because until then there is no rule that could be saved.
    const audDraft = (audienceFor === k && audienceDraft)
      || { mode: aud?.mode || "all", agents: [...(aud?.agents || [])] };
    const projDraft = (projectsFor === k && projectsDraft)
      || { mode: proj?.mode || "all", projects: [...(proj?.projects || [])] };

    const seg = (attr, chosen, options) => `<div class="seg">${options.map(([id, label]) =>
      `<button data-${attr}="${id}" data-key="${esc(k)}" aria-pressed="${chosen === id}"
        ${busy ? "disabled" : ""}>${esc(label)}</button>`).join("")}</div>`;

    const chips = (attr, all, chosen, empty) => `<div class="dfull pickrow">
      ${all.length ? all.map((name) => `
        <button class="pickchip" data-${attr}="${esc(name)}" data-key="${esc(k)}"
          aria-pressed="${chosen.includes(name)}" ${busy ? "disabled" : ""}
          >${esc(name)}</button>`).join("")
        : `<span class="sub">${esc(empty)}</span>`}
      ${chosen.length ? "" : `<span class="sub">Pick at least one — nothing changes until you do.</span>`}
    </div>`;

    const known = cat.agents || [];
    const seenProjects = [...new Set([...(cat.projects_seen || []),
                                      ...(cat.project ? [cat.project] : []),
                                      ...projDraft.projects])].sort();

    return `<div class="keydetail">
      ${used ? `<p class="usedline dfull">${esc(used)}</p>` : ""}

      <div class="drow"><span class="dlabel">When something asks</span>
        ${seg("mode", mode, [["always", MODE.always[0]], ["ask", MODE.ask[0]],
                             ["never", MODE.never[0]]])}</div>

      <div class="drow"><span class="dlabel">Shared with</span>${scopePicker(k)}</div>

      <div class="drow"><span class="dlabel">Apps</span>
        ${seg("audmode", audDraft.mode, [["all", "Every app"], ["include", "Only chosen"],
                                         ["exclude", "All except"]])}</div>
      ${audDraft.mode === "all" ? ""
        : chips("audagent", known, audDraft.agents,
                "No app has asked for a credential yet, so there is nobody to choose.")}

      <div class="drow"><span class="dlabel">Projects</span>
        ${seg("projmode", projDraft.mode, [["all", "Every project"], ["include", "Only these"],
                                           ["exclude", "All except"]])}</div>
      ${projDraft.mode === "all" ? "" : `
        ${chips("projname", seenProjects, projDraft.projects, "")}
        <div class="dfull addrow two">
          <input id="proj-new" placeholder="Another project name" spellcheck="false"
            value="${esc(projectTyped)}" />
          <button class="act" data-projadd data-key="${esc(k)}">${icon("plus")} Add</button>
        </div>`}

      <div class="drow"><span class="dlabel">On your devices</span>
        <span class="sub">${esc(whereLine(k))}</span></div>

      ${accountRows(k)}

      <div class="drow"><span class="dlabel">Replace it</span>
        <button class="act" data-rotate-open="${esc(k)}">${rotateView.key === k ? "Close" : "Rotate…"}</button></div>
      ${rotateView.key === k ? `<div class="dfull">${rotatePanel(k)}</div>` : ""}

      <div class="drow"><span class="dlabel">History</span>
        <button class="act" data-hist="${esc(k)}">${history[k] ? "Hide" : "Who has used this"}</button></div>
      ${history[k] ? `<div class="dfull">${historyBlock(k)}</div>` : ""}
    </div>`;
  }

  /** Where a key is, in a sentence. */
  function whereLine(k) {
    const d = syncView.data;
    if (!d) return "Not checked yet.";
    const others = (d.devices || []).filter((r) => r.reachable);
    if (!others.length) return "Only this device is exchanging keys right now.";
    const lacking = lackingDevices(k);
    if (!lacking.length) return `This device and ${others.length === 1 ? deviceName(others[0].host) : `all ${others.length} others`}.`;
    return `Not on ${lacking.map(deviceName).join(", ")} yet.`;
  }

  // ── whose account a key is in ─────────────────────────────────────────
  //
  // `passbook account` (passbook_accounts.py): the email the provider account signs in with, how it signs
  // in, and its name. Signing in the wrong way at a provider makes a new, empty account (Liam, 2026-11-24:
  // a Google sign-in to DeepInfra, whose account signs in with GitHub), so the key's page says which
  // account to sign in to. Found by asking the provider where it will say; typed here where it will not.
  let accountEdit = { key: "", draft: null, busy: "", error: "", said: "" };

  function accountRows(k) {
    const acc = state.catalog?.accounts || {};
    const entry = acc.entries?.[k], askable = (acc.askable || []).includes(k), v = accountEdit;
    const busy = v.key === k && !!v.busy;
    const ask = askable ? `<button class="act" data-account-lookup="${esc(k)}" ${busy ? "disabled" : ""}>${v.key === k && v.busy === "lookup" ? "Asking…" : "Ask the provider"}</button>` : "";
    const said = v.key === k && (v.error || v.said) ? `<p class="note flat dfull">${esc(v.error || v.said)}</p>` : "";
    if (v.key !== k || !v.draft) {
      return `<div class="drow"><span class="dlabel">Account</span>
        <div><span class="sub">${entry ? `${esc(entry.line)} <small>(${esc(entry.said)})</small>` : "Not recorded: which account is this key made in?"}</span>
        <span class="chips inline">${ask}<button class="act" data-account-edit="${esc(k)}">${entry ? "Change" : "Add"}</button></span></div></div>${said}`;
    }
    const d = v.draft, vias = Object.entries(acc.via || {});
    return `<div class="drow"><span class="dlabel">Account</span><span class="sub">The provider account this key was made in. Kept on this device only.</span></div>
      <div class="dfull addrow two">
        <input id="acct-email" data-account-field="email" placeholder="Email it signs in with" spellcheck="false" autocomplete="off" value="${esc(d.email)}" />
        <select id="acct-via" data-account-field="via"><option value="">Signs in with…</option>${vias.map(([id, label]) =>
          `<option value="${esc(id)}" ${d.via === id ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>
      </div>
      <div class="dfull addrow two" style="grid-template-columns: minmax(0,1fr) minmax(0,1fr)">
        <input id="acct-name" data-account-field="account" placeholder="Account or team name (optional)" spellcheck="false" autocomplete="off" value="${esc(d.account)}" />
        <input id="acct-note" data-account-field="note" placeholder="Note: region, which console (optional)" spellcheck="false" autocomplete="off" value="${esc(d.note)}" />
      </div>
      <div class="dfull chips inline">
        <button class="act" data-account-save="${esc(k)}" ${busy ? "disabled" : ""}>${v.busy === "save" ? "Saving…" : "Save"}</button>
        <button class="act" data-account-cancel ${busy ? "disabled" : ""}>Cancel</button>${ask}
      </div>${said}`;
  }

  async function accountStep(k, command, args, busyAs) {
    accountEdit = { ...accountEdit, key: k, busy: busyAs, error: "", said: "" }; paint();
    try {
      const answer = await invoke(command, args);
      if (command === "account_lookup") {
        const r = (answer?.results || [])[0] || {};
        accountEdit.said = r.status === "found" ? "Found by asking the provider."
          : r.status === "kept" ? "The provider was asked about this key before; nothing changed."
          : r.status === "not-allowed" ? "This key may not read who owns it. Add the account by hand."
          : r.status === "rejected" ? "The provider rejected the key."
          : r.status === "unsaid" ? "The provider answered without naming an account."
          : "The provider could not be asked just now.";
        if (r.status === "found" && accountEdit.draft) accountEdit.draft = null;
      } else {
        accountEdit.draft = null;
      }
      state = await invoke("state");
    } catch (e) { accountEdit.error = String(e?.message || e); }
    accountEdit.busy = ""; paint();
  }

  // ── rotating a key ─────────────────────────────────────────────────────
  //
  // `passbook rotate` already does this well from a terminal: replace the value, push it to every
  // service that holds the key, keep the old one until the new one is confirmed, roll back if not. The
  // window had no way in. This is the same verb as four steps on the key itself: make the new key at
  // the provider, paste it, see where it went, then say it works or put the old one back.
  let rotateView = { key: "", data: null, busy: "", error: "", check: null };

  /** Open a key's Rotate steps. From the key itself the button also closes them; from anywhere else
   *  (`stay`) it only ever opens. */
  async function openRotate(k, stay = false) {
    if (rotateView.key === k && !stay) { rotateView = { key: "", data: null, busy: "", error: "", check: null }; paint(); return; }
    rotateView = { key: k, data: null, busy: "load", error: "", check: null };
    showKeyRow(k);
    try { rotateView.data = await invoke("rotate_status", { key: k }); }
    catch (e) { rotateView.error = balanceError(e); }
    rotateView.busy = ""; paint();
    scrollToKey(k, "nearest");
  }

  const scrollToKey = (k, block) => [...main.querySelectorAll("[data-keyrow]")].find((el) => el.dataset.keyrow === k)?.scrollIntoView({ block });

  /** Bring one key's row on screen: the Keys page, past any search or filter that hides it, its group
   *  unfolded, and far enough down the list that its row has been built.
   *
   *  It used to count how far down the key was in the plain list of names. The page is listed by group,
   *  which is a different order, and a folded group builds no rows at all: Find anything, then Enter on
   *  a key in a folded or far-down group, landed on Keys with nothing opened and nothing in view.
   */
  function bringKeyRow(k, open = false) {
    page = "keys";
    if (!shownKeys().includes(k)) { query = ""; keyFilter = "all"; }
    for (const [group, members] of Object.entries(state?.catalog?.groups || {})) {
      if (members.includes(k)) delete collapsed[group];
    }
    const where = rowOrder(shownKeys()).indexOf(k);
    if (where >= rowLimit) rowLimit = where + ROW_PAGE;
    if (open) expanded[k] = true;
    keyCursor = k;
    paint();
    scrollToKey(k, open ? "center" : "nearest");
  }
  const showKeyRow = (k) => bringKeyRow(k, true);

  async function rotateStep(busyAs, command, args) {
    rotateView.busy = busyAs; rotateView.error = ""; paint();
    try {
      const answer = await invoke(command, args);
      if (command === "rotate_verify") rotateView.check = answer;
      else {
        rotateView.data = answer;
        if (answer && answer.ok === false) rotateView.error = (answer.problems || []).join(" ") || "That did not go through.";
        state = await invoke("state");
      }
    } catch (e) { rotateView.error = balanceError(e); }
    rotateView.busy = ""; paint();
  }

  function rotatePanel(k) {
    const v = rotateView, d = v.data;
    if (!d) return `<div class="rotate"><p class="note flat">${v.error ? esc(v.error) : "Looking up where this key lives…"}</p></div>`;
    const busy = !!v.busy, pending = d.pending, provider = d.provider;
    const where = `<div class="rotwhere">
        ${(d.services || []).length ? `<div><span class="dlabel">${pending ? "PassBook updated" : "PassBook will update"}</span><div class="chips inline">${d.services.map((x) =>
          `<span class="chip">${esc(x.service)}${pending && x.service in (pending.pushed || {}) ? (pending.pushed[x.service] ? " \u2713" : " \u2717") : ""}</span>`).join("")}</div></div>` : ""}
        ${(d.places || []).length ? `<div><span class="dlabel">Update these yourself</span><div class="chips inline">${d.places.map((x) =>
          `<span class="chip">${esc(x.where)}${x.note ? ` (${esc(x.note)})` : ""}</span>`).join("")}</div></div>` : ""}
        ${!(d.services || []).length && !(d.places || []).length ? `<p class="note flat">No service is recorded as holding this key, so only this store and your other devices change.</p>` : ""}
      </div>`;
    if (!pending) {
      return `<div class="rotate">
        <div class="rotstep"><span class="stepno">1</span><div class="grow"><strong>Make a new key${provider ? ` at ${esc(provider.name)}` : ""}</strong>
          <div class="note flat">Create the new one before removing the old, so nothing stops working in between.</div>
          ${d.account?.line ? `<div class="note flat">Sign in to the account it belongs to: <strong>${esc(d.account.line)}</strong>.</div>` : ""}</div>
          ${provider ? `<button class="act" data-topup="${esc(provider.id)}">Open ${esc(provider.name)}</button>` : ""}</div>
        <div class="rotstep"><span class="stepno">2</span><div class="grow"><strong>Paste it here</strong>
          <div class="note flat">PassBook replaces the value, sends it to your other devices, and keeps the old one until you say the new one works.</div>
          ${where}
          <div class="alform"><input id="rotvalue" data-keep type="password" autocomplete="off" spellcheck="false" placeholder="The new value for ${esc(k)}" size="36" />
            <button class="act primary" data-rotate-start="${esc(k)}" ${busy ? "disabled" : ""}>${v.busy === "start" ? "Replacing…" : "Replace"}</button></div></div></div>
        ${v.error ? `<p class="note flat err">${esc(v.error)}</p>` : ""}
      </div>`;
    }
    const failed = Object.entries(pending.pushed || {}).filter(([, ok]) => !ok).map(([name]) => name);
    const checked = v.check;
    return `<div class="rotate">
      <div class="rotstep"><span class="stepno done">${icon("check", "tinyicon")}</span><div class="grow"><strong>${pending.restored ? "The previous value is back in place" : "The new value is in place"}</strong>
        <div class="note flat">Since ${esc(sinceEpoch(pending.startedAt, "a moment ago"))}. ${pending.restored ? "" : "The previous value is still kept, in case this one does not work."}</div>
        ${where}
        ${failed.length ? `<p class="note flat err">Did not take it: ${esc(failed.join(", "))}. Try again from a terminal: passbook services retry ${esc(k)}</p>` : ""}</div></div>
      <div class="rotstep"><span class="stepno">3</span><div class="grow"><strong>Check it works</strong>
        <div class="note flat">${provider?.canVerify
          ? (checked ? esc(checked.status === "ready" ? `${provider.name} accepted it.` : checked.rejected ? `${provider.name} refused it: ${checked.message}` : `${provider.name} did not give a clear answer: ${checked.message}`)
                     : `PassBook can ask ${esc(provider.name)} with the new value.`)
          : "PassBook cannot ask this service itself. Run whatever uses the key and see that it still works."}</div></div>
        ${provider?.canVerify ? `<button class="act" data-rotate-verify="${esc(provider.id)}" ${busy ? "disabled" : ""}>${v.busy === "verify" ? "Asking…" : checked ? "Ask again" : "Ask now"}</button>` : ""}</div>
      <div class="rotstep"><span class="stepno">4</span><div class="grow"><strong>Finish</strong>
        <div class="note flat">Confirming forgets the previous value for good. Putting it back also sends it to the services that got the new one.</div></div>
        <button class="act" data-rotate-finish="rollback" data-key="${esc(k)}" ${busy ? "disabled" : ""}>${v.busy === "rollback" ? "Putting it back…" : "Put the old one back"}</button>
        <button class="act primary" data-rotate-finish="confirm" data-key="${esc(k)}" ${busy ? "disabled" : ""}>${v.busy === "confirm" ? "Confirming…" : "It works"}</button></div>
      ${v.error ? `<p class="note flat err">${esc(v.error)}</p>` : ""}
    </div>`;
  }

  /** Show a tick on one button for a moment, then put it back.
   *
   *  Held in state rather than done to the element, because a paint replaces
   *  every node — a class set on the button would be gone by the next tick of
   *  the background refresh.
   */
  let openTimer = 0;
  /** Whether somebody has text selected inside `root` right now. */
  function selectionIn(root) {
    const chosen = window.getSelection?.();
    if (!chosen || chosen.isCollapsed || !String(chosen).trim()) return false;
    return !!chosen.anchorNode && root.contains(chosen.anchorNode);
  }

  /** Whether the text of this key's name is what is selected. Asked of the row as it is now, by name:
   *  the element that was clicked may have been replaced by a repaint since. */
  function selectingName(k) {
    const row = keyRowEl(k);
    const name = row?.querySelector(".keyname");
    return !!name && selectionIn(name);
  }

  const keyRowEl = (k) => [...main.querySelectorAll("[data-keyrow]")].find((el) => el.dataset.keyrow === k) || null;

  // ── changing a value ───────────────────────────────────────────────────
  //
  // The only way to change a value used to be: reveal it, then click the picture of it. Nothing on the
  // row said so, a guarded key (which is never revealed) could not be changed at all, and the box that
  // opened saved whatever was in it the moment it lost focus — so clicking away to check something
  // overwrote a working credential with half a paste ("i search a key and there is no way to edit it",
  // Liam 2026-11-24). Every row has a pencil now. It opens the same empty box, and the box has a Save
  // and a Cancel: Enter saves, Escape cancels, and clicking elsewhere does neither.
  function editValue(k) {
    if (replacing[k]) { cancelEdit(k); return; }
    replacing[k] = { saving: false, error: "" };
    keyCursor = k;
    paint();
    document.getElementById("edit-" + k)?.focus();
  }

  function cancelEdit(k) {
    if (replacing[k]?.saving) return;
    const box = document.getElementById("edit-" + k);
    if (box) box.value = "";
    delete replacing[k];
    paint();
  }

  async function saveValue(k) {
    const edit = replacing[k];
    const box = document.getElementById("edit-" + k);
    if (!edit || edit.saving || !box) return;
    const next = box.value;
    if (!next.trim()) {
      edit.error = "Paste or type the new value first.";
      paint(); document.getElementById("edit-" + k)?.focus();
      return;
    }
    edit.saving = true; edit.error = ""; paint();
    try { state = await invoke("add_key", { name: k, value: next, replace: true }); notice = ""; }
    catch (e) {
      // The box keeps what was typed: a refused save should not cost the paste as well.
      edit.saving = false; edit.error = said(e);
      paint(); document.getElementById("edit-" + k)?.focus();
      return;
    }
    // Somebody typed this, so for these few seconds the window does hold a
    // value — unavoidably, since the typing happened here. It is dropped as
    // soon as the store has it, rather than left sitting in a field.
    const typed = document.getElementById("edit-" + k);
    if (typed) typed.value = "";
    delete replacing[k];
    hideValue(k);
    markCopied("edit:" + k);
    watchSending([k]);
    paint();
  }

  /** Open or close a key's settings. */
  function toggleKeyRow(k) {
    if (expanded[k]) delete expanded[k]; else expanded[k] = true;
    // Leaving a row closes whatever editor it had open, so reopening it
    // starts from the summary rather than half-way through a change.
    if (!expanded[k]) {
      if (audienceFor === k) { audienceFor = null; audienceDraft = null; }
      if (projectsFor === k) { projectsFor = null; projectsDraft = null; }
    }
    paint();
  }

  /** Put a key's value on the clipboard, from its button or from the keyboard. */
  async function copyValue(k) {
    // `navigator.clipboard.writeText` takes a string, which is why this does
    // not happen here: it was the one path that put the value back in this
    // heap, on the row's most-used button. On a machine that seals reads it is
    // refused outright, and the refusal says so.
    try {
      await invoke("copy_key", { name: k });
      markCopied(k);
      notice = "";
    } catch (e) { notice = said(e); }
    paint();
  }

  function markCopied(mark) {
    if (!mark) return;
    copied[mark] = true;
    clearTimeout(copiedTimers[mark]);
    copiedTimers[mark] = setTimeout(() => {
      delete copied[mark];
      delete copiedTimers[mark];
      paintKeepingCaret();
    }, 1400);
  }

  const chosen = () => Object.keys(picked).filter((k) => picked[k]);

  /** What you can do to a handful of keys at once.
   *
   *  Only appears once something is ticked. Scoping many keys and removing many
   *  keys are the two jobs worth doing in bulk; both are one-by-one otherwise,
   *  and a store of a few hundred makes that unbearable.
   */
  function bulkBar(shown) {
    const on = chosen();
    if (!on.length) return "";
    const cat = state.catalog;
    const locked = on.filter((k) => cat?.scopes?.[k] && !cat.scopes[k].may_change);
    return `<div class="bulkbar ${bulkConfirm ? "confirm" : ""}">
      <span class="grow"><strong>${on.length}</strong> selected</span>
      ${bulkConfirm ? `
        <span class="warn">${icon("alert")} Remove ${on.length} key${on.length === 1 ? "" : "s"}?
          Other apps on this device may be using ${on.length === 1 ? "it" : "them"},
          and ${on.length === 1 ? "it is" : "they are"} not recoverable from here.</span>
        <button class="act" data-bulkcancel>Cancel</button>
        <button class="act destructive" data-bulkgo ${busy ? "disabled" : ""}>
          ${icon("trash")} Remove ${on.length}</button>
      ` : `
        <select class="scope" data-bulkscope ${busy ? "disabled" : ""}>
          <option value="">Share with…</option>
          ${(cat?.scope_options || []).map((s) =>
            `<option value="${s}">${esc(SCOPE_WORDS[s] || s)}</option>`).join("")}
        </select>
        <button class="act" data-bulkgithub ${busy ? "disabled" : ""}>${icon("out")} Send to GitHub</button>
        <button class="act danger" data-bulkremove ${busy ? "disabled" : ""}>${icon("trash")} Remove</button>
        <button class="act" data-bulkclear>Clear</button>
      `}
      ${locked.length && !bulkConfirm ? `<div class="note">${locked.length} of these
        ${locked.length === 1 ? "is" : "are"} owned by another workspace and will not
        change.</div>` : ""}
    </div>`;
  }

  /** Key rows, arranged by group.
   *
   *  A few hundred keys as one flat list is a list nobody reads. Groups are
   *  inferred from the names people already use, so this costs nobody any
   *  tagging — and a search collapses back to a flat list, because when you are
   *  hunting one key the headings are in the way.
   */
  /** The row that says how many are not built yet, and loads them when reached.
   *
   *  Kept as a real element rather than a scroll handler: an observer fires
   *  once when it comes into view, where a scroll handler fires on every pixel
   *  and then has to measure the page to decide it has nothing to do. It is
   *  also a button, so this works from the keyboard and without the observer.
   */
  function moreRow(remaining) {
    if (remaining <= 0) return "";
    return `<button class="morerow" data-more="1">${icon("chevron", "tinyicon")}
      Show ${Math.min(remaining, ROW_PAGE)} more · ${remaining} not shown</button>`;
  }

  /** The keys as the groups they are listed under, or null when the list is flat.
   *  Groups are the default view. A search, a filter or an order is a question about keys, not groups. */
  function keyBuckets(keys) {
    const cat = state.catalog;
    if (!cat?.available || query.trim() || keyFilter !== "all" || keySort !== "group") return null;
    const shown = new Set(keys);
    const buckets = [];
    for (const [group, members] of Object.entries(cat.groups || {})) {
      const here = members.filter((m) => shown.has(m));
      if (here.length) buckets.push([group, here]);
    }
    return buckets.length < 2 ? null : buckets;
  }

  /** The keys in the order their rows are built, which is the order `rowLimit` counts through. */
  function rowOrder(keys) {
    const buckets = keyBuckets(keys);
    return buckets ? buckets.flatMap(([group, members]) => collapsed[group] ? [] : members) : keys;
  }

  function groupedKeys(keys) {
    if (!keys.length) return "";
    const cat = state.catalog;
    const readable = readableSet();
    const flat = () => keys.slice(0, rowLimit).map((k) => keyRow(k, readable)).join("")
      + moreRow(keys.length - rowLimit);
    const buckets = keyBuckets(keys);
    if (!buckets) return flat();

    // The window ends where the rows run out, headings included. An earlier
    // version kept emitting every group and only withheld their rows, which
    // left thirty group headers with nothing under them — indistinguishable
    // from thirty empty groups. A list that simply stops, with a count of what
    // is below it, is the one people already know how to read.
    //
    // A group's count is the whole group in the current filter, not the part
    // that happens to be built: a number that changed as you scrolled would be
    // no use for deciding whether to open one.
    let budget = rowLimit;
    let held = 0;
    const parts = [];
    for (const [group, members] of buckets) {
      const shut = collapsed[group];
      // A group somebody folded shut costs no rows, so it stays a landmark
      // however far down the list it is, and none of it counts as withheld —
      // it is not shown because it was closed, which is a different thing.
      if (!shut && budget <= 0) { held += members.length; continue; }
      const room = shut ? [] : members.slice(0, budget);
      budget -= room.length;
      held += members.length - room.length - (shut ? members.length : 0);
      const restricted = members.filter((m) => cat.audiences?.[m]).length;
      parts.push(`<div class="grouprow" data-group="${esc(group)}" role="button" tabindex="0"
                aria-expanded="${!shut}">
          <span class="caret">${icon("chevron", "tinyicon")}</span>
          ${avatar(group)}
          <span class="gname">${esc(group)}</span>
          <span class="gcount">${members.length}</span>
          ${restricted ? `<span class="grestricted">${icon("shield", "tinyicon")}
            ${restricted} restricted</span>` : ""}
        </div>
        ${room.map((k) => keyRow(k, readable)).join("")}`);
    }
    return parts.join("") + moreRow(held);
  }

  const SCOPE_WORDS = {
    workspace: "This workspace only",
    machine: "This device",
    tailnet: "All my devices",
  };

  /** How far a key reaches, and whether this workspace may say.
   *
   *  Widening a scope hands a credential to workspaces that did not have it, so
   *  the workspace it came from keeps that decision. A borrowing workspace sees
   *  the scope and can read the key; it cannot pass it on. Otherwise sharing a
   *  key would hand over the power to share it onward, which is not sharing.
   */
  function scopePicker(k) {
    const cat = state.catalog;
    const rule = cat?.scopes?.[k];
    if (!rule) return "";
    const options = (cat.scope_options || []).map((s) =>
      `<option value="${s}"${s === rule.scope ? " selected" : ""}>${esc(SCOPE_WORDS[s] || s)}</option>`
    ).join("");
    if (!rule.may_change) {
      return `<span class="scope locked" title="Only the ${esc(rule.owner)} workspace can change this">
        ${icon("lock", "tinyicon")} ${esc(SCOPE_WORDS[rule.scope] || rule.scope)}
        · set by ${esc(rule.owner)}</span>`;
    }
    return `<select class="scope" data-scope="${esc(k)}" ${busy ? "disabled" : ""}
      title="Where this key can be used">${options}</select>`;
  }

  /** The store.
   *
   *  The page used to open with a paragraph explaining what a store is, a
   *  headline reading "281 STORED · WORKSPACE MAIN", a permanently open
   *  two-field add form, a checkbox on every row, and the file path in grey at
   *  the bottom. All of that was on screen before you had asked for any of it.
   *
   *  What is left is a search box and the keys. Adding one and selecting
   *  several are both things you do occasionally and deliberately, so both are
   *  a press away; the path and the encryption panel moved to Settings, where
   *  the rest of the machine's plumbing already lives.
   */
  function keysPage() {
    const s = state.store || {};
    const keys = shownKeys();
    const all = (s.keys || []).length;
    return `
      <h2>Keys</h2>
      <div class="group keys">
        <div class="keyshead">
        <div class="toolbar">
          ${searchField("q-keys")}
          ${searchCount(keys.length, all)}
          <span class="grow"></span>
          ${all ? `<button class="act ${selectMode ? "primary" : ""}" data-selectmode="1">
            ${selectMode ? "Done" : "Select"}</button>` : ""}
          <button class="act" data-addopen="1" aria-expanded="${adding}"
            title="${adding ? "Put the form away" : `Add a key (${MOD_KEY}N)`}">
            ${adding ? "Close" : `${icon("plus")} Add key`}</button>
        </div>
        ${adding ? (pasted ? pastedPanel() : addPanel()) : ""}
        ${keyFilterBar()}
        ${selectMode ? bulkBar(keys) : ""}
        </div>
        ${groupedKeys(keys) || nothingShown(all)}
      </div>
      ${query.trim() || !all ? "" : `<p class="note countnote">${countLabel(keys.length, all)}</p>`}
      ${listHint()}`;
  }

  // ── adding a key ───────────────────────────────────────────────────────
  //
  // What was wrong with the form, each of them seen in the window (2026-11-24):
  //   · Enter did nothing in either field. The only way to add was to reach for the button.
  //   · Pressing Add emptied both fields at once and grayed the button, with no word about what was
  //     happening, until the key had been sent to the other devices as well as written on this one. If
  //     the add was then refused, what had been typed was already gone.
  //   · A name that was already here was answered with a green "Added" while the store kept the old
  //     value: `passbook add` leaves an existing key alone unless told to replace it, and exits 0.
  //   · A name the store cannot take ("my key") came back as "Nothing on stdin looked like KEY=value".
  //
  // So the form has its own state. `busy` is this form's alone, so the rest of the page keeps working
  // while a key is being added; what was typed stays where it is until the store has it; and the line
  // under the fields says, as the name is typed, when it is already here or cannot be a name.
  let addForm = { busy: false, replacing: false, error: "", did: "", sent: null };

  function addPanel() {
    const f = addForm;
    return `<div class="addrow">
        <input id="k" data-keep placeholder="Name, like OPENAI_API_KEY" spellcheck="false" autocapitalize="off"
          autocomplete="off" aria-label="Name of the key" ${f.busy ? "disabled" : ""} />
        <input id="v" data-keep type="password" placeholder="Value" autocomplete="off"
          aria-label="Value of the key" ${f.busy ? "disabled" : ""} />
        <button class="act primary${justAdded && !f.busy ? " done" : ""}" id="addgo" ${f.busy ? "disabled" : ""}>${
          f.busy ? `<span class="spinner"></span> ${f.replacing ? "Replacing…" : "Adding…"}`
          : justAdded ? `${icon("check")} ${esc(f.did || "Added")}` : "Add"}</button>
      </div>
      <div class="addhint" id="addhint"></div>`;
  }

  /** The line under the two fields: what is wrong, or what pressing Add will do, or nothing much. */
  function addHint() {
    const hint = document.getElementById("addhint");
    const nameBox = document.getElementById("k"), valueBox = document.getElementById("v");
    const go = document.getElementById("addgo");
    if (!hint || !nameBox || !valueBox) return;
    const f = addForm, name = nameBox.value.trim();
    const held = name ? storedName(name) : "";
    const tidy = name && !KEY_NAME.test(name) ? tidyName(name) : "";
    const shape = name ? null : valueShape(valueBox.value);
    let html;
    if (f.error) html = `<span class="err" role="alert">${esc(f.error)}</span>`;
    else if (name && !KEY_NAME.test(name)) {
      html = `<span class="err">A name is letters, digits and underscores, and does not start with a digit.</span>
        ${tidy ? `<button class="act" id="usename" data-name="${esc(tidy)}">Use ${esc(tidy)}</button>` : ""}`;
    } else if (held) {
      html = `<span class="sub"><span class="mono">${esc(held)}</span> is already here.
        Saving replaces its value for everything that uses it.</span>`;
    } else if (shape) {
      html = `<span class="sub">Looks like a key from ${esc(shape[2])}.</span>
        <button class="act" id="usename" data-name="${esc(shape[1])}">Name it ${esc(shape[1])}</button>`;
    } else if (f.sent) {
      html = `<span class="sub${f.sent.bad ? " err" : ""}">${f.sent.busy ? `<span class="spinner"></span>` : ""}${esc(f.sent.text)}</span>`;
    } else {
      html = `<span class="sub">Paste <span class="mono">NAME=value</span> lines, or a whole .env, to add several at once.</span>`;
    }
    hint.innerHTML = html;
    if (go && !f.busy && !(justAdded && !name)) go.textContent = held ? "Replace value" : "Add";
    const use = document.getElementById("usename");
    if (use) use.onclick = () => {
      nameBox.value = use.dataset.name; f.error = ""; addHint();
      (valueBox.value ? go : valueBox)?.focus();
    };
  }

  /** Open the form, with a name already in it when one is known. */
  function openAdd(name = "") {
    page = "keys"; adding = true; pasted = null; addForm.error = ""; notice = "";
    paint();
    const box = document.getElementById("k");
    if (!box) return;
    if (name) box.value = name;
    addHint();
    box.focus();
    try { box.setSelectionRange(box.value.length, box.value.length); } catch { /* refused */ }
  }

  function closeAdd() {
    if (addForm.busy) return;
    for (const id of ["k", "v"]) { const box = document.getElementById(id); if (box) box.value = ""; }
    adding = false; pasted = null; addForm.error = ""; addForm.sent = null;
    paint();
  }

  async function submitAdd() {
    const f = addForm;
    const nameBox = document.getElementById("k"), valueBox = document.getElementById("v");
    if (f.busy || !nameBox || !valueBox) return;
    const typed = nameBox.value.trim(), value = valueBox.value;
    const complain = (words, box) => { f.error = words; addHint(); box.focus(); };
    if (!typed) return complain("Give the key a name.", nameBox);
    if (!KEY_NAME.test(typed)) return complain("A name is letters, digits and underscores, and does not start with a digit.", nameBox);
    if (!value.trim()) return complain("Paste or type its value.", valueBox);
    // A name that is already here is replaced, and the line under the fields has said so. Sent as an
    // add it would be left alone by the store and reported here as done.
    const held = storedName(typed);
    f.busy = true; f.replacing = !!held; f.error = ""; f.sent = null;
    paint();
    let next;
    try { next = await invoke("add_key", { name: held || typed, value, replace: !!held }); }
    catch (e) {
      // What was typed is still in the fields: a refused add should not cost the paste as well.
      f.busy = false; f.error = said(e);
      paint();
      document.getElementById("v")?.focus();
      return;
    }
    f.busy = false; state = next; notice = "";
    // The store answers with the name it actually wrote, which is not always
    // the one that was typed.
    const added = storedName(typed) || typed;
    // Emptied here rather than by the repaint, which carries typed text across.
    for (const id of ["k", "v"]) { const box = document.getElementById(id); if (box) box.value = ""; }
    f.did = held ? "Replaced" : "Added";
    markAdded(added);
    watchSending([added]);
    // Somebody who went to another page while the key was being added stays there.
    if (page === "keys") { bringKeyRow(added); document.getElementById("k")?.focus({ preventScroll: true }); }
    else paint();
    // Whether the new key is encrypted is the vault's to say, and the row says it ("readable").
    refreshVault().then(() => paintKeepingCaret());
  }

  // ── what became of a key after it was saved here ───────────────────────
  //
  // Saving writes the key on this device and then sends it to the others. The window waited for both,
  // so it waited on the slowest of them. The app now answers as soon
  // as the key is written, the sending carries on behind it, and `passbook://sent` says how it went.
  let sending = { keys: [], timer: 0 };

  function saySending(words, how = {}) {
    addForm.sent = words ? { text: words, ...how } : null;
    if (document.getElementById("addhint")) addHint();
    else if (words && how.bad) { notice = words; paint(); }
  }

  function watchSending(keys) {
    clearTimeout(sending.timer);
    sending.keys = keys;
    addForm.sent = null;
    // Said only if it is still going after a moment. With nothing to send to it is over before anybody
    // could have read the words.
    sending.timer = setTimeout(() => {
      if (!sending.keys.length) return;
      saySending("Saved on this device. Sending to your other devices…", { busy: true });
      // An app too old to say how it went: stop saying it is still going.
      sending.timer = setTimeout(() => { sending.keys = []; saySending(""); }, 120000);
    }, 700);
  }

  /** How the sending went, in the window's words rather than a terminal's. */
  function sendingDone(report) {
    const waited = !!addForm.sent?.busy;
    clearTimeout(sending.timer);
    sending.keys = [];
    const out = String(report?.out || ""), problem = String(report?.problem || "");
    const all = report?.keys || [];
    const names = all.length > 3 ? `${all.slice(0, 2).join(", ")} and ${all.length - 2} more` : all.join(", ");
    const are = all.length > 1 ? "are" : "is";
    const missed = [...problem.matchAll(/not sent to (\S+) \(([^)]*)\)/g)];
    const services = out.match(/^(\S+) is also on (\d+) service/m);
    if (services) {
      // Changing a value here does not reach a Worker or a CI secret that holds a copy of it.
      notice = `${services[1]} is saved here, but ${services[2] === "1" ? "one service still holds" : `${services[2]} services still hold`} the old value. Open the key and use Rotate to update ${services[2] === "1" ? "it" : "them"}.`;
      saySending(""); paint();
      return;
    }
    if (missed.length) {
      return saySending(`${names || "It"} ${are} saved on this device. Not on ${missed.map((m) => m[1]).join(", ")} yet (${missed[0][2]}); PassBook will keep trying.`, { bad: true });
    }
    if (/not sent to any other machine/.test(problem)) {
      return saySending(`${names || "It"} ${are} saved on this device. No other device could be reached, so nothing has been sent yet.`, { bad: true });
    }
    // It was written here, and then the sending ended badly in some way this does not have words for.
    if (report?.ok === false) {
      return saySending(`${names || "It"} ${are} saved on this device, but the sending to your other devices did not finish. They will pick it up the next time they exchange keys.`, { bad: true });
    }
    const sent = out.match(/^sent to (\d+) machine/m);
    if (!waited) return saySending("");
    saySending(sent ? `Sent to ${sent[1] === "1" ? "your other device" : `your ${sent[1]} other devices`}.` : "Saved on this device.");
    sending.timer = setTimeout(() => saySending(""), 4000);
  }

  /** Encryption at rest, with the way to fix it in the same box.
   *
   *  This panel used to state the problem and stop there, which left the only
   *  actionable thing in the window as a red badge. Whatever it reports now, it
   *  also carries the next step: seal it, sign in to it, or set it up.
   */
  function encryptionPanel(seal) {
    const v = vault;
    const sealed = v?.fully_sealed ?? seal.fully_sealed;
    const readable = (v?.plaintext?.length ?? 0) + (v?.legacy_v1?.length ?? 0);
    const detail = v?.detail || seal.detail || "";

    let action = "";
    if (!v?.supported) {
      action = `<p class="note">This device has no vault runtime yet.
        Run <code>passbook install</code> to add one.</p>`;
    } else if (!v.profiles?.length) {
      // One action, one password. Creating a profile, sealing, starting the
      // broker and signing in are never useful apart, and a first-run screen
      // that asks for the same password four times is one people abandon.
      action = `
        <p class="note">One step: this makes a profile to hold the key, encrypts every
        value under it, and signs you in.</p>
        <div class="addrow">
          <input id="sec-label" placeholder="Your name" spellcheck="false" value="Owner" />
          <input id="sec-pw" type="password" placeholder="New vault password" />
          <button class="act primary" id="sec-go" ${busy ? "disabled" : ""}>Secure this device</button>
        </div>
        <p class="note">Nothing else on this device stores that password, so pick
        something you will not lose. You can undo the whole thing later.</p>
        ${aside(`<p>Values behind a framework's public prefix stay readable \u2014 a build
          inlines those into a browser bundle long before anyone could sign in, so
          encrypting them protects nothing.</p>`, "What stays readable")}`;
    } else if (!sealed) {
      action = `
        <p class="note">Encrypting ${readable === 1 ? "it" : "them"} means nothing can
        read ${readable === 1 ? "it" : "them"} again until you sign in.</p>
        <div class="addrow two">
          <input id="seal-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="seal-go" ${busy ? "disabled" : ""}>Encrypt everything</button>
        </div>`;
    } else if (!v.unlocked) {
      // Signing in is the panel at the top of the page. It was offered here as well, a second
      // password box for the same act on the same screen.
      action = `<p class="note">Everything is encrypted and the vault is shut, so apps on
        this device have no credentials until you sign in above.</p>`;
    }

    return `
      <div class="group">
        <h3>Encryption</h3>
        <div class="row"><div class="grow">${esc(detail)}</div>
          <span class="tag ${sealed ? "on" : "off"}">${sealed ? "Encrypted" : "Readable"}</span></div>
        ${action}
        ${sealed && v?.unlocked ? (unsealing ? `
          <p class="note err">Turning it off writes every value back to disk in the clear, where
            anything running as you can read it, signed in or not.</p>
          <div class="addrow three">
            <input id="sl-pw" type="password" placeholder="Vault password" aria-label="Vault password" />
            <button class="act" data-unsealclose="1" ${busy ? "disabled" : ""}>Cancel</button>
            <button class="act destructive" id="unseal-go" ${busy ? "disabled" : ""}>Turn off encryption</button>
          </div>` : `<div class="addrow two"><span></span>
            <button class="act" data-unsealopen="1" ${busy ? "disabled" : ""}>Turn off encryption\u2026</button></div>`) : ""}
        ${aside(`<p>Encryption protects the store on a stolen laptop, a backup, a synced
          home folder, or a copy that ends up in a repo. While you are signed in, code
          running as you can still ask for a key \u2014 that is what Permissions are
          for.</p>${sealed ? `<p>Turning it off puts every value back in the clear on
          disk. The way out is here on purpose \u2014 an encryption you cannot reverse is
          one nobody turns on.</p>` : ""}`)}
      </div>`;
  }

  /** What this window does about somebody watching the screen.
   *
   *  Stated rather than assumed, and stated per platform, because two of the
   *  three are conditional and a panel that claimed them everywhere would be
   *  wrong on exactly the machines where the difference matters. It also says
   *  what none of it covers, which is the part a page like this usually leaves
   *  out: anything running as you can still read the store through the CLI, and
   *  that is a question for Permissions, not for the screen.
   */
  function veilGroup() {
    const rows = [
      [true, "Values are drawn, not written",
       "A revealed credential is an image. There is no text for a screen reader, "
       + "for the accessibility APIs, or for an agent reading this window, and no "
       + "string left in the page afterwards."],
      [guards.capture, "Hidden from screenshots and screen sharing",
       guards.capture
         ? "This window is excluded from screen capture the same way a video player is."
         : "This platform has no way to exclude a window from capture, so a screenshot "
           + "of this window shows what is on it. The drawing above still applies."],
      [true, `Revealed values hide themselves after ${HIDE_AFTER / 1000} seconds`,
       "And the app overwrites its copy when they do."],
    ];
    if (!guards.drawing) {
      rows[0] = [false, "Values cannot be shown on this machine",
        "PassBook draws credentials rather than writing them, and found no monospace "
        + "font here to draw with. Reveal and copy are refused rather than falling "
        + "back. Use a key instead of reading it:  passbook run -- <command>"];
    }
    // One line for the three facts, and what each means behind it. They are things this window
    // does rather than settings, and three full rows of them sat between the settings.
    // What is missing is said as missing: a row's title names the protection, so it cannot stand in
    // for the sentence that it is absent.
    const MISSING = { "Hidden from screenshots and screen sharing": "Screenshots and screen sharing can show this window" };
    const off = rows.filter(([on]) => !on).map(([on, title, why]) => [on, MISSING[title] || title, why]);
    return `
      <div class="group">
        <h3>On screen</h3>
        <div class="row"><div class="grow">${off.length
          ? `<strong>${esc(off.map(([, title]) => title).join(". "))}.</strong>
             <div class="sub">${esc(off.map(([, , why]) => why).join(" "))}</div>`
          : `<strong>Values are drawn as pictures, hidden from screenshots, and hide themselves after ${HIDE_AFTER / 1000} seconds.</strong>`}</div>
          <span class="tag ${off.length ? "off" : "on"}">${off.length ? `${rows.length - off.length} of ${rows.length} on` : "All on"}</span></div>
        ${aside(rows.map(([on, title, why]) => `<p><strong>${esc(title)}${on ? "" : " \u2014 not here"}.</strong>
          ${esc(why)}</p>`).join("") + `<p>This is about somebody \u2014 or something \u2014 watching the
          screen. It does not cover code running as you, which can ask the store for a
          key without opening this window at all: that is what Permissions and sealed
          reads are for.</p>`, "What this window does about the screen")}
      </div>`;
  }

  /** A fragment written to sit mid-sentence, used to open one. */
  const sentence = (s) => String(s || "").replace(/^./, (c) => c.toUpperCase());

  function profileLabel(id) {
    return (vault?.profiles || []).find((p) => p.id === id)?.label || id || "this device";
  }

  const BACKUP_SHAPES = {
    encrypted: ["Encrypted", "A passphrase you choose. Portable, needs nothing installed at the other end."],
    gpg: ["GPG", "An armoured GPG message, symmetric under a passphrase."],
    plain: ["Plain text", "Every value readable. For moving to a device that has no PassBook yet."],
  };

  function defaultExportPath(shape) {
    const home = state?.home || "~";
    const day = new Date().toISOString().slice(0, 10);
    const where = state?.catalog?.workspace || state?.store?.workspace || "store";
    const ext = shape === "plain" ? "env" : shape === "gpg" ? "asc" : "pbx";
    return `${home}/Desktop/passbook-${where}-${day}.${ext}`;
  }

  /** Getting the store out, and back in.
   *
   *  Three shapes because the reasons differ. The plaintext one asks twice on
   *  purpose: "export" reads like "back up", and a plaintext backup is a copy
   *  of every credential you own.
   */
  /** Writing the store out, and reading one back in.
   *
   *  Both used to be on screen at once: five unlabelled input rows in a column,
   *  with no seam between the two jobs and the passphrase an export needs
   *  sitting *under* the button that had already run without it. They are one
   *  job at a time, so they are one at a time.
   */
  function backupPanel() {
    const v = vault;
    const shape = backup.shape;
    const [, blurb] = BACKUP_SHAPES[shape];
    const needsPass = shape !== "plain";
    const locked = v?.supported && v.fully_sealed && !v.unlocked;
    const exporting = backup.tab !== "import";

    const out = `
      ${locked ? `<p class="note">The vault is shut, so there is nothing readable to
        export. Sign in first.</p>` : ""}
      <div class="row"><span class="dlabel">Format</span>
        <div class="seg">${Object.entries(BACKUP_SHAPES).map(([id, [label]]) =>
          `<button data-bshape="${id}" aria-pressed="${shape === id}">${label}</button>`).join("")}</div>
      </div>
      <p class="note">${esc(blurb)}</p>
      ${needsPass ? `<div class="addrow one">
        <input id="bk-pass" type="password" placeholder="Passphrase for the file" />
      </div>` : `<p class="note err">${icon("alert", "tinyicon")} Every value in that file
        will be readable by anything that can open it. It is not a backup you keep; it is
        a thing you move and then destroy.</p>`}
      <div class="addrow two">
        <input id="bk-path" value="${esc(backup.path || defaultExportPath(shape))}"
          spellcheck="false" placeholder="Where to write it" />
        <button class="act ${shape === "plain" ? "danger" : "primary"}" id="bk-export"
          ${busy || locked ? "disabled" : ""}>${icon("out")} Export</button>
      </div>`;

    const back = `
      <p class="note">Encrypted, GPG and plain text are all recognised by looking at
      the file.</p>
      <div class="addrow one">
        <input id="bk-inpass" type="password" placeholder="Its passphrase, if it has one" />
      </div>
      <div class="addrow three">
        <input id="bk-in" placeholder="Path to an export" spellcheck="false" />
        <button class="act" id="bk-inspect" ${busy ? "disabled" : ""}>${icon("eye")} Inspect</button>
        <button class="act primary" id="bk-import" ${busy ? "disabled" : ""}>${icon("into")} Import</button>
      </div>`;

    return `
      <div class="group">
        <div class="grouphead">
          <h3>Backup</h3>
          <div class="seg">
            <button data-btab="export" aria-pressed="${exporting}">Export</button>
            <button data-btab="import" aria-pressed="${!exporting}">Import</button>
          </div>
        </div>
        ${exporting ? out : back}
        ${backup.said ? `<pre class="snippet">${esc(backup.said)}</pre>` : ""}
        ${aside(`<p>An import never overwrites a key this store already holds; it says
          which ones it kept. Exports and imports are both recorded by name in
          Activity.</p>`)}
      </div>`;
  }

  /** The two ways back in if the password goes.
   *
   *  A recovery code and a trusted device answer the same question, and they
   *  were two cards apart with the store's whole backup section between them —
   *  one of them a card containing nothing but a collapsed line.
   */
  function recoveryPanel() {
    const v = vault;
    return `
      <div class="group">
        <h3>If you lose the password</h3>
        ${recoveryCode ? `
          <div class="row">
            <span class="statustile good">${icon("shield")}</span>
            <div class="grow"><strong>Write this down, somewhere this device is not.</strong>
              <div class="recovery mono">${esc(recoveryCode)}</div></div>
            <button class="iconbtn ${copied.__recovery ? "done" : ""}"
              data-copytext="${esc(recoveryCode)}" data-copymark="__recovery"
              title="Copy" aria-label="Copy the recovery code">${icon(copied.__recovery ? "check" : "copy")}</button>
          </div>
          <p class="note">Shown once. It opens the vault on its own, so it is as good as
          the password \u2014 PassBook cannot show it again.</p>
          <div class="addrow two"><span></span>
            <button class="act" data-recoverydone>I have written it down</button></div>
        ` : `
          <div class="row"><div class="grow">A recovery code is a second way in. Without
            one, a forgotten password is the end of this store.</div></div>
          <div class="addrow two">
            <input id="rc-pw" type="password" placeholder="Vault password" />
            <button class="act" id="rc-go" ${busy || !v?.profiles?.length ? "disabled" : ""}>
              ${icon("shield")} Make a recovery code</button>
          </div>`}
        ${aside(`<p>${esc(sentence(v?.keystore?.describe || "no OS keystore on this platform"))}.
          ${v?.keystore?.available
            ? "Letting jobs start at boot without you is the \u201cA restart opens the vault by itself\u201d switch above \u2014 at the cost of letting anything running as you open the vault."
            : "Sign-in here is by password, which works the same on every platform."}</p>`,
          "Unlock with this device instead")}
      </div>`;
  }

  /** Whether a restart opens the vault by itself.
   *
   *  The window had no way to know this setting existed. So after a restart it
   *  could not say why everything was shut, and offered nothing to change it —
   *  the answer lived only in `passbook vault --stay-open`, which you have to
   *  already know about to look for.
   *
   *  The warning is not decoration. Turning this on puts the opening key in the
   *  OS keystore, where anything running as you can fetch it with no password
   *  and no prompt, which includes every agent. That sentence is the CLI's own
   *  and it comes across intact rather than being softened into a switch label.
   */
  function stayOpenBlock() {
    const s = vault?.stay_open;
    if (!s || typeof s.on !== "boolean") return "";   // not installed here
    const halves = `<div class="sub">device factor: ${s.device_factor ? "yes" : "no"}
      \u00b7 starts at login: ${s.boot_agent ? "yes" : "no"}</div>`;

    if (s.on) {
      return `
        <div class="group">
          <div class="row"><span class="statustile warn">${icon("unlock")}</span>
          <div class="grow"><strong>A restart opens the vault by itself</strong> \u2014
            jobs that start at boot keep working with nobody present. The cost:
            the opening key sits in this Mac's keystore, and any program running
            as you can fetch it \u2014 no password, no prompt. An agent on this
            machine can open your vault.
            ${halves}</div>
          <button class="act" data-stayopen="off" ${busy ? "disabled" : ""}>
            Require sign-in</button></div>
        </div>`;
    }
    return `
      <div class="group">
        <div class="row"><span class="statustile good">${icon("lock")}</span>
        <div class="grow"><strong>A restart leaves the vault shut</strong> \u2014 you sign
          in once afterwards. Until you do, apps get no credentials and adding a
          key is refused.
          ${halves}</div></div>
        <div class="addrow two">
          <input id="so-pw" type="password" placeholder="Vault password" data-keep aria-label="Vault password" />
          <button class="act" data-stayopen="on" ${busy || asking?.id === "stayopen-on" ? "disabled" : ""}>
            ${icon("unlock")} Open at restart</button>
        </div>
        ${confirmStrip("stayopen-on", `Let this Mac open the vault after a restart? The opening key goes
          into the keystore, where any program running as you can fetch it with no password and no
          prompt. That includes every agent on this machine.`, "Open at restart")}
        ${aside(`<p>Opening it automatically would put the key in this Mac's keystore, where
          any program running as you can fetch it \u2014 no password, no prompt. That
          includes every agent on this machine. What it buys is jobs that start at boot
          without you.</p>`, "What opening at restart costs")}
      </div>`;
  }

  /** Whether values are handed to callers the broker did not start.
   *
   *  Its own block rather than a line in the sealing card, because it answers a
   *  different question. Sealing is about the disk; this is about what a
   *  process running as you can obtain while the vault is wide open — which is
   *  the gap people assume encryption already closed, and it does not.
   */
  // Pins are reported here and set from the command line. A pin is taken from
  // a command — `passbook pin studio -- node server.js` — and a panel offering
  // a text box for that would be pretending it had checked something.
  function pinnedLine() {
    const pinned = state?.access?.pinned || {};
    const on = Object.keys(pinned).filter((a) => pinned[a]?.mode === "pinned");
    if (!on.length) {
      return `<div class="sub">No app is pinned to the code it may run.
        <code>passbook pin --what -- node server.js</code> shows what one would be.</div>`;
    }
    return `<div class="sub">${on.length} app${on.length === 1 ? " is" : "s are"} pinned
      and can run only the code they were pinned to: ${on.map(esc).join(", ")}.</div>`;
  }

  function readsBlock() {
    const mode = state?.access?.reads || "open";
    const guarded = Object.keys(state?.access?.guarded || {});
    const sealed = mode === "sealed";
    return `
      <div class="group">
        <div class="row"><span class="statustile ${sealed ? "good" : "warn"}">${
          icon(sealed ? "lock" : "unlock")}</span>
        <div class="grow"><strong>${sealed ? "Values are never handed out" : "Values can be read"}</strong> —
          ${sealed
            ? `credentials go only into processes PassBook starts, so an agent can
               use them and cannot read them.`
