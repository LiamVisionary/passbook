   *
   *  The window is the only place a request can be answered, so this is also
   *  the right place to raise one: it is announced by the process that can act
   *  on it, and the broker's job is reduced to making sure that process exists.
   */
  const announced = new Set();
  let canNotify = false;

  async function readyNotifications() {
    const api = window.__TAURI__?.notification;
    if (!api) return;
    try {
      canNotify = await api.isPermissionGranted();
      if (!canNotify) canNotify = (await api.requestPermission()) === "granted";
      // Clicking the banner is somebody saying "yes, show me" — so land on the
      // page with the buttons, not wherever they happened to leave the window.
      api.onAction?.(() => { page = "access"; notice = ""; paint(); });
    } catch { canNotify = false; }
  }

  function announce(pending) {
    const live = new Set((pending || []).map((p) => p.id));
    for (const id of [...announced]) if (!live.has(id)) announced.delete(id);
    if (!canNotify) return;
    const api = window.__TAURI__?.notification;
    for (const request of pending || []) {
      if (announced.has(request.id)) continue;
      announced.add(request.id);
      const names = (request.keys || []).slice(0, 3).join(", ");
      const rest = (request.keys || []).length - 3;
      const verb = { add: "wants to add", modify: "wants to change",
                     delete: "wants to remove" }[request.kind] || "wants to read";
      try {
        api.sendNotification({
          title: "PassBook",
          body: `${request.app} ${verb} ${names || "a credential"}${
            rest > 0 ? ` and ${rest} more` : ""}`,
        });
      } catch { /* a refused notification must not stop the request */ }
    }
  }

  async function refreshVault() {
    try { vault = await invoke("vault_state"); }
    catch { vault = null; }
  }

  const pwd = (id) => (document.getElementById(id)?.value ?? "");
  function humanTime(seconds) {
    if (!seconds) return "";
    if (seconds < 90) return `${seconds}s`;
    if (seconds < 5400) return `${Math.round(seconds / 60)} min`;
    return `${Math.round(seconds / 3600)}h`;
  }

  const APP = "hivemind-content-studio";

  /** How many key rows are built at a time, and how many are built right now.
   *
   *  A store of 281 keys is 11,351 nodes and 800KB of markup, and this window
   *  rebuilds its page from a string on every state change — so ticking one
   *  checkbox, copying one value or typing one letter into the search box each
   *  cost a full rebuild of all of it. Measured in the same webview: 50ms a
   *  keystroke, which is exactly the amount of lag a person notices while
   *  typing.
   *
   *  So a page of rows is built, and more are added as they are scrolled to.
   *  Everything above stays honest — the count in the header, the group counts,
   *  the search, the bulk selection — because those are computed over the whole
   *  filtered set. Only the rows nobody has scrolled to yet are missing.
   */
  const ROW_PAGE = 60;
  let rowLimit = ROW_PAGE;
  let rowGrower = null;

  /** Back to one page of rows. Anything that changes which keys are listed
   *  calls this: a filter that leaves a long list scrolled halfway is a filter
   *  that looks like it did nothing. */
  function resetRows() { rowLimit = ROW_PAGE; }

  /** Keys the current search matches. Case-insensitive substring, because a
   *  person hunting OPENAI_API_KEY types "openai", not a prefix. */
  function shownKeys() {
    const all = state?.store?.keys || [];
    const q = query.trim().toLowerCase();
    return q ? all.filter((k) => k.toLowerCase().includes(q)) : all;
  }

  function searchField(id) {
    return `<span class="searchwrap">${icon("search", "tinyicon")}
      <input class="search" id="${id}" type="search" placeholder="Search keys"
        value="${esc(query)}" spellcheck="false" autocapitalize="off" /></span>`;
  }

  function ago(iso) {
    const then = Date.parse(iso);
    if (!Number.isFinite(then)) return "";
    const s = Math.max(0, Math.round((Date.now() - then) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return `${Math.round(s / 86400)}d ago`;
  }

  function usedLine(k) {
    const u = (state.usage || {})[k];
    // No entry means never read — say that, rather than printing a zero that
    // looks like measured data.
    if (!u || !u.last) return "Never used.";
    const times = u.count === 1 ? "once" : `${u.count} times`;
    return `Last used ${ago(u.last)} by ${esc(u.last_app || "something")} · ${times}`;
  }

  function historyBlock(k) {
    const rows = history[k];
    if (rows === "loading") return `<div class="hist"><div class="foot">Reading the record…</div></div>`;
    if (!rows.length) return `<div class="hist"><div class="foot">Nothing recorded for this key yet.</div></div>`;
    return `<div class="hist">
      ${rows.slice().reverse().map((r) => `
        <div class="ev">
          <span class="when">${esc(ago(r.at))}</span>
          <span class="who">${esc(r.app || "unknown")}${r.reason ? ` — ${esc(r.reason)}` : ""}</span>
          <span class="op">${esc(r.op)}${r.granted === false ? " · denied" : ""}</span>
        </div>
        <div class="proof">${esc(r.proof || "")}</div>`).join("")}
      <div class="foot">Each line is hash-chained to the one before it. A row that
      was edited, removed or reordered breaks every proof after it.</div>
    </div>`;
  }

  function countLabel(shown, all) {
    return query.trim() && shown !== all ? `${shown} of ${all}` : `${all} stored`;
  }
  const modeOf = (key) => {
    const a = (state?.access?.apps || {})[APP] || {};
    return ((a.keys || {})[key] || {}).mode || (a.default || {}).mode || state?.access?.default_mode || "always";
  };

  /** How many of a thing each page is about, so the list carries the shape of
   *  the store rather than eight identical words. */
  /** Whether the page on screen lives on the Settings shelf. The sidebar entry
   *  stays lit while you are inside one, so you always know where you are. */
  const inSettings = () => page === "settings"
    || SETTINGS.some(([id]) => id === page);

  /** The way back out of a settings pane. */
  function settingsBack(title) {
    return `<button class="backlink" data-goto="settings">
      ${icon("chevron", "tinyicon")} Settings</button>
      <h2>${esc(title)}</h2>`;
  }

  function settingsPage() {
    const pending = (state?.broker?.pending || []).length;
    return `
      <h2>Settings</h2>
      <div class="group tight">
        ${SETTINGS.map(([id, label, glyph, blurb]) => `
          <button class="settingrow" data-goto="${id}">
            <span class="statustile plain sm">${icon(glyph)}</span>
            <span class="grow"><span class="settingname">${esc(label)}</span>
              <span class="sub">${esc(blurb)}</span></span>
            ${id === "access" && pending ? '<span class="dot"></span>' : ""}
            ${icon("chevron", "tinyicon")}
          </button>`).join("")}
      </div>`;
  }

  /** An explanation that is true, worth having, and not worth reading twice.
   *
   *  This app explained itself in paragraphs: why a profile is not a store,
   *  what a project name is worth as a claim, why an export is in the ledger.
   *  All of it correct, all of it permanently on screen, and the effect of
   *  putting it everywhere was a window that looked like documentation with
   *  controls embedded in it. Folded away it costs one line until asked for.
   */
  function aside(html, label = "Why") {
    return `<details class="aside"><summary>${esc(label)}</summary>
      <div class="asidebody">${html}</div></details>`;
  }

  function navCounts() {
    const links = state?.links || {};
    return {
      keys: (state?.store?.keys || []).length,
      signins: (signins || []).length,
      // What the page lists, so the badge and the list cannot disagree.
      machines: (links.lent || []).length + (links.tailnet || []).length
              + (links.borrowed || []).length,
    };
  }

  /** Whether anything can read a credential right now, pinned to the foot of
   *  the source list. It is the one fact that changes what every other page
   *  means, and hunting for it on the Vault page is how people miss it. */
  function navFoot() {
    const v = vault;
    if (!v?.supported) return "";
    const open = !!v.unlocked;
    const bare = (v.plaintext?.length ?? 0) + (v.legacy_v1?.length ?? 0);
    const where = state?.catalog?.workspace || state?.store?.workspace || "";

    // Three states, not two, because "locked" and "protected" are not the same
    // thing and this footer used to say the first while meaning neither.
    //
    // A locked vault over a store that is mostly plaintext is the worst of
    // them: it reads as safety, and the reassurance is the danger. It gets the
    // count in the headline, where "Vault locked" used to sit, because a person
    // who has just pressed Lock is looking at exactly this corner and deserves
    // to be told that pressing it did not do what the word says.
    const exposed = bare > 0;
    const tone = open ? "open" : exposed ? "exposed" : "shut";
    const headline = exposed
      ? `${bare} readable`
      : (open ? "Vault open" : "Vault locked");
    const detail = exposed
      ? "not encrypted on disk"
      : open
        ? profileLabel(v.signed_in_profile) + (v.expires_in ? ` \u00b7 ${humanTime(v.expires_in)} left` : "")
        : "nothing can read it";
    const glyph = exposed ? "alert" : open ? "unlock" : "lock";

    return `<div class="navfoot ${tone}">
      <button class="navfoot-main" data-page="vault"
        title="${exposed ? `${bare} value(s) are in the clear on disk` : "Workspace and sign-in"}">
        ${icon(glyph, "navicon")}
        <span class="col">
          <span class="navfoot-t">${esc(headline)}</span>
          <span class="navfoot-s">${esc(exposed || !where ? detail : `${where} \u00b7 ${detail}`)}</span>
        </span>
      </button>
      <button class="iconbtn navlock" data-locknow title="Lock this window"
        aria-label="Lock this window">${icon("lock")}</button>
    </div>`;
  }

  function paintNav() {
    const pending = (state?.broker?.pending || []).length;
    const counts = navCounts();
    nav.innerHTML = `
      <div class="brand"><img src="mark.png" alt="" /><span>PassBook</span></div>
      <div class="navlist">${PAGES.map(([id, label, glyph]) => `
        <button data-page="${id}" aria-current="${page === id}">
          ${icon(glyph, "navicon")}<span class="navlabel">${label}</span>
          ${counts[id] ? `<span class="navcount">${counts[id]}</span>` : ""}
        </button>`).join("")}</div>
      <div class="navbottom">
        <div class="navlist">
          <button data-page="settings" aria-current="${inSettings()}">
            ${icon("sliders", "navicon")}<span class="navlabel">Settings</span>
            ${pending ? '<span class="dot"></span>' : ""}
          </button>
        </div>
        ${navFoot()}
      </div>`;
    nav.querySelectorAll("[data-page]").forEach((b) =>
      b.onclick = () => {
        page = b.dataset.page; resetRows(); paint();
        // Opening the Record is the moment somebody wants to know, so ask then
        // — rather than on every poll, whatever page they were on.
        if (page === "record" && !chain.answer && !chain.busy) checkChain();
      });
    // Lock puts the WINDOW away — nothing else. It used to sign the broker out,
    // which meant closing the app at the end of the day also stopped every
    // agent reading credentials overnight; what agent access does is decided on
    // the lock screen this drops you on, by somebody already thinking about it.
    nav.querySelectorAll("[data-locknow]").forEach((b) => b.onclick = () => lockWindow());
  }

  // Mirrors the HivemindOS agent-env card: name and actions on one line, the
  // value on its own line underneath — masked until revealed, editable in
  // place, saved on blur.
  /** Is this key one the machine never prints?
   *
   *  A guarded key has no eye icon, and the missing icon has to explain itself
   *  — an affordance that silently disappears reads as a bug, and somebody
   *  chasing a bug goes looking for the store file, which is the one outcome
   *  this whole feature exists to prevent.
   */
  function isGuarded(k) {
    return !!(state?.access?.guarded && state.access.guarded[k]);
  }

  function guardedWhy(k) {
    const rule = state?.access?.guarded?.[k];
    if (!rule) return "";
    const into = (rule.commands || []).join(", ");
    const to = (rule.destinations || []).join(", ");
    return "Guarded: used, never shown."
      + (into ? ` May be injected into: ${into}.` : "")
      + (to ? ` May be sent to: ${to}.` : "")
      + " Run what needs it with passbook run.";
  }

  /** Keys sitting in the clear, as a set the rows can ask cheaply.
   *
   *  Read from the vault where it answers, else the state's own sealing block.
   *  Both now come from the v2 vault, so they cannot disagree.
   */
  function readableSet() {
    const source = vault?.supported ? vault : state?.sealing;
    const listed = source?.plaintext;
    return new Set(Array.isArray(listed) ? listed : []);
  }

  /** One key, one line.
   *
   *  What was here before put every policy a key has on the row itself: a
   *  reach dropdown, an audience sentence with its own Change button, a
   *  project button, and the last-used line — three lines and five controls,
   *  multiplied by a few hundred. On a store this size the page rendered 363
   *  buttons and 60 dropdowns before you had done anything, and the key names
   *  were the smallest thing on it.
   *
   *  A row is now a name, whether it is hidden, and the two things people
   *  actually do (look, copy). Everything else is a key's *settings*, and it
   *  opens when you ask for it — the same trade every list on this platform
   *  makes, and the reason those lists stay readable at any length.
   */
  function keyRow(k, readable) {
    const shown = revealed[k];
    const open = expanded[k];
    const pending = confirming === k;
    // A key nobody encrypted is not protected by the vault, whatever the vault
    // says about itself. Saying so on the row is the whole point: this app told
    // someone "Vault locked" in the sidebar while the eye icon beside every key
    // still worked, and the sentence that explained why was below 279 rows.
    const bare = readable ? readable.has(k) : false;
    return `<div class="keyrow${open ? " open" : ""}">
      <div class="head">
        ${selectMode ? `<input type="checkbox" class="pick" data-pick="${esc(k)}"
          ${picked[k] ? "checked" : ""} aria-label="Select ${esc(k)}" />` : ""}
        <span class="named" data-open="${esc(k)}"><span class="mono">${esc(k)}</span>
          ${shown ? "" : `<span class="masked" title="Hidden">••••••••••</span>`}
          ${bare ? `<span class="bare" title="This value is not encrypted. Anything running as you can read it, signed in or not.">${icon("unlock", "tinyicon")} readable</span>` : ""}
          ${isGuarded(k) ? `<span class="bare guarded" title="${esc(guardedWhy(k))}">${icon("lock", "tinyicon")} guarded</span>` : ""}</span>
        ${isGuarded(k)
          ? `<button class="iconbtn" disabled title="${esc(guardedWhy(k))}"
               aria-label="Guarded: never shown">${icon("lock")}</button>`
          : `<button class="iconbtn ${shown ? "on" : ""}" data-reveal="${esc(k)}"
          title="${shown ? "Hide value" : "Reveal value"}"
          aria-label="${shown ? "Hide value" : "Reveal value"}">${icon(shown ? "eyeOff" : "eye")}</button>`}
        <button class="iconbtn ${copied[k] ? "done" : ""}" data-copy="${esc(k)}"
          title="${copied[k] ? "Copied" : "Copy value"}"
          aria-label="${copied[k] ? "Copied" : "Copy value"}">${icon(copied[k] ? "check" : "copy")}</button>
        <button class="iconbtn danger" data-remove="${esc(k)}" title="Remove"
          aria-label="Remove ${esc(k)}">${icon("trash")}</button>
        <button class="iconbtn disclose" data-open="${esc(k)}"
          title="${open ? "Hide settings" : "Settings for this key"}"
          aria-expanded="${open}"
          aria-label="Settings for ${esc(k)}">${icon("chevron")}</button>
      </div>
      ${replacing[k] ? `<input class="val" data-replace="${esc(k)}" value=""
        spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder="Type a new value for ${esc(k)}, or press Escape" />`
       : revealing[k] ? `<div class="val loading" role="status" aria-live="polite">
           <span class="spinner"></span>Reading ${esc(k)}…</div>`
       : shown ? valuePicture(k) : ""}
      ${pending ? `<div class="confirmstrip">
        <span class="grow">Remove it? Another app may be using it, and the value is
          not recoverable from here.</span>
        <button class="act" data-cancel="1">Cancel</button>
        <button class="act destructive" data-rmgo="${esc(k)}" ${busy ? "disabled" : ""}>
          ${icon("trash")} Remove</button>
      </div>` : ""}
      ${open ? keyDetail(k) : ""}
    </div>`;
  }

  /** A key's settings, shown only while its row is open.
   *
   *  Every control that used to sit on the row lives here, plus the one that
   *  used to have a page of its own: whether a read is answered, asked about
   *  or refused. That was a list of all 281 keys with a three-way switch on
   *  each — 854 buttons to change one of them, on a page whose other half was
   *  about something else entirely.
   *
   *  Two columns, and the second one is only as wide as the widest control in
   *  it. The first version pushed each control to the right edge of the panel
   *  with `margin-left: auto`, which on a full-width window left a hand's
   *  width of nothing between a label and the thing it labels — the eye has to
   *  travel it on every row, and on a wide screen it gets worse, not better.
   *
   *  Nothing here opens a different view. Apps and Projects each used to be a
   *  button that replaced the whole panel with an editor, three clicks and a
   *  Save to change what is now one click on a switch that was already on
   *  screen. They are the same three-way choice as the row above them, so they
   *  are drawn the same way and applied the same way: immediately.
   */
  function keyDetail(k) {
    const cat = state.catalog || {};
    const aud = cat.audiences?.[k];
    const proj = cat.projects?.[k];
    const used = usedLine(k);
    const mode = modeOf(k);

    // A draft exists only between choosing "Only chosen" and picking the first
    // name, because until then there is no rule that could be saved.
    const audDraft = (audienceFor === k && audienceDraft)
      || { mode: aud?.mode || "all", agents: [...(aud?.agents || [])] };
    const projDraft = (projectsFor === k && projectsDraft)
      || { mode: proj?.mode || "all", projects: [...(proj?.projects || [])] };

    const seg = (attr, chosen, options) => `<div class="seg">${options.map(([id, label]) =>
      `<button data-${attr}="${id}" data-key="${esc(k)}" aria-pressed="${chosen === id}"
        ${busy ? "disabled" : ""}>${esc(label)}</button>`).join("")}</div>`;

    const chips = (attr, all, chosen, empty) => `<div class="dfull pickrow">
      ${all.length ? all.map((name) => `
        <button class="pickchip" data-${attr}="${esc(name)}" data-key="${esc(k)}"
          aria-pressed="${chosen.includes(name)}" ${busy ? "disabled" : ""}
          >${esc(name)}</button>`).join("")
        : `<span class="sub">${esc(empty)}</span>`}
      ${chosen.length ? "" : `<span class="sub">Pick at least one — nothing changes until you do.</span>`}
    </div>`;

    const known = cat.agents || [];
    const seenProjects = [...new Set([...(cat.projects_seen || []),
                                      ...(cat.project ? [cat.project] : []),
                                      ...projDraft.projects])].sort();

    return `<div class="keydetail">
      ${used ? `<p class="usedline dfull">${esc(used)}</p>` : ""}

      <div class="drow"><span class="dlabel">When something asks</span>
        ${seg("mode", mode, [["always", MODE.always[0]], ["ask", MODE.ask[0]],
                             ["never", MODE.never[0]]])}</div>

      <div class="drow"><span class="dlabel">Shared with</span>${scopePicker(k)}</div>

      <div class="drow"><span class="dlabel">Apps</span>
        ${seg("audmode", audDraft.mode, [["all", "Every app"], ["include", "Only chosen"],
                                         ["exclude", "All except"]])}</div>
      ${audDraft.mode === "all" ? ""
        : chips("audagent", known, audDraft.agents,
                "No app has asked for a credential yet, so there is nobody to choose.")}

      <div class="drow"><span class="dlabel">Projects</span>
        ${seg("projmode", projDraft.mode, [["all", "Every project"], ["include", "Only these"],
                                           ["exclude", "All except"]])}</div>
      ${projDraft.mode === "all" ? "" : `
        ${chips("projname", seenProjects, projDraft.projects, "")}
        <div class="dfull addrow two">
          <input id="proj-new" placeholder="Another project name" spellcheck="false"
            value="${esc(projectTyped)}" />
          <button class="act" data-projadd data-key="${esc(k)}">${icon("plus")} Add</button>
        </div>`}

      <div class="drow"><span class="dlabel">History</span>
        <button class="act" data-hist="${esc(k)}">${history[k] ? "Hide" : "Who has used this"}</button></div>
      ${history[k] ? `<div class="dfull">${historyBlock(k)}</div>` : ""}
    </div>`;
  }

  /** Show a tick on one button for a moment, then put it back.
   *
   *  Held in state rather than done to the element, because a paint replaces
   *  every node — a class set on the button would be gone by the next tick of
   *  the background refresh.
   */
  function markCopied(mark) {
    if (!mark) return;
    copied[mark] = true;
    clearTimeout(copiedTimers[mark]);
    copiedTimers[mark] = setTimeout(() => {
      delete copied[mark];
      delete copiedTimers[mark];
      paint();
    }, 1400);
  }

  const chosen = () => Object.keys(picked).filter((k) => picked[k]);

  /** What you can do to a handful of keys at once.
   *
   *  Only appears once something is ticked. Scoping many keys and removing many
   *  keys are the two jobs worth doing in bulk; both are one-by-one otherwise,
   *  and a store of a few hundred makes that unbearable.
   */
  function bulkBar(shown) {
    const on = chosen();
    if (!on.length) return "";
    const cat = state.catalog;
    const locked = on.filter((k) => cat?.scopes?.[k] && !cat.scopes[k].may_change);
    return `<div class="bulkbar ${bulkConfirm ? "confirm" : ""}">
      <span class="grow"><strong>${on.length}</strong> selected</span>
      ${bulkConfirm ? `
        <span class="warn">${icon("alert")} Remove ${on.length} key${on.length === 1 ? "" : "s"}?
          Other apps on this device may be using ${on.length === 1 ? "it" : "them"},
          and ${on.length === 1 ? "it is" : "they are"} not recoverable from here.</span>
        <button class="act" data-bulkcancel>Cancel</button>
        <button class="act destructive" data-bulkgo ${busy ? "disabled" : ""}>
          ${icon("trash")} Remove ${on.length}</button>
      ` : `
        <select class="scope" data-bulkscope ${busy ? "disabled" : ""}>
          <option value="">Share with…</option>
          ${(cat?.scope_options || []).map((s) =>
            `<option value="${s}">${esc(SCOPE_WORDS[s] || s)}</option>`).join("")}
        </select>
        <button class="act danger" data-bulkremove ${busy ? "disabled" : ""}>${icon("trash")} Remove</button>
        <button class="act" data-bulkclear>Clear</button>
      `}
      ${locked.length && !bulkConfirm ? `<div class="note">${locked.length} of these
        ${locked.length === 1 ? "is" : "are"} owned by another workspace and will not
        change.</div>` : ""}
    </div>`;
  }

  /** Key rows, arranged by group.
   *
   *  A few hundred keys as one flat list is a list nobody reads. Groups are
   *  inferred from the names people already use, so this costs nobody any
   *  tagging — and a search collapses back to a flat list, because when you are
   *  hunting one key the headings are in the way.
   */
  /** The row that says how many are not built yet, and loads them when reached.
   *
   *  Kept as a real element rather than a scroll handler: an observer fires
   *  once when it comes into view, where a scroll handler fires on every pixel
   *  and then has to measure the page to decide it has nothing to do. It is
   *  also a button, so this works from the keyboard and without the observer.
   */
  function moreRow(remaining) {
    if (remaining <= 0) return "";
    return `<button class="morerow" data-more="1">${icon("chevron", "tinyicon")}
      Show ${Math.min(remaining, ROW_PAGE)} more · ${remaining} not shown</button>`;
  }

  function groupedKeys(keys) {
    if (!keys.length) return "";
    const cat = state.catalog;
    const readable = readableSet();
    const flat = () => keys.slice(0, rowLimit).map((k) => keyRow(k, readable)).join("")
      + moreRow(keys.length - rowLimit);
    if (!cat?.available || query.trim()) return flat();

    const shown = new Set(keys);
    const buckets = [];
    for (const [group, members] of Object.entries(cat.groups || {})) {
      const here = members.filter((m) => shown.has(m));
      if (here.length) buckets.push([group, here]);
    }
    if (buckets.length < 2) return flat();

    // The window ends where the rows run out, headings included. An earlier
    // version kept emitting every group and only withheld their rows, which
    // left thirty group headers with nothing under them — indistinguishable
    // from thirty empty groups. A list that simply stops, with a count of what
    // is below it, is the one people already know how to read.
    //
    // A group's count is the whole group in the current filter, not the part
    // that happens to be built: a number that changed as you scrolled would be
    // no use for deciding whether to open one.
    let budget = rowLimit;
    let held = 0;
    const parts = [];
    for (const [group, members] of buckets) {
      const shut = collapsed[group];
      // A group somebody folded shut costs no rows, so it stays a landmark
      // however far down the list it is, and none of it counts as withheld —
      // it is not shown because it was closed, which is a different thing.
      if (!shut && budget <= 0) { held += members.length; continue; }
      const room = shut ? [] : members.slice(0, budget);
      budget -= room.length;
      held += members.length - room.length - (shut ? members.length : 0);
      const restricted = members.filter((m) => cat.audiences?.[m]).length;
      parts.push(`<div class="grouprow" data-group="${esc(group)}" role="button" tabindex="0"
                aria-expanded="${!shut}">
          <span class="caret">${icon("chevron", "tinyicon")}</span>
          ${avatar(group)}
          <span class="gname">${esc(group)}</span>
          <span class="gcount">${members.length}</span>
          ${restricted ? `<span class="grestricted">${icon("shield", "tinyicon")}
            ${restricted} restricted</span>` : ""}
        </div>
        ${room.map((k) => keyRow(k, readable)).join("")}`);
    }
    return parts.join("") + moreRow(held);
  }

  const SCOPE_WORDS = {
    workspace: "This workspace only",
    machine: "This device",
    tailnet: "All my devices",
  };

  /** How far a key reaches, and whether this workspace may say.
   *
   *  Widening a scope hands a credential to workspaces that did not have it, so
   *  the workspace it came from keeps that decision. A borrowing workspace sees
   *  the scope and can read the key; it cannot pass it on. Otherwise sharing a
   *  key would hand over the power to share it onward, which is not sharing.
   */
  function scopePicker(k) {
    const cat = state.catalog;
    const rule = cat?.scopes?.[k];
    if (!rule) return "";
    const options = (cat.scope_options || []).map((s) =>
      `<option value="${s}"${s === rule.scope ? " selected" : ""}>${esc(SCOPE_WORDS[s] || s)}</option>`
    ).join("");
    if (!rule.may_change) {
      return `<span class="scope locked" title="Only the ${esc(rule.owner)} workspace can change this">
        ${icon("lock", "tinyicon")} ${esc(SCOPE_WORDS[rule.scope] || rule.scope)}
        · set by ${esc(rule.owner)}</span>`;
    }
    return `<select class="scope" data-scope="${esc(k)}" ${busy ? "disabled" : ""}
      title="Where this key can be used">${options}</select>`;
  }

  /** The store.
   *
   *  The page used to open with a paragraph explaining what a store is, a
   *  headline reading "281 STORED · WORKSPACE MAIN", a permanently open
   *  two-field add form, a checkbox on every row, and the file path in grey at
   *  the bottom. All of that was on screen before you had asked for any of it.
   *
   *  What is left is a search box and the keys. Adding one and selecting
   *  several are both things you do occasionally and deliberately, so both are
   *  a press away; the path and the encryption panel moved to Settings, where
   *  the rest of the machine's plumbing already lives.
   */
  function keysPage() {
    const s = state.store || {};
    const keys = shownKeys();
    const all = (s.keys || []).length;
    return `
      <h2>Keys</h2>
      <div class="group">
        <div class="toolbar">
          ${searchField("q-keys")}
          <span class="grow"></span>
          ${all ? `<button class="act ${selectMode ? "primary" : ""}" data-selectmode="1">
            ${selectMode ? "Done" : "Select"}</button>` : ""}
          <button class="act ${adding ? "primary" : ""}" data-addopen="1">
            ${icon("plus")} Add key</button>
        </div>
        ${adding ? `<div class="addrow">
          <input id="k" placeholder="Name" spellcheck="false" autocapitalize="off" />
          <input id="v" type="password" placeholder="Value" />
          <button class="act primary" id="addgo" ${busy ? "disabled" : ""}>Add</button>
        </div>` : ""}
        ${selectMode ? bulkBar(keys) : ""}
        ${groupedKeys(keys)
          || `<div class="empty">${query.trim()
                ? `Nothing matches “${esc(query)}”.` : "No keys yet."}</div>`}
      </div>
      ${query.trim() || !all ? "" : `<p class="note countnote">${countLabel(keys.length, all)}</p>`}`;
  }

  /** Encryption at rest, with the way to fix it in the same box.
   *
   *  This panel used to state the problem and stop there, which left the only
   *  actionable thing in the window as a red badge. Whatever it reports now, it
   *  also carries the next step: seal it, sign in to it, or set it up.
   */
  function encryptionPanel(seal) {
    const v = vault;
    const sealed = v?.fully_sealed ?? seal.fully_sealed;
    const readable = (v?.plaintext?.length ?? 0) + (v?.legacy_v1?.length ?? 0);
    const detail = v?.detail || seal.detail || "";

    let action = "";
    if (!v?.supported) {
      action = `<p class="note">This device has no vault runtime yet.
        Run <code>passbook install</code> to add one.</p>`;
    } else if (!v.profiles?.length) {
      // One action, one password. Creating a profile, sealing, starting the
      // broker and signing in are never useful apart, and a first-run screen
      // that asks for the same password four times is one people abandon.
      action = `
        <p class="note">One step: this makes a profile to hold the key, encrypts every
        value under it, and signs you in.</p>
        <div class="addrow">
          <input id="sec-label" placeholder="Your name" spellcheck="false" value="Owner" />
          <input id="sec-pw" type="password" placeholder="New vault password" />
          <button class="act primary" id="sec-go" ${busy ? "disabled" : ""}>Secure this device</button>
        </div>
        <p class="note">Nothing else on this device stores that password, so pick
        something you will not lose. You can undo the whole thing later.</p>
        ${aside(`<p>Values behind a framework's public prefix stay readable \u2014 a build
          inlines those into a browser bundle long before anyone could sign in, so
          encrypting them protects nothing.</p>`, "What stays readable")}`;
    } else if (!sealed) {
      action = `
        <p class="note">Encrypting ${readable === 1 ? "it" : "them"} means nothing can
        read ${readable === 1 ? "it" : "them"} again until you sign in.</p>
        <div class="addrow two">
          <input id="seal-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="seal-go" ${busy ? "disabled" : ""}>Encrypt everything</button>
        </div>`;
    } else if (!v.unlocked) {
      action = `
        <p class="note">Everything is encrypted and the vault is shut, so apps on
        this device currently have no credentials. Sign in to give them some.</p>
        <div class="addrow two">
          <input id="si-pw2" type="password" placeholder="Vault password" />
          <button class="act primary" id="si-go2" ${busy ? "disabled" : ""}>Sign in</button>
        </div>`;
    } else {
      action = `<p class="note">Signed in as ${esc(profileLabel(v.signed_in_profile))}${
        v.expires_in ? `, for another ${humanTime(v.expires_in)}` : ""}.
        <button class="act" data-signout>Lock now</button></p>`;
    }

    return `
      <div class="group">
        <h3>Encryption</h3>
        <div class="row"><div class="grow">${esc(detail)}</div>
          <span class="tag ${sealed ? "on" : "off"}">${sealed ? "Encrypted" : "Readable"}</span></div>
        ${action}
        ${sealed && v?.unlocked ? `<div class="addrow two">
          <input id="sl-pw" type="password" placeholder="Vault password" />
          <button class="act" id="unseal-go" ${busy ? "disabled" : ""}>Turn off encryption</button>
        </div>` : ""}
        ${aside(`<p>Encryption protects the store on a stolen laptop, a backup, a synced
          home folder, or a copy that ends up in a repo. While you are signed in, code
          running as you can still ask for a key \u2014 that is what Permissions are
          for.</p>${sealed ? `<p>Turning it off puts every value back in the clear on
          disk. The way out is here on purpose \u2014 an encryption you cannot reverse is
          one nobody turns on.</p>` : ""}`)}
      </div>
      ${veilGroup()}`;
  }

  /** What this window does about somebody watching the screen.
   *
   *  Stated rather than assumed, and stated per platform, because two of the
   *  three are conditional and a panel that claimed them everywhere would be
   *  wrong on exactly the machines where the difference matters. It also says
   *  what none of it covers, which is the part a page like this usually leaves
   *  out: anything running as you can still read the store through the CLI, and
   *  that is a question for Permissions, not for the screen.
   */
  function veilGroup() {
    const rows = [
      [true, "Values are drawn, not written",
       "A revealed credential is an image. There is no text for a screen reader, "
       + "for the accessibility APIs, or for an agent reading this window, and no "
       + "string left in the page afterwards."],
      [guards.capture, "Hidden from screenshots and screen sharing",
       guards.capture
         ? "This window is excluded from screen capture the same way a video player is."
         : "This platform has no way to exclude a window from capture, so a screenshot "
           + "of this window shows what is on it. The drawing above still applies."],
      [true, `Revealed values hide themselves after ${HIDE_AFTER / 1000} seconds`,
       "And the app overwrites its copy when they do."],
    ];
    if (!guards.drawing) {
      rows[0] = [false, "Values cannot be shown on this machine",
        "PassBook draws credentials rather than writing them, and found no monospace "
        + "font here to draw with. Reveal and copy are refused rather than falling "
        + "back. Use a key instead of reading it:  passbook run -- <command>"];
    }
    return `
      <div class="group">
        <h3>On screen</h3>
        ${rows.map(([on, title, why]) => `<div class="row">
          <div class="grow"><strong>${esc(title)}</strong>
            <div class="sub">${esc(why)}</div></div>
          <span class="tag ${on ? "on" : "off"}">${on ? "On" : "No"}</span>
        </div>`).join("")}
        ${aside(`<p>This is about somebody \u2014 or something \u2014 watching the
          screen. It does not cover code running as you, which can ask the store for a
          key without opening this window at all: that is what Permissions and
          <code>passbook policy --reads sealed</code> are for.</p>`)}
      </div>`;
  }

  /** A fragment written to sit mid-sentence, used to open one. */
  const sentence = (s) => String(s || "").replace(/^./, (c) => c.toUpperCase());

  function profileLabel(id) {
    return (vault?.profiles || []).find((p) => p.id === id)?.label || id || "this device";
  }

  const BACKUP_SHAPES = {
    encrypted: ["Encrypted", "A passphrase you choose. Portable, needs nothing installed at the other end."],
    gpg: ["GPG", "An armoured GPG message, symmetric under a passphrase."],
    plain: ["Plain text", "Every value readable. For moving to a device that has no PassBook yet."],
  };

  function defaultExportPath(shape) {
    const home = state?.home || "~";
    const day = new Date().toISOString().slice(0, 10);
    const where = state?.catalog?.workspace || state?.store?.workspace || "store";
    const ext = shape === "plain" ? "env" : shape === "gpg" ? "asc" : "pbx";
    return `${home}/Desktop/passbook-${where}-${day}.${ext}`;
  }

  /** Getting the store out, and back in.
   *
   *  Three shapes because the reasons differ. The plaintext one asks twice on
   *  purpose: "export" reads like "back up", and a plaintext backup is a copy
   *  of every credential you own.
   */
  /** Writing the store out, and reading one back in.
   *
   *  Both used to be on screen at once: five unlabelled input rows in a column,
   *  with no seam between the two jobs and the passphrase an export needs
   *  sitting *under* the button that had already run without it. They are one
   *  job at a time, so they are one at a time.
   */
  function backupPanel() {
    const v = vault;
    const shape = backup.shape;
    const [, blurb] = BACKUP_SHAPES[shape];
    const needsPass = shape !== "plain";
    const locked = v?.supported && v.fully_sealed && !v.unlocked;
    const exporting = backup.tab !== "import";

    const out = `
      ${locked ? `<p class="note">The vault is shut, so there is nothing readable to
        export. Sign in first.</p>` : ""}
      <div class="row"><span class="dlabel">Format</span>
        <div class="seg">${Object.entries(BACKUP_SHAPES).map(([id, [label]]) =>
          `<button data-bshape="${id}" aria-pressed="${shape === id}">${label}</button>`).join("")}</div>
      </div>
      <p class="note">${esc(blurb)}</p>
      ${needsPass ? `<div class="addrow one">
        <input id="bk-pass" type="password" placeholder="Passphrase for the file" />
      </div>` : `<p class="note err">${icon("alert", "tinyicon")} Every value in that file
        will be readable by anything that can open it. It is not a backup you keep; it is
        a thing you move and then destroy.</p>`}
      <div class="addrow two">
        <input id="bk-path" value="${esc(backup.path || defaultExportPath(shape))}"
          spellcheck="false" placeholder="Where to write it" />
        <button class="act ${shape === "plain" ? "danger" : "primary"}" id="bk-export"
          ${busy || locked ? "disabled" : ""}>${icon("out")} Export</button>
      </div>`;

    const back = `
      <p class="note">Encrypted, GPG and plain text are all recognised by looking at
      the file.</p>
      <div class="addrow one">
        <input id="bk-inpass" type="password" placeholder="Its passphrase, if it has one" />
      </div>
      <div class="addrow three">
        <input id="bk-in" placeholder="Path to an export" spellcheck="false" />
        <button class="act" id="bk-inspect" ${busy ? "disabled" : ""}>${icon("eye")} Inspect</button>
        <button class="act primary" id="bk-import" ${busy ? "disabled" : ""}>${icon("into")} Import</button>
      </div>`;

    return `
      <div class="group">
        <div class="grouphead">
          <h3>Backup</h3>
          <div class="seg">
            <button data-btab="export" aria-pressed="${exporting}">Export</button>
            <button data-btab="import" aria-pressed="${!exporting}">Import</button>
          </div>
        </div>
        ${exporting ? out : back}
        ${backup.said ? `<pre class="snippet">${esc(backup.said)}</pre>` : ""}
        ${aside(`<p>An import never overwrites a key this store already holds; it says
          which ones it kept. Exports and imports are both recorded by name in
          Activity.</p>`)}
      </div>`;
  }

  /** The two ways back in if the password goes.
   *
   *  A recovery code and a trusted device answer the same question, and they
   *  were two cards apart with the store's whole backup section between them —
   *  one of them a card containing nothing but a collapsed line.
   */
  function recoveryPanel() {
    const v = vault;
    return `
      <div class="group">
        <h3>If you lose the password</h3>
        ${recoveryCode ? `
          <div class="row">
            <span class="statustile good">${icon("shield")}</span>
            <div class="grow"><strong>Write this down, somewhere this device is not.</strong>
              <div class="recovery mono">${esc(recoveryCode)}</div></div>
            <button class="iconbtn ${copied.__recovery ? "done" : ""}"
              data-copytext="${esc(recoveryCode)}" data-copymark="__recovery"
              title="Copy" aria-label="Copy the recovery code">${icon(copied.__recovery ? "check" : "copy")}</button>
          </div>
          <p class="note">Shown once. It opens the vault on its own, so it is as good as
          the password \u2014 PassBook cannot show it again.</p>
          <div class="addrow two"><span></span>
            <button class="act" data-recoverydone>I have written it down</button></div>
        ` : `
          <div class="row"><div class="grow">A recovery code is a second way in. Without
            one, a forgotten password is the end of this store.</div></div>
          <div class="addrow two">
            <input id="rc-pw" type="password" placeholder="Vault password" />
            <button class="act" id="rc-go" ${busy || !v?.profiles?.length ? "disabled" : ""}>
              ${icon("shield")} Make a recovery code</button>
          </div>`}
        ${aside(`<p>${esc(sentence(v?.keystore?.describe || "no OS keystore on this platform"))}.
          ${v?.keystore?.available
            ? "Trusting this device would let jobs start at boot without you \u2014 at the cost of letting anything running as you open the vault. Add it with <code>passbook profile trust-device</code>."
            : "Sign-in here is by password, which works the same on every platform."}</p>`,
          "Unlock with this device instead")}
      </div>`;
  }

  /** Whether values are handed to callers the broker did not start.
   *
   *  Its own block rather than a line in the sealing card, because it answers a
   *  different question. Sealing is about the disk; this is about what a
   *  process running as you can obtain while the vault is wide open — which is
   *  the gap people assume encryption already closed, and it does not.
   */
  function readsBlock() {
    const mode = state?.access?.reads || "open";
    const guarded = Object.keys(state?.access?.guarded || {});
    const sealed = mode === "sealed";
    return `
      <div class="group">
        <div class="row"><span class="statustile ${sealed ? "good" : "warn"}">${
          icon(sealed ? "lock" : "unlock")}</span>
        <div class="grow"><strong>${sealed ? "Values are never handed out" : "Values can be read"}</strong> —
          ${sealed
            ? `credentials go only into processes PassBook starts, so an agent can
               use them and cannot read them.`
            : `anything running as you can ask for a value and receive it.
               <code>passbook policy --reads sealed</code> closes that.`}
          ${guarded.length
            ? `<div class="sub">${guarded.length} key${guarded.length === 1 ? " is" : "s are"}
               guarded and never printed whatever this is set to:
               ${guarded.map(esc).join(", ")}.</div>`
            : `<div class="sub">No keys are individually guarded.
               <code>passbook guard NAME --to host</code> binds one.</div>`}
        </div></div>
      </div>`;
  }

  function vaultPage() {
    const v = vault;
    if (!v) return settingsBack("Security") + `<p class="lede">Reading…</p>`;
    if (!v.supported) {
      return settingsBack("Security") + `
        <p class="lede">This device cannot encrypt keys yet.</p>
        <div class="group"><p class="note">Run <code>passbook install</code> to add it,
        then reopen this window.</p></div>`;
    }

    // A held key is not the same claim as a readable store. Each profile has
    // its own key and the profile is bound into every value, so signing in to
    // the wrong one holds a perfectly good key that opens nothing.
    const sealedCount = (v.sealed || []).length;
    const opens = v.opens ?? sealedCount;
    const wrongProfile = v.unlocked && sealedCount > 0 && opens === 0;
    const partial = v.unlocked && opens > 0 && opens < sealedCount;

    const openState = v.unlocked
      ? `<div class="row"><span class="statustile ${wrongProfile ? "warn" : "good"}">${
           icon(wrongProfile ? "alert" : "unlock")}</span>
         <div class="grow"><strong>${wrongProfile ? "Open, and reading nothing" : "Open"}</strong> —
           signed in as ${esc(profileLabel(v.signed_in_profile))} by ${esc(v.factor || "password")}${
             v.expires_in ? `, ${humanTime(v.expires_in)} left`
                          : ", and it stays open until you lock it"}.
           ${wrongProfile ? `<div class="sub">None of the ${sealedCount} encrypted values open with
             this profile — they were sealed by another one. Sign out and sign in to the profile
             that holds them.</div>`
             : partial ? `<div class="sub">${opens} of ${sealedCount} encrypted values open with
               this profile; the rest were sealed by another one.</div>` : ""}</div>
         <button class="act" data-signout ${busy ? "disabled" : ""}>${icon("lock")} Lock</button></div>`
      : `<div class="row"><span class="statustile warn">${icon("lock")}</span>
         <div class="grow"><strong>Locked</strong> —
           ${v.fully_sealed
             ? "apps on this device have no credentials right now."
             : "though the store is not sealed, so values are readable anyway."}</div>
         <span class="tag off">Locked</span></div>`;

    const signIn = v.unlocked || !v.profiles.length ? "" : `
      <div class="group">
        <h3>Sign in</h3>
        ${v.profiles.length > 1 ? `
          <select id="si-profile">
            ${v.profiles.map((p) => `<option value="${esc(p.id)}"${
              p.id === (vaultForm.profile || v.active) ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
          </select>` : ""}
        <div class="addrow two">
          <input id="si-pw" type="password" placeholder="Vault password" />
          <select id="si-for" title="How long to stay open">
            ${SESSION_LENGTHS.map(([value, label]) => `<option value="${value}"${
              value === vaultForm.duration ? " selected" : ""}>${label}</option>`).join("")}
          </select>
          <button class="act primary" id="si-go" ${busy ? "disabled" : ""}>Sign in</button>
        </div>
        ${aside(`<p>Staying open is the default. Nothing locks itself — a vault that
          shut at four in the morning would stop the work it exists to allow. Lock it
          whenever you want to.</p>`, "About staying signed in")}
        ${!v.running ? `<p class="note">The broker is not running; signing in starts it.</p>` : ""}
      </div>`;

    // Adding a profile is a once-a-year act, and its form was permanently open
    // under the list — a third "Vault password" box on a screen that already
    // had two, asking for a new one rather than the one you have.
    const profiles = `
      <div class="group">
        <div class="grouphead">
          <h3>Profiles</h3>
          <button class="act ${addingProfile ? "primary" : ""}" data-addprofile="1">
            ${addingProfile ? "Cancel" : "Add profile"}</button>
        </div>
        ${v.profiles.length ? v.profiles.map((p) => `
          <div class="row">
            <div class="grow">
              <strong>${esc(p.label)}</strong>${p.active ? " · active" : ""}
              <div class="factors">${p.factors.length
                ? p.factors.map((f) => `<span class="chip">${icon(
                    { password: "key", passkey: "person", device: "monitor" }[f.kind] || "shield",
                    "tinyicon")} ${esc(f.kind)}</span>`).join("")
                : `<span class="chip">no factors</span>`}</div>
            </div>
            ${p.active ? "" : `<button class="act" data-use="${esc(p.label)}">Use</button>`}
          </div>`).join("")
          : `<div class="empty">No profiles yet.</div>`}
        ${addingProfile ? `<div class="addrow">
          <input id="np-label" placeholder="Name for the new profile" spellcheck="false" />
          <input id="np-pw" type="password" placeholder="A password for it" />
          <button class="act primary" id="np-create" ${busy ? "disabled" : ""}>Create</button>
        </div>` : ""}
        ${aside(`<p>A profile is a sign-in and the key it holds, not a separate store.
          Every profile lists the same keys; what changes is whose key opens them.</p>
          <p>Adding one does not switch to it — press <strong>Use</strong> when you mean
          to, then sign in again.</p>`, "What a profile is")}
      </div>`;

    // One encryption panel, not two. This page and the Keys page each carried
    // their own; they disagreed about first run, because only one of them knew
    // how to make a profile and seal in a single step.
    const encryption = encryptionPanel(state.sealing || {});

    return settingsBack("Security") + `
      <div class="group">${openState}</div>
      ${readsBlock()}
      ${signIn}${encryption}${profiles}${recoveryPanel()}${backupPanel()}`;
  }

  function lockBanner() {
    if (!vault?.supported || vault.unlocked || !vault.fully_sealed) return "";
    return `<div class="banner">
      ${icon("lock")}
      <div class="body"><strong>The vault is locked.</strong>
      Every value is encrypted, so apps on this device have no credentials until you sign in.
      <div class="acts"><button data-goto="vault">Sign in</button></div></div>
    </div>`;
  }

  /** The grid: every key against every app that has actually asked.
   *
   *  The apps listed are read out of the access ledger, not just the ones
   *  somebody remembered to configure — those are usually the interesting ones.
   */
  const STATE_TAG = {
    connected:    ["on",  "Live"],
    expiring:     ["on",  "Renewing"],
    expired:      ["off", "Expired"],
    "no-refresh": ["off", "No refresh"],
    disconnected: ["off", "Signed out"],
  };

  async function refreshSignins() {
    try { signins = await invoke("oauth_state"); }
    catch { signins = null; }
  }

  async function callSignin(name, args = {}) {
    busy = true; paint();
    try { signins = await invoke(name, args); notice = ""; }
    catch (e) { notice = String(e); }
    finally { busy = false; paint(); }
  }

  /** Accounts this machine is signed in to, and whether they still work.
   *
   *  An OAuth grant is a credential with a clock on it. The broker renews one
   *  when something reads it, so "expired" here is a statement about right now
   *  rather than a problem — what actually needs a person is a grant with no
   *  refresh token, or one the provider has revoked.
   */
  function signinsPage() {
    const list = signins;
    if (list === null) {
      return `<h2>Sign-ins</h2><p class="lede">Reading…</p>`;
    }

    const rows = list.length ? list.map((s) => {
      const [tone, label] = STATE_TAG[s.state] || ["off", s.state];
      const waiting = connecting[s.id];
      return `<div class="row">
        ${avatar(String(s.id).split(":")[0])}
        <div class="grow">
          <strong class="mono">${esc(s.id)}</strong>
          <div class="note">${esc(s.detail)}</div>
        </div>
        <span class="tag ${tone}">${esc(label)}</span>
        ${waiting
          ? `<span class="note">waiting for the browser…</span>`
          : `${s.has_refresh ? `<button class="act" data-oarefresh="${esc(s.id)}"
                ${busy ? "disabled" : ""}>Renew</button>` : ""}
             <button class="act" data-oaconnect="${esc(s.id)}" ${busy ? "disabled" : ""}>
               ${s.state === "disconnected" ? "Sign in" : "Sign in again"}</button>
             <button class="act danger" data-oaforget="${esc(s.id)}" ${busy ? "disabled" : ""}>Forget</button>`}
      </div>`;
    }).join("") : `<div class="empty">No sign-ins yet.</div>`;

    return `<h2>Sign-ins</h2>
      <p class="lede">Accounts this device holds, kept signed in so agents never
      meet a dead one.</p>
      <div class="group">
        ${rows}
        ${aside(`<p>A sign-in is stored like any other credential \u2014 encrypted with
          them, held to the same rules, in the same record. What is different is the
          clock: it is renewed on the way past when something reads it, so nothing has
          to handle that itself.</p>`, "How these stay alive")}
      </div>
      <div class="group">
        <h3>Add a sign-in</h3>
        <p class="note">Register a client with the provider, then describe it here.
        Nothing is connected until you sign in.</p>
        <pre class="snippet">passbook oauth add google work --client-id &lt;your client id&gt;
passbook oauth connect google:work</pre>
        ${aside(`<p>No vendor's own client id ships with PassBook. Some tools sign in
          with a client they registered for themselves, and borrowing one is between
          you and that vendor's terms \u2014 not something this app should decide for
          you.</p>`, "Why you need your own client id")}
      </div>`;
  }

  function appsPage() {
    const cat = state.catalog;
    if (!cat?.available) {
      return settingsBack("Apps") + `
        <div class="group"><p class="note">Run <code>passbook install</code>, then reopen.</p></div>`;
    }
    const known = cat.agents || [];
    const restricted = Object.keys(cat.audiences || {});

    const summary = `
      <div class="group">
        <div class="row">
          <div class="grow"><strong>${known.length}</strong> app${known.length === 1 ? "" : "s"}
            have asked this device for a credential.</div>
          <span class="tag ${restricted.length ? "info" : ""}">${restricted.length
            ? `${restricted.length} restricted` : "nothing restricted"}</span>
        </div>
        ${known.length ? `<div class="chips">${[...known].sort((a, b) =>
            ((cat.agent_activity || {})[b] || 0) - ((cat.agent_activity || {})[a] || 0)
          ).map((a) => {
            const asks = (cat.agent_activity || {})[a] || 0;
            // A name alone cannot be judged: a daemon asking every minute and a
            // one-off from a test read identically without this.
            return `<span class="chip mono" title="${asks} recorded read${asks === 1 ? "" : "s"}">${esc(a)}
              <span class="asks">${asks}</span></span>`;
          }).join("")}</div>`
          : `<p class="note">None yet. An app appears here the first time it asks —
             including ones you never configured, which is the point.</p>`}
        ${aside(`<p>These are the names things give when they ask. A name is a claim,
          not a proof: it chooses the policy and fills the record, but it is not a
          password. The number beside each is how many reads it has on record \u2014 a
          name with one is usually a test that ran once.</p>
          <p>PassBook's own commands are not listed; restricting them would be
          restricting yourself. They are all in Activity.</p>`, "About these names")}
      </div>`;

    const mcp = `
      <div class="group">
        <h3>Give an agent access</h3>
        <p class="note">So an agent can ask for one credential at a time instead of you
        pasting keys into a chat.</p>
        <pre class="snippet">claude mcp add passbook -- passbook mcp</pre>
        ${aside(`<p>For anything else, point it at <code>passbook mcp</code> over
          stdio.</p>`, "Other agents")}
      </div>`;

    if (!grid) {
      return settingsBack("Apps") + `
        ${summary}
        <div class="group">
          <div class="row"><div class="grow">See every key against every app.</div>
            <button class="act" data-grid="1" ${busy ? "disabled" : ""}>Show the grid</button></div>
        </div>
        ${mcp}`;
    }

    const rows = grid.rows.filter((r) =>
      !gridOnlyRestricted || r.audience.mode !== "all"
      || Object.values(r.agents).some((c) => c.outcome !== "grant"));

    return settingsBack("Apps") + `
      ${summary}
      <div class="group">
        <div class="row">
          <div class="grow">${rows.length} key${rows.length === 1 ? "" : "s"} ×
            ${grid.agents.length} app${grid.agents.length === 1 ? "" : "s"}</div>
          <button class="act ${gridOnlyRestricted ? "primary" : ""}" data-gridfilter="1">
            ${gridOnlyRestricted ? "Showing restricted" : "Show all"}</button>
          <button class="act" data-grid="1">Refresh</button>
        </div>
        <div class="matrixwrap">
          <table class="matrix">
            <thead><tr><th>Key</th>${grid.agents.map((a) =>
              `<th class="mono">${esc(a)}</th>`).join("")}</tr></thead>
            <tbody>
              ${rows.map((r) => `<tr>
                <td class="mono kname">${esc(r.key)}
                  <span class="gtag">${esc(r.group)}</span></td>
                ${grid.agents.map((a) => {
                  const cell = r.agents[a];
                  const cls = { grant: "yes", refuse: "no", ask: "ask" }[cell.outcome];
                  const glyph = { grant: "check", refuse: "cross", ask: "question" }[cell.outcome];
                  const word = { grant: "yes", refuse: "no", ask: "asks" }[cell.outcome];
                  return `<td class="cell ${cls}" title="${esc(cell.why)}"
                    aria-label="${word}">${icon(glyph)}</td>`;

            </tbody>

        </div>
        ${rows.length ? "" : `<div class="empty">Nothing is restricted — every app

      ${mcp}`;

  /** Which workspace this machine acts for, and the way back in.
   *
   *  Locking and choosing a workspace belong on one screen because they are one
   *  moment: you step away from a client's credentials, or you step into them.
   *  Splitting them puts the sign-in on a page you reach by remembering it.
   */
  function switchPage() {
    const cat = state.catalog || {};
    const rows = cat.workspace_rows || [];
    const here = cat.workspace || state.store?.workspace || "";
    const pinned = cat.workspace_pinned;
    const v = vault;

    const list = rows.length ? rows.map((row) => `
      <div class="row">
        ${avatar(row.label || row.id)}
        <div class="grow">
          <div><strong>${esc(row.label || row.id)}</strong>${row.active ? " \u00b7 active" : ""}</div>
          <div class="sub mono">${esc(row.id)}${row.inherits ? ""
            : " \u00b7 does not inherit the shared store"}</div>
        </div>
        ${row.active
          ? `<span class="tag on">Here</span>`
          : `<button class="act" data-workspace="${esc(row.id)}" ${busy || pinned ? "disabled" : ""}>
               Switch</button>`}
      </div>`).join("")
      : `<div class="empty">This device has no workspaces \u2014 everything lives in the
         shared store.</div>`;

    const signIn = !v?.supported ? "" : v.unlocked ? `
      <div class="group">
        <div class="row">
          <span class="statustile good">${icon("unlock")}</span>
          <div class="grow"><strong>Signed in</strong> as
            ${esc(profileLabel(v.signed_in_profile))}${v.expires_in
              ? `, ${humanTime(v.expires_in)} left` : ""}.</div>
          <button class="act" data-signout ${busy ? "disabled" : ""}>${icon("lock")} Lock</button>
        </div>
        <p class="note">Locking closes the vault for everything on this device, not just
        this window. Anything mid-request gets refused rather than served stale.</p>
      </div>`
      : `
      <div class="group">
        <h3>Sign in</h3>
        ${(v.profiles || []).length > 1 ? `
          <div class="addrow two">
            <select id="sw-profile">
              ${v.profiles.map((p) => `<option value="${esc(p.id)}"${
                p.id === (vaultForm.profile || v.active) ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
            </select>
          </div>` : ""}
        <div class="addrow two">
          <input id="sw-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="sw-go" ${busy ? "disabled" : ""}>${icon("unlock")} Sign in</button>
        </div>
        ${(v.profiles || []).length ? "" : `<p class="note">No profile on this device yet.
          Set one up on the Vault page.</p>`}
      </div>`;

    return `
      <h2>Workspace</h2>
      <p class="lede">Which set of credentials this device is working with, and
      whether anything can read them.</p>
      ${signIn}
      <div class="group">
        <h3>Workspaces</h3>
        ${list}
        ${pinned ? `<p class="note">HIVE_WORKSPACE is set in this app's environment, so it is
          pinned to <span class="mono">${esc(here)}</span> and switching is turned off here.
          A pinned process is pinned deliberately \u2014 usually an agent working for one
          client \u2014 and a switch made in this window should not quietly re-point it.</p>`
          : `<p class="note">Switching writes HivemindOS's own workspace manifest, so both
          apps agree on which one is active. Keys stay where they are; what changes is which
          store this device reads first and where a new key is written.</p>`}
      </div>`;
  }

  const CONFIRM_WORDS = {
    add: ["Adding a key", "A credential this store did not have before."],
    modify: ["Replacing a value", "An existing key being overwritten \u2014 the change that quietly breaks things."],
    delete: ["Removing a key", "Gone from this store; the value is not recoverable from here."],
  };

  /** What happens when something asks — the rules that are not about one key.
   *
   *  Two thirds of this page used to be a list of all 281 keys with a
   *  three-way switch on each: 843 buttons, kept up to date with the identical
   *  list on the Keys page, so that changing one key meant finding it twice.
   *  That switch now lives on the key, where it is a property of the key. What
   *  is left here is the part that is genuinely global.
   */
  function accessPage() {
    const a = state.access || {};
    const cat = state.catalog || {};
    const pending = state.broker?.pending || [];
    const open = a.sessions || [];
    return `
      ${settingsBack("Permissions")}
      ${pending.map((p) => `
        <div class="banner">
          ${icon("alert")}
          <div class="body">
            <b>${esc(p.app)}</b> ${esc({ add: "wants to add", modify: "wants to change",
              delete: "wants to remove" }[p.kind] || "wants")} ${esc((p.keys || []).join(", "))}
            ${p.reason ? `<div style="opacity:.85;margin-top:2px">${esc(p.reason)}</div>` : ""}
            <div class="acts">
              <button data-ok="${esc(p.id)}" data-for="">Just once</button>

            </div>

      <div class="group">
        <h3>Ask before changing a key</h3>
        ${(cat.confirm_ops || ["add", "modify", "delete"]).map((op) => {
          const on = !!(cat.confirm || {})[op];
          const [label, blurb] = CONFIRM_WORDS[op];
          return `<div class="row">
            <div class="grow"><div><strong>${label}</strong></div>
              <div class="sub">${blurb}</div></div>
            <div class="seg">
              <button data-confirm="${op}" data-on="0" aria-pressed="${!on}">Straight away</button>
              <button data-confirm="${op}" data-on="1" aria-pressed="${on}">Ask me</button>
            </div>
          </div>`;
        }).join("")}
      </div>
      <div class="group">
        <h3>Stop being asked</h3>
        ${open.length ? open.map((u) => `
          <div class="row"><div class="grow">${(u.keys || []).length
              ? `<span class="mono">${esc(u.keys.join(", "))}</span>` : "Every key"}</div>
            <span class="tag on">${Math.round(u.remaining_seconds / 60)}m left</span>
            <button class="act" data-lock="1" ${busy ? "disabled" : ""}>Close now</button></div>`).join("")
          : `<div class="row"><div class="grow">Answer everything without asking, for a while.
             It closes on its own.</div>
             <div class="seg">${(a.presets || ["15m","1h","4h"]).map((p) =>
               `<button data-unlock="${p}">${p}</button>`).join("")}</div></div>`}
      </div>
      <p class="note">Each key also has its own answer — open a key on the Keys page to

  }

  function machinesPage() {
    const l = state.links || {};
    // Tailnet machines sit in the same list as grants, badged with how trust
    // was established. They belong here — they hold the store — but a grant
    // had a fingerprint compared on two screens and an adoption did not, and
    // one badge is the difference between saying so and implying otherwise.
    const rows = [
      ...(l.lent || []).map((r) => ({ ...r, lent: true })),
      ...(l.tailnet || []).map((r) => ({ ...r, lent: true })),
      ...(l.borrowed || []),
    ];
    return `
      <h2>Devices</h2>
      <p class="lede">Every device that holds this store \u2014 the ones you paired with,
      and the ones that have it because they are on your network.</p>
      <div class="group">
        <h3>This device</h3>
        <div class="row">
          <span class="statustile plain">${icon("monitor")}</span>
          <div class="grow"><div class="mono">${esc(l.fingerprint || "—")}</div>
            <div class="sub">Pairing code \u2014 both ends read this aloud before a key moves.</div></div>
          ${l.fingerprint ? `<button class="iconbtn ${copied.__fingerprint ? "done" : ""}"
            data-copytext="${esc(l.fingerprint)}" data-copymark="__fingerprint"
            title="${copied.__fingerprint ? "Copied" : "Copy pairing code"}"
            aria-label="Copy pairing code">${icon(copied.__fingerprint ? "check" : "copy")}</button>` : ""}
        </div>
      </div>
      <div class="group">
        <h3>Paired devices</h3>
        ${rows.map((r) => `
          <div class="row">
            <span class="statustile plain sm">${icon(r.lent ? "out" : "into")}</span>
            <div class="grow">
              <div>${r.lent ? "Lent to" : "Borrowed from"}
                <span class="mono">${esc(r.host || r.fingerprint || r.did)}</span>
                ${r.via === "tailnet"
                  ? `<span class="viatag" title="Trusted because it is on your network. No pairing code was compared.">${icon("globe", "tinyicon")} network</span>`
                  : `<span class="viatag grant" title="Both ends compared a pairing code.">${icon("shield", "tinyicon")} paired</span>`}</div>
              ${(r.keys || []).length > 8
                ? `<div class="sub">${(r.keys || []).length} keys \u2014 everything whose reach allows it</div>`
                : `<div class="chips inline">${(r.keys || []).map((k) =>
                    `<span class="chip mono">${esc(k)}</span>`).join("") || `<span class="sub">no keys</span>`}</div>`}</div>
            ${r.lent && r.active
              ? (r.via === "tailnet"
                  ? `<button class="act" data-forget="${esc(r.host)}" ${busy ? "disabled" : ""}>Forget</button>`
                  : `<button class="act" data-revoke="${esc(r.did)}" ${busy ? "disabled" : ""}>Revoke</button>`)
              : `<span class="tag ${r.active ? "on" : "off"}">${r.revoked ? "Revoked" : r.active ? "Active" : "Expired"}</span>`}
          </div>`).join("") || `<div class="empty">No other devices.</div>`}
        ${aside(`<p>A pairing names which keys may move, and it can be undone from
          here. It is not the only way a device ends up holding this store \u2014 see
          below.</p>`)}
      </div>
      ${fleetPanel()}`;
  }

  /** Machines that hold this store without a PassBook grant.
   *
   *  Kept apart from linked machines rather than merged with them. A linked
   *  machine is trusted because both ends compared a fingerprint; a tailnet
   *  peer is trusted because it is on the tailnet. One list would be the more
   *  comfortable lie, and this page already told someone "no linked machines"
   *  while six machines held their credentials.
   */
  function fleetPanel() {
    const f = state.fleet;
    if (!f) return "";
    if (!f.available) {
      return `<div class="group">
        <h3>Your network</h3>
        <p class="note">${esc(f.detail || "This device cannot see your network.")}</p>
      </div>`;
    }
    // Machines already recorded above are not repeated here. What is left is
    // the rest of the tailnet: on it, but not receiving the store.
    const known = new Set(((state.links || {}).tailnet || []).map((r) => r.host));
    const rows = (f.peers || []).filter((p) => !known.has(p.host));
    const replicating = rows.filter((p) => p.replicates);
    if (!rows.length) {
      return `<div class="group">
        <h3>Rest of your network</h3>
        <p class="note">Every device that receives the store is listed above.</p>
      </div>`;
    }
    return `
      <div class="group">
        <div class="row">
          <span class="statustile ${replicating.length ? "warn" : "plain"}">${icon("globe")}</span>
          <div class="grow">${replicating.length
            ? `<strong>${replicating.length}</strong> more device${replicating.length === 1 ? "" : "s"}
               receive${replicating.length === 1 ? "s" : ""} this store but ${replicating.length === 1 ? "is" : "are"}
               not recorded above. Run <code>passbook sync</code> to record ${replicating.length === 1 ? "it" : "them"}.`
            : `The rest of your network. ${rows.length} device${rows.length === 1 ? "" : "s"}
               ${rows.length === 1 ? "is" : "are"} reachable but ${rows.length === 1 ? "does" : "do"} not
               receive the store.`}</div>
          <span class="tag ${replicating.length ? "info" : ""}">${rows.length} other${rows.length === 1 ? "" : "s"}</span>
        </div>
        ${rows.map((p) => `
          <div class="row">
            <span class="statustile plain sm">${icon(p.replicates ? "globe" : "monitor")}</span>
            <div class="grow">
              <div class="mono">${esc(p.host)}</div>
              <div class="sub">${esc(p.os || "unknown")}${p.replicates
                ? " \u00b7 set up" : " \u00b7 not set up \u2014 does not receive the store"}</div>
            </div>
            ${p.replicates
              ? `<span class="tag off">Has the store</span>`
              : `<span class="tag">Not shared</span>`}
          </div>`).join("") || `<div class="empty">No other devices on your network.</div>`}
        ${aside(`<p>A device stays here until <code>passbook sync</code> has seen it,
          after which it joins the list above.</p>`)}
      </div>`;
  }

  /** The drawer everything technical was moved into.
   *
   *  The background service had a page in the source list, level with Keys.
   *  Nobody opens an app to look at a daemon — but the day it is not running
   *  is the day you need to find it, so it is one press inside Settings
   *  rather than gone. The store's path on disk joins it here; it was in grey
   *  under 281 keys, where it was decoration for everyone who did not need it
   *  and unfindable for the one person who did.
   */
  function brokerPage() {
    const b = state.broker || {};
    const st = state.store || {};
    return `
      ${settingsBack("Advanced")}
      <div class="group">
        <h3>Background access</h3>
        <div class="row">
          <span class="statustile ${b.running ? "good" : "warn"}">${icon("hub")}</span>
          <div class="grow">${b.running
            ? "Running. Every read goes through one door and is recorded."
            : "Not running — each app records its own reads, so Activity has gaps."}</div>
          <span class="tag ${b.running ? "on" : "off"}">${b.running ? "On" : "Off"}</span>
          <button class="act ${b.running ? "" : "primary"}" data-broker="${b.running ? "stop" : "start"}"
            ${busy ? "disabled" : ""}>${icon("power")} ${b.running ? "Turn off" : "Turn on"}</button></div>
        ${b.limits ? aside(`<p>${esc(b.limits)}</p>`, "What this does not stop") : ""}
      </div>
      <div class="group">
        <h3>On this device</h3>
        <div class="row"><span class="dlabel">Store</span>
          <span class="mono pathval">${esc(st.path || "—")}</span></div>
        ${st.writes_to && st.writes_to !== st.path ? `
          <div class="row"><span class="dlabel">New keys go to</span>
            <span class="mono pathval">${esc(st.writes_to)}</span></div>` : ""}
        <div class="row"><span class="dlabel">Workspace</span>
          <span class="mono pathval">${esc(st.workspace || "main")}</span></div>
      </div>`;
  }

  /** What each kind of entry did, in words — one entry per ledger operation.
   *
   *  Both halves matter. `did` is what happened; `didnt` is what the same row
   *  means when `granted` is false, and it is not one sentence for all of them:
   *  a refused sign-in was refused, but a read that comes back false only means
   *  some of the names asked for were not in the store. This app said "was
   *  refused" for both, which turned 438 ordinary rows into security events and
   *  buried the one row on this machine that really was a refusal.
   *
   *  `bare` marks the operations that are about the store rather than about
   *  particular keys, so they do not get "1 key" glued to the end of them.
   *
   *  Keep this in step with OPERATIONS in passbook_stamp.py — a missing entry
   *  prints the raw op verbatim, which is how "hivemindos reveal 1 keys" got on
   *  screen. There is a test that fails if the two drift apart.
   */
  const OP_WORD = {
    read:      { did: "read", didnt: "read", partial: "some were not there" },
    reveal:    { did: "revealed", didnt: "could not reveal" },
    // "used", never "read": the whole point of a grant is that the caller
    // caused the key to work without ever holding it, and a row saying "read"
    // would claim the one thing that did not happen.
    use:       { did: "used", didnt: "could not use" },
    write:     { did: "changed", didnt: "could not change" },
    denied:    { did: "was refused", didnt: "was refused" },
    ask:       { did: "asked to use", didnt: "asked to use" },
    approve:   { did: "was allowed", didnt: "was allowed" },
    unlock:    { did: "opened access to", didnt: "could not open access to" },
    lock:      { did: "closed access to", didnt: "closed access to" },
    refresh:   { did: "renewed", didnt: "could not renew" },
    export:    { did: "exported", didnt: "could not export" },
    import:    { did: "imported", didnt: "could not import" },
    link:      { did: "was given", didnt: "could not be given" },
    unlink:    { did: "no longer has", didnt: "no longer has" },
    provision: { did: "set up", didnt: "could not set up" },
    signin:    { did: "signed in", didnt: "was refused a sign-in", bare: true },
    signout:   { did: "locked the vault", didnt: "locked the vault", bare: true },
    seal:      { did: "encrypted the store", didnt: "could not encrypt the store", bare: true },
    unseal:    { did: "decrypted the store", didnt: "could not decrypt the store", bare: true },
    recovery:  { did: "made a recovery code", didnt: "could not make one", bare: true },
  };

  /** What each kind of entry did, as a glyph. Same vocabulary, same test. */
  const OP_ICON = {
    read: "eye", reveal: "eye", write: "pencil", denied: "cross", ask: "alert",
    approve: "check", unlock: "unlock", lock: "lock", refresh: "history",
    export: "out", import: "into", link: "link", unlink: "cross",
    provision: "plus", signin: "unlock", signout: "lock", seal: "lock",
    use: "unlock",
    unseal: "unlock", recovery: "shield",
  };

  /** The same thing, over and over, as one row that says how many times.
   *
   *  675 of the 2,208 rows on this machine share a timestamp to the second
   *  with another row: one caller read a single key 29 times inside one
   *  second. Printing 29 identical lines is accurate and useless — it fills
   *  the page with one event and pushes everything else off it. Folded up,
   *  with the count kept, nothing is hidden and the rest is visible.
   */
  function foldRuns(rows) {
    const out = [];
    for (const row of rows) {
      const run = out[out.length - 1];
      const same = run && run.row.app === row.app && run.row.op === row.op
        && run.row.granted === row.granted
        && (run.row.keyCount || 0) === (row.keyCount || 0)
        && (run.row.keys || []).join() === (row.keys || []).join();
      // Rows arrive newest first, so the head of a run keeps the time shown
      // and the tail is remembered for the tooltip. Folding must never lose
      // when something happened — only how many lines it takes to say so.
      if (same) { run.times += 1; run.oldest = row.at; }
      else out.push({ row, times: 1, oldest: row.at });
    }
    return out;
  }

  /** Re-hash the whole chain and say whether it holds.
   *
   *  Not part of the five-second refresh: it walks every row of a ledger that
   *  is megabytes long, and it was costing that on every poll to answer a
   *  question only this page asks. Asked once when the page opens, and again
   *  whenever somebody presses the button.
   */
  async function checkChain() {
    if (chain.busy) return;
    chain.busy = true; paint();
    try { chain.answer = await invoke("verify_record"); }
    catch (e) { chain.answer = { intact: null, detail: String(e) }; }
    finally { chain.busy = false; paint(); }
  }

  function recordPage() {
    const r = state.record || {};
    const rows = (r.rows || []).slice(-40).reverse();
    // `state` no longer verifies, so `intact` arrives as null and only this
    // page's own check fills it in. Null is not "fine" — a chain nobody has
    // checked must not be labelled Intact, which is the whole point of it.
    const checked = chain.answer || (r.intact === null ? null : r);
    const intact = checked ? checked.intact : null;
    const broken = intact === false;
    const tone = broken ? "warn" : intact ? "good" : "plain";
    const word = chain.busy ? "Checking…" : broken ? "Tampered" : intact ? "Verified" : "Not checked";
    const detail = chain.busy ? "Checking every entry."
      : broken ? (checked.detail || "This record has been altered.")
