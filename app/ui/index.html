<!doctype html>
<meta charset="utf-8" />
<title>PassBook</title>
<style>
  /* macOS Settings is the reference, not a web dashboard: a source list on the
     left, grouped inset rows on the right, one accent colour, and no border
     that the platform would not draw itself. */
  :root {
    color-scheme: light dark;
    --bg: #eceef2;
    --bg2: #f5f6f9;
    --sidebar: rgba(244,245,248,0.72);
    --card: #ffffff;
    --line: rgba(0,0,0,0.075);
    --line2: rgba(0,0,0,0.13);
    --ink1: #16171a;
    --ink2: #54565c;
    --ink3: #8a8c94;
    --chip: rgba(0,0,0,0.045);
    --chip2: rgba(0,0,0,0.072);
    /* PassBook blue. The logo's own blue is #0068FC, which lands at 4.06:1
       on this background — under AA for the small accent text this app uses
       for "2 restricted" and "readable by only …". One shade down clears
       4.5:1 both as text on the background and as white on the button, and
       is indistinguishable from the logo at a glance. */
    --accent: #0060ee;
    --accent-ink: #ffffff;
    --accent-soft: rgba(0,96,238,0.10);
    --brand: #0068fc;
    --brand-deep: #011d3d;
    --sel: rgba(0,0,0,0.06);
    --good: #157033;
    --good-soft: rgba(21,112,51,0.12);
    --warn: #b3261e;
    --warn-soft: rgba(179,38,30,0.10);
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 16px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b;
      --bg2: #1e1f23;
      --sidebar: rgba(32,33,38,0.7);
      --card: #232429;
      --line: rgba(255,255,255,0.075);
      --line2: rgba(255,255,255,0.14);
      --ink1: #f2f3f5;
      --ink2: #b1b3bb;
      --ink3: #7b7d87;
      --chip: rgba(255,255,255,0.06);
      --chip2: rgba(255,255,255,0.1);
      /* Lifted for a dark field; its ink is the logo's own navy. */
      --accent: #4d9bff;
      --accent-ink: #05203f;
      --accent-soft: rgba(77,155,255,0.16);
      --brand: #4d9bff;
      --brand-deep: #011d3d;
      --sel: rgba(255,255,255,0.075);
      --good: #5fd07d;
      --good-soft: rgba(95,208,125,0.15);
      --warn: #ff7b70;
      --warn-soft: rgba(255,123,112,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.26);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; background: var(--bg); color: var(--ink1);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── icons ───────────────────────────────────────────────────────────── */
  /* One stroke weight, one grid, currentColor throughout, so an icon takes the
     colour of whatever it sits in and never needs a second file. */
  svg.ic {
    width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  svg.navicon { width: 17px; height: 17px; flex-basis: 17px; }
  svg.pageicon { width: 20px; height: 20px; flex-basis: 20px; stroke-width: 1.6; }
  svg.emptyicon { width: 26px; height: 26px; flex-basis: 26px; stroke-width: 1.35; opacity: .5; }
  svg.tinyicon { width: 13px; height: 13px; flex-basis: 13px; }

  /* ── source list ─────────────────────────────────────────────────────── */
  nav {
    width: 216px; flex: 0 0 216px; background: var(--sidebar);
    backdrop-filter: saturate(180%) blur(20px);
    border-right: 1px solid var(--line);
    padding: 30px 10px 10px; -webkit-app-region: drag;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 14px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { font-size: 13.5px; font-weight: 700; letter-spacing: -0.012em; }
  .navlist { display: flex; flex-direction: column; gap: 1px; }
  .navlist button {
    -webkit-app-region: no-drag; display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left; padding: 6px 9px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink1); font: inherit; cursor: default;
  }
  .navlist button svg { color: var(--ink3); }
  .navlist button:hover { background: var(--sel); }
  .navlist button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .navlist button[aria-current="true"] svg { color: var(--accent-ink); }
  .navlist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .navlabel { flex: 1; min-width: 0; }
  .navcount { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .navlist button[aria-current="true"] .navcount { color: var(--accent-ink); opacity: .75; }
  nav .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex: 0 0 7px;
  }
  .navlist button[aria-current="true"] .dot { background: var(--accent-ink); }

  /* Whether anything can read a credential right now is the one fact worth
     seeing from every page, so it sits at the foot of the source list. */
  .navfoot {
    -webkit-app-region: no-drag; margin-top: auto;
    display: flex; align-items: center; gap: 4px; width: 100%;
    padding: 5px 6px 5px 9px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--ink1);
  }
  .navfoot:hover { border-color: var(--line2); }
  .navfoot-main {
    display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0;
    text-align: left; border: 0; background: transparent; color: inherit;
    font: inherit; cursor: default; padding: 3px 0;
  }
  .navfoot-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
  .navlock { width: 26px; height: 26px; flex-basis: 26px; }
  .navfoot .col { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .navfoot-t { font-size: 12px; font-weight: 600; }
  .navfoot-s { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .navfoot.open .navfoot-main svg { color: var(--good); }
  /* Locked AND encrypted is the good state; it should not wear the warning
     colour that a store sitting in the clear needs. */
  .navfoot.shut .navfoot-main svg { color: var(--good); }
  .navfoot.exposed { border-color: var(--warn); background: var(--warn-soft); }
  .navfoot.exposed .navfoot-main svg { color: var(--warn); }
  .navfoot.exposed .navfoot-t { color: var(--warn); }

  /* ── content ─────────────────────────────────────────────────────────── */
  main { flex: 1; overflow-y: auto; padding: 30px 28px 32px; -webkit-app-region: drag; }
  main > * { -webkit-app-region: no-drag; }
  h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.022em; }
  .lede { color: var(--ink2); margin: 3px 0 0; max-width: 62ch; }
  .pagehead { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .pagetile {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .pagetext { min-width: 0; }
  .statustile {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .statustile.good { background: var(--good-soft); color: var(--good); }
  .statustile.warn { background: var(--warn-soft); color: var(--warn); }
  .statustile.plain { background: var(--chip2); color: var(--ink2); }
  .statustile.sm { width: 26px; height: 26px; flex-basis: 26px; border-radius: 7px; }
  .statustile.sm svg { width: 14px; height: 14px; }
  .chips.inline { padding: 5px 0 0; }

  .group {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .group h3 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink3); padding: 12px 14px 6px; background: transparent;
  }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sub { color: var(--ink3); font-size: 11.5px; margin-top: 1px; }
  .note { color: var(--ink3); font-size: 11.5px; line-height: 1.5; padding: 10px 14px 13px; }
  .note code, .lede code {
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--chip2); border-radius: 4px; padding: 1px 5px;
  }

  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--ink2); font: inherit; font-size: 12px;
    padding: 3px 10px; border-radius: 6px; cursor: default; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink1); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  button.act {
    border: 1px solid var(--line2); background: var(--card); color: var(--ink1);
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 7px; cursor: default;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  button.act:hover { background: var(--sel); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.act.primary:hover { filter: brightness(1.07); }
  button.act.danger { color: var(--warn); }
  button.act.danger:hover { background: var(--warn-soft); }
  /* The button that removes a credential was styled `primary` — the same blue
     as Add and Save, which is how an app says "this is the one you want". A
     destructive confirmation should never wear the recommended colour. */
  button.act.destructive {
    background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 600;
  }
  button.act.destructive:hover { background: var(--warn); filter: brightness(1.08); }
  .confirming { background: var(--warn-soft); border-radius: 8px; padding: 6px 8px; margin: -2px 0; }
  .confirming .sub { color: var(--warn); margin: 0; }
  button.act:disabled { opacity: .45; }
  button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* A word plus a coloured dot, so state reads without reading. */
  .tag { font-size: 11px; color: var(--ink3); white-space: nowrap;
         display: inline-flex; align-items: center; gap: 5px; }
  .tag.on, .tag.off, .tag.info { font-weight: 600; border-radius: 99px; padding: 2px 9px; }
  .tag.info { color: var(--accent); background: var(--accent-soft); }
  .tag.on { color: var(--good); background: var(--good-soft); }
  .tag.off { color: var(--warn); background: var(--warn-soft); }
  .tag.on::before, .tag.off::before, .tag.info::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  input { font: inherit; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line2);
          background: var(--bg2); color: var(--ink1); min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line2);
           background: var(--card); color: var(--ink1); }
  .add { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .add input:first-of-type { width: 190px; }
  .add input:last-of-type { flex: 1; }

  .banner { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius);
            padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 10px;
            align-items: flex-start; box-shadow: var(--shadow); }
  .banner > svg { margin-top: 1px; flex: 0 0 16px; }
  .banner .body { flex: 1; min-width: 0; }
  .banner b { font-weight: 700; }
  .banner .acts { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .banner button {
    border: 1px solid rgba(0,0,0,.2); background: rgba(255,255,255,.92); color: #16171a;
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 7px; cursor: default;
  }
  .banner button:hover { background: #fff; }
  .empty {
    color: var(--ink3); padding: 26px 14px; font-size: 12.5px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  }

  /* Add sits at the TOP of the list: on a store with hundreds of keys, an add
     row at the bottom is a scroll away and may as well not exist. */
  .addrow { display: grid; grid-template-columns: minmax(0,0.8fr) minmax(0,1fr) auto;
            gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  /* One field and a button: the three-column grid stretched the button over
     half the window, which read as a second text field. */
  .addrow.two { grid-template-columns: minmax(0,1fr) auto; }
  .keyrow { padding: 10px 14px; }
  .keyrow + .keyrow { border-top: 1px solid var(--line); }
  .keyrow:hover { background: var(--bg2); }
  .keyrow .head { display: flex; align-items: center; gap: 8px; }
  .keyrow .named { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
  .keyrow .head .mono { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; font-size: 12.5px; }
  .keyrow .val {
    width: 100%; margin-top: 7px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 5px 9px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--card); color: var(--ink1);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  /* A hidden value is a chip beside its name, not a field of its own: a row of
     empty grey per key is most of what you see on a store of any size. */
  /* Not decoration: this is the one place a person looking at a key can learn
     that the lock in the sidebar does not cover it. */
  .bare {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    color: var(--warn); background: var(--warn-soft);
    border-radius: 5px; padding: 2px 7px;
  }
  .masked {
    font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em;
    color: var(--ink3); background: var(--chip); border-radius: 5px;
    padding: 2px 8px; white-space: nowrap;
  }
  .aud .used { color: var(--ink3); }

  /* Row actions are icons: four words on every row of a few hundred is more
     text than the key names they sit beside. */
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex: 0 0 28px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink3); cursor: default;
  }
  .iconbtn:hover { background: var(--sel); color: var(--ink1); }
  .iconbtn.on { background: var(--accent-soft); color: var(--accent); }
  /* A notice at the far end of the page is not feedback for a button press —
     the eye is on the button. It turns into a tick where it stands. */
  .iconbtn.done { background: var(--good-soft); color: var(--good); }
  .iconbtn.done svg { animation: pop .22s ease-out; }
  .iconbtn:active { transform: scale(0.92); }
  @keyframes pop {
    0%   { transform: scale(.55); opacity: 0; }
    60%  { transform: scale(1.14); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .iconbtn.done svg { animation: none; }
    .iconbtn:active { transform: none; }
  }
  .iconbtn.danger:hover { background: var(--warn-soft); color: var(--warn); }
  .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Kept for the few text buttons that still read better as words. */
  .icon {
    border: 1px solid transparent; background: transparent; color: var(--ink3);
    font: inherit; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; cursor: default;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .icon:hover { background: var(--sel); color: var(--ink1); }
  .icon.on { color: var(--accent); font-weight: 600; }
  .icon.danger:hover { color: var(--warn); }

  .hist { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 8px; }
  .hist .ev { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  .hist .ev .when { color: var(--ink3); font-size: 11px; white-space: nowrap; width: 118px; flex: 0 0 118px; }
  .hist .ev .who { flex: 1; min-width: 0; font-size: 11.5px; overflow-wrap: anywhere; }
  .hist .ev .op { color: var(--ink3); font-size: 11px; }
  .hist .proof {
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink3); overflow-wrap: anywhere; padding: 0 0 4px 128px;
  }
  .hist .foot { color: var(--ink3); font-size: 11px; padding-top: 6px; }

  /* A store can hold hundreds of keys, so find-as-you-type is the primary way
     in, not a convenience bolted to the side. */
  .grouphead { display: flex; align-items: center; gap: 10px; padding: 11px 14px 9px; }
  .grouphead h3 { padding: 0; flex: 1; }
  .searchwrap { position: relative; display: inline-flex; align-items: center; }
  .searchwrap > svg { position: absolute; left: 9px; color: var(--ink3); pointer-events: none; }
  .search {
    font: inherit; font-size: 12px; width: 210px; padding: 5px 9px 5px 29px;
    border-radius: 7px; border: 1px solid var(--line2);
    background: var(--bg2); color: var(--ink1);
  }
  .err { color: var(--warn); }
  .noticebar {
    display: flex; gap: 8px; align-items: flex-start; margin-top: 14px;
    padding: 10px 12px; border-radius: 10px; font-size: 12.5px;
    background: var(--warn-soft); color: var(--warn);
  }
  .noticebar.good { background: var(--good-soft); color: var(--good); }
  .noticebar svg { margin-top: 1px; }

  /* Groups on the Keys page. A monogram carries a colour the eye can aim at,
     which a row of identical grey headings does not. */
  .grouprow {
    display: flex; align-items: center; gap: 9px; padding: 9px 14px;
    cursor: default; user-select: none; background: var(--bg2);
    border-top: 1px solid var(--line);
  }
  .grouprow:hover { background: var(--chip); }
  .grouprow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .grouprow .caret { color: var(--ink3); display: flex; transition: transform .13s ease; }
  .grouprow[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .avatar {
    width: 24px; height: 24px; flex: 0 0 24px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: hsl(var(--h) 68% 92%); color: hsl(var(--h) 50% 34%);
  }
  @media (prefers-color-scheme: dark) {
    .avatar { background: hsl(var(--h) 38% 24%); color: hsl(var(--h) 68% 76%); }
  }
  .gname { font-weight: 600; font-size: 12.5px; color: var(--ink1); }
  .gcount { font-size: 11px; color: var(--ink3); background: var(--chip2);
    border-radius: 99px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .grestricted { font-size: 11px; color: var(--accent); margin-left: auto;
    display: inline-flex; align-items: center; gap: 4px; }

  /* Audience */
  .aud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .aud .restricted { color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
  .audedit { border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px;
    margin-top: 8px; background: var(--bg2); }
  .audmodes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .audlist { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .audlist label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .audedit .note { padding: 4px 0 0; }

  /* The matrix */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 14px 12px; }
  .chip { font-size: 11.5px; background: var(--chip2); border-radius: 99px;
    padding: 3px 10px; color: var(--ink2);
    display: inline-flex; align-items: center; gap: 5px; }
  .factors { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .matrixwrap { overflow-x: auto; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.matrix th, table.matrix td { text-align: left; padding: 7px 12px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.matrix thead th { color: var(--ink3); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; background: var(--bg2); }
  table.matrix tbody tr:hover { background: var(--bg2); }
  .kname { max-width: 22rem; overflow: hidden; text-overflow: ellipsis; }
  .gtag { font-size: 10.5px; color: var(--ink3); margin-left: 6px; }
  td.cell { text-align: center; }
  td.cell svg { width: 15px; height: 15px; }
  td.cell.yes { color: var(--good); }
  td.cell.no { color: var(--warn); }
  td.cell.ask { color: var(--accent); }
  .snippet { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; overflow-x: auto; margin: 4px 14px 10px; color: var(--ink1); }

  select.scope { font: inherit; font-size: 11.5px; padding: 2px 6px; border-radius: 6px;
    border: 1px solid var(--line2); background: var(--card); color: var(--ink2); max-width: 15rem; }
  select.scope:hover { color: var(--ink1); }
  .recovery {
    font-size: 15px; letter-spacing: .06em; margin-top: 5px;
    background: var(--chip2); border-radius: 7px; padding: 7px 10px;
    display: inline-block; user-select: all;
  }
  .viatag {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
    font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 6px;
    color: var(--ink3); background: var(--chip2);
  }
  .viatag.grant { color: var(--good); background: var(--good-soft); }
  .scope.locked { font-size: 11.5px; color: var(--ink3); background: var(--chip);
    border-radius: 6px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; }

  input.pick { margin: 0 .1rem 0 0; accent-color: var(--accent); cursor: pointer;
    width: 14px; height: 14px; flex: 0 0 14px; }
  .bulkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 9px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--accent-soft); position: sticky; top: 0; z-index: 2; }
  .bulkbar .grow { flex: 1; min-width: 0; }
  .bulkbar .warn { color: var(--warn); font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px; }
  .bulkbar.confirm { background: var(--warn-soft); }
  .bulkbar .note { flex-basis: 100%; margin: 0; padding: 4px 0 0; }
</style>

<nav id="nav"></nav>
<main id="main"><p class="empty">Reading this machine…</p></main>

<script>
(() => {
  const invoke = window.__TAURI__?.core?.invoke;
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  /** The icon set.
   *
   *  Drawn here rather than pulled from a library: it is a dozen glyphs, an
   *  icon font would be a second file to ship and sign, and every third-party
   *  set carries a licence notice this repo would then have to carry too.
   *  One 24-grid, one stroke weight, currentColor throughout.
   */
  const ICONS = {
    key: '<circle cx="7.4" cy="12" r="4.1"/><path d="M11.5 12H20.8"/><path d="M17.4 12v3.4"/><path d="M20.2 12v2.5"/>',
    lock: '<rect x="4.5" y="10.5" width="15" height="9.5" rx="2.4"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/><circle cx="12" cy="15.2" r="1.3" fill="currentColor" stroke="none"/>',
    unlock: '<rect x="4.5" y="10.5" width="15" height="9.5" rx="2.4"/><path d="M8 10.5V7.6a4 4 0 0 1 7.5-1.9"/><circle cx="12" cy="15.2" r="1.3" fill="currentColor" stroke="none"/>',
    person: '<circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20c0-3.7 3.2-5.6 7.2-5.6s7.2 1.9 7.2 5.6"/>',
    sliders: '<path d="M4 7.5h9.5"/><path d="M18.5 7.5H20"/><circle cx="16" cy="7.5" r="2.1"/><path d="M4 16.5h3.5"/><path d="M12.5 16.5H20"/><circle cx="10" cy="16.5" r="2.1"/>',
    chip: '<rect x="7" y="7" width="10" height="10" rx="2.2"/><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3"/>',
    monitor: '<rect x="3" y="4.8" width="18" height="12" rx="2.2"/><path d="M9 20.5h6"/><path d="M12 16.8v3.7"/>',
    hub: '<circle cx="12" cy="12" r="2.4"/><circle cx="5.2" cy="6" r="2"/><circle cx="18.8" cy="6" r="2"/><circle cx="12" cy="19.8" r="2"/><path d="M6.8 7.4 10.2 10.4"/><path d="M17.2 7.4 13.8 10.4"/><path d="M12 14.4v3"/>',
    doc: '<rect x="4.5" y="3.5" width="15" height="17" rx="2.2"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/>',
    eye: '<path d="M2.6 12S6.2 5.9 12 5.9 21.4 12 21.4 12 17.8 18.1 12 18.1 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.9"/>',
    eyeOff: '<path d="M4 4 20 20"/><path d="M9.7 6.3A9.9 9.9 0 0 1 12 5.9c5.8 0 9.4 6.1 9.4 6.1a17.6 17.6 0 0 1-3.3 4"/><path d="M6.4 8.1A17.4 17.4 0 0 0 2.6 12s3.6 6.1 9.4 6.1a9.7 9.7 0 0 0 3.2-.5"/><path d="M9.9 9.9a2.9 2.9 0 0 0 4.1 4.1"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M15 6.7V5.6A1.6 1.6 0 0 0 13.4 4H5.6A1.6 1.6 0 0 0 4 5.6v7.8A1.6 1.6 0 0 0 5.6 15h1.1"/>',
    history: '<path d="M3.6 12a8.4 8.4 0 1 0 2.7-6.2"/><path d="M3.2 4.2v4.2h4.2"/><path d="M12 7.8V12l3 1.8"/>',
    trash: '<path d="M4.5 7h15"/><path d="M9.6 7V5.3a1.3 1.3 0 0 1 1.3-1.3h2.2a1.3 1.3 0 0 1 1.3 1.3V7"/><path d="M6.7 7l.8 12a1.6 1.6 0 0 0 1.6 1.5h5.8a1.6 1.6 0 0 0 1.6-1.5l.8-12"/><path d="M10.4 11v6M13.6 11v6"/>',
    search: '<circle cx="10.6" cy="10.6" r="6"/><path d="M15 15l5 5"/>',
    plus: '<path d="M12 5.2v13.6M5.2 12h13.6"/>',
    shield: '<path d="M12 3.3 19 5.9v5.5c0 4.2-2.8 7.6-7 9.3-4.2-1.7-7-5.1-7-9.3V5.9Z"/><path d="M9.2 12.1 11.3 14.2 15 10.5"/>',
    check: '<path d="M5 12.6 9.4 17 19 7.4"/>',
    cross: '<path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>',
    question: '<circle cx="12" cy="12" r="8.6"/><path d="M9.7 9.5a2.4 2.4 0 1 1 2.9 2.6v1.4"/><circle cx="12.5" cy="16.4" r=".9" fill="currentColor" stroke="none"/>',
    chevron: '<path d="M9.8 5.8 16 12l-6.2 6.2"/>',
    pencil: '<path d="M4 20h4L19.1 8.9a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14.5 6.4 17.6 9.5"/>',
    alert: '<path d="M12 4.6 21 20H3Z"/><path d="M12 10v4.4"/><circle cx="12" cy="17.4" r="1" fill="currentColor" stroke="none"/>',
    inbox: '<path d="M4 13.6h4.2l1.3 2.3h5l1.3-2.3H20"/><path d="M4.6 13.6 7 5.9A1.6 1.6 0 0 1 8.5 4.8h7A1.6 1.6 0 0 1 17 5.9l2.4 7.7v4.4A1.6 1.6 0 0 1 17.8 19.6H6.2A1.6 1.6 0 0 1 4.6 18Z"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.2 2.4 3.4 5.3 3.4 8.5S14.2 18.1 12 20.5c-2.2-2.4-3.4-5.3-3.4-8.5S9.8 5.9 12 3.5Z"/>',
    building: '<path d="M4.5 20.5V5.4a1.4 1.4 0 0 1 1.4-1.4h7.2a1.4 1.4 0 0 1 1.4 1.4v15.1"/><path d="M14.5 10h3.6a1.4 1.4 0 0 1 1.4 1.4v9.1"/><path d="M3 20.5h18"/><path d="M7.6 7.6h3.4M7.6 11.2h3.4M7.6 14.8h3.4"/>',
    folder: '<path d="M3.5 7.4a1.6 1.6 0 0 1 1.6-1.6h3.6l2 2.4h7.7a1.6 1.6 0 0 1 1.6 1.6v8.4a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6Z"/>',
    power: '<path d="M12 4v8"/><path d="M17.3 7a7.4 7.4 0 1 1-10.6 0"/>',
    link: '<path d="M10.2 13.8a3.6 3.6 0 0 0 5.1 0l3-3a3.6 3.6 0 0 0-5.1-5.1l-1.3 1.3"/><path d="M13.8 10.2a3.6 3.6 0 0 0-5.1 0l-3 3a3.6 3.6 0 0 0 5.1 5.1l1.3-1.3"/>',
    out: '<path d="M6 18 18 6"/><path d="M9 6h9v9"/>',
    into: '<path d="M18 6 6 18"/><path d="M15 18H6V9"/>',
  };
  /** One icon, as inline SVG. `extra` names the size class. */
  const icon = (name, extra = "") =>
    `<svg class="ic ${extra}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.question}</svg>`;

  /** A group's monogram tile. The hue is derived from the name, so a vendor
   *  keeps the same colour between launches without anyone storing one. */
  function avatar(name) {
    let h = 0;
    for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `<span class="avatar" style="--h:${h}">${esc((String(name)[0] || "?").toUpperCase())}</span>`;
  }

  const MODE = {
    always: ["Always", "Handed over without interrupting you."],
    ask:    ["Ask me", "The request waits until you answer it."],
    window: ["In hours", "Allowed inside a schedule, refused outside it."],
    never:  ["Never", "Always refused."],
  };
  const PAGES = [
    ["keys", "Keys", "key"], ["vault", "Vault", "lock"],
    ["signins", "Sign-ins", "person"], ["access", "Access", "sliders"],
    ["agents", "Agents", "chip"],
    ["machines", "Machines", "monitor"],
    ["broker", "Broker", "hub"], ["record", "Record", "doc"],
  ];

  let state = null, page = "keys", busy = false, notice = "";
  // The vault answers a different question from `state` — not "what is in the
  // store" but "may anything read it right now" — so it is fetched separately
  // and is allowed to be missing on an older CLI without blanking the window.
  let vault = null;
  let vaultForm = { profile: "", label: "" };
  // Which groups are folded shut, and the lazily-fetched access grid. A grid
  // over a few hundred keys is not something to ship with every 5s refresh.
  let collapsed = {};
  let grid = null, gridOnlyRestricted = false;
  // Sign-ins are fetched separately: they can be slow to answer when the
  // broker is mid-renewal, and the key list should not wait on that.
  let signins = null, connecting = {};
  // Which keys are ticked, and whether a bulk delete is awaiting a yes.
  let picked = {}, bulkConfirm = false;
  // The key whose audience is open, and the edit in progress. The mode
  // buttons used to apply on click, so choosing `Only chosen` before ticking
  // anybody just set an error at the far bottom of a long list — which reads
  // as a dead button. They pick a mode now; Save commits it.
  let audienceFor = null, audienceDraft = null;
  // The project editor, same shape as the audience one and open one at a time.
  let projectsFor = null, projectsDraft = null, projectTyped = "";
  // Which buttons are showing a tick, and the timer that clears each one. The
  // timer is held so a second press restarts it rather than the first press's
  // timer wiping the second one's tick.
  let copied = {};
  const copiedTimers = {};
  // Backup: which shape, where, and the last thing that happened. The
  // passphrase is never held here — it goes straight from its field to the CLI
  // and the field is cleared, because a paint would otherwise put it back.
  let backup = { shape: "encrypted", note: "", busy: "", said: "", ok: false };
  let recoveryCode = "";
  // Which row is mid-edit. The background refresh must not wipe a half-typed
  // value out from under someone, so polling pauses while this is set.
  let revealed = {};    // key -> true once its value has been fetched and shown
  let values = {};      // key -> value, held only while revealed
  let confirming = null;
  let query = "";
  let history = {};   // key -> rows, fetched only when someone opens it

  async function call(name, args = {}) {
    busy = true; paint();
    try { const next = await invoke(name, args); notice = ""; state = next; }
    catch (e) { notice = String(e); }
    finally { busy = false; paint(); }
  }

  /** Vault commands answer with vault state, not store state. */
  async function callVault(name, args = {}) {
    busy = true; paint();
    try { vault = await invoke(name, args); notice = ""; }
    catch (e) { notice = String(e); }
    finally { busy = false; paint(); }
  }

  async function refreshVault() {
    try { vault = await invoke("vault_state"); }
    catch { vault = null; }
  }

  const pwd = (id) => (document.getElementById(id)?.value ?? "");
  function humanTime(seconds) {
    if (!seconds) return "";
    if (seconds < 90) return `${seconds}s`;
    if (seconds < 5400) return `${Math.round(seconds / 60)} min`;
    return `${Math.round(seconds / 3600)}h`;
  }

  const APP = "hivemind-content-studio";

  /** Keys the current search matches. Case-insensitive substring, because a
   *  person hunting OPENAI_API_KEY types "openai", not a prefix. */
  function shownKeys() {
    const all = state?.store?.keys || [];
    const q = query.trim().toLowerCase();
    return q ? all.filter((k) => k.toLowerCase().includes(q)) : all;
  }

  function searchField(id) {
    return `<span class="searchwrap">${icon("search", "tinyicon")}
      <input class="search" id="${id}" type="search" placeholder="Search keys"
        value="${esc(query)}" spellcheck="false" autocapitalize="off" /></span>`;
  }

  function ago(iso) {
    const then = Date.parse(iso);
    if (!Number.isFinite(then)) return "";
    const s = Math.max(0, Math.round((Date.now() - then) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return `${Math.round(s / 86400)}d ago`;
  }

  function usedLine(k) {
    const u = (state.usage || {})[k];
    // No entry means never read — say that, rather than printing a zero that
    // looks like measured data.
    if (!u || !u.last) return "Never used.";
    const times = u.count === 1 ? "once" : `${u.count} times`;
    return `Last used ${ago(u.last)} by ${esc(u.last_app || "something")} · ${times}`;
  }

  function historyBlock(k) {
    const rows = history[k];
    if (rows === "loading") return `<div class="hist"><div class="foot">Reading the record…</div></div>`;
    if (!rows.length) return `<div class="hist"><div class="foot">Nothing recorded for this key yet.</div></div>`;
    return `<div class="hist">
      ${rows.slice().reverse().map((r) => `
        <div class="ev">
          <span class="when">${esc(ago(r.at))}</span>
          <span class="who">${esc(r.app || "unknown")}${r.reason ? ` — ${esc(r.reason)}` : ""}</span>
          <span class="op">${esc(r.op)}${r.granted === false ? " · denied" : ""}</span>
        </div>
        <div class="proof">${esc(r.proof || "")}</div>`).join("")}
      <div class="foot">Each line is hash-chained to the one before it. A row that
      was edited, removed or reordered breaks every proof after it.</div>
    </div>`;
  }

  function countLabel(shown, all) {
    return query.trim() && shown !== all ? `${shown} of ${all}` : `${all} stored`;
  }
  const modeOf = (key) => {
    const a = (state?.access?.apps || {})[APP] || {};
    return ((a.keys || {})[key] || {}).mode || (a.default || {}).mode || state?.access?.default_mode || "always";
  };

  /** How many of a thing each page is about, so the list carries the shape of
   *  the store rather than eight identical words. */
  function navCounts() {
    const links = state?.links || {};
    return {
      keys: (state?.store?.keys || []).length,
      signins: (signins || []).length,
      agents: (state?.catalog?.agents || []).length,
      machines: (links.lent || []).length + (links.borrowed || []).length,
    };
  }

  /** Whether anything can read a credential right now, pinned to the foot of
   *  the source list. It is the one fact that changes what every other page
   *  means, and hunting for it on the Vault page is how people miss it. */
  function navFoot() {
    const v = vault;
    if (!v?.supported) return "";
    const open = !!v.unlocked;
    const bare = (v.plaintext?.length ?? 0) + (v.legacy_v1?.length ?? 0);
    const where = state?.catalog?.workspace || state?.store?.workspace || "";

    // Three states, not two, because "locked" and "protected" are not the same
    // thing and this footer used to say the first while meaning neither.
    //
    // A locked vault over a store that is mostly plaintext is the worst of
    // them: it reads as safety, and the reassurance is the danger. It gets the
    // count in the headline, where "Vault locked" used to sit, because a person
    // who has just pressed Lock is looking at exactly this corner and deserves
    // to be told that pressing it did not do what the word says.
    const exposed = bare > 0;
    const tone = open ? "open" : exposed ? "exposed" : "shut";
    const headline = exposed
      ? `${bare} readable`
      : (open ? "Vault open" : "Vault locked");
    const detail = exposed
      ? "not encrypted on disk"
      : open
        ? profileLabel(v.signed_in_profile) + (v.expires_in ? ` \u00b7 ${humanTime(v.expires_in)} left` : "")
        : "nothing can read it";
    const glyph = exposed ? "alert" : open ? "unlock" : "lock";

    return `<div class="navfoot ${tone}">
      <button class="navfoot-main" data-page="vault"
        title="${exposed ? `${bare} value(s) are in the clear on disk` : "Workspace and sign-in"}">
        ${icon(glyph, "navicon")}
        <span class="col">
          <span class="navfoot-t">${esc(headline)}</span>
          <span class="navfoot-s">${esc(exposed || !where ? detail : `${where} \u00b7 ${detail}`)}</span>
        </span>
      </button>
      ${open ? `<button class="iconbtn navlock" data-locknow title="Lock and switch workspace"
        aria-label="Lock and switch workspace">${icon("lock")}</button>` : ""}
    </div>`;
  }

  function paintNav() {
    const pending = (state?.broker?.pending || []).length;
    const counts = navCounts();
    nav.innerHTML = `
      <div class="brand"><img src="mark.png" alt="" /><span>PassBook</span></div>
      <div class="navlist">${PAGES.map(([id, label, glyph]) => `
        <button data-page="${id}" aria-current="${page === id}">
          ${icon(glyph, "navicon")}<span class="navlabel">${label}</span>
          ${id === "access" && pending ? '<span class="dot"></span>'
            : counts[id] ? `<span class="navcount">${counts[id]}</span>` : ""}
        </button>`).join("")}</div>
      ${navFoot()}`;
    nav.querySelectorAll("[data-page]").forEach((b) =>
      b.onclick = () => { page = b.dataset.page; paint(); });
    // Lock and go straight to the screen you would need next. Locking and then
    // leaving someone on the Keys page is how a lock button gets pressed twice.
    nav.querySelectorAll("[data-locknow]").forEach((b) => b.onclick = async () => {
      page = "switch";
      revealed = {}; values = {}; history = {};
      await callVault("vault_signout");
    });
  }

  // Mirrors the HivemindOS agent-env card: name and actions on one line, the
  // value on its own line underneath — masked until revealed, editable in
  // place, saved on blur.
  /** Keys sitting in the clear, as a set the rows can ask cheaply.
   *
   *  Read from the vault where it answers, else the state's own sealing block.
   *  Both now come from the v2 vault, so they cannot disagree.
   */
  function readableSet() {
    const source = vault?.supported ? vault : state?.sealing;
    const listed = source?.plaintext;
    return new Set(Array.isArray(listed) ? listed : []);
  }

  function keyRow(k, readable) {
    const shown = revealed[k];
    const pending = confirming === k;
    // A key nobody encrypted is not protected by the vault, whatever the vault
    // says about itself. Saying so on the row is the whole point: this app told
    // someone "Vault locked" in the sidebar while the eye icon beside every key
    // still worked, and the sentence that explained why was below 279 rows.
    const bare = readable ? readable.has(k) : false;
    return `<div class="keyrow">
      <div class="head">
        <input type="checkbox" class="pick" data-pick="${esc(k)}"
          ${picked[k] ? "checked" : ""} aria-label="Select ${esc(k)}" />
        <span class="named"><span class="mono">${esc(k)}</span>
          ${shown || pending ? "" : `<span class="masked" title="Hidden">••••••••••</span>`}
          ${bare ? `<span class="bare" title="This value is not encrypted. Anything running as you can read it, signed in or not.">${icon("unlock", "tinyicon")} readable</span>` : ""}</span>
        ${pending ? `
          <span class="confirming"><span class="sub">Remove it? Another app may be using it,
            and the value is not recoverable from here.</span></span>
          <button class="act" data-cancel="1">Cancel</button>
          <button class="act destructive" data-rmgo="${esc(k)}" ${busy ? "disabled" : ""}>
            ${icon("trash")} Remove</button>
        ` : `
          <button class="iconbtn ${shown ? "on" : ""}" data-reveal="${esc(k)}"
            title="${shown ? "Hide value" : "Reveal value"}"
            aria-label="${shown ? "Hide value" : "Reveal value"}">${icon(shown ? "eyeOff" : "eye")}</button>
          <button class="iconbtn ${copied[k] ? "done" : ""}" data-copy="${esc(k)}"
            title="${copied[k] ? "Copied" : "Copy value"}"
            aria-label="${copied[k] ? "Copied" : "Copy value"}">${icon(copied[k] ? "check" : "copy")}</button>
          <button class="iconbtn ${history[k] ? "on" : ""}" data-hist="${esc(k)}"
            title="Who has used this key" aria-label="Who has used this key">${icon("history")}</button>
          <button class="iconbtn danger" data-remove="${esc(k)}" title="Remove"
            aria-label="Remove">${icon("trash")}</button>
        `}
      </div>
      ${shown ? `<input class="val" data-val="${esc(k)}" value="${esc(values[k] ?? "")}"
        spellcheck="false" autocapitalize="off" placeholder="empty" />` : ""}
      ${audienceBlock(k, usedLine(k))}
      ${history[k] ? historyBlock(k) : ""}
    </div>`;
  }

  /** Show a tick on one button for a moment, then put it back.
   *
   *  Held in state rather than done to the element, because a paint replaces
   *  every node — a class set on the button would be gone by the next tick of
   *  the background refresh.
   */
  function markCopied(mark) {
    if (!mark) return;
    copied[mark] = true;
    clearTimeout(copiedTimers[mark]);
    copiedTimers[mark] = setTimeout(() => {
      delete copied[mark];
      delete copiedTimers[mark];
      paint();
    }, 1400);
  }

  const chosen = () => Object.keys(picked).filter((k) => picked[k]);

  /** What you can do to a handful of keys at once.
   *
   *  Only appears once something is ticked. Scoping many keys and removing many
   *  keys are the two jobs worth doing in bulk; both are one-by-one otherwise,
   *  and a store of a few hundred makes that unbearable.
   */
  function bulkBar(shown) {
    const on = chosen();
    if (!on.length) return "";
    const cat = state.catalog;
    const locked = on.filter((k) => cat?.scopes?.[k] && !cat.scopes[k].may_change);
    return `<div class="bulkbar ${bulkConfirm ? "confirm" : ""}">
      <span class="grow"><strong>${on.length}</strong> selected</span>
      ${bulkConfirm ? `
        <span class="warn">${icon("alert")} Remove ${on.length} key${on.length === 1 ? "" : "s"}?
          Other apps on this machine may be using ${on.length === 1 ? "it" : "them"},
          and ${on.length === 1 ? "it is" : "they are"} not recoverable from here.</span>
        <button class="act" data-bulkcancel>Cancel</button>
        <button class="act destructive" data-bulkgo ${busy ? "disabled" : ""}>
          ${icon("trash")} Remove ${on.length}</button>
      ` : `
        <select class="scope" data-bulkscope ${busy ? "disabled" : ""}>
          <option value="">Set reach…</option>
          ${(cat?.scope_options || []).map((s) =>
            `<option value="${s}">${esc(SCOPE_WORDS[s] || s)}</option>`).join("")}
        </select>
        <button class="act danger" data-bulkremove ${busy ? "disabled" : ""}>${icon("trash")} Remove</button>
        <button class="act" data-bulkclear>Clear</button>
      `}
      ${locked.length && !bulkConfirm ? `<div class="note">${locked.length} of these
        ${locked.length === 1 ? "is" : "are"} owned by another workspace — their reach
        will not change.</div>` : ""}
    </div>`;
  }

  /** Key rows, arranged by group.
   *
   *  A few hundred keys as one flat list is a list nobody reads. Groups are
   *  inferred from the names people already use, so this costs nobody any
   *  tagging — and a search collapses back to a flat list, because when you are
   *  hunting one key the headings are in the way.
   */
  function groupedKeys(keys) {
    if (!keys.length) return "";
    const cat = state.catalog;
    const readable = readableSet();
    if (!cat?.available || query.trim()) return keys.map((k) => keyRow(k, readable)).join("");

    const shown = new Set(keys);
    const buckets = [];
    for (const [group, members] of Object.entries(cat.groups || {})) {
      const here = members.filter((m) => shown.has(m));
      if (here.length) buckets.push([group, here]);
    }
    if (buckets.length < 2) return keys.map((k) => keyRow(k, readable)).join("");

    return buckets.map(([group, members]) => {
      const shut = collapsed[group];
      const restricted = members.filter((m) => cat.audiences?.[m]).length;
      return `<div class="grouprow" data-group="${esc(group)}" role="button" tabindex="0"
                aria-expanded="${!shut}">
          <span class="caret">${icon("chevron", "tinyicon")}</span>
          ${avatar(group)}
          <span class="gname">${esc(group)}</span>
          <span class="gcount">${members.length}</span>
          ${restricted ? `<span class="grestricted">${icon("shield", "tinyicon")}
            ${restricted} restricted</span>` : ""}
        </div>
        ${shut ? "" : members.map((k) => keyRow(k, readable)).join("")}`;
    }).join("");
  }

  const SCOPE_WORDS = {
    workspace: "This workspace",
    machine: "All workspaces here",
    tailnet: "All workspaces + linked machines",
  };

  /** How far a key reaches, and whether this workspace may say.
   *
   *  Widening a scope hands a credential to workspaces that did not have it, so
   *  the workspace it came from keeps that decision. A borrowing workspace sees
   *  the scope and can read the key; it cannot pass it on. Otherwise sharing a
   *  key would hand over the power to share it onward, which is not sharing.
   */
  function scopePicker(k) {
    const cat = state.catalog;
    const rule = cat?.scopes?.[k];
    if (!rule) return "";
    const options = (cat.scope_options || []).map((s) =>
      `<option value="${s}"${s === rule.scope ? " selected" : ""}>${esc(SCOPE_WORDS[s] || s)}</option>`
    ).join("");
    if (!rule.may_change) {
      return `<span class="scope locked" title="Only the ${esc(rule.owner)} workspace can change this">
        ${icon("lock", "tinyicon")} ${esc(SCOPE_WORDS[rule.scope] || rule.scope)}
        · set by ${esc(rule.owner)}</span>`;
    }
    return `<select class="scope" data-scope="${esc(k)}" ${busy ? "disabled" : ""}
      title="How far this key reaches">${options}</select>`;
  }

  /** Who a key is for, as a line under the row — and the control to change it. */
  function audienceBlock(k, used = "") {
    const cat = state.catalog;
    if (!cat?.available) return used ? `<div class="sub">${used}</div>` : "";
    const rule = cat.audiences?.[k];
    const editing = audienceFor === k;
    const label = !rule ? "every agent"
      : rule.mode === "include" ? `only ${rule.agents.join(", ")}`
      : `all except ${rule.agents.join(", ")}`;

    if (!editing) {
      const prule = cat.projects?.[k];
      const plabel = !prule ? ""
        : prule.mode === "include" ? `only in ${prule.projects.join(", ")}`
        : `not in ${prule.projects.join(", ")}`;
      return `<div class="sub aud">
        ${used ? `<span class="used">${used}</span>` : ""}
        ${scopePicker(k)}
        <span class="${rule ? "restricted" : ""}">${rule ? icon("shield", "tinyicon") : ""}
          Readable by ${esc(label)}</span>
        <button class="icon" data-aud="${esc(k)}">${icon("pencil", "tinyicon")} Change</button>
        ${prule ? `<span class="restricted">${icon("folder", "tinyicon")} ${esc(plabel)}</span>` : ""}
        <button class="icon" data-proj="${esc(k)}">${icon("folder", "tinyicon")}
          ${prule ? "Projects" : "Limit to a project"}</button>
      </div>${projectsFor === k ? projectEditor(k) : ""}`;
    }
    const known = cat.agents || [];
    const draft = audienceDraft || { mode: rule?.mode || "all", agents: [...(rule?.agents || [])] };
    const needsAgents = draft.mode !== "all";
    const ready = !needsAgents || draft.agents.length > 0;
    const modeLabel = (m) => ({ all: "Every agent", include: "Only chosen", exclude: "All except" }[m]);
    const summary = draft.mode === "all"
      ? "every agent will be able to read it"
      : draft.agents.length
        ? (draft.mode === "include"
            ? `only ${draft.agents.join(", ")} will be able to read it`
            : `everyone except ${draft.agents.join(", ")} will be able to read it`)
        : "now pick which agents";

    return `<div class="audedit">
      <div class="sub">Who may read <span class="mono">${esc(k)}</span>?</div>
      <div class="audmodes">
        ${["all", "include", "exclude"].map((m) =>
          `<button class="act ${draft.mode === m ? "primary" : ""}" data-audmode="${m}"
            aria-pressed="${draft.mode === m}">${modeLabel(m)}</button>`).join("")}
      </div>
      ${needsAgents ? (known.length ? `<div class="audlist">
        ${known.map((a) => `<label><input type="checkbox" data-audagent="${esc(a)}"
          ${draft.agents.includes(a) ? "checked" : ""} /> ${esc(a)}</label>`).join("")}
      </div>` : `<p class="note">No agents have asked for a credential yet, so there is
        nobody to choose. They appear here the first time one asks.</p>`) : ""}
      <p class="note">${draft.mode === "exclude"
        ? "Excluding an agent is final: it is refused whatever the access mode says, and no approval or unlock overrides it."
        : `Result: ${esc(summary)}.`}</p>
      <div class="audmodes">
        <button class="act primary" data-audsave="${esc(k)}" ${ready && !busy ? "" : "disabled"}>Save</button>
        <button class="act" data-audcancel="1">Cancel</button>
      </div>
    </div>`;
  }

  /** Which projects a key is for.
   *
   *  The same three modes as the agent audience, because it is the same
   *  question asked about a different noun. A project is a claim its caller
   *  makes — usually the basename of a git root — which is exactly the standing
   *  an agent name has, and it buys the same thing: a key limited to one
   *  checkout is not handed to an agent running in another, so an instruction
   *  smuggled into one repository cannot spend another repository's credentials.
   */
  function projectEditor(k) {
    const cat = state.catalog || {};
    const rule = cat.projects?.[k];
    const draft = projectsDraft
      || { mode: rule?.mode || "all", projects: [...(rule?.projects || [])] };
    const known = [...new Set([...(cat.projects_seen || []),
                               ...(cat.project ? [cat.project] : []),
                               ...draft.projects])].sort();
    const needs = draft.mode !== "all";
    const ready = !needs || draft.projects.length > 0;
    const modeLabel = (m) => ({ all: "Every project", include: "Only these",
                                exclude: "All except" }[m]);
    const summary = draft.mode === "all"
      ? "readable from any project"
      : draft.projects.length
        ? (draft.mode === "include"
            ? `readable only from ${draft.projects.join(", ")}`
            : `readable everywhere except ${draft.projects.join(", ")}`)
        : "now pick which projects";

    return `<div class="audedit">
      <div class="sub">Which projects may read <span class="mono">${esc(k)}</span>?</div>
      <div class="audmodes">
        ${["all", "include", "exclude"].map((m) =>
          `<button class="act ${draft.mode === m ? "primary" : ""}" data-projmode="${m}"
            aria-pressed="${draft.mode === m}">${modeLabel(m)}</button>`).join("")}
      </div>
      ${needs ? `
        ${known.length ? `<div class="audlist">
          ${known.map((name) => `<label><input type="checkbox" data-projname="${esc(name)}"
            ${draft.projects.includes(name) ? "checked" : ""} /> ${esc(name)}${
              name === cat.project ? " (here)" : ""}</label>`).join("")}
        </div>` : ""}
        <div class="addrow two">
          <input id="proj-new" placeholder="Another project name" spellcheck="false"
            value="${esc(projectTyped)}" />
          <button class="act" data-projadd>${icon("plus")} Add</button>
        </div>` : ""}
      <p class="note">${draft.mode === "exclude"
        ? "Excluding a project is final: a caller working there is refused whatever the access mode says."
        : `Result: ${esc(summary)}.`}</p>
      <p class="note">A project is what the caller says it is \u2014 the name of its git root,
      or <span class="mono">PASSBOOK_PROJECT</span>. It is a claim, like an agent's name, not a
      password. It stops a confused agent reaching across checkouts; it does not stop someone
      who already runs code as you.</p>
      <div class="audmodes">
        <button class="act primary" data-projsave="${esc(k)}" ${ready && !busy ? "" : "disabled"}>Save</button>
        <button class="act" data-projcancel="1">Cancel</button>
      </div>
    </div>`;
  }

  function keysPage() {
    const s = state.store || {};
    const seal = state.sealing || {};
    const keys = shownKeys();
    return `
      <h2>Keys</h2>
      <p class="lede">One store, shared by every app on this Mac. Paste a key once and
      they all have it. Reveal shows a value and records that you looked.</p>
      <div class="group">
        <div class="grouphead">
          <h3>${countLabel(keys.length, (s.keys || []).length)} · workspace ${esc(s.workspace || "main")}</h3>
          ${searchField("q-keys")}
        </div>
        <div class="addrow">
          <input id="k" placeholder="KEY_NAME" spellcheck="false" autocapitalize="off" />
          <input id="v" type="password" placeholder="value" />
          <button class="act primary" id="addgo" ${busy ? "disabled" : ""}>${icon("plus")} Add</button>
        </div>
        ${bulkBar(keys)}
        ${groupedKeys(keys)
          || `<div class="empty">${query.trim()
                ? `Nothing matches “${esc(query)}”.` : "No keys yet."}</div>`}
        <p class="note">${esc(s.path || "")}${s.writes_to && s.writes_to !== s.path
          ? `<br>New keys are written to this workspace: ${esc(s.writes_to)}` : ""}</p>
      </div>
      ${encryptionPanel(seal)}`;
  }

  /** Encryption at rest, with the way to fix it in the same box.
   *
   *  This panel used to state the problem and stop there, which left the only
   *  actionable thing in the window as a red badge. Whatever it reports now, it
   *  also carries the next step: seal it, sign in to it, or set it up.
   */
  function encryptionPanel(seal) {
    const v = vault;
    const sealed = v?.fully_sealed ?? seal.fully_sealed;
    const readable = (v?.plaintext?.length ?? 0) + (v?.legacy_v1?.length ?? 0);
    const detail = v?.detail || seal.detail || "";

    let action = "";
    if (!v?.supported) {
      action = `<p class="note">This machine has no vault runtime yet.
        Run <code>passbook install</code> to add one.</p>`;
    } else if (!v.profiles?.length) {
      // One action, one password. Creating a profile, sealing, starting the
      // broker and signing in are never useful apart, and a first-run screen
      // that asks for the same password four times is one people abandon.
      action = `
        <p class="note">One step: this makes a profile to hold the key, encrypts
        every value under it, and signs you in. Values behind a framework's public
        prefix stay readable — a build inlines those into a browser bundle long
        before anyone could sign in, so encrypting them protects nothing.</p>
        <div class="addrow">
          <input id="sec-label" placeholder="Your name" spellcheck="false" value="Owner" />
          <input id="sec-pw" type="password" placeholder="New vault password" />
          <button class="act primary" id="sec-go" ${busy ? "disabled" : ""}>Secure this machine</button>
        </div>
        <p class="note">Nothing else on this machine stores that password, so pick
        something you will not lose. You can undo the whole thing later.</p>`;
    } else if (!sealed) {
      action = `
        <p class="note">${readable} value${readable === 1 ? "" : "s"}
        ${readable === 1 ? "is" : "are"} still readable by anything running as you.
        Sealing encrypts ${readable === 1 ? "it" : "them"} under your profile;
        nothing can read ${readable === 1 ? "it" : "them"} again until you sign in.</p>
        <div class="addrow two">
          <input id="seal-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="seal-go" ${busy ? "disabled" : ""}>Seal the store</button>
        </div>`;
    } else if (!v.unlocked) {
      action = `
        <p class="note">Everything is encrypted and the vault is shut, so apps on
        this machine currently have no credentials. Sign in to give them some.</p>
        <div class="addrow two">
          <input id="si-pw2" type="password" placeholder="Vault password" />
          <button class="act primary" id="si-go2" ${busy ? "disabled" : ""}>Sign in</button>
        </div>`;
    } else {
      action = `<p class="note">Signed in as ${esc(profileLabel(v.signed_in_profile))}${
        v.expires_in ? `, for another ${humanTime(v.expires_in)}` : ""}.
        <button class="act" data-signout>Lock now</button></p>`;
    }

    return `
      <div class="group">
        <h3>Encryption at rest</h3>
        <div class="row"><div class="grow">${esc(detail)}</div>
          <span class="tag ${sealed ? "on" : "off"}">${sealed ? "Encrypted" : "Readable"}</span></div>
        ${action}
        <p class="note">Sealing protects the store on a stolen laptop, a backup, a
        synced home folder, or a copy that ends up in a repo. While you are signed
        in, code running as you can still ask the broker for a key — that is what
        Access rules are for.</p>
      </div>`;
  }

  /** A fragment written to sit mid-sentence, used to open one. */
  const sentence = (s) => String(s || "").replace(/^./, (c) => c.toUpperCase());

  function profileLabel(id) {
    return (vault?.profiles || []).find((p) => p.id === id)?.label || id || "this machine";
  }

  const BACKUP_SHAPES = {
    encrypted: ["Encrypted", "A passphrase you choose. Portable, needs nothing installed at the other end."],
    gpg: ["GPG", "An armoured GPG message, symmetric under a passphrase."],
    plain: ["Plain text", "Every value readable. For moving to a machine that has no PassBook yet."],
  };

  function defaultExportPath(shape) {
    const home = state?.home || "~";
    const day = new Date().toISOString().slice(0, 10);
    const where = state?.catalog?.workspace || state?.store?.workspace || "store";
    const ext = shape === "plain" ? "env" : shape === "gpg" ? "asc" : "pbx";
    return `${home}/Desktop/passbook-${where}-${day}.${ext}`;
  }

  /** Getting the store out, and back in.
   *
   *  Three shapes because the reasons differ. The plaintext one asks twice on
   *  purpose: "export" reads like "back up", and a plaintext backup is a copy
   *  of every credential you own.
   */
  function backupPanel() {
    const v = vault;
    const shape = backup.shape;
    const [, blurb] = BACKUP_SHAPES[shape];
    const needsPass = shape !== "plain";
    const locked = v?.supported && v.fully_sealed && !v.unlocked;

    return `
      <div class="group">
        <h3>Backup and transfer</h3>
        ${locked ? `<p class="note">The vault is shut, so there is nothing readable to
          export. Sign in first.</p>` : ""}
        <div class="row">
          <div class="grow">Write every key in this store to one file.</div>
          <div class="seg">${Object.entries(BACKUP_SHAPES).map(([id, [label]]) =>
            `<button data-bshape="${id}" aria-pressed="${shape === id}">${label}</button>`).join("")}</div>
        </div>
        <p class="note">${esc(blurb)}</p>
        <div class="addrow two">
          <input id="bk-path" value="${esc(backup.path || defaultExportPath(shape))}"
            spellcheck="false" placeholder="Where to write it" />
          <button class="act ${shape === "plain" ? "danger" : "primary"}" id="bk-export"
            ${busy || locked ? "disabled" : ""}>${icon("out")} Export</button>
        </div>
        ${needsPass ? `<div class="addrow two">
          <input id="bk-pass" type="password" placeholder="Passphrase for the export" />
          <span class="tag">${shape === "gpg" ? "gpg, symmetric" : "scrypt + AES-GCM"}</span>
        </div>` : `<p class="note err">${icon("alert", "tinyicon")} Every value in that file
          will be readable by anything that can open it. It is not a backup you keep; it is
          a thing you move and then destroy.</p>`}

        <div class="row"><div class="grow">Read an export back in. Encrypted, GPG and
          plain text are all recognised by looking at the file.</div></div>
        <div class="addrow two">
          <input id="bk-in" placeholder="Path to an export" spellcheck="false" />
          <button class="act" id="bk-inspect" ${busy ? "disabled" : ""}>${icon("eye")} Inspect</button>
        </div>
        <div class="addrow two">
          <input id="bk-inpass" type="password" placeholder="Its passphrase, if it has one" />
          <button class="act" id="bk-import" ${busy ? "disabled" : ""}>${icon("into")} Import</button>
        </div>
        ${backup.said ? `<pre class="snippet">${esc(backup.said)}</pre>` : ""}
        <p class="note">An import never overwrites a key this store already holds; it says
        which ones it kept. Everything here is recorded by name in the ledger \u2014 an
        export is the largest read anyone performs against a store, so it would be a
        strange one to leave out.</p>
      </div>

      <div class="group">
        <h3>If you forget the password</h3>
        ${recoveryCode ? `
          <div class="row">
            <span class="statustile good">${icon("shield")}</span>
            <div class="grow"><strong>Write this down, somewhere this machine is not.</strong>
              <div class="recovery mono">${esc(recoveryCode)}</div></div>
            <button class="iconbtn ${copied.__recovery ? "done" : ""}"
              data-copytext="${esc(recoveryCode)}" data-copymark="__recovery"
              title="Copy" aria-label="Copy the recovery code">${icon(copied.__recovery ? "check" : "copy")}</button>
          </div>
          <p class="note">Shown once. It opens the vault on its own, so it is as good as the
          password \u2014 PassBook keeps only enough to check it, and cannot show it again.</p>
          <div class="addrow two"><span></span>
            <button class="act" data-recoverydone>I have written it down</button></div>
        ` : `
          <div class="row"><div class="grow">Your data key is wrapped by your password and
            nothing else, so a forgotten password is the end of this store. A recovery code
            is a second wrapping.</div></div>
          <div class="addrow two">
            <input id="rc-pw" type="password" placeholder="Vault password" />
            <button class="act" id="rc-go" ${busy || !v?.profiles?.length ? "disabled" : ""}>
              ${icon("shield")} Make a recovery code</button>
          </div>`}
      </div>`;
  }

  function vaultPage() {
    const v = vault;
    if (!v) return `<h2>Vault</h2><p class="lede">Reading the vault…</p>`;
    if (!v.supported) {
      return `<h2>Vault</h2>
        <p class="lede">This machine has no vault runtime yet.</p>
        <div class="group"><p class="note">Run <code>passbook install</code> to add one,
        then reopen this window.</p></div>`;
    }

    const openState = v.unlocked
      ? `<div class="row"><span class="statustile good">${icon("unlock")}</span>
         <div class="grow"><strong>Open</strong> —
           signed in as ${esc(profileLabel(v.signed_in_profile))} by ${esc(v.factor || "password")}${
             v.expires_in ? `, ${humanTime(v.expires_in)} left` : ""}.</div>
         <button class="act" data-signout ${busy ? "disabled" : ""}>${icon("lock")} Lock</button></div>`
      : `<div class="row"><span class="statustile warn">${icon("lock")}</span>
         <div class="grow"><strong>Locked</strong> —
           ${v.fully_sealed
             ? "apps on this machine have no credentials right now."
             : "though the store is not sealed, so values are readable anyway."}</div>
         <span class="tag off">Locked</span></div>`;

    const signIn = v.unlocked || !v.profiles.length ? "" : `
      <div class="group">
        <h3>Sign in</h3>
        ${v.profiles.length > 1 ? `
          <select id="si-profile">
            ${v.profiles.map((p) => `<option value="${esc(p.id)}"${
              p.id === (vaultForm.profile || v.active) ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
          </select>` : ""}
        <div class="addrow two">
          <input id="si-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="si-go" ${busy ? "disabled" : ""}>Sign in</button>
        </div>
        ${!v.running ? `<p class="note">The broker is not running; signing in starts it.</p>` : ""}
      </div>`;

    const profiles = `
      <div class="group">
        <h3>Profiles</h3>
        ${v.profiles.length ? v.profiles.map((p) => `
          <div class="row">
            <div class="grow">
              <strong>${esc(p.label)}</strong>${p.active ? " · active" : ""}
              <div class="factors">${p.factors.length
                ? p.factors.map((f) => `<span class="chip">${icon(
                    { password: "key", passkey: "person", device: "monitor" }[f.kind] || "shield",
                    "tinyicon")} ${esc(f.kind)}</span>`).join("")
                : `<span class="chip">no factors</span>`}</div>
            </div>
            ${p.active ? "" : `<button class="act" data-use="${esc(p.label)}">Use</button>`}
          </div>`).join("")
          : `<div class="empty">No profiles yet.</div>`}
        <div class="addrow">
          <input id="np-label" placeholder="New profile name" spellcheck="false" />
          <input id="np-pw" type="password" placeholder="Vault password" />
          <button class="act" id="np-create" ${busy ? "disabled" : ""}>Add profile</button>
        </div>
        <p class="note">A profile is a sign-in and the key it holds. Passwords work
        on every machine; a passkey can be enrolled from HivemindOS or Hivemind
        Content Studio and works the same way here.</p>
      </div>`;

    const encryption = `
      <div class="group">
        <h3>The store</h3>
        <div class="row"><div class="grow">${esc(v.detail || "")}</div>
          <span class="tag ${v.fully_sealed ? "on" : "off"}">${v.fully_sealed ? "Encrypted" : "Readable"}</span></div>
        ${v.legacy_v1?.length ? `<p class="note">${v.legacy_v1.length} value(s) still use the
          older machine-key encryption. Sealing again moves them onto your profile.</p>` : ""}
        <div class="addrow two">
          <input id="sl-pw" type="password" placeholder="Vault password" />
          ${v.fully_sealed
            ? `<button class="act" id="unseal-go" ${busy ? "disabled" : ""}>Decrypt back to plaintext</button>`
            : `<button class="act primary" id="seal-go2" ${busy ? "disabled" : ""}>Seal the store</button>`}
        </div>
        <p class="note">${v.fully_sealed
          ? "Decrypting puts every value back in the clear on disk. The way out is here on purpose — an encryption you cannot reverse is one nobody turns on."
          : "Sealing encrypts every value under your profile key."}</p>
      </div>`;

    const device = `
      <div class="group">
        <h3>This device</h3>
        <p class="note">${esc(sentence(v.keystore?.describe || "no OS keystore on this platform"))}.
        ${v.keystore?.available
          ? "A device factor could let jobs start at boot without you — at the cost of letting anything running as you open the vault. Add one with <code>passbook profile trust-device</code>."
          : "Sign-in here is by password, which works the same on every platform."}</p>
      </div>`;

    return `<h2>Vault</h2>
      <p class="lede">Whether anything on this machine can read your credentials right now.</p>
      <div class="group">${openState}</div>
      ${signIn}${encryption}${profiles}${backupPanel()}${device}`;
  }

  function lockBanner() {
    if (!vault?.supported || vault.unlocked || !vault.fully_sealed) return "";
    return `<div class="banner">
      ${icon("lock")}
      <div class="body"><strong>The vault is locked.</strong>
      Every value is encrypted, so apps on this machine have no credentials until you sign in.
      <div class="acts"><button data-goto="vault">Sign in</button></div></div>
    </div>`;
  }

  /** The grid: every key against every agent that has actually asked.
   *
   *  The agents listed are read out of the access ledger, not just the ones
   *  somebody remembered to configure — those are usually the interesting ones.
   */
  const STATE_TAG = {
    connected:    ["on",  "Live"],
    expiring:     ["on",  "Renewing"],
    expired:      ["off", "Expired"],
    "no-refresh": ["off", "No refresh"],
    disconnected: ["off", "Signed out"],
  };

  async function refreshSignins() {
    try { signins = await invoke("oauth_state"); }
    catch { signins = null; }
  }

  async function callSignin(name, args = {}) {
    busy = true; paint();
    try { signins = await invoke(name, args); notice = ""; }
    catch (e) { notice = String(e); }
    finally { busy = false; paint(); }
  }

  /** Accounts this machine is signed in to, and whether they still work.
   *
   *  An OAuth grant is a credential with a clock on it. The broker renews one
   *  when something reads it, so "expired" here is a statement about right now
   *  rather than a problem — what actually needs a person is a grant with no
   *  refresh token, or one the provider has revoked.
   */
  function signinsPage() {
    const list = signins;
    if (list === null) {
      return `<h2>Sign-ins</h2><p class="lede">Reading…</p>`;
    }

    const rows = list.length ? list.map((s) => {
      const [tone, label] = STATE_TAG[s.state] || ["off", s.state];
      const waiting = connecting[s.id];
      return `<div class="row">
        ${avatar(String(s.id).split(":")[0])}
        <div class="grow">
          <strong class="mono">${esc(s.id)}</strong>
          <div class="note">${esc(s.detail)}</div>
        </div>
        <span class="tag ${tone}">${esc(label)}</span>
        ${waiting
          ? `<span class="note">waiting for the browser…</span>`
          : `${s.has_refresh ? `<button class="act" data-oarefresh="${esc(s.id)}"
                ${busy ? "disabled" : ""}>Renew</button>` : ""}
             <button class="act" data-oaconnect="${esc(s.id)}" ${busy ? "disabled" : ""}>
               ${s.state === "disconnected" ? "Sign in" : "Sign in again"}</button>
             <button class="act danger" data-oaforget="${esc(s.id)}" ${busy ? "disabled" : ""}>Forget</button>`}
      </div>`;
    }).join("") : `<div class="empty">No sign-ins yet.</div>`;

    return `<h2>Sign-ins</h2>
      <p class="lede">Accounts this machine holds, kept alive so agents never see a dead token.</p>
      <div class="group">
        ${rows}
        <p class="note">A sign-in's tokens live in this store like any other credential —
        sealed with it, held to the same access rules, and in the same record. What is
        different is the clock: the broker renews one on the way past when something
        reads it, so an agent never has to handle refresh, and a grant does not die
        just because the app that created it is closed.</p>
      </div>
      <div class="group">
        <h3>Add a sign-in</h3>
        <p class="note">Register a client with the provider, then describe it here.
        Nothing is connected until you sign in.</p>
        <pre class="snippet">passbook oauth add google work --client-id &lt;your client id&gt;
passbook oauth connect google:work</pre>
        <p class="note">No vendor's own client id ships with PassBook. Some CLIs sign in
        with a client they registered for themselves, and borrowing one is between you
        and that vendor's terms — not something this app should decide for you.</p>
      </div>`;
  }

  function agentsPage() {
    const cat = state.catalog;
    if (!cat?.available) {
      return `<h2>Agents</h2>
        <p class="lede">Grouping is not installed on this machine.</p>
        <div class="group"><p class="note">Run <code>passbook install</code>, then reopen.</p></div>`;
    }
    const known = cat.agents || [];
    const restricted = Object.keys(cat.audiences || {});

    const summary = `
      <div class="group">
        <div class="row">
          <div class="grow"><strong>${known.length}</strong> agent${known.length === 1 ? "" : "s"}
            have asked this machine for a credential.</div>
          <span class="tag ${restricted.length ? "info" : ""}">${restricted.length
            ? `${restricted.length} restricted` : "nothing restricted"}</span>
        </div>
        ${known.length ? `<div class="chips">${known.map((a) =>
          `<span class="chip mono">${esc(a)}</span>`).join("")}</div>`
          : `<p class="note">None yet. An agent appears here the first time it asks —
             including ones you never configured, which is the point.</p>`}
        <p class="note">An agent's name is a claim it makes when it connects, not a
        proof. It decides policy and fills the record; it is not a password.</p>
      </div>`;

    const mcp = `
      <div class="group">
        <h3>Give an agent access</h3>
        <p class="note">PassBook speaks MCP, so an agent can list what exists and ask
        for one credential at a time — checked and recorded — instead of you pasting
        keys into a chat.</p>
        <pre class="snippet">claude mcp add passbook -- passbook mcp</pre>
        <p class="note">For anything else, point it at <code>passbook mcp</code> over stdio.</p>
      </div>`;

    if (!grid) {
      return `<h2>Agents</h2>
        <p class="lede">Which agents can read which credentials.</p>
        ${summary}
        <div class="group">
          <div class="row"><div class="grow">Build the grid to see every key against
            every agent.</div>
            <button class="act primary" data-grid="1" ${busy ? "disabled" : ""}>Show the matrix</button></div>
        </div>
        ${mcp}`;
    }

    const rows = grid.rows.filter((r) =>
      !gridOnlyRestricted || r.audience.mode !== "all"
      || Object.values(r.agents).some((c) => c.outcome !== "grant"));

    return `<h2>Agents</h2>
      <p class="lede">Which agents can read which credentials.</p>
      ${summary}
      <div class="group">
        <div class="row">
          <div class="grow">${rows.length} key${rows.length === 1 ? "" : "s"} ×
            ${grid.agents.length} agent${grid.agents.length === 1 ? "" : "s"}</div>
          <button class="act ${gridOnlyRestricted ? "primary" : ""}" data-gridfilter="1">
            ${gridOnlyRestricted ? "Showing restricted" : "Show all"}</button>
          <button class="act" data-grid="1">Refresh</button>
        </div>
        <div class="matrixwrap">
          <table class="matrix">
            <thead><tr><th>Key</th>${grid.agents.map((a) =>
              `<th class="mono">${esc(a)}</th>`).join("")}</tr></thead>
            <tbody>
              ${rows.map((r) => `<tr>
                <td class="mono kname">${esc(r.key)}
                  <span class="gtag">${esc(r.group)}</span></td>
                ${grid.agents.map((a) => {
                  const cell = r.agents[a];
                  const cls = { grant: "yes", refuse: "no", ask: "ask" }[cell.outcome];
                  const glyph = { grant: "check", refuse: "cross", ask: "question" }[cell.outcome];
                  const word = { grant: "yes", refuse: "no", ask: "asks" }[cell.outcome];
                  return `<td class="cell ${cls}" title="${esc(cell.why)}"
                    aria-label="${word}">${icon(glyph)}</td>`;
                }).join("")}
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        ${rows.length ? "" : `<div class="empty">Nothing is restricted — every agent
          can read every key.</div>`}
      </div>
      ${mcp}`;
  }

  /** Which workspace this machine acts for, and the way back in.
   *
   *  Locking and choosing a workspace belong on one screen because they are one
   *  moment: you step away from a client's credentials, or you step into them.
   *  Splitting them puts the sign-in on a page you reach by remembering it.
   */
  function switchPage() {
    const cat = state.catalog || {};
    const rows = cat.workspace_rows || [];
    const here = cat.workspace || state.store?.workspace || "";
    const pinned = cat.workspace_pinned;
    const v = vault;

    const list = rows.length ? rows.map((row) => `
      <div class="row">
        ${avatar(row.label || row.id)}
        <div class="grow">
          <div><strong>${esc(row.label || row.id)}</strong>${row.active ? " \u00b7 active" : ""}</div>
          <div class="sub mono">${esc(row.id)}${row.inherits ? ""
            : " \u00b7 does not inherit the machine store"}</div>
        </div>
        ${row.active
          ? `<span class="tag on">Here</span>`
          : `<button class="act" data-workspace="${esc(row.id)}" ${busy || pinned ? "disabled" : ""}>
               Switch</button>`}
      </div>`).join("")
      : `<div class="empty">This machine has no workspaces \u2014 everything lives in the
         machine store.</div>`;

    const signIn = !v?.supported ? "" : v.unlocked ? `
      <div class="group">
        <div class="row">
          <span class="statustile good">${icon("unlock")}</span>
          <div class="grow"><strong>Signed in</strong> as
            ${esc(profileLabel(v.signed_in_profile))}${v.expires_in
              ? `, ${humanTime(v.expires_in)} left` : ""}.</div>
          <button class="act" data-signout ${busy ? "disabled" : ""}>${icon("lock")} Lock</button>
        </div>
        <p class="note">Locking closes the vault for everything on this machine, not just
        this window. Anything mid-request gets refused rather than served stale.</p>
      </div>`
      : `
      <div class="group">
        <h3>Sign in</h3>
        ${(v.profiles || []).length > 1 ? `
          <div class="addrow two">
            <select id="sw-profile">
              ${v.profiles.map((p) => `<option value="${esc(p.id)}"${
                p.id === (vaultForm.profile || v.active) ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
            </select>
          </div>` : ""}
        <div class="addrow two">
          <input id="sw-pw" type="password" placeholder="Vault password" />
          <button class="act primary" id="sw-go" ${busy ? "disabled" : ""}>${icon("unlock")} Sign in</button>
        </div>
        ${(v.profiles || []).length ? "" : `<p class="note">No profile on this machine yet.
          Set one up on the Vault page.</p>`}
      </div>`;

    return `
      <h2>Workspace</h2>
      <p class="lede">Which set of credentials this machine is working with, and
      whether anything can read them.</p>
      ${signIn}
      <div class="group">
        <h3>Workspaces</h3>
        ${list}
        ${pinned ? `<p class="note">HIVE_WORKSPACE is set in this app's environment, so it is
          pinned to <span class="mono">${esc(here)}</span> and switching is turned off here.
          A pinned process is pinned deliberately \u2014 usually an agent working for one
