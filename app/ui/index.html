          client \u2014 and a switch made in this window should not quietly re-point it.</p>`
          : `<p class="note">Switching writes HivemindOS's own workspace manifest, so both
          apps agree on which one is active. Keys stay where they are; what changes is which
          store this machine reads first and where a new key is written.</p>`}
      </div>`;
  }

  const CONFIRM_WORDS = {
    add: ["Adding a key", "A credential this store did not have before."],
    modify: ["Replacing a value", "An existing key being overwritten \u2014 the change that quietly breaks things."],
    delete: ["Removing a key", "Gone from this store; the value is not recoverable from here."],
  };

  function accessPage() {
    const a = state.access || {};
    const cat = state.catalog || {};
    const pending = state.broker?.pending || [];
    const open = a.sessions || [];
    return `
      <h2>Access</h2>
      <p class="lede">How each key is answered when something asks for it.</p>
      ${pending.map((p) => `
        <div class="banner">
          ${icon("alert")}
          <div class="body">
            <b>${esc(p.app)}</b> ${esc({ add: "wants to add", modify: "wants to change",
              delete: "wants to remove" }[p.kind] || "wants")} ${esc((p.keys || []).join(", "))}
            ${p.reason ? `<div style="opacity:.85;margin-top:2px">${esc(p.reason)}</div>` : ""}
            <div class="acts">
              <button data-ok="${esc(p.id)}" data-for="">Just once</button>
              <button data-ok="${esc(p.id)}" data-for="1h">For 1 hour</button>
              <button data-no="${esc(p.id)}">Decline</button>
            </div>
          </div>
        </div>`).join("")}
      <div class="group">
        <h3>Before a key changes</h3>
        <div class="row"><div class="grow">Everything else on this page is about
          <em>reads</em>. These are about <em>changes</em>: whether adding, replacing or
          removing a key stops and asks you first.</div></div>
        ${(cat.confirm_ops || ["add", "modify", "delete"]).map((op) => {
          const on = !!(cat.confirm || {})[op];
          const [label, blurb] = CONFIRM_WORDS[op];
          return `<div class="row">
            <span class="statustile ${on ? "good" : "plain"} sm">${icon(on ? "shield" : "plus")}</span>
            <div class="grow"><div><strong>${label}</strong></div>
              <div class="sub">${blurb}</div></div>
            <div class="seg">
              <button data-confirm="${op}" data-on="0" aria-pressed="${!on}">Straight away</button>
              <button data-confirm="${op}" data-on="1" aria-pressed="${on}">Ask me</button>
            </div>
          </div>`;
        }).join("")}
        <p class="note">A change that asks waits in this window and raises a system
        notification, and nothing is written until you answer. Turning one on when no
        broker is running would leave nobody to ask, so a change is refused rather than
        allowed through \u2014 a toggle whose enforcement disappears with a daemon is not
        a toggle.</p>
      </div>
      <div class="group">
        <h3>Stop being asked</h3>
        ${open.length ? open.map((u) => `
          <div class="row"><div class="grow">${(u.keys || []).length
              ? `<span class="mono">${esc(u.keys.join(", "))}</span>` : "Every key"}</div>
            <span class="tag on">${Math.round(u.remaining_seconds / 60)}m left</span>
            <button class="act" data-lock="1" ${busy ? "disabled" : ""}>Close now</button></div>`).join("")
          : `<div class="row"><div class="grow">Open access for a while; it closes on its own.</div>
             <div class="seg">${(a.presets || ["15m","1h","4h"]).map((p) =>
               `<button data-unlock="${p}">${p}</button>`).join("")}</div></div>
             <p class="note">While it is open, anything running as you can use these keys
             without asking. That is what it is for — but it should never be something
             you did without noticing.</p>`}
      </div>
      <div class="group">
        <div class="grouphead">
          <h3>Per key · ${countLabel(shownKeys().length, (state.store?.keys || []).length)}</h3>
          ${searchField("q-access")}
        </div>
        ${shownKeys().map((k) => {
          const m = modeOf(k);
          // The default mode's sentence, repeated under every key, is a wall of
          // one sentence. What differs between rows is the group a key is in,
          // and the mode — but only when somebody has changed it.
          const dflt = state?.access?.default_mode || "always";
          const group = state.catalog?.groups
            ? Object.keys(state.catalog.groups).find((g) => state.catalog.groups[g].includes(k))
            : "";
          const under = m === dflt
            ? (group && group !== "Ungrouped" ? esc(group) : "")
            : esc(MODE[m][1]);
          return `<div class="row"><div class="grow"><div class="mono">${esc(k)}</div>
            ${under ? `<div class="sub">${under}</div>` : ""}</div>
            <div class="seg">${["always","ask","never"].map((x) =>
              `<button data-key="${esc(k)}" data-mode="${x}" aria-pressed="${m === x}">${MODE[x][0]}</button>`).join("")}</div>
          </div>`; }).join("")
          || `<div class="empty">${query.trim()
                ? `Nothing matches “${esc(query)}”.` : "No keys yet."}</div>`}
      </div>`;
  }

  function machinesPage() {
    const l = state.links || {};
    // Tailnet machines sit in the same list as grants, badged with how trust
    // was established. They belong here — they hold the store — but a grant
    // had a fingerprint compared on two screens and an adoption did not, and
    // one badge is the difference between saying so and implying otherwise.
    const rows = [
      ...(l.lent || []).map((r) => ({ ...r, lent: true })),
      ...(l.tailnet || []).map((r) => ({ ...r, lent: true })),
      ...(l.borrowed || []),
    ];
    return `
      <h2>Machines</h2>
      <p class="lede">Every machine that holds this store \u2014 the ones you granted it
      to, and the ones that receive it because they share your tailnet.</p>
      <div class="group">
        <h3>This machine</h3>
        <div class="row">
          <span class="statustile plain">${icon("monitor")}</span>
          <div class="grow"><div class="mono">${esc(l.fingerprint || "—")}</div>
            <div class="sub">Both ends read this aloud before a key moves.</div></div>
          ${l.fingerprint ? `<button class="iconbtn ${copied.__fingerprint ? "done" : ""}"
            data-copytext="${esc(l.fingerprint)}" data-copymark="__fingerprint"
            title="${copied.__fingerprint ? "Copied" : "Copy fingerprint"}"
            aria-label="Copy fingerprint">${icon(copied.__fingerprint ? "check" : "copy")}</button>` : ""}
        </div>
      </div>
      <div class="group">
        <h3>Linked machines</h3>
        ${rows.map((r) => `
          <div class="row">
            <span class="statustile plain sm">${icon(r.lent ? "out" : "into")}</span>
            <div class="grow">
              <div>${r.lent ? "Lent to" : "Borrowed from"}
                <span class="mono">${esc(r.host || r.fingerprint || r.did)}</span>
                ${r.via === "tailnet"
                  ? `<span class="viatag" title="Trusted because it shares your tailnet. No fingerprint was compared.">${icon("globe", "tinyicon")} tailnet</span>`
                  : `<span class="viatag grant" title="A signed grant. Both ends compared a fingerprint.">${icon("shield", "tinyicon")} granted</span>`}</div>
              ${(r.keys || []).length > 8
                ? `<div class="sub">${(r.keys || []).length} keys \u2014 everything whose reach allows it</div>`
                : `<div class="chips inline">${(r.keys || []).map((k) =>
                    `<span class="chip mono">${esc(k)}</span>`).join("") || `<span class="sub">no keys</span>`}</div>`}</div>
            ${r.lent && r.active
              ? (r.via === "tailnet"
                  ? `<button class="act" data-forget="${esc(r.host)}" ${busy ? "disabled" : ""}>Forget</button>`
                  : `<button class="act" data-revoke="${esc(r.did)}" ${busy ? "disabled" : ""}>Revoke</button>`)
              : `<span class="tag ${r.active ? "on" : "off"}">${r.revoked ? "Revoked" : r.active ? "Active" : "Expired"}</span>`}
          </div>`).join("") || `<div class="empty">No linked machines.</div>`}
        <p class="note">A link is a signed grant naming which keys may move, and it can
        be revoked from here. It is not the only way a machine ends up holding this
        store \u2014 see below.</p>
      </div>
      ${fleetPanel()}`;
  }

  /** Machines that hold this store without a PassBook grant.
   *
   *  Kept apart from linked machines rather than merged with them. A linked
   *  machine is trusted because both ends compared a fingerprint; a tailnet
   *  peer is trusted because it is on the tailnet. One list would be the more
   *  comfortable lie, and this page already told someone "no linked machines"
   *  while six machines held their credentials.
   */
  function fleetPanel() {
    const f = state.fleet;
    if (!f) return "";
    if (!f.available) {
      return `<div class="group">
        <h3>On the tailnet</h3>
        <p class="note">${esc(f.detail || "This machine cannot see a tailnet.")}</p>
      </div>`;
    }
    // Machines already recorded above are not repeated here. What is left is
    // the rest of the tailnet: on it, but not receiving the store.
    const known = new Set(((state.links || {}).tailnet || []).map((r) => r.host));
    const rows = (f.peers || []).filter((p) => !known.has(p.host));
    const replicating = rows.filter((p) => p.replicates);
    if (!rows.length) {
      return `<div class="group">
        <h3>Rest of the tailnet</h3>
        <p class="note">Every machine on this tailnet that receives the store is listed
        above. Nothing else here.</p>
      </div>`;
    }
    return `
      <div class="group">
        <div class="row">
          <span class="statustile ${replicating.length ? "warn" : "plain"}">${icon("globe")}</span>
          <div class="grow">${replicating.length
            ? `<strong>${replicating.length}</strong> more machine${replicating.length === 1 ? "" : "s"}
               receive${replicating.length === 1 ? "s" : ""} this store but ${replicating.length === 1 ? "is" : "are"}
               not recorded above. Run <code>passbook sync</code> to record ${replicating.length === 1 ? "it" : "them"}.`
            : `The rest of this tailnet. ${rows.length} machine${rows.length === 1 ? "" : "s"}
               ${rows.length === 1 ? "is" : "are"} reachable but ${rows.length === 1 ? "does" : "do"} not
               receive the store.`}</div>
          <span class="tag ${replicating.length ? "info" : ""}">${rows.length} other${rows.length === 1 ? "" : "s"}</span>
        </div>
        ${rows.map((p) => `
          <div class="row">
            <span class="statustile plain sm">${icon(p.replicates ? "globe" : "monitor")}</span>
            <div class="grow">
              <div class="mono">${esc(p.host)}</div>
              <div class="sub">${esc(p.os || "unknown")}${p.replicates
                ? " \u00b7 running a collector" : " \u00b7 no collector \u2014 does not receive the store"}</div>
            </div>
            ${p.replicates
              ? `<span class="tag off">Replicated</span>`
              : `<span class="tag">Not replicated</span>`}
          </div>`).join("") || `<div class="empty">No other machines on this tailnet.</div>`}
        <p class="note">A machine appears here until <code>passbook sync</code> has seen
        it, after which it is listed above with the rest. Replication itself is still
        driven by HivemindOS; PassBook decides what may leave (a key's reach), and the
        two are joined at the point a key is sent.</p>
      </div>`;
  }

  function brokerPage() {
    const b = state.broker || {};
    return `
      <h2>Broker</h2>
      <p class="lede">One door for credential reads, so the record does not depend on
      each app choosing to keep one.</p>
      <div class="group">
        <h3>Status</h3>
        <div class="row">
          <span class="statustile ${b.running ? "good" : "warn"}">${icon("hub")}</span>
          <div class="grow">${b.running
            ? `Reads go through the broker, default <b>${esc(b.mode || "always")}</b>.`
            : "Not running — each app records its own reads, so the record has gaps."}</div>
          <span class="tag ${b.running ? "on" : "off"}">${b.running ? "Running" : "Stopped"}</span>
          <button class="act ${b.running ? "" : "primary"}" data-broker="${b.running ? "stop" : "start"}"
            ${busy ? "disabled" : ""}>${icon("power")} ${b.running ? "Stop" : "Start"}</button></div>
        <p class="note">${esc(b.limits || "")}</p>
      </div>`;
  }

  /** What each kind of entry did, as a glyph. */
  const OP_ICON = {
    read: "eye", write: "pencil", set: "pencil", add: "plus", remove: "trash",
    signin: "unlock", signout: "lock", seal: "lock", unseal: "unlock",
    link: "link", revoke: "cross", grant: "check", refuse: "cross",
  };

  function recordPage() {
    const r = state.record || {};
    const rows = (r.rows || []).slice(-40).reverse();
    const broken = r.intact === false;
    return `
      <h2>Record</h2>
      <p class="lede">Every read, hash-chained. Key names and times — never a value.</p>
      <div class="group">
        <div class="row">
          <span class="statustile ${broken ? "warn" : "good"}">${icon(broken ? "alert" : "shield")}</span>
          <div class="grow">${esc(r.detail || "")}</div>
          <span class="tag ${broken ? "off" : "on"}">${broken ? "Broken" : "Intact"}</span>
        </div>
      </div>
      <div class="group">
        <h3>Latest ${rows.length}</h3>
        ${rows.map((row) => `
          <div class="row">
            <span class="statustile plain sm" title="${esc(row.op || "")}">${icon(OP_ICON[row.op] || "doc")}</span>
            <div class="grow">
              <div class="mono">${esc((row.keys || []).join(", ")) || esc(row.op || "—")}</div>
              <div class="sub">${esc(row.app || "unknown")}${row.granted === false ? " · refused" : ""}</div>
            </div>
            <span class="tag">${esc(ago(row.at) || row.op || "")}</span>
          </div>`).join("") || `<div class="empty">Nothing recorded yet.</div>`}
      </div>`;
  }

  /** The last thing that happened, said once, in the colour it deserves. */
  function noticeBar() {
    if (!notice) return "";
    const good = /\bcopied\.$/.test(notice);
    return `<div class="noticebar ${good ? "good" : ""}">${icon(good ? "check" : "alert")}
      <span>${esc(notice)}</span></div>`;
  }

  const PAGE_ICON = Object.fromEntries(PAGES.map(([id, , glyph]) => [id, glyph]));
  // Reached from the source list's foot rather than from the list itself: it is
  // where you go to leave or to come back, not a section you browse.
  PAGE_ICON.switch = "building";

  /** Give the page its heading tile and every empty state a glyph.
   *
   *  Done to the rendered DOM rather than in each page function: there are
   *  fourteen headings across eight pages once the loading and not-installed
   *  variants are counted, and a rule applied in one place cannot be the one
   *  somebody forgets.
   */
  function dressPage() {
    const h2 = main.querySelector("h2");
    if (h2 && !h2.closest(".pagehead")) {
      const lede = h2.nextElementSibling?.classList.contains("lede") ? h2.nextElementSibling : null;
      const wrap = document.createElement("div");
      wrap.className = "pagehead";
      const tile = document.createElement("span");
      tile.className = "pagetile";
      tile.innerHTML = icon(PAGE_ICON[page] || "key", "pageicon");
      const text = document.createElement("div");
      text.className = "pagetext";
      h2.parentNode.insertBefore(wrap, h2);
      wrap.append(tile, text);
      text.append(h2);
      if (lede) text.append(lede);
    }
    main.querySelectorAll(".empty").forEach((box) => {
      if (box.querySelector("svg")) return;
      box.insertAdjacentHTML("afterbegin", icon("inbox", "emptyicon"));
    });
  }

  function paint() {
    if (!state) return;
    paintNav();
    const body = { keys: keysPage, vault: vaultPage, signins: signinsPage,
                   access: accessPage, agents: agentsPage,
                   machines: machinesPage, switch: switchPage,
                   broker: brokerPage, record: recordPage }[page]();
    main.innerHTML = lockBanner() + body + noticeBar();
    dressPage();

    main.querySelectorAll("[data-goto]").forEach((b) => b.onclick = () => {
      page = b.dataset.goto; notice = ""; paint();
    });
    main.querySelectorAll("[data-signout]").forEach((b) => b.onclick = () => callVault("vault_signout"));
    main.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
      busy = true; paint();
      try { state = await invoke("set_confirmation", {
              op: b.dataset.confirm, required: b.dataset.on === "1" });
            notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-bshape]").forEach((b) => b.onclick = () => {
      backup.shape = b.dataset.bshape;
      // The default path carries the shape's extension, so a shape change moves
      // it — unless the person has typed their own.
      const typed = document.getElementById("bk-path")?.value ?? "";
      if (!typed || typed === backup.path || typed.startsWith(`${state?.home || "~"}/Desktop/passbook-`)) {
        backup.path = "";
      } else {
        backup.path = typed;
      }
      backup.said = "";
      paint();
    });
    main.querySelectorAll("[data-recoverydone]").forEach((b) => b.onclick = () => {
      recoveryCode = ""; paint();
    });
    main.querySelectorAll("[data-workspace]").forEach((b) => b.onclick = async () => {
      busy = true; paint();
      try { state = await invoke("set_workspace", { name: b.dataset.workspace });
            notice = ""; grid = null; picked = {}; revealed = {}; values = {}; }
      catch (e) { notice = String(e); }
      finally { busy = false; await refreshVault(); paint(); }
    });

    main.querySelectorAll("[data-oarefresh]").forEach((b) => b.onclick = () =>
      callSignin("oauth_refresh", { id: b.dataset.oarefresh }));
    main.querySelectorAll("[data-oaforget]").forEach((b) => b.onclick = () =>
      callSignin("oauth_disconnect", { id: b.dataset.oaforget }));
    main.querySelectorAll("[data-oaconnect]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.oaconnect;
      connecting[id] = true; paint();
      try { await invoke("oauth_connect", { id }); notice = ""; }
      catch (e) { notice = String(e); connecting[id] = false; paint(); return; }
      // The browser half happens outside this window, so poll rather than wait.
      const until = Date.now() + 185000;
      const tick = async () => {
        await refreshSignins();
        const done = (signins || []).find((s) => s.id === id);
        if (done?.state === "connected" || Date.now() > until) {
          delete connecting[id]; paint(); return;
        }
        setTimeout(tick, 2000);
      };
      setTimeout(tick, 2000);
    });

    main.querySelectorAll("[data-group]").forEach((b) => {
      const toggle = () => {
        const name = b.dataset.group;
        collapsed[name] = !collapsed[name];
        paint();
      };
      b.onclick = toggle;
      b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    });

    main.querySelectorAll("[data-pick]").forEach((b) => b.onchange = () => {
      const k = b.dataset.pick;
      if (b.checked) picked[k] = true; else delete picked[k];
      bulkConfirm = false;
      paint();
    });
    main.querySelectorAll("[data-bulkclear]").forEach((b) => b.onclick = () => {
      picked = {}; bulkConfirm = false; paint();
    });
    main.querySelectorAll("[data-bulkremove]").forEach((b) => b.onclick = () => {
      bulkConfirm = true; paint();
    });
    main.querySelectorAll("[data-bulkcancel]").forEach((b) => b.onclick = () => {
      bulkConfirm = false; paint();
    });
    main.querySelectorAll("[data-bulkgo]").forEach((b) => b.onclick = async () => {
      const names = chosen();
      busy = true; paint();
      try { state = await invoke("remove_keys", { names });
            notice = ""; picked = {}; bulkConfirm = false; grid = null; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-bulkscope]").forEach((s) => s.onchange = async () => {
      const scope = s.value;
      if (!scope) return;
      const names = chosen();
      busy = true; paint();
      try {
        const answer = await invoke("set_keys_scope", { names, scope });
        // A partial refusal comes back with the new state and the reason; the
        // keys that did change have changed, so show both.
        if (answer && answer.partial) { state = answer.state; notice = answer.partial; }
        else { state = answer; notice = ""; }
        grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });

    main.querySelectorAll("[data-scope]").forEach((s) => s.onchange = async () => {
      busy = true; paint();
      try { state = await invoke("set_key_scope", { name: s.dataset.scope, scope: s.value });
            notice = ""; grid = null; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });

    main.querySelectorAll("[data-aud]").forEach((b) => b.onclick = () => {
      audienceFor = b.dataset.aud; audienceDraft = null;
      projectsFor = null; projectsDraft = null; paint();
    });
    main.querySelectorAll("[data-proj]").forEach((b) => b.onclick = () => {
      projectsFor = b.dataset.proj; projectsDraft = null; projectTyped = "";
      audienceFor = null; audienceDraft = null; paint();
    });
    main.querySelectorAll("[data-projcancel]").forEach((b) => b.onclick = () => {
      projectsFor = null; projectsDraft = null; projectTyped = ""; paint();
    });
    main.querySelectorAll("[data-projmode]").forEach((b) => b.onclick = () => {
      const rule = state.catalog?.projects?.[projectsFor];
      projectsDraft = projectsDraft
        || { mode: rule?.mode || "all", projects: [...(rule?.projects || [])] };
      const next = b.dataset.projmode;
      // `include` and `exclude` mean opposite things about the same names, so a
      // flip starts empty rather than carrying a selection across a change of
      // meaning nobody asked for.
      if (next !== projectsDraft.mode) projectsDraft.projects = [];
      projectsDraft.mode = next;
      paint();
    });
    main.querySelectorAll("[data-projname]").forEach((c) => c.onchange = () => {
      projectsDraft = projectsDraft || { mode: "include", projects: [] };
      const name = c.dataset.projname;
      projectsDraft.projects = c.checked
        ? [...new Set([...projectsDraft.projects, name])]
        : projectsDraft.projects.filter((p) => p !== name);
      paint();
    });
    main.querySelectorAll("[data-projadd]").forEach((b) => b.onclick = () => {
      const box = document.getElementById("proj-new");
      const name = (box?.value ?? "").trim();
      if (!name) return;
      projectsDraft = projectsDraft || { mode: "include", projects: [] };
      if (projectsDraft.mode === "all") projectsDraft.mode = "include";
      projectsDraft.projects = [...new Set([...projectsDraft.projects, name])];
      projectTyped = "";
      paint();
    });
    main.querySelectorAll("[data-projsave]").forEach((b) => b.onclick = async () => {
      const draft = projectsDraft || { mode: "all", projects: [] };
      busy = true; paint();
      try {
        state = await invoke("set_key_projects", {
          name: b.dataset.projsave, mode: draft.mode,
          projects: draft.mode === "all" ? [] : draft.projects });
        notice = ""; projectsFor = null; projectsDraft = null; projectTyped = ""; grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-audcancel]").forEach((b) => b.onclick = () => {
      audienceFor = null; audienceDraft = null; paint();
    });
    main.querySelectorAll("[data-audmode]").forEach((b) => b.onclick = () => {
      const rule = state.catalog?.audiences?.[audienceFor];
      audienceDraft = audienceDraft
        || { mode: rule?.mode || "all", agents: [...(rule?.agents || [])] };
      const next = b.dataset.audmode;
      // Between `include` and `exclude` the same names mean opposite things —
      // the agent that was the only one allowed becomes one of the blocked. So
      // a flip starts empty rather than carrying a selection across a change of
      // meaning that nobody asked for.
      if (next !== audienceDraft.mode) audienceDraft.agents = [];
      audienceDraft.mode = next;
      paint();
    });
    main.querySelectorAll("[data-audagent]").forEach((c) => c.onchange = () => {
      audienceDraft = audienceDraft || { mode: "include", agents: [] };
      const who = c.dataset.audagent;
      audienceDraft.agents = c.checked
        ? [...new Set([...audienceDraft.agents, who])]
        : audienceDraft.agents.filter((a) => a !== who);
      paint();
    });
    main.querySelectorAll("[data-audsave]").forEach((b) => b.onclick = async () => {
      const draft = audienceDraft || { mode: "all", agents: [] };
      busy = true; paint();
      try {
        state = await invoke("set_key_audience", {
          name: b.dataset.audsave, mode: draft.mode,
          agents: draft.mode === "all" ? [] : draft.agents });
        notice = ""; audienceFor = null; audienceDraft = null; grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });

    main.querySelectorAll("[data-grid]").forEach((b) => b.onclick = async () => {
      busy = true; paint();
      try { grid = await invoke("access_matrix", { agents: [] }); notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    main.querySelectorAll("[data-gridfilter]").forEach((b) => b.onclick = () => {
      gridOnlyRestricted = !gridOnlyRestricted; paint();
    });
    main.querySelectorAll("[data-use]").forEach((b) => b.onclick = () =>
      callVault("vault_use_profile", { label: b.dataset.use }));

    const signIn = (field, select) => {
      const profile = select ? (document.getElementById(select)?.value ?? "") : "";
      callVault("vault_signin", { profile, password: pwd(field) });
    };
    const wire = (id, run) => {
      const button = document.getElementById(id);
      if (button) button.onclick = run;
    };
    wire("bk-export", async () => {
      const path = document.getElementById("bk-path")?.value?.trim() ?? "";
      const passphrase = document.getElementById("bk-pass")?.value ?? "";
      if (!path) { notice = "Where should it go?"; paint(); return; }
      backup.path = path;
      busy = true; backup.said = ""; paint();
      try {
        const answer = await invoke("export_store", {
          path, shape: backup.shape, passphrase, note: backup.note || "" });
        backup.said = `Wrote ${answer.path}`;
        notice = "";
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    wire("bk-inspect", async () => {
      const path = document.getElementById("bk-in")?.value?.trim() ?? "";
      const passphrase = document.getElementById("bk-inpass")?.value ?? "";
      if (!path) { notice = "Which file?"; paint(); return; }
      busy = true; paint();
      try { backup.said = await invoke("inspect_export", { path, passphrase }).then((a) => a.detail);
            notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    wire("bk-import", async () => {
      const path = document.getElementById("bk-in")?.value?.trim() ?? "";
      const passphrase = document.getElementById("bk-inpass")?.value ?? "";
      if (!path) { notice = "Which file?"; paint(); return; }
      busy = true; paint();
      try {
        const answer = await invoke("import_store", { path, passphrase, overwrite: false });
        backup.said = answer.detail;
        state = answer.state; notice = ""; grid = null;
      } catch (e) { notice = String(e); }
      finally { busy = false; paint(); }
    });
    wire("rc-go", async () => {
      const password = pwd("rc-pw");
      if (!password) { notice = "The vault password is needed to mint a recovery code."; paint(); return; }
      busy = true; paint();
      try { recoveryCode = (await invoke("make_recovery_code", { password })).code; notice = ""; }
      catch (e) { notice = String(e); }
      finally { busy = false; await refreshVault(); paint(); }
    });
    wire("si-go", () => signIn("si-pw", "si-profile"));
    wire("sw-go", () => signIn("sw-pw", "sw-profile"));
    wire("si-go2", () => signIn("si-pw2", null));
    wire("seal-go", () => callVault("vault_seal", { password: pwd("seal-pw") }));
    wire("seal-go2", () => callVault("vault_seal", { password: pwd("sl-pw") }));
    wire("unseal-go", () => callVault("vault_unseal", { password: pwd("sl-pw") }));
    wire("sec-go", () => callVault("vault_secure",
      { label: document.getElementById("sec-label")?.value ?? "", password: pwd("sec-pw") }));
    wire("np-create", () => callVault("vault_create_profile",
      { label: document.getElementById("np-label")?.value ?? "", password: pwd("np-pw") }));

    // Enter submits the password field it is in, because a password field that
    // needs a mouse to submit is one people retype.
    [["si-pw", "si-go"], ["si-pw2", "si-go2"], ["seal-pw", "seal-go"],
     ["sec-pw", "sec-go"], ["np-pw", "np-create"], ["sw-pw", "sw-go"]].forEach(([field, button]) => {
      const input = document.getElementById(field);
      if (input) input.onkeydown = (e) => { if (e.key === "Enter") document.getElementById(button)?.click(); };
    });

    main.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () =>
      call("set_mode", { app: APP, key: b.dataset.key, mode: b.dataset.mode }));
    main.querySelectorAll("[data-unlock]").forEach((b) => b.onclick = () =>
      call("unlock", { duration: b.dataset.unlock, reason: "from PassBook" }));
    main.querySelectorAll("[data-lock]").forEach((b) => b.onclick = () => call("lock"));
    main.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () =>
      call("resolve", { id: b.dataset.ok, approve: true, remember: b.dataset.for }));
    main.querySelectorAll("[data-no]").forEach((b) => b.onclick = () =>
      call("resolve", { id: b.dataset.no, approve: false, remember: "" }));
    main.querySelectorAll("[data-broker]").forEach((b) => b.onclick = () =>
      call("broker", { action: b.dataset.broker }));
    main.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = () =>
      call("revoke", { did: b.dataset.revoke }));
    main.querySelectorAll("[data-forget]").forEach((b) => b.onclick = () =>
      call("forget_machine", { host: b.dataset.forget }));
    main.querySelectorAll("[data-reveal]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.reveal;
      if (revealed[k]) { delete revealed[k]; delete values[k]; paint(); return; }
      try { values[k] = await invoke("reveal_key", { name: k }); revealed[k] = true; notice = ""; }
      catch (e) { notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-hist]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.hist;
      if (history[k]) { delete history[k]; paint(); return; }
      history[k] = "loading"; paint();
      try { history[k] = await invoke("key_history", { name: k }); }
      catch (e) { history[k] = []; notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-copytext]").forEach((b) => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copytext); markCopied(b.dataset.copymark); }
      catch (e) { notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.copy;
      try {
        const v = values[k] ?? await invoke("reveal_key", { name: k });
        await navigator.clipboard.writeText(v);
        markCopied(k);
        notice = "";
      } catch (e) { notice = String(e); }
      paint();
    });
    main.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => {
      confirming = b.dataset.remove; paint();
    });
    main.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => {
      confirming = null; notice = ""; paint();
    });
    main.querySelectorAll("[data-rmgo]").forEach((b) => b.onclick = async () => {
      const k = b.dataset.rmgo;
      confirming = null; delete revealed[k]; delete values[k];
      await call("remove_key", { name: k });
    });
    // Saving on blur is how the HivemindOS card behaves; Escape reverts.
    main.querySelectorAll("[data-val]").forEach((input) => {
      const k = input.dataset.val;
      if (!revealed[k]) return;
      input.onkeydown = (e) => {
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { input.value = values[k] ?? ""; input.blur(); }
      };
      input.onblur = async () => {
        const next = input.value;
        if (next === (values[k] ?? "") || !next.trim()) return;
        values[k] = next;
        await call("add_key", { name: k, value: next, replace: true });
      };
    });
    // innerHTML is replaced on every paint, so typing would lose focus after
    // each keystroke without restoring it here.
    const projBox = document.getElementById("proj-new");
    if (projBox) {
      projBox.oninput = () => { projectTyped = projBox.value; };
      projBox.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.querySelector("[data-projadd]")?.click(); }
      };
    }
    ["q-keys", "q-access"].forEach((id) => {
      const box = document.getElementById(id);
      if (!box) return;
      box.oninput = () => {
        query = box.value;
        const at = box.selectionStart;
        paint();
        const again = document.getElementById(id);
        if (again) { again.focus(); again.setSelectionRange(at, at); }
      };
      box.onkeydown = (e) => {
        if (e.key === "Escape" && query) { query = ""; paint(); document.getElementById(id)?.focus(); }
      };
    });
    const go = document.getElementById("addgo");
    if (go) go.onclick = async () => {
      const name = document.getElementById("k").value;
      const value = document.getElementById("v").value;
      if (!name.trim() || !value.trim()) { notice = "A key needs a name and a value."; paint(); return; }
      await call("add_key", { name, value, replace: false });
    };
  }

  async function boot() {
    if (!invoke) {
      main.innerHTML = `<h2>PassBook</h2><p class="lede err">This window could not reach
        the app backend. That is a build problem, not a credential problem —
        <code>withGlobalTauri</code> must be enabled in tauri.conf.json.</p>`;
      return;
    }
    try { state = await invoke("state"); await refreshVault(); await refreshSignins(); paint(); }
    catch (e) { main.innerHTML = `<h2>PassBook</h2><p class="lede err">${esc(String(e))}</p>`; }
  }
  boot();
  setInterval(async () => {
    // A background refresh must not wipe a value someone is mid-edit on.
    const focused = document.activeElement;
    if (busy || confirming || audienceFor || bulkConfirm
        || Object.keys(picked).length || Object.keys(connecting).length) return;
    if (focused?.classList?.contains("val") || focused?.classList?.contains("search")) return;
    // A half-typed password must survive the refresh for the same reason a
    // half-typed value does.
    if (focused?.type === "password") return;
    try { state = await invoke("state"); await refreshVault(); await refreshSignins(); paint(); } catch {}
  }, 5000);
})();
</script>
