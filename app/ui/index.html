        const next = input.value;
        input.value = "";
        delete replacing[k];
        if (!next.trim()) { paint(); return; }
        // Somebody typed this, so for these few seconds the window does hold a
        // value — unavoidably, since the typing happened here. Hiding the row
        // ends that as soon as the store has it, rather than leaving it sitting
        // in a field behind whatever the person does next.
        hideValue(k);
        await call("add_key", { name: k, value: next, replace: true });
      };
      input.focus();
    });
    // innerHTML is replaced on every paint, so typing would lose focus after
    // each keystroke without restoring it here.
    const projBox = document.getElementById("proj-new");
    if (projBox) {
      projBox.oninput = () => { projectTyped = projBox.value; };
      projBox.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.querySelector("[data-projadd]")?.click(); }
      };
    }
    // Grow the list when its tail is scrolled to. The observer is rebuilt each
    // paint because the node it watched was replaced by the paint that made it.
    rowGrower?.disconnect();
    rowGrower = null;
    const more = main.querySelector("[data-more]");
    if (more) {
      const grow = () => { rowLimit += ROW_PAGE; paint(); };
      more.onclick = grow;
      if (window.IntersectionObserver) {
        // A margin, so the rows are built before the tail is reached rather
        // than after. It stops on its own: a full list has no tail to watch.
        rowGrower = new IntersectionObserver(
          (seen) => { if (seen.some((e) => e.isIntersecting)) grow(); },
          { rootMargin: "600px" });
        rowGrower.observe(more);
      }
    }

    ["q-keys", "q-access"].forEach((id) => {
      const box = document.getElementById(id);
      if (!box) return;
      box.oninput = () => {
        query = box.value;
        resetRows();
        const at = box.selectionStart;
        paint();
        const again = document.getElementById(id);
        if (again) { again.focus(); again.setSelectionRange(at, at); }
      };
      box.onkeydown = (e) => {
        if (e.key === "Escape" && query) {
          query = ""; resetRows(); paint(); document.getElementById(id)?.focus();
        }
      };
    });
    const go = document.getElementById("addgo");
    if (go) go.onclick = async () => {
      const name = document.getElementById("k").value;
      const value = document.getElementById("v").value;
      if (!name.trim() || !value.trim()) { notice = "A key needs a name and a value."; paint(); return; }
      await call("add_key", { name, value, replace: false });
    };
  }

  async function boot() {
    if (!invoke) {
      main.innerHTML = `<h2>PassBook</h2><p class="lede err">This window could not reach
        the app backend. That is a build problem, not a credential problem —
        <code>withGlobalTauri</code> must be enabled in tauri.conf.json.</p>`;
      return;
    }
    try {
      state = await invoke("state");
      await refreshVault();
      await refreshSignins();
      // A remembered lock is only honoured if the factor that would lift it is
      // still there. A workspace that lost its key between sessions would
      // otherwise come back to a screen nothing can answer.
      if (appLocked && !canProveIdentity(activeRow())) unlockWindow();
      paint();
      paintGate();
      await readyNotifications();
      try { biometry = await invoke("biometric_status") || biometry; } catch { /* older build */ }
      // Two of the three protections are conditional, so the window asks rather
      // than claiming them. See `capture_protection` in main.rs.
      try { guards = await invoke("capture_protection") || guards; } catch { /* older build */ }
      if (biometry.available) { paintGate(); paint(); }
      announce(state?.broker?.pending);
      // A link that launched this window fired its event before there was a
      // window to hear it, so the first question is always "is one waiting?".
      await loadAsk();
      wireDrop();
      const events = window.__TAURI__?.event;
      if (events?.listen) {
        events.listen("passbook://ask", () => loadAsk());
        events.listen("passbook://ask-refused", (e) => {
          notice = String(e?.payload || "That link could not be read.");
          paint();
        });
      }
    }
    catch (e) { main.innerHTML = `<h2>PassBook</h2><p class="lede err">${esc(String(e))}</p>`; }
  }
  boot();
  // A poll that repaints unconditionally repaints for nothing nearly every
  // time. Most five-second windows change nothing at all, and a repaint of a
  // store this size is the most expensive thing the window does — so compare
  // first, and only rebuild when the answer is actually different.
  let lastSeen = "";
  let quietPolls = 0;
  setInterval(async () => {
    // A background refresh must not wipe a value someone is mid-edit on.
    const focused = document.activeElement;
    if (busy || confirming || audienceFor || bulkConfirm
        || Object.keys(picked).length || Object.keys(connecting).length
        || Object.keys(revealing).length) return;
    if (focused?.classList?.contains("val") || focused?.classList?.contains("search")) return;
    // A half-typed password must survive the refresh for the same reason a
    // half-typed value does.
    if (focused?.type === "password") return;
    try {
      const next = await invoke("state");
      await refreshVault();
      await refreshSignins();
      // Before the unchanged-state shortcut below: a request that arrived and
      // was answered between two polls still deserves to have been announced.
      announce(next?.broker?.pending);
      // A chain checked ten rows ago has not been checked. The label goes back
      // to "Not checked" rather than keeping a tick that is no longer about
      // the record on screen.
      const tail = (rows) => (rows || []).slice(-1)[0]?.proofHash || "";
      if (chain.answer && tail(next.record?.rows) !== tail(state?.record?.rows)) {
        chain.answer = null;
      }
      const now = JSON.stringify([next, vault, signins]);
      // Relative times ("4m ago") go stale while nothing changes, so a quiet
      // window still gets one repaint a minute to move them along.
      if (now === lastSeen && ++quietPolls < 12) { state = next; return; }
      lastSeen = now; quietPolls = 0;
      state = next;
      paint();
    } catch {}
  }, 5000);
})();
</script>
